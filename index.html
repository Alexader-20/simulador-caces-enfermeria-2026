rofesional de actuar en favor del bienestar del paciente, promoviendo el mayor beneficio posible; sin embargo, en este escenario el conflicto no radica en qué es lo \"mejor\" clínicamente, sino en quién tiene la potestad de decidir, lo que corresponde al ámbito de la autonomía. • Justicia: Este principio alude a la distribución equitativa de los recursos y al trato imparcial entre los pacientes, aspecto que no es el eje central del dilema planteado, ya que no existe una disputa por acceso a recursos sanitarios limitados. • No maleficencia: Implica la obligación de no causar daño al paciente; si bien continuar con tratamientos experimentales podría generar sufrimiento adicional, el conflicto principal del caso se centra en el respeto a la decisión personal del paciente frente a la insistencia familiar, y no en la prevención de un daño directo por parte del profesional. Tip/Mnemotecnia: \"El paciente decide, la familia acompaña\": ante un paciente competente, su voluntad expresada (autonomía) prevalece sobre el deseo de la familia, salvo excepciones legales específicas.","bibliography":"Consejo Internacional de Enfermeras. Código Deontológico del CIE para la Profesión de Enfermería. Ginebra, Suiza; 2016. Subcomponente: Ética en el ejercicio profesional Tema: Ética y bioética: valores y principios Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":189,"question":"En la unidad operativa del primer nivel de atención, se ha planificado la ejecución de la campaña de salud “Cómo cuidar tu corazón”; cada miembro del equipo de salud tiene asignada una actividad. ¿Cuáles son los roles que le corresponden al profesional de enfermería?","options":["Informativo, detección y erradicación.","Fomento de la salud y prevención de enfermedades y accidentes.","Asesoramiento individual.","Educador, apoyo, refuerzo e identificar grupos de riesgo."],"answer":"Educador, apoyo, refuerzo e identificar grupos de riesgo.","justification":"Dentro del primer nivel de atención, el rol del profesional de enfermería en actividades de promoción de la salud como campañas comunitarias se centra en la función educativa: transmitir conocimientos sobre autocuidado cardiovascular, brindar apoyo emocional y motivacional a la población participante, reforzar conductas saludables mediante seguimiento y retroalimentación, e identificar mediante la valoración clínica y epidemiológica a los grupos con mayor riesgo cardiovascular (hipertensos, diabéticos, obesos, sedentarios) para dirigir intervenciones focalizadas. Este rol se fundamenta en los principios de la atención primaria de salud y en el enfoque de enfermería comunitaria, donde el profesional actúa como agente educador y gestor de riesgo dentro del equipo multidisciplinario. Opciones incorrectas: • Informativo, detección y erradicación: Estas funciones corresponden más a actividades de vigilancia epidemiológica y control de enfermedades transmisibles (detección de casos, erradicación de focos), propias de programas de control epidemiológico, no del rol educativo- preventivo específico de enfermería en una campaña de promoción de salud cardiovascular. • Fomento de la salud y prevención de enfermedades y accidentes: Aunque estos son objetivos generales de cualquier campaña de salud pública y aplican a todo el equipo de salud, no describen las funciones específicas y operativas que ejecuta el profesional de enfermería dentro de la actividad, por lo que resulta una opción demasiado genérica. • Asesoramiento individual: Corresponde a una intervención puntual y limitada dentro del proceso de atención, pero no abarca la totalidad de las funciones del profesional de enfermería en el contexto comunitario descrito, que incluye educación grupal, refuerzo y estratificación de riesgo. Tip/Mnemotecnia: \"EAR-Riesgo\": Educador, Apoyo, Refuerzo e identificación de grupos de Riesgo, son las funciones clave de enfermería en actividades de promoción de la salud comunitaria.","bibliography":"Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Generalidades para el cuidado enfermero Tema: Caracterización de la profesión: roles, funciones y campos de actuación Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":190,"question":"Durante la entrega recepción de la guardia de enfermería, se reciben los equipos adquiridos por la institución de salud para la atención en la sala de labor de parto, con el fin de desarrollar actividades basadas en la confidencialidad y confianza entre pacientes, profesionales y personal de salud. Además, se realizará una capacitación continua para su uso y aplicación correcta. ¿A qué principio transversal de la seguridad del paciente-usuario corresponde principalmente este accionar de la institución de salud?","options":["Alianza con el paciente y su familia.","Cultura de seguridad.","Impacto.","Atención centrada en la persona."],"answer":"Cultura de seguridad.","justification":"Este principio transversal de la seguridad del paciente hace referencia al conjunto de valores, actitudes, competencias y patrones de comportamiento que determinan el compromiso de una organización de salud con la seguridad, tanto de sus profesionales como de los usuarios. Se manifiesta a través de acciones proactivas como la adquisición de equipos adecuados y certificados, la capacitación continua del personal para su correcto uso, y el fomento de un ambiente de confianza y confidencialidad que permita la comunicación abierta de errores o eventos adversos sin temor a represalias. La cultura de seguridad es la base sobre la cual se construyen las demás prácticas seguras institucionales, ya que integra el aprendizaje organizacional, el trabajo en equipo y el liderazgo orientado a minimizar los riesgos asistenciales. Opciones incorrectas: • Alianza con el paciente y su familia: Este principio se refiere específicamente a la participación activa del paciente y su familia en el proceso de atención, incluyendo la toma de decisiones informadas y la retroalimentación sobre su cuidado, no a la gestión interna de recursos y capacitación del personal. • Impacto: No corresponde a un principio transversal reconocido de forma independiente en los marcos de seguridad del paciente; suele emplearse como un criterio de evaluación de resultados o consecuencias de una intervención, no como fundamento cultural-organizacional. • Atención centrada en la persona: Este principio prioriza las necesidades, preferencias y valores individuales del paciente en el diseño y ejecución del cuidado, pero el enunciado se enfoca en la organización institucional (equipos, capacitación, confianza del equipo de salud), lo cual corresponde más específicamente a la cultura de seguridad institucional. Tip/Mnemotecnia: Recuerda \"3C\" de la Cultura de Seguridad: Compromiso institucional, Capacitación continua y Confianza/Confidencialidad para reportar errores sin temor a sanciones.","bibliography":"Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Seguridad y calidad en el cuidado Tema: Seguridad del paciente: generalidades Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":191,"question":"Un paciente de 72 años, hospitalizado en el servicio de clínica por diagnóstico médico de neumonía, es atendido por la enfermera de turno. El paciente refiere cefalea de moderada intensidad. Al informar al médico, prescribe administrar analgésicos; la enfermera procede inmediatamente y, además, proporciona las medidas de relajación que minimizan su molestia. Aplicando el pensamiento crítico, ¿a qué etapa del proceso de enfermería corresponde este caso?","options":["Evaluar.","Implementar.","Diagnosticar.","Planificar."],"answer":"Implementar.","justification":"Esta etapa del Proceso de Atención de Enfermería (PAE) corresponde a la ejecución de las intervenciones previamente planificadas para el cuidado del paciente. En el caso descrito, la enfermera pone en marcha las acciones concretas: administra el analgésico prescrito por el médico y, de forma complementaria, aplica medidas no farmacológicas de relajación para minimizar la cefalea. La implementación incluye tanto la realización de órdenes médicas dependientes como las intervenciones autónomas (independientes) propias del juicio clínico enfermero, lo cual demuestra pensamiento crítico al integrar ambas estrategias para el confort y bienestar del paciente. Opciones incorrectas: • Evaluar: Corresponde a la última etapa del PAE, en la cual se determina si las intervenciones realizadas lograron los resultados esperados (por ejemplo, verificar si la cefalea disminuyó tras la administración del analgésico y las medidas de relajación), pero en el caso planteado aún no se describe este proceso de valoración de resultados. • Diagnosticar: Es la etapa en la que se identifican y formulan los problemas de salud reales o potenciales del paciente a partir de los datos recolectados en la valoración (por ejemplo, \"dolor agudo relacionado con proceso infeccioso\"); en el escenario descrito no se está formulando un diagnóstico, sino ejecutando acciones de cuidado. • Planificar: Consiste en el establecimiento de objetivos y la selección de las intervenciones enfermeras que se llevarán a cabo para resolver el diagnóstico identificado; en este caso, la planificación ya se dio previamente (al determinar qué medidas se aplicarían), y lo que se describe es la ejecución real de dichas acciones. Tip/Mnemotecnia: Recuerda las 5 etapas del PAE con el acrónimo \"VADIE\": Valoración, Análisis/Diagnóstico, Diseño/Planificación, Implementación (hacer/ejecutar) y Evaluación. Si la enfermera \"hace\" algo (administra, aplica, ejecuta), está en la etapa de Implementar.","bibliography":"Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Proceso de atención en Enfermería Tema: Bases conceptuales: etapas del PAE Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":192,"question":"Paciente femenina de 50 años se encuentra hospitalizada por laparotomía exploratoria. Presenta herida quirúrgica cubierta con apósito manchado de líquido purulento y de mal olor. A la valoración, la herida presenta eritema, rubor y calor local. El profesional enfermero procede a retirar el apósito. ¿Cuál es la clasificación correcta del desecho generado?","options":["Desecho biológico-infeccioso.","Desecho cortopunzante.","Desecho anatomopatológico.","Desecho común."],"answer":"Desecho biológico-infeccioso.","justification":"El apósito retirado presenta líquido purulento, mal olor y signos clínicos de infección (eritema, rubor, calor local), lo que indica presencia de microorganismos patógenos en concentración suficiente para causar enfermedad. Según la clasificación de desechos hospitalarios, todo material que ha estado en contacto con fluidos corporales contaminados o secreciones de un proceso infeccioso (apósitos, gasas, guantes) se cataloga como desecho biológico-infeccioso, y debe manejarse con las precauciones de bioseguridad correspondientes: doble embalaje en bolsa roja, rotulación y disposición final diferenciada para evitar la transmisión de infecciones al personal de salud y al ambiente. Opciones incorrectas: • Desecho cortopunzante: Corresponde a objetos con capacidad de penetrar o cortar tejido, como agujas, hojas de bisturí, ampolletas rotas o lancetas; el apósito no tiene estas características físicas. • Desecho anatomopatológico: Se refiere a órganos, tejidos, muestras biológicas para análisis, placenta o partes corporales amputadas, no a material de curación contaminado con secreciones. • Desecho común: Corresponde a material sin riesgo biológico, como papel, cartón o restos de alimentos, que no ha tenido contacto con fluidos corporales o secreciones infecciosas. Tip/Mnemotecnia: \"Si gotea, huele o infecta, es biológico-infeccioso; si corta o pincha, es cortopunzante; si es tejido u órgano, es anatomopatológico\".","bibliography":"Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Bioseguridad Tema: Manejo y tipo de desechos Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":193,"question":"Un paciente ingresa a una sala de emergencias con una herida abierta en el antebrazo, causada por un objeto cortante. El médico decide realizar una sutura para cerrar la herida. ¿Cuál de las siguientes acciones es la más adecuada para garantizar la asepsia en este acto?","options":["Lavar el antebrazo con agua y jabón antes de la sutura.","Utilizar guantes de manejo durante el procedimiento de sutura.","Aplicar solución antiséptica directamente sobre la herida y suturar.","Utilizar guantes estériles durante el procedimiento de sutura."],"answer":"Utilizar guantes estériles durante el procedimiento de sutura.","justification":"La sutura es un procedimiento invasivo que rompe la barrera cutánea y requiere técnica aséptica estricta para prevenir la introducción de microorganismos a tejidos profundos. El uso de guantes estériles, junto con campo estéril e instrumental esterilizado, constituye el estándar de manejo en este tipo de procedimientos invasivos, ya que garantiza que no exista contacto de la herida con flora bacteriana exógena o de la piel del operador, reduciendo significativamente el riesgo de infección del sitio quirúrgico. Opciones incorrectas: • Lavar el antebrazo con agua y jabón antes de la sutura: Es una medida de higiene previa válida para remover suciedad y contaminación macroscópica, pero no sustituye la técnica aséptica durante el procedimiento invasivo en sí, ya que el agua y jabón no garantizan esterilidad ni eliminan la totalidad de la flora microbiana. • Utilizar guantes de manejo durante el procedimiento de sutura: Los guantes de manejo (no estériles) están diseñados para procedimientos de contacto general y protección del personal frente a fluidos, pero no cumplen los estándares de esterilidad requeridos para procedimientos invasivos como la sutura, exponiendo al paciente a riesgo de infección. • Aplicar solución antiséptica directamente sobre la herida y suturar: La antisepsia de la piel es un paso complementario importante, pero no reemplaza el uso de guantes estériles ni garantiza por sí sola la asepsia de todo el acto quirúrgico, ya que el operador y el material utilizado también deben estar estériles. Tip/Mnemotecnia: Ante procedimiento invasivo, piensa \"ASEPSIA TOTAL\": guantes estériles, campo estéril e instrumental estéril; la antisepsia de piel y el lavado son pasos previos, no sustitutos.","bibliography":"Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Bioseguridad Tema: Asepsia y antisepsia Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":194,"question":"Como profesional de enfermería ha sido designado para esterilizar varios paquetes de ropa quirúrgica en un hospital, tomando en cuenta las recomendaciones de la Norma de Bioseguridad para Establecimientos de Salud del Ministerio de Salud Pública del Ecuador. ¿Cuál de los siguientes métodos de esterilización es el adecuado en este caso?","options":["Esterilización por óxido de etileno.","Esterilización por calor húmedo.","Esterilización por peróxido de hidrógeno.","Esterilización por calor seco."],"answer":"Esterilización por calor húmedo.","justification":"La esterilización por calor húmedo (autoclave a vapor saturado bajo presión) es el método de elección para textiles y ropa quirúrgica porque el vapor logra una penetración rápida y uniforme en materiales porosos, alcanzando temperaturas de 121-134°C que destruyen esporas bacterianas resistentes (como Bacillus atrophaeus y Geobacillus stearothermophilus) en tiempos cortos (15-30 minutos), sin dejar residuos tóxicos, siendo económico, seguro y ampliamente disponible en los establecimientos de salud del Ecuador según la normativa del MSP. Opciones incorrectas: • Esterilización por óxido de etileno: Se emplea para material termosensible como plásticos, catéteres o dispositivos electrónicos que no toleran altas temperaturas ni humedad; no es el método de elección para textiles debido a su alto costo, toxicidad residual y prolongado tiempo de aireación posterior. • Esterilización por peróxido de hidrógeno: Se utiliza en sistemas de plasma para instrumental delicado, endoscopios y dispositivos termosensibles; no penetra adecuadamente en materiales porosos y voluminosos como la ropa quirúrgica, por lo que no está indicado para este tipo de material. • Esterilización por calor seco: Se reserva para instrumental metálico, vidrio y materiales que puedan dañarse con la humedad; requiere temperaturas más altas (160-180°C) y tiempos prolongados (1-2 horas), además de no ser eficaz ni recomendado para textiles por el riesgo de deterioro y combustión del material. Tip/Mnemotecnia: \"Ropa que se moja, con vapor se esteriliza\": recuerda que el calor húmedo (autoclave) es el gold standard para textiles porosos, mientras que el calor seco y óxido de etileno se reservan para metal y material termosensible respectivamente.","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: Bioseguridad Tema: Limpieza, desinfección y métodos de esterilización Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":195,"question":"Paciente de 60 años con antecedentes de cáncer de próstata, para su tratamiento el médico indica intervención quirúrgica. Durante la visita médica el equipo de salud explica sobre el procedimiento al paciente, pero el paciente no desea iniciarlo. ¿Qué pilar de la bioética está implicado en este caso?","options":["Autonomía.","No maleficencia.","Justicia.","Beneficencia."],"answer":"Autonomía.","justification":"El principio de autonomía reconoce el derecho de una persona competente a decidir libremente sobre las intervenciones propuestas después de recibir información suficiente, comprensible y veraz. En el caso, el paciente conoce la recomendación quirúrgica y manifiesta que no desea iniciarla; su rechazo informado debe ser respetado y documentado, siempre verificando capacidad para decidir, comprensión de consecuencias y ausencia de coacción. El modelo de consentimiento informado del MSP se fundamenta precisamente en la participación del paciente y en su facultad de aceptar o rechazar procedimientos. Opciones incorrectas: • No maleficencia: Se refiere al deber de evitar daño innecesario. Es un principio transversal, pero el conflicto central del caso no es un daño causado por el equipo sino la decisión del paciente de rechazar una intervención. • Justicia: Se relaciona con equidad, trato imparcial y distribución justa de recursos y oportunidades de atención; no es el eje del rechazo de un tratamiento por decisión personal. • Beneficencia: Obliga al equipo a recomendar acciones orientadas al bienestar del paciente, como la cirugía cuando está indicada, pero no autoriza a imponerla contra una decisión autónoma e informada. Tip/Mnemotecnia: “Mi cuerpo, mi decisión informada” = autonomía.","bibliography":"Ministerio de Salud Pública del Ecuador. Modelo de gestión de aplicación del consentimiento informado en la práctica asistencial. Anexo del Acuerdo Ministerial 5316. Quito: MSP; 2014. https://www.salud.gob.ec/wp-content/uploads/2014/11/MSP_Consentimiento-Informado_-AM- 5316.pdf Subcomponente: Ética en el ejercicio profesional Tema: Ética y bioética: valores y principios Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":196,"question":"Un paciente de 60 años ha sido ingresado en el hospital tras sufrir un esguince de tobillo severo mientras jugaba al fútbol. A pesar de recibir analgésicos, sigue experimentando dolor intenso e inflamación en el tobillo. El profesional de enfermería decide implementar terapias no farmacológicas para ayudar a manejar su dolor. ¿Qué medida prioritaria utiliza en este caso?","options":["Utilizar técnicas clínicas de meditación.","Aplicar compresas frías en la zona afectada.","Realizar ejercicios de respiración profunda y relajación.","Aplicar masajes suaves en la zona afectada."],"answer":"Aplicar compresas frías en la zona afectada.","justification":"En un esguince agudo con dolor e inflamación, la aplicación local de frío es una medida no farmacológica útil para producir analgesia y ayudar a limitar el edema durante la fase inicial. Las recomendaciones de manejo conservador del esguince incluyen crioterapia como intervención aguda, habitualmente combinada con protección, compresión y elevación. Debe aplicarse con una barrera protectora y en periodos breves para evitar lesión cutánea por frío. Entre las opciones ofrecidas, es la intervención que actúa de forma más directa sobre el dolor y la inflamación del tobillo. Opciones incorrectas: • Utilizar técnicas clínicas de meditación: Puede disminuir la percepción del dolor y la ansiedad como estrategia complementaria, pero no actúa directamente sobre el edema traumático agudo y no es la prioridad entre las opciones. • Realizar ejercicios de respiración profunda y relajación: Son medidas coadyuvantes para modular tensión y ansiedad; resultan menos específicas para la inflamación local del esguince. • Aplicar masajes suaves en la zona afectada: Durante la fase aguda, manipular directamente una zona dolorosa e inflamada puede aumentar molestias y no constituye la medida inicial de elección antes de descartar lesiones importantes. Tip/Mnemotecnia: Esguince agudo: “frío = dolor e inflamación”.","bibliography":"Kaminski TW, Hertel J, Amendola N, et al. National Athletic Trainers' Association Position Statement: Conservative Management and Prevention of Ankle Sprains in Athletes. J Athl Train. 2013;48(4):528- 545. https://pmc.ncbi.nlm.nih.gov/articles/PMC3718356/ Subcomponente: Procedimientos básicos del cuidado enfermero Tema: Medidas terapéuticas, aplicación de calor y frío Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":197,"question":"Un paciente masculino de 67 años es ingresado en el servicio de cardiología, con diagnóstico médico de fibrilación auricular tratado con warfarina. Durante la noche deambula para ir al baño y se resbala sin sufrir ningún daño perceptible. ¿Cómo se denomina a este evento relacionado con la seguridad del paciente?","options":["Evento adverso leve.","Cuasi evento.","Evento centinela.","Evento adverso."],"answer":"Cuasi evento.","justification":"El Manual de Seguridad del Paciente del MSP define el cuasi evento como una situación que pudo haber causado daño pero no llegó a producirlo, ya sea por azar o por intervención oportuna. El escenario es prácticamente el ejemplo clásico: el paciente se resbala durante la deambulación pero no presenta daño perceptible. Aunque no haya lesión, debe notificarse y analizarse porque revela fallas o riesgos del sistema —por ejemplo, prevención de caídas en un paciente anticoagulado— que podrían ocasionar un evento grave en otra ocasión. Opciones incorrectas: • Evento adverso leve: Requiere que haya ocurrido daño atribuible a la atención, aunque sea de baja severidad. En el caso no se identifica lesión ni consecuencia clínica. • Evento centinela: Implica muerte, daño grave o pérdida permanente/temporal severa de función asociada a la atención; el caso no presenta ese desenlace. • Evento adverso: También supone daño no intencional relacionado con la atención. La ausencia de daño hace que la categoría más precisa sea cuasi evento. Tip/Mnemotecnia: “Casi pasó, pero no hubo daño” = cuasi evento.","bibliography":"Ministerio de Salud Pública del Ecuador. Seguridad del Paciente - Usuario. Manual. Primera edición. Quito:      MSP;      2016.       Registro     Oficial,     Edición     Especial      No.      760. https://www.registroficial.gob.ec/edicion-especial-no-760-7/ Subcomponente: Seguridad y calidad en el cuidado Tema: Seguridad del paciente: generalidades Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":198,"question":"En la unidad de cuidados intensivos el personal de enfermería realiza de forma rutinaria la desinfección con glutaraldehído al 2% de todos los equipos utilizados en la intubación del paciente como las láminas del laringoscopio, este procedimiento es realizado durante 20 minutos. De acuerdo con el caso, ¿Qué nivel de desinfección se está aplicando?","options":["Desinfección de bajo nivel.","Desinfección de nivel mínimo.","Desinfección de alto nivel.","Desinfección de nivel intermedio."],"answer":"Desinfección de alto nivel.","justification":"El glutaraldehído al 2 % con un tiempo de contacto aproximado de 20 minutos se utiliza como agente de desinfección de alto nivel para determinados dispositivos semicríticos termosensibles. Las láminas del laringoscopio contactan mucosas y, conforme a la clasificación de Spaulding incorporada en el Manual de Bioseguridad del MSP, requieren al menos desinfección de alto nivel después de una limpieza previa adecuada. Este nivel destruye bacterias vegetativas, micobacterias, hongos y virus, aunque no garantiza la eliminación absoluta de grandes cargas de esporas como la esterilización. Opciones incorrectas: • Desinfección de bajo nivel: Se reserva principalmente para superficies y artículos no críticos; no es suficiente para un dispositivo que contacta mucosas. • Desinfección de nivel mínimo: No corresponde a una categoría técnica estándar en la clasificación utilizada por el MSP para reprocesamiento de dispositivos. • Desinfección de nivel intermedio: Tiene mayor espectro que la de bajo nivel, pero no alcanza el nivel requerido para artículos semicríticos como las láminas del laringoscopio. Tip/Mnemotecnia: Semicrítico + mucosa = “alto nivel”.","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Bioseguridad para los Establecimientos de Salud. Quito: MSP; 2016. https://dspace.uniandes.edu.ec/handle/123456789/11812 Subcomponente: Bioseguridad Tema: Limpieza, desinfección y métodos de esterilización Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":199,"question":"Un profesional de enfermería ha terminado de realizar el aseo de un paciente fallecido debido a un infarto agudo de miocardio por arritmia maligna, ha retirado los catéteres, ocluido los orificios naturales y ha colocado el cuerpo en decúbito supino con ligera elevación de la cabeza sobre una almohada. ¿Por qué se coloca el cuerpo en esa posición?","options":["Para disminuir la lividez cadavérica en el rostro.","Para evitar el drenaje sanguíneo de la cara.","Para retrasar la aparición del enfriamiento cadavérico.","Para impedir la aparición de la rigidez cadavérica."],"answer":"Para disminuir la lividez cadavérica en el rostro.","justification":"Tras la muerte, la sangre se desplaza por gravedad hacia las zonas declives y produce livor mortis o lividez cadavérica. Colocar el cuerpo en decúbito supino con la cabeza y los hombros ligeramente elevados ayuda a disminuir la acumulación de sangre en la cara y, por tanto, la coloración violácea facial, favoreciendo además una presentación digna para la familia. Los procedimientos de cuidado post mortem recomiendan realizar este posicionamiento tempranamente antes de que la lividez se fije. Opciones incorrectas: • Para evitar el drenaje sanguíneo de la cara: La finalidad principal no es impedir un 'drenaje' activo de sangre, sino reducir el estancamiento gravitacional en tejidos faciales. • Para retrasar la aparición del enfriamiento cadavérico: El algor mortis depende principalmente de la pérdida de calor corporal y del ambiente; elevar la cabeza no lo retrasa de forma relevante. • Para impedir la aparición de la rigidez cadavérica: La rigidez se produce por cambios bioquímicos post mortem en el músculo; la posición ayuda a mantener alineación antes de que aparezca, pero no evita el rigor mortis. Tip/Mnemotecnia: Post mortem: cabeza elevada = menos “coloración por gravedad” en el rostro.","bibliography":"Wolters Kluwer. Lippincott Nursing Procedures. 8th ed. Philadelphia: Wolters Kluwer; 2019. NLM Catalog: https://www.ncbi.nlm.nih.gov/nlmcatalog/101741645 Subcomponente: Procedimientos básicos del cuidado enfermero Tema: Cuidados postmorten Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":200,"question":"Un lactante de 8 meses es ingresado al servicio de pediatría. Durante la valoración de enfermería, usted observa que el paciente presenta dificultad respiratoria evidente, cianosis peribucal, tos persistente y la presencia de abundantes secreciones en la vía aérea. A la auscultación, se perciben sonidos crepitantes en ambos campos pulmonares. Al realizar el razonamiento clínico para priorizar los problemas del paciente basándose en la taxonomía NANDA-I, usted identifica el diagnóstico de \"Limpieza ineficaz de la vía aérea\". ¿A qué dominio de la taxonomía NANDA-I corresponde el diagnóstico identificado para este paciente?","options":["Dominio Actividad / Reposo","Dominio Principios Vitales","Dominio Seguridad / Protección","Dominio Confort"],"answer":"Dominio Seguridad / Protección","justification":"En la taxonomía NANDA-I, el diagnóstico “Limpieza ineficaz de las vías aéreas” (Ineffective airway clearance) se encuentra en el Dominio 11: Seguridad/Protección, dentro de la clase relacionada con lesión física. El diagnóstico describe la incapacidad para eliminar secreciones u obstrucciones de la vía respiratoria y mantenerla permeable, lo que se vincula directamente con la protección frente a hipoxia, aspiración y deterioro respiratorio. Los hallazgos del lactante —secreciones abundantes, tos, cianosis y ruidos respiratorios— son congruentes con este problema. Opciones incorrectas: • Dominio Actividad / Reposo: Incluye respuestas relacionadas con actividad, ejercicio, sueño, energía y procesos cardiopulmonares de tolerancia/función, pero no es donde NANDA-I ubica este diagnóstico específico. • Dominio Principios Vitales: Corresponde al Dominio 10 (Life Principles), centrado en valores, creencias y congruencia entre valores/acciones; no se relaciona con la permeabilidad de la vía aérea. • Dominio Confort: Incluye diagnósticos sobre comodidad física, ambiental, social y psicológica, como dolor; no es la clasificación del diagnóstico de limpieza ineficaz de vías aéreas. Tip/Mnemotecnia: Vía aérea permeable = protección frente al daño → Dominio 11 Seguridad/Protección.","bibliography":"Herdman TH, Kamitsuru S, Lopes CT, eds. NANDA International Nursing Diagnoses: Definitions and Classification, 2024–2026. 13th ed. New York: Thieme; 2024. https://shop.thieme.com/en/NANDA-I- International-Nursing-Diagnoses/9781684206025 Subcomponente: Proceso de atención en Enfermería Tema: Taxonomías, NANDA, NOC Y NIC Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":201,"question":"Durante la revisión mensual de las soluciones intravenosas en el coche de paro y en la bodega de una unidad de hospitalización, el personal de enfermería identifica varios frascos de cloruro de sodio al 0.9%, lactato de ringer y dextrosa en agua al 5% que han cumplido su fecha de caducidad. De acuerdo con el manual de gestión interna de residuos y desechos generados en establecimientos de salud del MSP, ¿en qué categoría deben ser clasificados estos medicamentos para su correcto acopio y transferencia diferenciada?","options":["Desechos comunes.","Desechos farmacéuticos peligrosos.","Desechos farmacéuticos no peligrosos.","Desechos químicos peligrosos"],"answer":"Desechos farmacéuticos no peligrosos.","justification":"Las soluciones parenterales simples vencidas, como cloruro de sodio al 0,9 %, lactato de Ringer y dextrosa al 5 %, se clasifican dentro de los desechos farmacéuticos no peligrosos cuando no contienen principios activos de alto riesgo. El manual ecuatoriano diferencia estos residuos de los farmacéuticos peligrosos y establece su segregación, acopio y transferencia diferenciada. Que el producto haya caducado impide su uso clínico, pero no convierte automáticamente una solución de sales o glucosa en un desecho químico peligroso. Opciones incorrectas: • Desechos comunes: Aunque su composición pueda ser de bajo riesgo, al tratarse de productos farmacéuticos vencidos deben seguir la corriente específica establecida para residuos farmacéuticos, no mezclarse con basura común. • Desechos farmacéuticos peligrosos: Esta categoría se reserva para fármacos con características o principios activos que representan riesgos mayores y requieren manejo especial; las soluciones simples descritas se consideran de bajo riesgo. • Desechos químicos peligrosos: Se aplica a reactivos y sustancias químicas con propiedades peligrosas específicas; las soluciones intravenosas simples caducadas se gestionan como desechos farmacéuticos no peligrosos según el manual. Tip/Mnemotecnia: Suero simple vencido ≠ basura común: va a “farmacéutico no peligroso”.","bibliography":"Ministerio de Salud Pública del Ecuador. Gestión interna de los residuos y desechos generados en los establecimientos de salud. Manual. Quito: MSP; 2019. https://www.salud.gob.ec/ministerio-de- salud-publica-presento-el-manual-de-gestion-interna-de-los-residuos-desechos-generados-en-los- establecimientos-de-salud/ Subcomponente: Bioseguridad Tema: Manejo y tipo de desechos Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":202,"question":"De acuerdo con el Manual de Bioseguridad para los establecimientos de salud del MSP, los dispositivos médicos se clasifican según el riesgo de infección que representa su uso. Aquellos artículos que ingresan directamente a cavidades o tejidos estériles, incluyendo el sistema vascular, se denominan \"artículos críticos\" debido al alto riesgo de infección que conllevan si están contaminados con cualquier microorganismo, por lo que deben ser siempre estériles. ¿Cuál de los siguientes grupos de insumos corresponde a esta categoría?","options":["Equipos de asistencia respiratoria, anestesia y equipos endoscópicos.","Instrumental quirúrgico, sondas cardiacas, catéteres y prótesis.","Esfigmomanómetros, estetoscopios, sábanas y superficies de camas.","Mascarillas de oxígeno, laringoscopios y depresores linguales."],"answer":"Instrumental quirúrgico, sondas cardiacas, catéteres y prótesis.","justification":"El Manual de Bioseguridad del MSP aplica la clasificación de Spaulding: los artículos críticos penetran tejidos estériles o el sistema vascular y, si están contaminados, implican alto riesgo de infección. Por ello deben estar estériles antes del uso. El instrumental quirúrgico, las sondas cardiacas, los catéteres intravasculares y las prótesis cumplen esa definición porque ingresan a compartimentos normalmente estériles. Opciones incorrectas: • Equipos de asistencia respiratoria, anestesia y equipos endoscópicos: En general contactan mucosas o piel no intacta y se clasifican como semicríticos, por lo que requieren al menos desinfección de alto nivel según el dispositivo. • Esfigmomanómetros, estetoscopios, sábanas y superficies de camas: Contactan piel intacta o el entorno y son artículos no críticos; requieren limpieza y desinfección de bajo nivel según riesgo. • Mascarillas de oxígeno, laringoscopios y depresores linguales: La mayoría contacta mucosas y se maneja como material semicrítico o de uso único según el producto; no corresponde al grupo típico de artículos críticos que penetran tejidos estériles. Tip/Mnemotecnia: Crítico = “entra a estéril o a vaso” → esterilización.","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Bioseguridad para los Establecimientos de Salud. Quito: MSP; 2016. https://dspace.uniandes.edu.ec/handle/123456789/11812 Subcomponente: Bioseguridad Tema: Limpieza, desinfección y métodos de esterilización Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":203,"question":"Madre acude al centro de salud con su recién nacido masculino de 15 días de vida para el tamizaje metabólico neonatal. Al momento, recién nacido con signos vitales normales. ¿Qué consideración es correcta en la toma de la muestra?","options":["Puncionar en la parte central del talón.","Limpiar el área del talón con gasa impregnada en alcohol antiséptico.","Puncionar en una de las partes laterales del talón.","Friccionar el sitio de punción antes de la toma de la muestra."],"answer":"Puncionar en una de las partes laterales del talón.","justification":"La técnica correcta para la toma de muestra de tamizaje metabólico neonatal (prueba del talón) indica que la punción debe realizarse en las caras laterales interna o externa de la superficie plantar del talón, evitando la zona central posterior, ya que en este sitio existe mayor riesgo de lesionar el hueso calcáneo, tendones y estructuras nerviosas, además de que la profundidad ósea en recién nacidos es menor a 2.4 mm, lo que puede provocar osteocondritis o osteomielitis si la punción es profunda y central. Opciones incorrectas: • Puncionar en la parte central del talón: Está contraindicado, ya que en esta zona el hueso calcáneo se encuentra más superficial, incrementando el riesgo de osteomielitis, lesión nerviosa y formación de cicatrices dolorosas. • Limpiar el área del talón con gasa impregnada en alcohol antiséptico: El alcohol debe dejarse secar completamente antes de la punción, ya que si permanece húmedo puede hemolizar la muestra y alterar los resultados del tamizaje; además, el procedimiento estándar recomienda su evaporación total, no solo la limpieza per se como paso determinante. • Friccionar el sitio de punción antes de la toma de la muestra: No se recomienda friccionar vigorosamente el talón, ya que esto puede provocar hemólisis de la muestra y alterar los valores bioquímicos analizados en el tamizaje. Tip/Mnemotecnia: \"Talón de lado, muestra segura\" — recuerda puncionar siempre en las caras laterales del talón (interna o externa), nunca en el centro posterior, para evitar lesión ósea y garantizar una muestra de calidad.","bibliography":"Kliegman R, Geme J, Blum N, Shah S, Tasker R, Wilson K. Tratado de pediatría de Nelson. 21ª ed. Elsevier; 2020. Subcomponente: Cuidados de enfermería en el recién nacido Tema: Valoración integral del recién nacido Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":204,"question":"El cáncer de cuello uterino se clasifica en diferentes estadios clínicos para su manejo; por tanto, una mujer que presenta un tumor que se ha extendido a la pared de la pelvis, al examen rectal no hay espacio libre de cáncer entre el tumor y la pared de la pelvis. ¿A qué estadio clínico corresponde?","options":["Estadio III B.","Estadio II A.","Estadio IV B.","Estadio IV A."],"answer":"Estadio III B.","justification":"Según la clasificación FIGO (Federación Internacional de Ginecología y Obstetricia) para cáncer de cuello uterino, el estadio III corresponde a un tumor que se extiende a la pared pélvica y/o afecta el tercio inferior de la vagina y/o causa hidronefrosis o anulación funcional del riñón, sin otra causa que lo explique. Específicamente, el estadio III B se define cuando el tumor se extiende hasta la pared pélvica, y al examen rectal no existe espacio libre de cáncer entre el tumor y dicha pared (signo de \"congelación\" o \"frozen pelvis\"), y/o cuando produce hidronefrosis o riñón no funcionante, independientemente del tamaño tumoral. Este hallazgo clínico es fundamental porque determina que el tumor ya no es susceptible de manejo quirúrgico curativo, orientando el tratamiento hacia radioterapia y quimioterapia concurrente. Opciones incorrectas: • Estadio II A: Corresponde a un tumor que se extiende más allá del cuello uterino, pero sin invadir el tercio inferior de la vagina ni la pared pélvica; en este subestadio existe compromiso vaginal superior sin invasión parametrial evidente. • Estadio IV B: Se reserva para la enfermedad con diseminación a distancia (metástasis a órganos extrapélvicos como pulmón, hígado o huesos), lo cual constituye un compromiso sistémico mucho más avanzado que la simple extensión local a la pared pélvica. • Estadio IV A: Se refiere a la extensión del tumor a órganos adyacentes como la vejiga o el recto (confirmada por biopsia), sin necesariamente existir extensión hasta la pared pélvica como criterio único. Tip/Mnemotecnia: Recuerda \"Pelvis Congelada = III B\": si al tacto rectal el tumor está \"pegado\" o fijo a la pared pélvica sin espacio libre, o si hay hidronefrosis/riñón no funcionante, siempre piensa en Estadio III B, sin importar el tamaño del tumor.","bibliography":"Hoffman B, Schorge J, Halvorson L, Hamid C, Corton M, Schaffer J. Williams Ginecología. 4ª ed. McGraw-Hill; 2022. Subcomponente: Cuidados gíneco obstétricos de la mujer Tema: Cuidados de enfermería en patología ginecológica: cáncer de mama y cáncer cérvico uterino Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":205,"question":"Paciente femenina de 16 años acude a la unidad de salud, refiere que ha empezado su vida sexual y desconoce los métodos de anticoncepción, enfermedades de transmisión sexual, entre otros. Por lo que necesita asesoría en salud sexual y reproductiva. ¿Cuál es el primer paso a seguir para cumplir con el proceso de asesoría, de acuerdo al Manual de Asesoría en Salud Sexual y Reproductiva del Ministerio de Salud Pública?","options":["Información.","Indagación.","Vínculo.","Decisión."],"answer":"Vínculo.","justification":"Según el Manual de Asesoría en Salud Sexual y Reproductiva del Ministerio de Salud Pública del Ecuador, el proceso de asesoría consejería consta de momentos secuenciales, siendo el primero el establecimiento del vínculo, es decir, la creación de un ambiente de confianza, empatía y respeto entre el/la profesional de salud y el/la usuario/a. Este paso es indispensable porque permite que la persona se sienta escuchada y en confianza para expresar abiertamente sus dudas, temores y necesidades en torno a la sexualidad, condición previa para que los siguientes momentos (indagación, información y decisión) sean efectivos y respondan realmente a la realidad del/la adolescente. Opciones incorrectas: • Información: Corresponde a un momento posterior, en el cual se brindan contenidos técnicos y educativos sobre métodos anticonceptivos, infecciones de transmisión sexual y salud reproductiva, pero solo después de haber indagado las necesidades específicas de la usuaria. • Indagación: Es la segunda etapa del proceso, en la que se explora a profundidad la situación, conocimientos previos, contexto biopsicosocial y riesgos de la persona; requiere que ya exista un vínculo de confianza establecido. • Decisión: Constituye la etapa final, en la que la persona asesorada, con la información y el acompañamiento recibidos, toma una decisión informada y autónoma sobre su salud sexual y reproductiva. Tip/Mnemotecnia: Recuerda la secuencia con la sigla \"VIDC\": Vínculo → Indagación → Decisión → Cierre. Sin vínculo (confianza), no hay indagación honesta ni decisión bien informada.","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: Salud sexual y reproductiva de la mujer Tema: Normas y guías de salud sexual y reproductiva Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":206,"question":"Mujer de 23 años, primípara, permanece en la sala de partos en conjunto con su recién nacido masculino a término. Durante el parto no se presentaron complicaciones ni riesgos. La mujer solicita información sobre cuándo debe iniciar la lactancia materna. ¿Qué información le ofrece?","options":["Lactancia materna cuando pase a hospitalización.","Lactancia materna dentro de la primera hora luego del nacimiento.","Lactancia materna cuando pase a recuperación.","Lactancia materna una hora después del nacimiento."],"answer":"Lactancia materna dentro de la primera hora luego del nacimiento.","justification":"La lactancia materna precoz, dentro de la primera hora de vida, constituye una práctica esencial recomendada por la OMS y el MSP dentro de las estrategias de contacto piel con piel y alojamiento conjunto, ya que favorece el vínculo madre-hijo, estimula la producción de oxitocina y prolactina (facilitando la lactogénesis y la involución uterina), aporta calostro rico en inmunoglobulinas que protege al neonato de infecciones, y promueve la colonización adecuada de la microbiota intestinal del recién nacido. Esta práctica forma parte de los \"Diez pasos para una lactancia materna exitosa\" de la Iniciativa Hospital Amigo del Niño y de la Niñez. Opciones incorrectas: • Lactancia materna cuando pase a hospitalización: Retrasar el inicio de la lactancia hasta el traslado a hospitalización pierde la ventana crítica del período sensitivo neonatal, en el cual el reflejo de succión y búsqueda están más desarrollados, disminuyendo las probabilidades de un enganche exitoso y de estimulación hormonal oportuna. • Lactancia materna cuando pase a recuperación: Diferir la lactancia al periodo de recuperación materna desconoce que, en un parto sin complicaciones, tanto la madre como el neonato están en condiciones óptimas para iniciar el contacto piel con piel y el amamantamiento de forma inmediata en la misma sala de partos. • Lactancia materna una hora después del nacimiento: Esta opción es incorrecta porque establece el inicio de la lactancia después de transcurrida la primera hora, contradiciendo la recomendación de iniciarla dentro de dicho periodo (y no posterior a él), lo cual reduce los beneficios fisiológicos e inmunológicos asociados a la lactancia precoz. Tip/Mnemotecnia: \"La primera hora es de oro\": piel con piel + succión precoz = mejor vínculo, mejor producción de leche y mejor protección inmunológica para el recién nacido.","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: Cuidados de enfermería en el embarazo, parto y puerperio Tema: Fisiología de la lactancia materna educación en salud, del futuro. GRATUITO CURSO CACES 2026 -2027 ENFERMERÍA ENFERMERÍA Plataforma con contenido académico Escanea el QR e Webinars con temas     ingresa a nuestro importantes y             GRUPO preguntas filtradas Bancos de preguntas CACES 2025 y 2026 Descuentos exclusivos en nuestros cursos PREMIUM PRO - ESTANDAR Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":207,"question":"Mujer primigesta de 46 años, gestante de 20 semanas, que acude a centro de salud, refiere malestar general acompañado de cefalea, cambios de la visión, náusea que llega al vómito, edema de manos y miembros inferiores y oliguria. Es valorada por profesional de enfermería, quien realiza valoración de Score MAMÁ y una entrevista minuciosa. ¿Cuál es un factor de riesgo alto para preeclampsia?","options":["Infección de vías urinarias.","Enfermedad renal crónica.","Enfermedad periodontal.","Primer embarazo."],"answer":"Enfermedad renal crónica.","justification":"Constituye un factor de riesgo alto para el desarrollo de preeclampsia, según las guías internacionales (ACOG, NICE) y la normativa del MSP para la valoración de riesgo obstétrico mediante el SCORE MAMÁ. La nefropatía crónica genera daño endotelial preexistente, alteración en la regulación de factores angiogénicos (sFlt-1, PlGF) y disminución de la perfusión renal, lo que predispone a una placentación anómala y a la génesis del síndrome hipertensivo del embarazo. Junto con la hipertensión arterial crónica, la diabetes pregestacional, las enfermedades autoinmunes (LES, síndrome antifosfolípido) y el antecedente de preeclampsia en embarazo previo, se clasifica como factor de riesgo alto que obliga a iniciar profilaxis con ácido acetilsalicílico a dosis bajas desde el primer trimestre. Opciones incorrectas: • Infección de vías urinarias: Es una complicación frecuente del embarazo asociada a parto pretérmino y sepsis materna, pero no se clasifica dentro de los factores de riesgo alto para preeclampsia según las escalas de valoración obstétrica. • Enfermedad periodontal: Se ha relacionado con parto pretérmino y bajo peso al nacer por diseminación de mediadores inflamatorios, pero no figura como factor de riesgo alto establecido para preeclampsia. • Primer embarazo: La nuliparidad es un factor de riesgo moderado para preeclampsia, no alto, ya que se asocia a una menor exposición inmunológica previa a antígenos paternos/fetales, pero su peso predictivo es menor que el de las comorbilidades crónicas maternas. Tip/Mnemotecnia: \"CHAD renal\" – Comorbilidades crónicas (Cardiopatía, Hipertensión crónica, Autoinmunidad, Diabetes pregestacional) + enfermedad Renal = factores de riesgo ALTO para preeclampsia; edad >40 años y nuliparidad son factores de riesgo MODERADO.","bibliography":"Cunningham G, Leveno K, Dashe J, Hoffman B, Spong C, Casey B. Williams Obstetrics. 26ª ed. McGraw-Hill; 2022. Subcomponente: Cuidados de enfermería en el embarazo, parto y puerperio Tema: SCORE MAMA y claves obstétricas Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":208,"question":"Recién nacido en sus primeros segundos de vida, producto a término con peso adecuado para la edad gestacional. Al momento, en la valoración APGAR de 0 a 3 puntos, presenta llanto débil, cianosis generalizada, ausencia de respiración, frecuencia cardíaca menor de 100 latidos por minuto. Al examen físico se evidencia presencia de líquido amniótico meconial, secreciones respiratorias en escasa cantidad. ¿Qué acción inmediata debe realizar el profesional en enfermería en el recién nacido?","options":["Aplicar el minuto de oro.","Aspiración de secreciones.","Cuidados de observación.","Estímulos sensoriales."],"answer":"Aplicar el minuto de oro.","justification":"El \"minuto de oro\" es el estándar de manejo inicial en reanimación neonatal establecido por el Programa de Reanimación Neonatal (PRN), y debe iniciarse de forma inmediata ante un recién nacido con APGAR bajo (0-3), signos de depresión), cianosis generalizada y bradicardia (FC <100 lpm). Consiste en realizar, dentro de los primeros 60 segundos de vida, los pasos iniciales de estabilización: colocar al neonato en posición adecuada con vía aérea despejada, secar y estimular, evaluar respiración, frecuencia cardíaca y color, e iniciar ventilación con presión positiva si es necesario. Esta secuencia sistematizada y cronometrada tiene como objetivo revertir la asfixia perinatal y evitar daño hipóxico-isquémico, priorizándose sobre cualquier otra intervención aislada. Opciones incorrectas: • Aspiración de secreciones: Actualmente no se recomienda la aspiración de rutina, incluso en presencia de líquido amniótico meconial, salvo que exista obstrucción evidente de la vía aérea que impida la ventilación; realizarla de forma indiscriminada puede retrasar el inicio de la ventilación con presión positiva y provocar bradicardia refleja por estimulación vagal. • Cuidados de observación: Son inapropiados en este escenario, ya que el neonato presenta signos claros de depresión severa que requieren intervención activa e inmediata, no una conducta expectante que retrasaría la reanimación y aumentaría el riesgo de daño neurológico y muerte. • Estímulos sensoriales: Constituyen únicamente uno de los componentes del minuto de oro (secado y estimulación táctil), pero de manera aislada son insuficientes ante un neonato con ausencia de respiración y bradicardia, que requiere el protocolo completo de reanimación. Tip/Mnemotecnia: \"Minuto de oro = Secar, Posicionar, Evaluar, Ventilar\" — recuerda que los primeros 60 segundos de vida son decisivos para romper el círculo de hipoxia-bradicardia-depresión respiratoria en el recién nacido.","bibliography":"Organización Panamericana de la Salud. Manual Clínico AIEPI Neonatal en el contexto del continuo materno-recién nacido-salud infantil. OPS; 2006. Subcomponente: Cuidados de enfermería en el recién nacido Tema: Reanimación neonatal, oxigenoterapia y saturación de oxígeno Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":209,"question":"A la valoración de un recién nacido, en el cual se identifica que no responde, no ventila y no tiene pulso; en la escena se encuentra el profesional de enfermería y un segundo reanimador. ¿Cuál es la relación entre compresión y ventilación en este caso?","options":["15 compresiones, 2 ventilaciones.","30 compresiones, 2 ventilaciones.","30 compresiones, 1 ventilación.","15 compresiones, 3 ventilaciones."],"answer":"15 compresiones, 2 ventilaciones.","justification":"En la reanimación cardiopulmonar neonatal con dos reanimadores presentes, la relación compresión-ventilación recomendada es de 15:2, a diferencia de la relación 30:2 utilizada cuando existe un único reanimador. Esta relación busca optimizar la oxigenación y ventilación del neonato, dado que en esta población las causas de paro son predominantemente de origen respiratorio (hipoxia), por lo que se prioriza una ventilación más frecuente y eficaz en comparación con el adulto. Las compresiones deben realizarse a una profundidad de al menos un tercio del diámetro anteroposterior del tórax, con una frecuencia de 100-120 por minuto, utilizando la técnica de los dos pulgares con manos rodeando el tórax, que ha demostrado generar mayor presión de perfusión coronaria cuando se dispone de dos reanimadores. Opciones incorrectas: • 30 compresiones, 2 ventilaciones: Esta relación corresponde a la reanimación con un único reanimador en neonatos, o bien a la reanimación cardiopulmonar básica en el adulto, pero no es la indicada cuando se cuenta con dos reanimadores en un recién nacido. • 30 compresiones, 1 ventilación: Esta combinación no corresponde a ningún protocolo estandarizado de reanimación neonatal, pediátrica o de adultos vigente. • 15 compresiones, 3 ventilaciones: Aunque mantiene la base de 15 compresiones para dos reanimadores, el número de ventilaciones recomendado es de 2, no de 3, por lo que esta opción es incorrecta. Tip/Mnemotecnia: \"Uno solo, treinta y dos; dos o más, quince y dos\" — con un reanimador la relación es 30:2, y con dos o más reanimadores en neonatos, la relación cambia a 15:2 para priorizar la ventilación.","bibliography":"Organización Panamericana de la Salud. Manual Clínico AIEPI Neonatal en el contexto del continuo materno-recién nacido-salud infantil. OPS; 2006. Subcomponente: Cuidados de enfermería en el recién nacido Tema: Reanimación neonatal, oxigenoterapia y saturación de oxígeno Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":210,"question":"Un neonato con antecedentes de prematurez moderada llega al servicio de emergencias de la maternidad en brazos de su madre. Es valorado por el profesional de enfermería, quien observa letargia y cianosis distal leve; procede a colocarlo en la incubadora conectado al sensor de temperatura de piel, donde se aprecia un valor de 35.3 °C. ¿En qué clasificación de temperatura se encuentra el neonato?","options":["Hipotermia moderada.","Normotermia.","Hipotermia leve.","Hipotermia grave."],"answer":"Hipotermia moderada.","justification":"Según la clasificación de la OMS adoptada en la estrategia AIEPI Neonatal, la hipotermia moderada se define por una temperatura corporal (axilar o de piel) entre 32.0 °C y 35.9 °C. El neonato del caso, con 35.3 °C, letargia y cianosis distal, se ubica en este rango, presentando signos clínicos compatibles con estrés por frío avanzado: la letargia refleja el aumento del consumo de oxígeno y la depleción de reservas energéticas (glucógeno y grasa parda) que el neonato pretérmino utiliza para generar calor mediante termogénesis sin escalofríos, mientras que la cianosis distal se explica por la vasoconstricción periférica compensatoria que prioriza la perfusión de órganos vitales. La prematurez moderada constituye un factor de riesgo determinante, dado la inmadurez del centro termorregulador hipotalámico, la mayor superficie corporal en relación con el peso y el escaso panículo adiposo subcutáneo. Opciones incorrectas: • Normotermia: Corresponde al rango de 36.5 °C a 37.5 °C, considerado el estado térmico neutro y deseable en el recién nacido; el valor de 35.3 °C está claramente por debajo de este rango. • Hipotermia leve: También denominada estrés por frío, se define entre 36.0 °C y 36.4 °C; el neonato del caso presenta una temperatura inferior a este umbral, por lo que su condición es más severa que la leve. • Hipotermia grave: Se establece con valores inferiores a 32.0 °C, generalmente asociada a bradicardia, apnea, hipoglucemia severa y riesgo elevado de mortalidad; el valor de 35.3 °C no alcanza este nivel de severidad. Tip/Mnemotecnia: Recuerda la escala térmica neonatal como una \"cuenta regresiva de la seguridad\": Normal (36.5- 37.5) → Leve/Estrés por frío (36-36.4) → Moderada (32-35.9) → Grave (<32). A menor temperatura, mayor riesgo de descompensación metabólica y muerte neonatal.","bibliography":"Organización Panamericana de la Salud. Manual Clínico AIEPI Neonatal en el contexto del continuo materno-recién nacido-salud infantil. OPS; 2006. Subcomponente: Cuidados de enfermería en el recién nacido Tema: Termorregulación, líquidos y electrolitos Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":211,"question":"Mujer de 20 años, primigesta, que cursa un embarazo de 12 semanas. En su primer control prenatal usted identifica la presencia de algunos factores de riesgo; a la valoración de enfermería determina que es una paciente de bajo riesgo. ¿Relacione cuáles son los factores de riesgo modificables y no modificables? 1. Factores modificables 2. Factores no modificables a. Fecha de última menstruación incierta. b. Inadecuado soporte familiar y de la pareja. c. Fumadora habitual. d. Baja escolaridad.","options":["1ad, 2bc.","1ab, 2cd.","1bc, 2ad.","1cd, 2ab."],"answer":"1bc, 2ad.","justification":"Los factores de riesgo modificables son aquellos susceptibles de intervención mediante educación, consejería o cambios conductuales durante el control prenatal, por lo que corresponden a \"fumadora habitual\" y \"soporte familiar y de la pareja inadecuado\"; ambos pueden abordarse activamente por el equipo de salud. En contraste, los factores no modificables son condiciones estructurales o históricas que no pueden revertirse en el curso del embarazo actual, como la \"fecha de última menstruación incierta\" y la \"baja escolaridad\". Esta clasificación es fundamental en la valoración integral de la embarazada, ya que orienta las intervenciones de enfermería hacia los factores biopsicosociales que sí pueden reducir el riesgo obstétrico. Opciones incorrectas: • 1ad, 2bc: Invierte la clasificación; coloca como modificables factores estructurales/históricos que no pueden cambiarse con intervención directa, y como no modificables factores conductuales que sí son susceptibles de modificación. • 1ab, 2cd: Agrupa incorrectamente la FUM incierta con el soporte familiar como modificables, cuando la FUM incierta es un dato histórico no modificable, y deja el tabaquismo (claramente modificable) entre los no modificables. • 1cd, 2ab: Ubica la baja escolaridad como modificable en el corto plazo del embarazo, lo cual no es realista dentro del período gestacional, y coloca el soporte familiar entre los no modificables. Tip/Mnemotecnia: \"Lo que PUEDES cambiar con consejería (hábitos y apoyo) es MODIFICABLE; lo que ya PASÓ o es ESTRUCTURAL (fechas y escolaridad) es NO MODIFICABLE.\"","bibliography":"Cunningham G, Leveno K, Dashe J, Hoffman B, Spong C, Casey B. Williams Obstetrics. 26ª ed. McGraw-Hill; 2022. Subcomponente: Cuidados de enfermería en el embarazo, parto y puerperio Tema: Valoración integral de la embarazada: aspectos clínicos, factores de riesgo obstétrico maternos: biofísicos, psicosociales, sociodemográficos y ambientales y factores protectores Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":212,"question":"Gestante de 12 semanas se presenta en el centro de salud para inmunización, posterior al control prenatal por parte de la obstetra. No presenta problema alguno de salud. A la valoración de enfermería no existen signos o síntomas de infección alguna ni se refieren alergias a vacunas por parte de la gestante. ¿Qué vacuna está contraindicada para esta paciente?","options":["Hepatitis tipo B.","Influenza estacional.","Difteria y tétanos.","Triple viral (SRP)."],"answer":"Triple viral (SRP).","justification":"sarampión, rubéola y parotiditis). Esta vacuna está elaborada con virus vivos atenuados, por lo que está contraindicada durante el embarazo debido al riesgo teórico de transmisión del virus vacunal al feto. La principal preocupación corresponde al componente contra la rubéola, debido a los graves efectos que la infección natural por este virus puede ocasionar durante la gestación. Por precaución, se recomienda administrar esta vacuna antes del embarazo o después del parto y evitar el embarazo durante al menos 28 días después de la vacunación. Opciones incorrectas: • Hepatitis tipo B: Es una vacuna inactivada (recombinante), segura durante el embarazo, indicada especialmente en gestantes con factores de riesgo o desconocimiento de su estado serológico, ya que no representa riesgo para el feto. • Influenza estacional: Se trata de una vacuna inactivada, recomendada en cualquier trimestre del embarazo, dado que reduce el riesgo de complicaciones respiratorias graves en la madre y confiere inmunidad pasiva al recién nacido. • Difteria y tétanos: Es una vacuna con toxoides inactivados, parte del esquema rutinario de la embarazada (dTpa), fundamental para prevenir el tétanos neonatal y proteger a la madre, sin riesgo de teratogenicidad. Tip/Mnemotecnia: \"Virus VIVO, en el embarazo NO VOY\": las vacunas de virus vivos atenuados (varicela, SRP, fiebre amarilla, BCG) están contraindicadas en gestantes; las inactivadas o de toxoides (influenza, dTpa, hepatitis B) sí se pueden administrar.","bibliography":"Ministerio de Salud Pública del Ecuador. Estrategia Nacional de Inmunizaciones, ENI. Ministerio de Salud Pública; 2021. Subcomponente: Cuidados de enfermería en el embarazo, parto y puerperio Tema: Manejo de la libreta integral de salud Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":213,"question":"Paciente femenina de 17 años acude a consulta externa refiriendo un retraso de 3 semanas en su ciclo menstrual, además menciona que tras realizarse una prueba urinaria de embarazo doméstica esta salió positiva. Al interrogatorio menciona prácticas sexuales sin protección. ¿Qué datos complementarios ayudarían a confirmar el embarazo?","options":["Cambios en el aparato reproductor inferior, signo de Chadwick.","El aumento de la pigmentación y la aparición de estrías abdominales.","Fecha de última menstruación y tiempo de amenorrea.","La detección de B-HCG en sangre y la ecografía transvaginal."],"answer":"La detección de B-HCG en sangre y la ecografía transvaginal.","justification":"Estos corresponden a los signos positivos o de certeza del embarazo, los únicos que permiten confirmarlo de manera objetiva. La subunidad beta de la gonadotropina coriónica humana (B-HCG) es producida por el sincitiotrofoblasto desde la implantación y su detección cuantitativa en sangre tiene alta sensibilidad y especificidad; sin embargo, el Gold Standard para confirmar la gestación intrauterina, visualizar el saco gestacional, el embrión y su actividad cardiaca (a partir de la sexta semana aproximadamente) es la ecografía transvaginal, que además permite descartar embarazo ectópico o molar. Opciones incorrectas: • Cambios en el aparato reproductor inferior, signo de Chadwick.: Corresponde a un signo probable de embarazo (coloración violácea de la vulva, vagina y cérvix por congestión vascular), útil como sospecha clínica pero no confirmatorio, ya que puede presentarse en otras condiciones que generan congestión pelviana. • El aumento de la pigmentación y la aparición de estrías abdominales.: Son signos presuntivos o subjetivos del embarazo, atribuibles a cambios hormonales (melanotropina, estrógenos), pero inespecíficos, pues pueden aparecer en otras condiciones como el uso de anticonceptivos hormonales o el síndrome de Cushing. • Fecha de última menstruación y tiempo de amenorrea.: Constituye un signo presuntivo relevante para el cálculo de la edad gestacional y la fecha probable de parto, pero no confirma por sí solo el embarazo, ya que la amenorrea puede deberse a múltiples causas. Tip/Mnemotecnia: Recuerda los 3 niveles de signos del embarazo: PRESUNTIVOS (amenorrea, náuseas, pigmentación) → PROBABLES (Chadwick, Hegar, útero aumentado) → POSITIVOS/DE CERTEZA (B-HCG, ecografía con saco gestacional/latido fetal, palpación de partes fetales). Solo los últimos confirman el diagnóstico.","bibliography":"Cunningham G, Leveno K, Dashe J, Hoffman B, Spong C, Casey B. Williams Obstetrics. 26ª ed. McGraw-Hill; 2022. Subcomponente: Cuidados de enfermería en el embarazo, parto y puerperio Tema: Embarazo: cambios fisiológicos, signos y síntomas Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":214,"question":"Usuario pediátrico con trastorno de despigmentación macular asociado a destrucción de melanocitos se encuentra hospitalizado acompañado de su madre. A la valoración se aprecian patrones de máculas y manchas blancas notablemente simétricos, con bordes ligeramente hiperpigmentados. ¿Qué cuidado de enfermería se debe considerar para evitar complicaciones?","options":["Recomendar terapia con psoraleno y radiación UV.","Sugerir que se evite el contacto con rayos solares.","Sugerir que no se empleen tópicos de esteroides.","Recomendar tratamiento UVB de banda amplia."],"answer":"Sugerir que se evite el contacto con rayos solares.","justification":"El vitíligo es un trastorno de despigmentación cutánea caracterizado por la destrucción autoinmune de los melanocitos, lo que genera máculas acrómicas o hipocrómicas de distribución simétrica con bordes hiperpigmentados. Al carecer de melanina, la piel afectada pierde su principal mecanismo de fotoprotección natural, por lo que resulta considerablemente más vulnerable a quemaduras solares, fotodaño y al fenómeno de Koebner. Por ello, el cuidado de enfermería prioritario es educar al paciente y a su cuidador sobre la importancia de evitar la exposición solar directa, utilizar protector solar de amplio espectro y ropa protectora, disminuyendo así el riesgo de complicaciones dérmicas y la progresión de las lesiones. Opciones incorrectas: • Recomendar terapia con psoraleno y radiación UV: Corresponde a un tratamiento médico especializado (PUVA) indicado por dermatología en casos seleccionados de vitíligo, pero no constituye una recomendación de cuidado de enfermería para prevenir complicaciones, ya que implica exposición controlada a UV bajo estricta supervisión profesional • Sugerir que no se empleen tópicos de esteroides: Los corticoides tópicos forman parte del manejo farmacológico del vitíligo para intentar la repigmentación; su uso no está contraindicado de forma general y su indicación corresponde al criterio médico, no a una medida preventiva de enfermería frente a complicaciones cutáneas. • Recomendar tratamiento UVB de banda amplia: Es una modalidad terapéutica fotoactiva empleada en dermatología especializada para estimular la repigmentación, pero al igual que el PUVA, implica exposición a radiación UV que debe realizarse bajo supervisión médica controlada, no como una medida de cuidado enfermero preventivo. Tip/Mnemotecnia: \"Piel sin melanina, piel sin protección\": en el vitíligo, la ausencia de melanocitos elimina la barrera natural contra el sol, por lo que la fotoprotección es la medida de enfermería más segura y universal.","bibliography":"Kliegman R, Geme J, Blum N, Shah S, Tasker R, Wilson K. Tratado de pediatría de Nelson. 21ª ed. Elsevier; 2020. Subcomponente: Cuidados de enfermería en la niñez y adolescencia Tema: Cuidados de enfermería en patologías de la piel: dermatitis, piodermitis, quemaduras Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":215,"question":"Una gestante de 34 años acude por su cuarto control prenatal. A la valoración de enfermería se determinan 28 semanas de gestación y riesgo de parto prematuro, que conlleva a que el recién nacido presente enfermedad de membrana hialina. ¿Qué acción profiláctica se debe aplicar?","options":["Iniciar aplicación de labetalol.","Aplicación de fludrocortisona.","Administración de betametasona.","Administrar gluconato de calcio."],"answer":"Administración de betametasona.","justification":"Los corticosteroides antenatales (betametasona o dexametasona) constituyen la intervención profiláctica de elección en gestantes con riesgo de parto pretérmino entre las 24 y 34 semanas de gestación, ya que aceleran la maduración del surfactante pulmonar fetal a través de la inducción de la síntesis de fosfolípidos por los neumocitos tipo II. Esto reduce significativamente la incidencia y severidad del síndrome de dificultad respiratoria neonatal (enfermedad de membrana hialina), así como la hemorragia intraventricular y la mortalidad neonatal. El esquema habitual es betametasona 12 mg IM cada 24 horas por dos dosis, o dexametasona 6 mg IM cada 12 horas por cuatro dosis. Opciones incorrectas: • Iniciar aplicación de labetalol: Es un betabloqueante utilizado como antihipertensivo de primera línea en trastornos hipertensivos del embarazo (preeclampsia, hipertensión gestacional), no tiene relación con la maduración pulmonar fetal. • Aplicación de fludrocortisona: Es un mineralocorticoide sintético empleado principalmente en el manejo de insuficiencia suprarrenal (enfermedad de Addison), sin indicación en la profilaxis de membrana hialina. • Administrar gluconato de calcio: Se utiliza como antídoto en la intoxicación por sulfato de magnesio y en el manejo de hipocalcemia, no tiene efecto sobre la maduración del surfactante pulmonar fetal. Tip/Mnemotecnia: \"BETA para el bebé\": Betametasona = Beneficio pulmonar fetal. Recuerda la ventana terapéutica de 24-34 semanas: \"24 a 34, corticoide ya\".","bibliography":"Cunningham G, Leveno K, Dashe J, Hoffman B, Spong C, Casey B. Williams Obstetrics. 26ª ed. McGraw-Hill; 2022. Subcomponente: Cuidados de enfermería en el embarazo, parto y puerperio Tema: Valoración y preparación para las pruebas de monitoreo, bienestar y maduración fetal Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":216,"question":"Paciente de 30 años que se encuentra en el postparto inmediato. A la valoración de enfermería presenta letargo, palidez, piel fría, diaforética, llenado capilar mayor a 3 segundos, frecuencia cardíaca de 130 latidos por minuto y presión arterial de 65/40 milímetros de mercurio. De acuerdo con el caso planteado, ¿cuál es el grado de shock hipovolémico que presenta la paciente?","options":["Moderado.","Leve.","Severo.","Compensado."],"answer":"Severo.","justification":"El cuadro clínico descrito corresponde a un shock hipovolémico severo (grado IV), caracterizado por una pérdida sanguínea estimada superior al 35-40% del volumen circulante. Los criterios que sustentan esta clasificación son la hipotensión marcada, la taquicardia significativa (FC 130 lpm) como mecanismo compensatorio máximo, el llenado capilar prolongado mayor a 3 segundos por vasoconstricción periférica extrema, y sobre todo el letargo, que evidencia hipoperfusión cerebral y compromiso del estado de conciencia. En este estadio los mecanismos compensatorios del organismo están sobrepasados, existe riesgo inminente de colapso circulatorio y falla multiorgánica, por lo que requiere reanimación hídrica agresiva, reposición de hemoderivados y manejo en unidad de cuidados críticos de forma inmediata. Opciones incorrectas: • Moderado: En este grado (pérdida del 25-35%), la paciente presenta taquicardia (FC 100-120 lpm), palidez, diaforesis y llenado capilar levemente prolongado, pero la presión arterial se mantiene aún dentro de límites relativamente aceptables y el estado de conciencia suele conservarse alerta u orientado, sin llegar al letargo. • Leve: Corresponde a una pérdida sanguínea del 15-25%, donde los signos vitales permanecen prácticamente normales o con mínimas alteraciones, sin compromiso del estado neurológico ni hipotensión significativa, ya que los mecanismos compensatorios logran mantener la perfusión tisular adecuada. • Compensado: Representa el estadio inicial (pérdida menor al 15%), donde los signos vitales se mantienen dentro de parámetros normales gracias a la activación de mecanismos compensatorios, sin evidencia clínica de hipoperfusión ni alteración del sensorio. Tip/Mnemotecnia: \"Las 4P del shock severo\": Presión baja (<90 sistólica), Pulso rápido (>130), Piel fría-pálida- diaforética y Perturbación de conciencia (letargo/confusión).","bibliography":"Cunningham G, Leveno K, Dashe J, Hoffman B, Spong C, Casey B. Williams Obstetrics. 26ª ed. McGraw-Hill; 2022. Subcomponente: Cuidados de enfermería en el embarazo, parto y puerperio Tema: SCORE MAMA y claves obstétricas Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":217,"question":"Un recién nacido se encuentra hospitalizado por bajo peso al nacer. La madre refiere que durante el embarazo presentó anticuerpos IgG positivos para toxoplasmosis, lo que indica una infección pasada. El bebé se encuentra inmunizado contra la hepatitis B y está siendo alimentado exclusivamente con leche materna. ¿Cuál es la forma en la que el recién nacido desarrolló inmunidad activa?","options":["Al recibir la vacuna contra la hepatitis B.","Al poseer anticuerpos para toxoplasmosis.","Al exponer al bebé al ambiente sanitario.","Al ser alimentado con leche materna."],"answer":"Al recibir la vacuna contra la hepatitis B.","justification":"La inmunidad activa se genera cuando el propio sistema inmunológico del individuo produce anticuerpos en respuesta a la exposición a un antígeno, ya sea de forma natural (infección) o artificial (vacunación). Al administrar la vacuna contra la hepatitis B al recién nacido, se introduce un antígeno (proteína de superficie del virus, HBsAg) que estimula a los linfocitos B del propio neonato para que generen anticuerpos específicos y células de memoria inmunológica, confiriendo protección duradera y activa contra la enfermedad. Opciones incorrectas: • Al poseer anticuerpos para toxoplasmosis: Los anticuerpos IgG maternos positivos para toxoplasmosis corresponden a una infección materna pasada; si estos anticuerpos atravesaran la placenta hacia el feto, constituirían inmunidad pasiva (transferencia de anticuerpos ya formados por otro individuo), no inmunidad activa, ya que el recién nacido no produce sus propios anticuerpos en este proceso. • Al exponer al bebé al ambiente sanitario: La exposición ambiental hospitalaria no constituye un mecanismo de inmunización; por el contrario, representa un riesgo de infecciones nosocomiales y no genera protección inmunológica planificada ni antígeno-específica. • Al ser alimentado con leche materna: La lactancia materna transfiere inmunoglobulinas (principalmente IgA secretora), factores bioactivos y células inmunocompetentes de la madre al lactante, lo cual constituye un mecanismo de inmunidad pasiva natural, ya que el neonato recibe anticuerpos preformados sin producir una respuesta inmune propia. Tip/Mnemotecnia: \"ACTIVA se ACTIVA tu propio sistema\" (vacunas e infecciones = tu cuerpo fabrica anticuerpos); \"PASIVA te lo PASAN\" (leche materna y anticuerpos transplacentarios = anticuerpos de otro).","bibliography":"Ministerio de Salud Pública del Ecuador. Estrategia Nacional de Inmunizaciones, ENI. Ministerio de Salud Pública; 2021. Subcomponente: Cuidados de enfermería en el recién nacido Tema: Inmunidad activa y pasiva Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":218,"question":"Recién nacido de 15 días de vida es llevado por su madre al Centro de Salud. Refiere que el parto fue en casa, en el sector rural, y desea que le apliquen las vacunas que le corresponden. En la valoración, el recién nacido se encuentra en condiciones normales. ¿Cuál es el esquema de vacunación que corresponde en este caso?","options":["Administrar la vacuna hepatitis B cero.","Administrar las vacunas BCG y hepatitis B cero.","Indicar a la madre que debe iniciar el esquema a los 2 meses de edad.","Administrar la vacuna BCG y continuar el esquema en 2 meses."],"answer":"Administrar la vacuna BCG y continuar el esquema en 2 meses.","justification":"Según la Estrategia Nacional de Inmunizaciones (ENI) del Ecuador, la vacuna BCG (protección contra formas graves de tuberculosis, como la meníngea y miliar) puede administrarse en cualquier momento antes del año de edad si no se aplicó al nacer, por lo que en un recién nacido de 15 días sin antecedente vacunal aún es oportuno colocarla. En cambio, la dosis de hepatitis B (HB0) tiene como objetivo específico prevenir la transmisión vertical del virus y debe administrarse idealmente dentro de las primeras 24 horas de vida (máximo hasta las 72 horas); al haber transcurrido 15 días, esta ventana epidemiológica ya se perdió, por lo que no corresponde aplicarla como monodosis. La protección contra hepatitis B se completará posteriormente con la vacuna pentavalente, que se inicia a los 2 meses de edad según el esquema regular. Opciones incorrectas: • Administrar la vacuna hepatitis B cero: Es incorrecta porque la HB0 solo cumple su función de barrera contra la transmisión perinatal cuando se aplica en las primeras horas de vida; a los 15 días ya no tiene el efecto protector esperado y, además, omite la aplicación de BCG, • Administrar las vacunas BCG y hepatitis B cero: Es incorrecta porque, aunque la BCG es apropiada en este momento, la hepatitis B cero ya no debe administrarse pasado el periodo neonatal inmediato, pues su objetivo de evitar la transmisión vertical ya no se cumple a los 15 días de vida. • Indicar a la madre que debe iniciar el esquema a los 2 meses de edad: Es incorrecta porque retrasar la BCG hasta los 2 meses expone innecesariamente al lactante a un mayor riesgo de formas graves de tuberculosis (miliar o meníngea) durante ese periodo, cuando la vacuna puede y debe aplicarse de inmediato al detectarse que no fue administrada al nacer. Tip/Mnemotecnia: \"BCG no espera, Hepatitis B cero sí tiene fecha de caducidad\" — recuerda que la BCG se puede poner en cualquier momento antes del año si se omitió al nacer, mientras que la HB0 solo protege si se aplica en las primeras horas de vida; después de ese lapso, la protección contra hepatitis B se retoma con la pentavalente a los 2 meses.","bibliography":"Ministerio de Salud Pública del Ecuador. Estrategia Nacional de Inmunizaciones, ENI. Ministerio de Salud Pública; 2021. Subcomponente: Cuidados de enfermería en el recién nacido Tema: Inmunidad activa y pasiva Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":219,"question":"Paciente femenina de 35 años refiere que consume un medicamento para tratar sus convulsiones. A la valoración de enfermería se identifica una amenorrea de aproximadamente 7 semanas y algunos signos y s
