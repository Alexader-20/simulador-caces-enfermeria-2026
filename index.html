íntomas probables de embarazo. Según el caso, ¿qué medicamento consume la paciente y puede provocar teratogenicidad en el desarrollo embrionario?","options":["Levotiroxina sódica.","Tiamina.","Carbamazepina.","Warfarina."],"answer":"Carbamazepina.","justification":"Es un fármaco anticonvulsivante clásicamente asociado a teratogenicidad, ya que su uso durante el primer trimestre del embarazo (periodo crítico de organogénesis, coincidente con la amenorrea de 7 semanas de la paciente) se relaciona con un mayor riesgo de defectos del tubo neural (espina bífida), anomalías craneofaciales, hipoplasia de uñas y retraso en el desarrollo. Por ello, en toda mujer en edad fértil que consume anticonvulsivantes se debe valorar la necesidad de suplementación con ácido fólico y realizar un control prenatal estrecho con ecografías dirigidas a la detección de malformaciones. Opciones incorrectas: • Levotiroxina sódica: Es la hormona tiroidea sintética utilizada para el tratamiento del hipotiroidismo; no solo no es teratogénica, sino que su uso adecuado durante el embarazo es fundamental para el correcto desarrollo neurológico fetal. • Tiamina: Corresponde a la vitamina B1, empleada en el tratamiento de deficiencias nutricionales (como en el síndrome de Wernicke-Korsakoff); no se asocia a efectos teratogénicos y su indicación no guarda relación con el manejo de convulsiones. • Warfarina: Es un anticoagulante oral con reconocido potencial teratogénico (síndrome de warfarina fetal), pero se utiliza para la prevención y tratamiento de eventos tromboembólicos, no para el control de crisis convulsivas, por lo que no corresponde al contexto clínico descrito. Tip/Mnemotecnia: \"Anticonvulsivantes en el embarazo: CARBA-mazepina CARBA-nza el riesgo de defectos del tubo neural\" — recuerda siempre indicar ácido fólico antes de la concepción en mujeres epilépticas en edad fértil.","bibliography":"Cunningham G, Leveno K, Dashe J, Hoffman B, Spong C, Casey B. Williams Obstetrics. 26ª ed. McGraw-Hill; 2022. Subcomponente: Cuidados de enfermería en el embarazo, parto y puerperio Tema: Farmaconocividad y teratogenicidad en el embarazo Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":220,"question":"Al centro de salud acude una madre con su hija de 6 meses para el control de rutina de su niña (crecimiento y desarrollo), peso 7120 gramos y talla de 66 centímetros, el personal de enfermería solicita la libreta integral de salud para el registro en las curvas correspondientes de peso y talla, determinando que la paciente se encuentra en percentil cero (0). ¿Cómo se interpreta el percentil obtenido?","options":["Peso y talla muy altos para la edad.","Peso y talla normales para la edad.","Peso y talla altos para la edad.","Peso y talla bajos para la edad."],"answer":"Peso y talla normales para la edad.","justification":"En el contexto de las curvas de crecimiento utilizadas por el MSP y la OMS, el valor 0 debe entenderse como la línea de puntuación Z = 0, es decir, la mediana del patrón de referencia para sexo y edad. Por ello, una niña de 6 meses cuyos puntos de peso y talla se ubican alrededor de esa línea presenta un crecimiento esperado y no evidencia, con esos indicadores aislados, déficit ni exceso. Es importante precisar que el enunciado utiliza la expresión “percentil cero”; técnicamente, la mediana corresponde al percentil 50 y no al percentil 0. Sin modificar la respuesta del banco, la opción marcada es la mejor porque el contexto claramente alude a la línea Z 0 de la libreta/curvas de crecimiento. Opciones incorrectas: • Peso y talla muy altos para la edad: Un crecimiento muy alto se representaría por valores claramente por encima de la mediana, habitualmente próximos o superiores a +2 desviaciones estándar según el indicador; no por la línea 0. • Peso y talla altos para la edad: Implica mediciones ubicadas por encima del patrón esperado para la edad. La línea Z = 0 representa el centro de la distribución, no un valor alto. • Peso y talla bajos para la edad: Los valores bajos se identifican al desplazarse hacia puntuaciones Z negativas; el déficit clínicamente relevante suele considerarse a partir de valores inferiores a −2 DE según el indicador antropométrico. Tip/Mnemotecnia: “Z = 0 = centro de la curva”: si está en la línea central, piensa en crecimiento esperado.","bibliography":"Ministerio de Salud Pública del Ecuador. Plan Intersectorial de Alimentación y Nutrición Ecuador 2018–2025. Quito: MSP; 2018. https://www.salud.gob.ec/wp-content/uploads/2018/08/PIANE-2018- 2025-final-compressed-.pdf Organización Mundial de la Salud. WHO Child Growth Standards. https://www.who.int/tools/child- growth-standards/standards Subcomponente: Cuidados de enfermería en la niñez y adolescencia Tema: Crecimiento, desarrollo y estimulación de lactantes, preescolares, escolares y adolescentes Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":221,"question":"Mujer de 52 años, acude al centro de salud porque refiere sofocos frecuentes, insomnio y cambios de humor, comenta que su última menstruación fue hace más de un año, no tiene antecedentes patológicos relevantes y no está tomando ningún tratamiento hormonal. Expresa su preocupación por su salud ósea ya que su madre tuvo fractura de cadera por osteoporosis. De acuerdo con el caso, ¿Cuál es la intervención de enfermería más adecuada?","options":["Indicar que los síntomas son normales y que no requiere atención específica.","Sugerir el uso de suplementos herbales sin necesidad de consulta médica.","Educar sobre cambios fisiológicos y promover hábitos saludables, dieta rica en calcio y vitamina D.","Recomendar el inicio inmediato de terapia hormonal sustitutiva para aliviar los síntomas."],"answer":"Educar sobre cambios fisiológicos y promover hábitos saludables, dieta rica en calcio y vitamina D.","justification":"La paciente cumple el criterio clínico de menopausia al referir más de 12 meses de amenorrea y presenta síntomas vasomotores y del sueño frecuentes en esta etapa. El Manual de Asesoría en Salud Sexual y Reproductiva del MSP señala que la mujer debe recibir información clara sobre los cambios del climaterio/menopausia y recomendaciones de hábitos adecuados para reducir efectos como osteoporosis y ateroesclerosis, incluyendo mejorar la alimentación y realizar actividad física. Dado el antecedente materno de fractura de cadera, la prevención de pérdida ósea cobra especial relevancia; una dieta adecuada en calcio y vitamina D, ejercicio con carga y valoración médica del riesgo óseo forman parte de una intervención segura y preventiva. Opciones incorrectas: • Indicar que los síntomas son normales y que no requiere atención específica: Aunque la menopausia es un proceso fisiológico, los síntomas pueden afectar la calidad de vida y el antecedente familiar aumenta la necesidad de educación, valoración de riesgos y seguimiento; no corresponde minimizar la consulta. • Sugerir el uso de suplementos herbales sin necesidad de consulta médica: Los productos herbales no deben recomendarse de forma indiscriminada porque su eficacia, dosis, pureza e interacciones pueden variar; se requiere valorar riesgos y preferencias. • Recomendar el inicio inmediato de terapia hormonal sustitutiva para aliviar los síntomas: La terapia hormonal no es una indicación autónoma de enfermería ni debe iniciarse sin valoración individual de contraindicaciones, riesgos y beneficios por el profesional prescriptor. Tip/Mnemotecnia: Menopausia: “educar + hábitos + evaluar riesgos”; la terapia hormonal siempre requiere valoración individual.","bibliography":"Ministerio de Salud Pública del Ecuador. Asesoría en salud sexual y reproductiva. Manual. Primera edición. Quito: Dirección Nacional de Promoción de la Salud; 2017. https://www.salud.gob.ec/wp- content/uploads/2023/01/Manual-asesoria-en-SSSR.pdf Subcomponente: Cuidados gíneco obstétricos de la mujer Tema: Cambios fisiológicos de la mujer: climaterio y menopausia Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":222,"question":"Paciente de 15 años acude a consulta externa. A la valoración por parte del profesional de enfermería la paciente refiere que piensa que está embarazada y se encuentra preocupada de que ahora pueda tener una infección de transmisión sexual (ITS). La prueba de embarazo es negativa. ¿Cuál es la prioridad de atención por parte del profesional de enfermería?","options":["Contactar a sus padres y notificar la necesidad de anticonceptivos.","Asesoría sobre prácticas de sexo seguro.","Derivar a la paciente al profesional de especialidad.","Solicitar una prueba de ITS a la pareja de la paciente."],"answer":"Asesoría sobre prácticas de sexo seguro.","justification":"La prioridad es brindar una asesoría confidencial, respetuosa y no juzgadora que permita reducir riesgos futuros de embarazo no planificado e infecciones de transmisión sexual. El Manual de Asesoría en Salud Sexual y Reproductiva del MSP establece que adolescentes tienen derecho al acceso a atención integral, información, anticoncepción cuando la requieran y contenidos sobre ITS/VIH, métodos anticonceptivos y prácticas responsables. La prueba de embarazo negativa no elimina el riesgo de ITS ni la necesidad de educación; por ello se debe explorar exposición, ofrecer pruebas pertinentes según riesgo y fortalecer uso correcto de preservativo y doble protección. Opciones incorrectas: • Contactar a sus padres y notificar la necesidad de anticonceptivos: No debe ser la primera acción automática. La atención adolescente debe respetar derechos, privacidad y confidencialidad dentro del marco legal y de seguridad; la participación familiar puede promoverse cuando sea apropiada, pero no sustituye la asesoría individual. • Derivar a la paciente al profesional de especialidad: La educación y asesoría básica en salud sexual y reproductiva son competencias del primer nivel y de enfermería; se deriva si existe una condición clínica que requiera atención especializada. • Solicitar una prueba de ITS a la pareja de la paciente: La pareja también puede requerir evaluación, pero la prioridad inmediata es atender a la adolescente, valorar su propio riesgo, ofrecer pruebas según indicación y darle consejería preventiva. Tip/Mnemotecnia: Adolescencia + riesgo sexual: primero “confianza, información y prevención”.","bibliography":"Ministerio de Salud Pública del Ecuador. Asesoría en salud sexual y reproductiva. Manual. Primera edición. Quito: Dirección Nacional de Promoción de la Salud; 2017. https://www.salud.gob.ec/wp- content/uploads/2023/01/Manual-asesoria-en-SSSR.pdf Subcomponente: Generalidades sobre niñez y adolescencia Tema: Sexualidad y adolescencia Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":223,"question":"Recién nacido de 3 días de vida, con antecedentes de asfixia perinatal, presenta un paro cardiorrespiratorio en la unidad neonatal. El equipo inicia maniobras de reanimación. Tras 30 segundos de ventilación efectiva y compresiones torácicas, la frecuencia cardiaca sigue por debajo de 60 latidos por minuto. De acuerdo con la situación clínica descrita y las guías de reanimación, ¿Cuál es el medicamento que debe preparar para su administración inmediata?","options":["Dopamina.","Adrenalina.","Dexametasona.","Aminofilina."],"answer":"Adrenalina.","justification":"En reanimación neonatal, la adrenalina (epinefrina) es el fármaco de elección cuando la frecuencia cardiaca permanece por debajo de 60 lpm a pesar de ventilación efectiva y compresiones torácicas coordinadas, una vez verificada la eficacia de la ventilación y cumplida la secuencia de reanimación. Su efecto alfa y beta adrenérgico aumenta la perfusión coronaria, la frecuencia y la contractilidad cardiaca. La guía ecuatoriana incluye a la epinefrina como medicamento de soporte vital en reanimación cardiopulmonar. Se conserva la respuesta marcada por el banco; como precisión técnica, los algoritmos neonatales actuales exigen confirmar ventilación efectiva y realizar el intervalo protocolario de compresiones antes de administrar el fármaco, por lo que el dato de “30 segundos de ventilación efectiva y compresiones” del enunciado debe interpretarse dentro de esa secuencia. Opciones incorrectas: • Dopamina: Es un vasoactivo empleado en determinados estados de hipotensión o shock, pero no es el medicamento de primera elección para un paro neonatal con FC <60 durante la reanimación. • Dexametasona: Es un corticosteroide; no tiene función como fármaco de reanimación para recuperar la frecuencia cardiaca en paro neonatal. • Aminofilina: Es un broncodilatador/metilxantina y no forma parte del algoritmo de reanimación neonatal para bradicardia extrema o paro. Tip/Mnemotecnia: RN con FC <60 pese a ventilación + compresiones efectivas: piensa en “EPI” = epinefrina.","bibliography":"Ministerio de Salud Pública del Ecuador. Recién nacido prematuro. Guía de Práctica Clínica. Quito: MSP; 2015. https://www.salud.gob.ec/wp-content/uploads/2016/09/GPC-Rec%C3%A9n-nacido- prematuro.pdf American Heart Association; American Academy of Pediatrics. Neonatal Resuscitation Guidelines. https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/neonatal-resuscitation Subcomponente: Cuidados de enfermería en el recién nacido Tema: Reanimación neonatal, oxigenoterapia y saturación de oxígeno Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":224,"question":"Paciente masculino de 4 años ingresa a emergencia por dificultad para respirar, madre refiere que el niño se encuentra agitado y con mucha tos seca, al examen físico se evidencia taquipnea, taquicardia y SO2 de 85 %. la PaO2 es de 40 mmHg. ¿Qué intervención es la más adecuada en ese momento?","options":["Aspiración de secreciones.","Administración de oxígeno.","Fisioterapia torácica.","Lavado nasal."],"answer":"Administración de oxígeno.","justification":"El niño presenta hipoxemia grave: saturación de oxígeno de 85 % y PaO2 de 40 mmHg, acompañadas de dificultad respiratoria, agitación, taquipnea y taquicardia. La prioridad inmediata es corregir la hipoxemia mediante oxigenoterapia, mientras se identifica y trata la causa. En pediatría, una saturación tan baja constituye un signo de gravedad y puede progresar rápidamente a fatiga respiratoria y compromiso neurológico o cardiovascular. La administración de oxígeno debe acompañarse de monitorización continua y reevaluación clínica. Opciones incorrectas: • Aspiración de secreciones: Solo es prioritaria si existen secreciones que obstruyen la vía aérea o impiden la ventilación. El caso destaca tos seca e hipoxemia severa; aspirar sin indicación puede causar trauma e hipoxemia adicional. • Fisioterapia torácica: Puede tener indicaciones específicas según la patología y presencia de secreciones, pero no corrige con suficiente rapidez una PaO2 de 40 mmHg ni una SpO2 de 85 %. • Lavado nasal: Es útil para obstrucción nasal por secreciones en cuadros altos, pero no es una intervención suficiente frente a hipoxemia grave y compromiso respiratorio sistémico. Tip/Mnemotecnia: SpO2 muy baja = primero oxigenar; luego tratar la causa.","bibliography":"Ministerio de Salud Pública del Ecuador. Neumonía adquirida en la comunidad en pacientes de 3 meses a 15 años. Guía de Práctica Clínica. Quito: MSP; 2017. https://www.salud.gob.ec/wp- content/uploads/2019/02/GPC_neumoni%CC%81a-adquirida_2017.pdf Subcomponente: Cuidados de enfermería en la niñez y adolescencia Tema: Procedimientos básicos en pediatría: higiene, medidas antropométricas, diluciones, fisioterapia respiratoria, oxigenoterapia, nebulizaciones, inmovilizaciones y drenajes. Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":225,"question":"Un profesional de enfermería realiza el control de crecimiento y desarrollo a un lactante de 18 meses en un centro de salud. Al evaluar el estado nutricional utilizando las curvas de crecimiento del Manual AIEPI, se identifica que el indicador de Peso para la Longitud se encuentra por debajo de la línea de −3 desviaciones estándar. Según la normativa vigente del Ministerio de Salud Pública del Ecuador, ¿cuál es la clasificación diagnóstica del estado nutricional para este caso?","options":["Desnutrición aguda moderada","Desnutrición aguda severa","Desnutrición crónica severa","Riesgo de desnutrición aguda"],"answer":"Desnutrición aguda severa","justification":"El indicador peso para la longitud/talla (P/L o P/T) evalúa emaciación o desnutrición aguda. Según los criterios antropométricos utilizados por el MSP y la OMS, una puntuación Z inferior a −3 desviaciones estándar corresponde a desnutrición aguda severa. Este hallazgo requiere evaluación clínica inmediata, búsqueda de signos de complicación, manejo nutricional según protocolo y seguimiento estrecho. Opciones incorrectas: • Desnutrición aguda moderada: Corresponde habitualmente a un P/L o P/T entre −2 y −3 desviaciones estándar, no por debajo de −3. • Desnutrición crónica severa: La desnutrición crónica se clasifica principalmente con talla/longitud para la edad; no con peso para la longitud. • Riesgo de desnutrición aguda: Describe una situación menos grave, cercana al límite inferior, pero un valor <−3 DE ya cumple criterio de desnutrición aguda severa. Tip/Mnemotecnia: P/T o P/L: “menos 2 = moderada; menos 3 = severa”.","bibliography":"Ministerio de Salud Pública del Ecuador. Plan Intersectorial de Alimentación y Nutrición Ecuador 2018–2025. Quito: MSP; 2018. https://www.salud.gob.ec/wp-content/uploads/2018/08/PIANE-2018- 2025-final-compressed-.pdf Subcomponente: Cuidados de enfermería en la niñez y adolescencia Tema: Patologías prevalentes en la infancia: AIEPI Clínico Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":226,"question":"Durante una visita domiciliaria, el personal de enfermería identifica un caso de presunta violencia intrafamiliar donde se ven afectadas una adulta mayor y su nieta adolescente. Al realizar el abordaje, el equipo Prioriza la atención analizando las necesidades específicas de cada una según su etapa de vida, así como los vínculos de vulnerabilidad y apoyo mutuo que existen entre ambas generaciones. De acuerdo con la Norma Técnica del MSP, ¿cuál es el enfoque de derechos que orienta el reconocimiento de la protección integral, las interrelaciones y las necesidades existentes en las diferentes edades de este núcleo familiar?","options":["Enfoque de inclusión social.","Enfoque intergeneracional.","Enfoque de equidad de género.","Enfoque de interculturalidad."],"answer":"Enfoque intergeneracional.","justification":"La Norma Técnica del MSP incorpora el enfoque intergeneracional para reconocer que los derechos, riesgos y necesidades varían a lo largo del ciclo de vida y que existen relaciones de apoyo, dependencia y vulnerabilidad entre generaciones. En el caso, el equipo debe valorar de forma diferenciada a la adulta mayor y a la adolescente, sin perder de vista la relación entre ambas y el impacto de la violencia en cada etapa vital. Ese análisis conjunto de edades e interrelaciones es el núcleo del enfoque intergeneracional. Opciones incorrectas: • Enfoque de inclusión social: Busca reducir barreras y exclusión de personas o grupos en situación de vulnerabilidad, pero no se centra específicamente en las relaciones entre distintas generaciones. • Enfoque de equidad de género: Analiza desigualdades, roles y relaciones de poder vinculadas al género; es muy relevante en violencia intrafamiliar, pero la pista del enunciado es la protección según edades e interrelación generacional. • Enfoque de interculturalidad: Promueve respeto y diálogo entre culturas, saberes y prácticas; no es el eje principal del caso descrito. Tip/Mnemotecnia: Si el caso compara necesidades de distintas edades y sus vínculos: enfoque intergeneracional.","bibliography":"Ministerio de Salud Pública del Ecuador. Norma técnica de atención integral a víctimas de violencia basada en género y graves violaciones a los derechos humanos. Quito: MSP; 2019. https://www.salud.gob.ec/wp-content/uploads/2021/03/Norma-tecnica-de-VBG-y-GVDH-.pdf Subcomponente: Salud sexual y reproductiva de la mujer Tema: Violencia de género y violencia intrafamiliar educación en salud, del futuro. GRATUITO CURSO CACES 2026 -2027 ENFERMERÍA ENFERMERÍA Plataforma con contenido académico Escanea el QR e Webinars con temas     ingresa a nuestro importantes y             GRUPO preguntas filtradas Bancos de preguntas CACES 2025 y 2026 Descuentos exclusivos en nuestros cursos PREMIUM PRO - ESTANDAR Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":227,"question":"Una paciente acude al servicio de emergencias con una historia clínica recurrente de atención por traumatismos. Durante el triage físico, el profesional de enfermería observa laceraciones, golpes múltiples y lesiones en el abdomen y los senos que no guardan una explicación lógica con el mecanismo de lesión referido. Al identificar estos indicios generales de sospecha de Violencia Basada en Género (VBG), la enfermera alerta inmediatamente al jefe de guardia. Conforme a la Norma Técnica del MSP, ¿cuál es el código de alerta institucional que debe activar el jefe de guardia para convocar al equipo de salud conformado para la valoración y atención inmediata de este caso?","options":["Código mariposa.","Código plata.","Código púrpura.","Código oro."],"answer":"Código púrpura.","justification":"La Norma Técnica del MSP para atención integral a víctimas de violencia basada en género y graves violaciones de derechos humanos establece el Código Púrpura como mecanismo institucional de alerta y activación del equipo de salud ante casos identificados o sospechosos de violencia basada en género. Las lesiones múltiples en zonas sugestivas y una historia poco congruente con el mecanismo referido justifican activar el protocolo, asegurar privacidad y seguridad, brindar atención clínica, registrar adecuadamente hallazgos y coordinar el abordaje interdisciplinario sin revictimización. Opciones incorrectas: • Código mariposa: No es el código institucional definido por la norma del MSP para activar la respuesta ante sospecha de VBG. • Código plata: No corresponde al código de alerta para violencia basada en género en la normativa citada. • Código oro: Tampoco es el código establecido por el MSP para convocar al equipo de atención de VBG. Tip/Mnemotecnia: Violencia basada en género = “P” de púrpura.","bibliography":"Ministerio de Salud Pública del Ecuador. Norma técnica de atención integral a víctimas de violencia basada en género y graves violaciones a los derechos humanos. Quito: MSP; 2019. https://www.salud.gob.ec/wp-content/uploads/2021/03/Norma-tecnica-de-VBG-y-GVDH-.pdf Subcomponente: Salud sexual y reproductiva de la mujer Tema: Violencia de género y violencia intrafamiliar Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":228,"question":"Un lactante de 14 meses es llevado por su madre al servicio de urgencias pediátricas tras sufrir un accidente doméstico con agua caliente. Durante la valoración física, el profesional de enfermería observa una lesión localizada en la región anterior del antebrazo que compromete únicamente la capa superficial de la piel (epidermis). El área presenta una inflamación leve, eritema (enrojecimiento) pronunciado y el niño manifiesta dolor al tacto; sin embargo, no se evidencia la formación de flictenas (ampollas). Con base en los criterios clínicos del Nelson. Tratado de pediatría, ¿cómo debe clasificarse el grado de esta quemadura?","options":["Segundo grado superficial.","Tercer grado.","Primer grado.","Segundo grado profundo."],"answer":"Primer grado.","justification":"Una quemadura de primer grado o superficial compromete únicamente la epidermis. Clínicamente se caracteriza por eritema, dolor, piel seca y ausencia de ampollas. El caso describe exactamente ese patrón: lesión superficial, inflamación leve, enrojecimiento y dolor sin flictenas. Estas lesiones suelen reepitelizar sin cicatriz porque la dermis permanece intacta. Opciones incorrectas: • Segundo grado superficial: Es una quemadura de espesor parcial que alcanza la dermis superficial y típicamente presenta ampollas, superficie húmeda y dolor intenso. • Tercer grado: Es de espesor total, destruye epidermis y dermis y puede afectar tejido subcutáneo; suele presentar piel blanquecina, marrón o carbonizada y menor sensibilidad en el centro. • Segundo grado profundo: Compromete capas profundas de la dermis, presenta aspecto moteado o pálido, menor blanqueamiento y mayor riesgo de cicatriz; no corresponde a una lesión limitada a epidermis sin ampollas. Tip/Mnemotecnia: Primer grado = “rojo, doloroso, seco y sin ampollas”.","bibliography":"Bingoel AS, et al. First-Degree Burns. In: Water-Filtered Infrared A (wIRA) Irradiation. NCBI Bookshelf;                    2022.          https://www.ncbi.nlm.nih.gov/books/NBK593470/ Kliegman RM, St. Geme JW, Blum NJ, Shah SS, Tasker RC, Wilson KM, eds. Nelson Textbook of Pediatrics. 21st ed. Elsevier; 2020. Subcomponente: Cuidados de enfermería en la niñez y adolescencia Tema: Cuidados de enfermería en patologías de la piel: dermatitis, piodermitis, quemaduras Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":229,"question":"Usted trabaja en el Departamento de Control de Infecciones; como reporte semanal se detectó un incremento en la tasa de infecciones del sitio quirúrgico, para lo que piden revisar el libro de registros de los quirófanos y reconocer los parámetros anómalos con relación a temperatura y humedad. ¿En qué quirófano está ocurriendo lo planteado en el caso?","options":["Quirófano 3: temperatura 22 °C, humedad 52 %.","Quirófano 2: temperatura 20 °C, humedad 50 %.","Quirófano 1: temperatura 24 °C, humedad 56 %.","Quirófano 4: temperatura 23 °C, humedad 55 %."],"answer":"Quirófano 1: temperatura 24 °C, humedad 56 %.","justification":"Los estándares internacionales (AORN, OMS y normativas de bioseguridad hospitalaria) establecen que el rango óptimo de temperatura en quirófano debe mantenerse entre 18-24 °C y la humedad relativa entre 30-60 %, con el objetivo de disminuir la proliferación microbiana y mantener el confort del equipo quirúrgico. El Quirófano 1 presenta los valores más cercanos al límite superior permitido (24 °C y 56 % de humedad), condición que favorece un ambiente cálido y húmedo propicio para la multiplicación bacteriana, la condensación y la formación de biopelícula en superficies, lo cual se correlaciona directamente con el incremento reportado en la tasa de infecciones del sitio quirúrgico (ISQ). El monitoreo continuo de estos parámetros es una medida de bioseguridad esencial dentro del programa de control de infecciones intrahospitalarias. Opciones incorrectas: • Quirófano 3: temperatura 22 °C, humedad 52 %: Se encuentra dentro del rango intermedio recomendado, sin desviaciones significativas que sugieran riesgo aumentado de proliferación microbiana. • Quirófano 2: temperatura 20 °C, humedad 50 %: Corresponde a los valores más próximos al límite inferior del rango óptimo, siendo la condición más segura y controlada de las cuatro salas evaluadas. • Quirófano 4: temperatura 23 °C, humedad 55 %: Aunque se acerca al límite superior, se mantiene aún dentro de los parámetros aceptables sin representar el mayor riesgo comparativo entre las opciones. Tip/Mnemotecnia: \"A mayor calor y humedad, mayor es la posibilidad de contaminación\": recuerda que temperatura y humedad elevadas (cercanas o superiores a 24 °C / 60 %) crean un ambiente favorable para el crecimiento bacteriano y el riesgo de infección del sitio quirúrgico.","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins; 2019. Subcomponente: Cuidados de enfermería a personas con problemas quirúrgicos más frecuentes Tema: Generalidades de la organización de áreas quirúrgicas, funciones y responsabilidades de la enfermera instrumentista y circulante Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":230,"question":"Paciente de 50 años es rescatado de un incendio en su hogar. A la valoración de enfermería presenta quemadura de segundo grado en el 20 % de su superficie corporal total, principalmente en tronco y extremidades superiores; presenta tos con esputo carbonáceo y estridor laríngeo. ¿Cuál es la intervención de enfermería prioritaria en este paciente?","options":["Administración de oxígeno al 100 %.","Aplicar apósitos estériles en la superficie quemada.","Administrar líquidos intravenosos.","Administrar analgésicos intravenosos para el manejo del dolor."],"answer":"Administración de oxígeno al 100 %.","justification":"La presencia de esputo carbonáceo y estridor laríngeo en un paciente rescatado de un incendio son signos de alarma que indican lesión por inhalación y compromiso inminente de la vía aérea superior, secundario al edema térmico y químico de la mucosa laríngea y traqueobronquial. Según el enfoque ABCDE de valoración en trauma/emergencias, la vía aérea y la oxigenación tienen prioridad absoluta sobre cualquier otra intervención, ya que el edema puede progresar rápidamente hasta la obstrucción completa de la vía aérea. La administración de oxígeno al 100 % con mascarilla de alto flujo (no reinhalación) corrige la hipoxia tisular y contrarresta la posible intoxicación por monóxido de carbono, frecuente en víctimas de incendios en espacios cerrados, mientras se valora la necesidad de intubación endotraqueal. Opciones incorrectas: • Aplicar apósitos estériles en la superficie quemada: es una intervención pertinente dentro del manejo local de la quemadura y la prevención de infecciones, pero se ubica en un nivel de prioridad inferior a la vía aérea; en el ABCDE corresponde a la \"E\" (exposición) y debe realizarse una vez asegurada la ventilación y oxigenación del paciente. • Administrar líquidos intravenosos: la reanimación hídrica es esencial en el manejo del gran quemado para prevenir el shock hipovolémico, pero corresponde a la \"C\" (circulación) del ABCDE, posterior al asegurar una vía aérea permeable y una adecuada oxigenación. • Administrar analgésicos intravenosos para el manejo del dolor: el control del dolor es importante en el confort del paciente quemado, pero no constituye una prioridad vital inmediata frente al riesgo de obstrucción de la vía aérea y la hipoxia, por lo que se posterga hasta estabilizar los parámetros ABC. Tip/Mnemotecnia: \"Primero el aire, luego todo lo demás\": ante esputo carbonáceo, quemaduras faciales, vibrisas quemadas o estridor, piensa siempre en lesión por inhalación → prioridad A (Airway) y oxígeno al 100 % antes de líquidos, curaciones o analgesia.","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins; 2019. Subcomponente: Procedimientos básicos del cuidado enfermero en pacientes adultos y adultos mayores Tema: Oxigenoterapia y manejo de la vía aérea Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":231,"question":"Paciente de 35 años ingresa a urgencias tras un accidente de tránsito. En la valoración inicial, el personal de enfermería registra: apertura ocular al dolor, emisión de palabras inapropiadas y flexión de las extremidades. De acuerdo con la Escala de Coma de Glasgow, ¿cuál es la puntuación total que alcanzó el paciente?","options":["Glasgow 9/15.","Glasgow 10/15.","Glasgow 8/15.","Glasgow 12/15."],"answer":"Glasgow 8/15.","justification":"La Escala de Coma de Glasgow (ECG) valora tres parámetros independientes: apertura ocular, respuesta verbal y respuesta motora, sumando un puntaje total que va de 3 (coma profundo) a 15 (estado de alerta normal). En este caso: apertura ocular al dolor corresponde a 2 puntos, emisión de palabras inapropiadas corresponde a 3 puntos en la respuesta verbal, y la flexión anormal (respuesta de decorticación) de las extremidades corresponde a 3 puntos en la respuesta motora. La suma de estos valores (2+3+3) da un total de 8/15, lo cual clasifica al paciente con Trauma Craneoencefálico (TCE) grave, requiriendo manejo avanzado de la vía aérea y monitorización neurológica estrecha. Opciones incorrectas: • Glasgow 9/15: Puntuación que no corresponde a la suma correcta de los parámetros descritos; se clasificaría como TCE moderado, categoría que no aplica según los hallazgos de la valoración. • Glasgow 10/15: Sobrestima el estado neurológico real del paciente; una puntuación de 10 correspondería a un TCE moderado, incompatible con la respuesta motora de flexión anormal descrita en el caso. • Glasgow 12/15: Puntuación demasiado alta para los hallazgos presentados; un Glasgow de 12 se asociaría con una respuesta verbal confusa y apertura ocular espontánea o a la voz, hallazgos distintos a los reportados en la valoración inicial. Tip/Mnemotecnia: Recuerda \"4-5-6, ojo-voz-motor\": Apertura Ocular (máx. 4), Respuesta Verbal (máx. 5), Respuesta Motora (máx. 6). Suma los tres componentes por separado antes de dar el total; un TCE grave siempre es ≤8, moderado 9-12, y leve 13-15.","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins; 2019. Subcomponente: Cuidados de enfermería en el adulto y adulto mayor Tema: Cuidados de enfermería a pacientes con politrauma Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":232,"question":"Paciente masculino de 65 años acude al hospital para un control médico. En la valoración clínica registra un valor de presión arterial de 129/89 mmHg en la primera toma. Al interrogarlo, el paciente informa que tiene antecedentes familiares de hipertensión arterial. ¿Cuál es la principal recomendación que usted brinda a este paciente?","options":["Educar sobre el uso de terapia de medicamentos antihipertensivos.","Realizar prueba de esfuerzo para ver su capacidad cardiovascular.","Control de exámenes de laboratorio para descartar alguna complicación.","Educar sobre una dieta baja en sodio y un programa de ejercicio regular."],"answer":"Educar sobre una dieta baja en sodio y un programa de ejercicio regular.","justification":"Con una cifra de 129/89 mmHg en una primera toma, el paciente se encuentra en el límite entre presión arterial elevada y una hipertensión en etapa 1. Ante una primera medición elevada, sin confirmación diagnóstica mediante tomas repetidas ni evidencia de daño a órgano blanco, la intervención de enfermería prioritaria es la modificación del estilo de vida: reducción del consumo de sodio (<2.3 g/día), actividad física aeróbica regular, control de peso y disminución del consumo de alcohol y tabaco. Estas medidas no farmacológicas constituyen la primera línea de manejo, especialmente relevante en un paciente con antecedentes familiares de hipertensión arterial, ya que buscan prevenir o retrasar la progresión hacia una hipertensión establecida. Opciones incorrectas: • Educar sobre el uso de terapia de medicamentos antihipertensivos. La farmacoterapia no está indicada en este momento, ya que se requiere confirmar el diagnóstico de hipertensión arterial con mediciones repetidas en diferentes visitas antes de iniciar tratamiento farmacológico • Realizar prueba de esfuerzo para ver su capacidad cardiovascular. Esta prueba está indicada para valorar isquemia miocárdica o capacidad funcional cardiovascular en pacientes con sospecha de enfermedad coronaria o previo a programas de rehabilitación cardíaca, pero no es la recomendación prioritaria ante una primera cifra tensional elevada sin otros signos de alarma. • Control de exámenes de laboratorio para descartar alguna complicación. Los exámenes de laboratorio (perfil lipídico, función renal, glicemia) son parte de la valoración integral del riesgo cardiovascular una vez confirmado el diagnóstico de hipertensión, pero no constituyen la recomendación principal e inmediata frente a un solo registro elevado de presión arterial. Tip/Mnemotecnia: \"DASH y muévete\": ante una presión arterial elevada o en etapa 1 sin confirmación diagnóstica, la primera línea siempre es el cambio de estilo de vida","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins; 2019. Subcomponente: Cuidados de enfermería en el adulto y adulto mayor Tema: Cuidados de enfermería en problemas cardiovasculares: hipertensión arterial, infarto agudo de miocardio, insuficiencia cardíaca congestiva Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":233,"question":"Paciente masculino de 37 años, con tipo de sangre B negativo, sufre accidente de tránsito y requiere transfusión sanguínea urgente, pero en el banco de sangre no se dispone de hemoderivados de su mismo grupo sanguíneo. ¿Cuál es el grupo sanguíneo que puede ser compatible con el tipo de sangre del paciente?","options":["AB negativo.","B positivo.","O positivo.","O negativo."],"answer":"O negativo.","justification":"El grupo O negativo es considerado el donante universal de glóbulos rojos, ya que sus eritrocitos carecen de los antígenos A, B y del factor Rh (D) en su membrana. Al no poseer estos antígenos, no genera respuesta inmunológica de aglutinación cuando se transfunde a receptores de cualquier grupo ABO y Rh, incluyendo pacientes B negativo como el del caso, en quienes no se dispone del hemoderivado isogrupo. Por esta razón, en situaciones de urgencia transfusional donde no existe disponibilidad del tipo específico del paciente, el O negativo constituye la alternativa segura y de elección según los protocolos de medicina transfusional. Opciones incorrectas: • AB negativo: El grupo AB es el receptor universal, no el donante universal; sus eritrocitos poseen ambos antígenos A y B en su superficie, por lo que al transfundirse a un paciente B negativo (que posee anticuerpos anti-A) provocaría una reacción hemolítica transfusional grave por incompatibilidad ABO. • B positivo: Aunque comparte el mismo grupo ABO, posee el antígeno Rh (D) positivo. Transfundir sangre Rh positivo a un receptor Rh negativo (como este paciente) puede sensibilizar al sistema inmune y generar la formación de anticuerpos anti-D, con riesgo de reacciones hemolíticas en exposiciones futuras. • O positivo: Si bien carece de antígenos A y B, posee el antígeno Rh (D) positivo, lo cual está contraindicado en un receptor Rh negativo por el riesgo de aloinmunización anti-D, especialmente relevante si el paciente requiere transfusiones futuras o es de sexo femenino en edad reproductiva. Tip/Mnemotecnia: \"El O negativo da a todos, el AB positivo recibe de todos\". Recuerda: primero se verifica el sistema ABO (misma letra o compatible) y después el factor Rh (negativo solo puede recibir negativo, salvo emergencia extrema documentada).","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins; 2019. Subcomponente: Procedimientos básicos del cuidado enfermero en pacientes adultos y adultos mayores Tema: Sondas, catéteres, drenajes, heridas, ostomías, transfusión de sangre y sus componentes Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":234,"question":"Paciente de 50 años sufre una caída sobre la mano extendida. Presenta dolor intenso, edema local, deformidad visible, hematomas y dificultad para mover la muñeca. Se realiza una radiografía y se diagnostica una fractura de Colles; se le coloca una férula de yeso. En el plan de alta, ¿qué indicación se debe dar al paciente?","options":["Indicar al paciente que puede apoyar ligeramente la mano para realizar actividades cotidianas.","Recomendar la administración de analgésicos opioides de forma regular.","Asegurar que el paciente tenga cita con fisioterapia para iniciar la rehabilitación.","Enseñar a reconocer los signos de compromiso neurovascular distal."],"answer":"Enseñar a reconocer los signos de compromiso neurovascular distal.","justification":"En pacientes con fractura de Colles inmovilizada con férula de yeso, el edema postraumático y la compresión del vendaje pueden comprometer la circulación y la inervación distal a la lesión, favoreciendo un síndrome compartimental o lesión del nervio mediano. Por ello, la educación en el plan de alta debe enfatizar la identificación temprana de signos como dolor intenso no controlado con analgesia, palidez, cianosis, frialdad distal, parestesias, disminución de la sensibilidad o del pulso radial, y disminución de la movilidad de los dedos, ya que su detección oportuna permite evitar complicaciones isquémicas irreversibles y garantizar la consulta médica inmediata. Opciones incorrectas: • Indicar al paciente que puede apoyar ligeramente la mano para realizar actividades cotidianas: Está contraindicado, ya que toda carga de peso o apoyo sobre la extremidad inmovilizada puede desplazar los fragmentos óseos reducidos y comprometer la consolidación adecuada de la fractura. • Recomendar la administración de analgésicos opioides de forma regular: El dolor de una fractura de Colles inmovilizada correctamente suele controlarse con analgésicos no opioides o antiinflamatorios; el uso rutinario de opioides no está indicado y, además, un dolor que no cede con analgesia habitual debe alertar sobre posible compromiso neurovascular o síndrome compartimental. • Asegurar que el paciente tenga cita con fisioterapia para iniciar la rehabilitación: La rehabilitación fisioterapéutica se programa una vez retirada la inmovilización y confirmada la consolidación ósea mediante control radiográfico, no de forma inmediata en el plan de alta tras la colocación de la férula. Tip/Mnemotecnia: Las \"5 P\" del compromiso neurovascular: Pain (dolor desproporcionado), Palidez, Parestesias, Parálisis y Pulso ausente. Enséñale al paciente a vigilarlas tras la inmovilización.","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins; 2019. Subcomponente: Cuidados de enfermería en el adulto y adulto mayor Tema: Cuidados de enfermería en problemas osteomusculares: fracturas, artritis, artrosis Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":235,"question":"El profesional de enfermería brinda cuidados a un paciente adulto hospitalizado en la Unidad de Cuidados Intensivos (UCI), que está recibiendo alimentación mediante una sonda nasogástrica. Usted nota que la alimentación no está fluyendo correctamente por la sonda, se observan residuos de fármacos pulverizados en su interior y no se logra obtener contenido gástrico mediante la aspiración por la sonda. ¿Qué complicación se describe en este caso?","options":["Ruptura de la sonda.","Desplazamiento de la sonda.","Mala colocación de la sonda.","Obstrucción de la sonda."],"answer":"Obstrucción de la sonda.","justification":"La presencia de residuos de fármacos pulverizados en el interior de la sonda, sumada a la ausencia de flujo adecuado de la nutrición enteral y la imposibilidad de aspirar contenido gástrico, es característica de la obstrucción luminal de la sonda nasogástrica. Esta complicación mecánica ocurre frecuentemente por la administración inadecuada de medicamentos triturados sin la dilución o el lavado posterior correspondiente, por precipitación de fórmulas nutricionales o por acumulación de secreciones espesas. El manejo de enfermería incluye la irrigación con agua tibia y jeringa de gran volumen aplicando presión suave, evitando el uso de soluciones ácidas que puedan coagular las proteínas de la fórmula y agravar la obstrucción; si la permeabilidad no se restablece, se debe considerar el recambio de la sonda. Opciones incorrectas: • Ruptura de la sonda: Se manifiesta con salida de líquido o fórmula por sitios distintos al extremo distal de la sonda, o daño visible en su estructura, y no se relaciona con la presencia de residuos farmacológicos obstructivos ni con la imposibilidad de aspiración. • Desplazamiento de la sonda: Se caracteriza por cambio en la posición de la marca externa de la sonda, salida accidental parcial o total del dispositivo, tos, náuseas o signos de colocación en vía aérea; no se asocia a la obstrucción física del lumen por residuos. • Mala colocación de la sonda: Corresponde a un error en el momento de la inserción inicial, evidenciado generalmente mediante control radiológico o auscultación, y se detecta antes o inmediatamente después de la colocación, no como un evento posterior asociado a residuos farmacológicos. Tip/Mnemotecnia: \"Sonda que no aspira ni fluye, y residuos exhibe: OBSTRUCCIÓN describe\". Ante fármacos triturados sin dilución adecuada, sospecha siempre obstrucción de la sonda.","bibliography":"Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Procedimientos básicos del cuidado enfermero en pacientes adultos y adultos mayores Tema: Sondas, catéteres, drenajes, heridas, ostomías, transfusión de sangre y sus componentes Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":236,"question":"Durante el turno en el servicio de Medicina Interna, se valora a un paciente masculino de 75 años con antecedentes de hipertensión arterial. En la valoración de enfermería se identifica anuria de 24 horas, fiebre y dolor en la fosa renal izquierda. El médico indica de manera presuntiva el diagnóstico de insuficiencia por el uso de nefrotóxicos. ¿Cuál medicamento provoca esta lesión?","options":["Claritromicina.","Gentamicina.","Ciprofloxacina.","Cefazolina."],"answer":"Gentamicina.","justification":"Es un aminoglucósido cuya principal reacción adversa es la nefrotoxicidad, mediada por su acumulación en las células del túbulo contorneado proximal, donde produce necrosis tubular aguda. Este mecanismo genera un cuadro de insuficiencia renal aguda no oligúrica o anúrica, que clínicamente puede acompañarse de dolor en flanco, fiebre (si coexiste un proceso infeccioso de base) y elevación de creatinina sérica. El riesgo se incrementa en adultos mayores, pacientes con depleción de volumen, uso concomitante de otros nefrotóxicos y tratamientos prolongados, por lo que enfermería debe vigilar estrechamente diuresis, función renal y niveles séricos del fármaco. Opciones incorrectas: • Claritromicina: Es un macrólido cuya toxicidad principal se relaciona con prolongación del intervalo QT y hepatotoxicidad, no con daño renal directo significativo. • Ciprofloxacina: Es una fluoroquinolona que, aunque puede producir cristaluria y nefritis intersticial en casos raros, su perfil de toxicidad predominante afecta tendones (tendinopatía) y sistema nervioso central, no siendo el nefrotóxico clásico esperado en este escenario. • Cefazolina: Es una cefalosporina de primera generación con bajo potencial nefrotóxico; su uso es seguro incluso en pacientes con cierto grado de disfunción renal, ajustando dosis según depuración de creatinina. Tip/Mnemotecnia: \"Los aminoGlucósidos dañan el Glomérulo y el oído\": recuerda que la gentamicina, amikacina y tobramicina son nefrotóxicas y ototóxicas por acumulación tubular proximal.","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins; 2019. Subcomponente: Cuidados de enfermería en el adulto y adulto mayor Tema: Cuidados de enfermería en problemas renales y urinarios: insuficiencia renal aguda y crónica e infecciones de vías urinarias Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":237,"question":"Madre soltera llama al 911 con extrema angustia; su hijo de 5 años ha caído accidentalmente desde una azotea. Rápidamente, los servicios de emergencia acuden al lugar y trasladan al niño al hospital; el médico informa a la madre que su hijo no sobrevivió a la caída. ¿Cuál es la primera fase del duelo por la que atraviesa la madre al recibir esta noticia?","options":["Ira.","Negociación.","Negación.","Depresión."],"answer":"Negación.","justification":"Corresponde a la primera fase del modelo de las cinco etapas del duelo descrito por Elisabeth Kübler-Ross (negación, ira, negociación, depresión y aceptación). Ante una pérdida súbita e inesperada, como la muerte de un hijo, el mecanismo de defensa inicial del psiquismo humano es rechazar la realidad de lo ocurrido como forma de amortiguar el impacto emocional; la persona no logra asimilar de inmediato la información recibida y puede mostrarse en shock, incrédula o incluso conducirse con aparente calma, negando verbal o conductualmente el hecho. En el ámbito del cuidado enfermero, especialmente en contextos de pérdida perinatal, pediátrica o en cuidados paliativos, reconocer esta fase para brindar apoyo empático, evitar confrontaciones prematuras con la realidad y facilitar progresivamente el proceso de duelo saludable. Opciones incorrectas: • Ira: Es la segunda etapa del duelo, en la que la persona, al comenzar a aceptar la pérdida, dirige sentimientos de rabia, frustración o resentimiento hacia sí misma, hacia otros o hacia circunstancias externas (personal de salud, Dios, el destino), buscando explicaciones o culpables ante lo sucedido. • Negociación: También llamada \"pacto\" o \"negociación con lo trascendente\", es la tercera fase en la que la persona intenta establecer acuerdos (frecuentemente con una entidad superior) con la esperanza de revertir o posponer la pérdida; en este caso ya no aplicaría porque el fallecimiento es un hecho consumado e informado directamente por el médico. • Depresión: Constituye la cuarta etapa, caracterizada por tristeza profunda, retraimiento y desesperanza, una vez que la persona ha comenzado a comprender la magnitud real de la pérdida, situación que se manifiesta después de que la negación inicial ha sido superada. Tip/Mnemotecnia: Recuerda el orden de las 5 fases de Kübler-Ross con el acrónimo \"NINDA\": Negación, Ira, Negociación, Depresión, Aceptación.","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins; 2019. Subcomponente: Cuidados de enfermería en el adulto y adulto mayor Tema: Cuidados paliativos Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":238,"question":"Un paciente de 25 años hospitalizado en el servicio de cirugía general sufre una caída de su propia altura con pérdida de conciencia al movilizarse al baño; se realiza valoración primaria de ABC —vía aérea, respiración y circulación—, obteniendo que el paciente no respira y no se palpa el pulso carotídeo, por lo cual se activa el código correspondiente y se inicia protocolo de Reanimación Cardio Pulmonar. Para tal efecto llegan dos profesionales de salud para apoyar. Como parte del equipo de respuesta se empieza a dar compresiones. ¿Cuál es la profundidad de la compresión en este paciente para que sea considerada de calidad?","options":["1/2 del diámetro anteroposterior del tórax.","1.5 a 2 pulgadas (4 a 5 centímetros).","0.5 a 1 pulgada (1.27 a 2.54 centímetros).","1/3 del diámetro anteroposterior del tórax."],"answer":"1.5 a 2 pulgadas (4 a 5 centímetros).","justification":"Según los estándares de Reanimación Cardiopulmonar (RCP) de calidad en el paciente adulto, la profundidad de la compresión torácica debe alcanzar entre 1.5 y 2 pulgadas (aproximadamente 4 a 5 cm), permitiendo una adecuada compresión del ventrículo izquierdo contra la columna vertebral para generar un gasto cardíaco efectivo que garantice la perfusión coronaria y cerebral. Esta profundidad debe acompañarse de una frecuencia de 100 a 120 compresiones por minuto, permitiendo la reexpansión torácica completa entre cada compresión y minimizando las interrupciones, criterios que en conjunto definen una RCP de alta calidad. Opciones incorrectas: • 1/2 del diámetro anteroposterior del tórax: Este parámetro no corresponde al criterio estandarizado de profundidad para RCP en el paciente adulto; la profundidad se mide en unidades absolutas (pulgadas/centímetros) y no como fracción del diámetro torácico. • 0.5 a 1 pulgada (1.27 a 2.54 centímetros): Esta profundidad es insuficiente para generar un flujo sanguíneo adecuado durante las compresiones, por lo que se considera una RCP de baja calidad que compromete la perfusión de órganos vitales. • 1/3 del diámetro anteroposterior del tórax: Este criterio corresponde al protocolo de RCP en lactantes y niños, en quienes la profundidad de compresión se establece como un tercio del diámetro anteroposterior del tórax, y no es aplicable al paciente adulto. Tip/Mnemotecnia: \"2 en 100\" — En el adulto, comprime al menos 2 pulgadas (sin superar 2.4 pulgadas/6 cm) a una frecuencia de 100 a 120 compresiones por minuto, permitiendo la expansión torácica completa.","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins;                                                                                       2019. Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Procedimientos básicos del cuidado enfermero en pacientes adultos y adultos mayores Tema: RCP básico Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":239,"question":"Un profesional de enfermería está brindando cuidados a un paciente diagnosticado de diabetes mellitus tipo 2 con sobrepeso, cuya indicación es la administración de insulina NPH —de acción intermedia— por vía subcutánea cada día; luego de limpiar la piel procede a la administración del fármaco. ¿Cuál es el principal cuidado de enfermería cuando se utiliza esta vía de administración?","options":["No extraer las burbujas de aire de la jeringuilla.","Rotar diariamente los sitios de inyección.","Insertar la aguja en ángulo de 10-15 grados.","Aplicar el medicamento con aguja de 12 mm."],"answer":"Rotar diariamente los sitios de inyección.","justification":"La rotación sistemática de los sitios de punción (abdomen, muslos, brazos, glúteos) es el cuidado prioritario en la administración de insulina subcutánea, ya que previene la aparición de lipodistrofia (lipohipertrofia o lipoatrofia), complicación que altera la absorción del fármaco, genera variabilidad en la glucemia y compromete el control metabólico del paciente diabético. Se recomienda mantener un patrón de rotación dentro de la misma zona anatómica, separando los sitios de punción por al menos 1 cm, y cambiar de zona de forma sistemática para preservar la integridad tisular y garantizar una farmacocinética predecible de la insulina. Opciones incorrectas: • No extraer las burbujas de aire de la jeringuilla: Es incorrecto, ya que las burbujas de aire deben eliminarse antes de la administración porque alteran la dosis exacta del fármaco a inyectar, lo cual es crítico en un medicamento de alto riesgo como la insulina. • Insertar la aguja en ángulo de 10-15 grados: Este ángulo corresponde a la técnica de administración intradérmica, no subcutánea. Para la vía subcutánea el ángulo recomendado es de 45 a 90 grados, dependiendo del pliegue cutáneo y la longitud de la aguja. • Aplicar el medicamento con aguja de 12 mm: Las agujas de mayor longitud (12 mm) se asocian a mayor riesgo de inyección intramuscular accidental, lo que acelera la absorción de la insulina y aumenta el riesgo de hipoglucemia. Actualmente se recomiendan agujas cortas (4-6 mm) para minimizar este riesgo, especialmente en pacientes con sobrepeso. Tip/Mnemotecnia: \"ROTAR para no lipohipertrofiar\": recuerda que cada aplicación de insulina debe alternar sitio anatómico y punto exacto dentro de la zona, dibujando mentalmente un \"reloj\" de rotación para no repetir el mismo punto en menos de 2-3 semanas.","bibliography":"Harvey M. Cálculo y administración de medicamentos. 5ª ed. Wolters Kluwer Health; 2016. Subcomponente: Procedimientos básicos del cuidado enfermero en pacientes adultos y adultos mayores Tema: Insulinoterapia y nutrición parenteral Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":240,"question":"Paciente de 45 años ingresa al servicio de urgencias con diagnóstico de trauma craneoencefálico grave, con una puntuación en la escala de Glasgow de 8/15. Para su manejo se requiere intubación orotraqueal. Como profesional de enfermería, usted debe confirmar la correcta posición del tubo mediante un dispositivo que permita medir la presión parcial de CO₂ en el aire espirado. ¿Cuál es el dispositivo principal que usted utiliza en este caso?","options":["Endotest.","Capnógrafo.","Oxímetro de pulso.","Gasómetro."],"answer":"Capnógrafo.","justification":"Es el dispositivo de elección para confirmar la correcta colocación del tubo orotraqueal, ya que mide de forma continua la presión parcial de dióxido de carbono al final de la espiración (EtCO₂) mediante un sensor infrarrojo. La presencia de una onda de capnografía sostenida (habitualmente entre 35-45 mmHg) confirma que el tubo se encuentra en la vía aérea y no en el esófago, siendo considerado el método más fiable y el estándar de oro (gold standard) para verificar la intubación traqueal, según las guías de reanimación y manejo avanzado de la vía aérea. Opciones incorrectas: • Endotest: Es un dispositivo colorimétrico desechable que detecta cambios de color (de púrpura a amarillo) en presencia de CO₂ espirado; aunque es útil como método complementario rápido, es menos preciso que la capnografía continua y puede dar falsos negativos en situaciones de bajo gasto cardíaco o paro cardiorrespiratorio. • Oxímetro de pulso: Mide la saturación de oxígeno en sangre periférica (SpO₂), no la concentración de CO₂ espirado; es útil para valorar la oxigenación del paciente, pero no confirma la posición del tubo endotraqueal. • Gasómetro: Permite analizar los gases arteriales (pH, PaO₂, PaCO₂, bicarbonato) a partir de una muestra de sangre arterial, pero no ofrece una monitorización continua ni en tiempo real de la posición del tubo endotraqueal durante el procedimiento de intubación. Tip/Mnemotecnia: \"CO₂ que sube y baja, el tubo está en la tráquea\" — recuerda que la onda de capnografía en \"meseta\" (waveform) es la confirmación más confiable de intubación exitosa, mientras que una línea plana sugiere intubación esofágica.","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins; 2019. Subcomponente: Procedimientos básicos del cuidado enfermero en pacientes adultos y adultos mayores Tema: Oxigenoterapia y manejo de la vía aérea Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":241,"question":"Paciente adulto mayor con antecedente de hipertensión arterial acude al centro de salud en busca de consejería, por lo que solicita información sobre una dieta adecuada. ¿Qué tipo de alimento adicionaría a la dieta de este paciente?","options":["Carne roja.","Sandía o melón.","Miel.","Frutos secos."],"answer":"Frutos secos.","justification":"Los frutos secos (nueces, almendras, avellanas) son un componente clave de la dieta DASH (Dietary Approaches to Stop Hypertension), recomendada como pilar no farmacológico en el manejo de la hipertensión arterial. Su aporte en ácidos grasos insaturados (omega-3 y omega-6), fibra, potasio, magnesio y antioxidantes contribuye a la reducción de la resistencia vascular periférica y mejora el perfil lipídico, disminuyendo así el riesgo cardiovascular. Además, su bajo contenido de sodio los convierte en una opción segura frente al riesgo de retención hídrica asociada a dietas ricas en sal. Opciones incorrectas: • Carne roja: Su alto contenido en grasas saturadas favorece la aterosclerosis y el incremento del colesterol LDL, factores que agravan el riesgo cardiovascular en el paciente hipertenso; su consumo debe restringirse y sustituirse preferentemente por proteínas magras o de origen vegetal. • Sandía o melón: Aunque son frutas hidratantes con cierto aporte de potasio, no constituyen la opción de mayor impacto nutricional en el control de la presión arterial en comparación con los frutos secos, y su alto índice glucémico puede no ser ideal en pacientes con comorbilidades metabólicas asociadas, frecuentes en el adulto mayor. • Miel: Es una fuente concentrada de azúcares simples que puede favorecer el sobrepeso y la resistencia a la insulina, condiciones que empeoran el control de la hipertensión arterial, especialmente en pacientes con síndrome metabólico concomitante. Tip/Mnemotecnia: Dieta DASH para la HTA = \"Frutas, Frutos secos, Fibra y bajo en sal\" — recuerda: menos sodio y grasas saturadas, más potasio, magnesio y calcio.","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins; 2019. Subcomponente: Cuidados de enfermería en el adulto y adulto mayor Tema: Cuidados de enfermería en problemas cardiovasculares: hipertensión arterial, infarto agudo de miocardio, insuficiencia cardíaca congestiva Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":242,"question":"Un paciente de 55 años con diagnóstico de hipertensión arterial acude a la consulta externa para control. A la valoración de enfermería se constatan los siguientes parámetros vitales: presión arterial 160/100 mmHg, frecuencia cardíaca 82 por minuto, frecuencia respiratoria 18 por minuto, temperatura 36,8 °C, saturación de oxígeno 90 %, IMC 24. El paciente refiere dolor de cabeza, mareo y visión borrosa; también informa que a veces olvida tomar la medicación y se encuentra temeroso por su condición de salud. ¿Qué intervención de enfermería es prioritaria en este caso?","options":["Administrar analgésicos prescritos.","Promover el cumplimiento del esquema terapéutico.","Controlar la ansiedad del paciente.","Realizar un plan de control y registro de peso corporal."],"answer":"Promover el cumplimiento del esquema terapéutico.","justification":"La hipertensión arterial es una enfermedad crónica cuyo control depende en gran medida de la adherencia al tratamiento farmacológico y a las medidas no farmacológicas indicadas. En este caso, el paciente presenta cifras tensionales elevadas acompañadas de síntomas de daño de órgano blanco incipiente y refiere explícitamente que \"a veces olvida tomar la medicación\", lo cual constituye la causa más probable de la descompensación actual, la intervención prioritaria debe dirigirse a la causa raíz del problema: la falta de adherencia terapéutica, ya que sin control farmacológico sostenido persiste el riesgo de complicaciones agudas graves Opciones incorrectas: • Administrar analgésicos prescritos: La cefalea es un síntoma secundario a la elevación tensional, no un problema primario independiente; tratarla sin abordar la causa sería una intervención sintomática y no prioritaria, además de que la administración de fármacos requiere prescripción médica específica. • Controlar la ansiedad del paciente: Si bien el temor por su condición de salud es relevante y debe abordarse dentro del plan de cuidados integral, no representa el riesgo inmediato para la vida del paciente; es una intervención complementaria, no la prioritaria ante cifras tensionales de riesgo. • Realizar un plan de control y registro de peso corporal: El IMC del paciente se encuentra dentro de rango normal, por lo que esta intervención no es pertinente como prioridad en el contexto clínico presentado, siendo más aplicable en pacientes con sobrepeso u obesidad asociada a HTA. Tip/Mnemotecnia: Ante un paciente hipertenso descompensado, pregúntate primero \"¿Está tomando su medicación?\" — la no adherencia es la causa más frecuente de crisis hipertensivas evitables. Recuerda: \"Sin adherencia no hay control\".","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins; 2019. Subcomponente: Cuidados de enfermería en el adulto y adulto mayor Tema: Cuidados de enfermería en problemas cardiovasculares: hipertensión arterial, infarto agudo de miocardio, insuficiencia cardíaca congestiva Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":243,"question":"Una paciente de 28 años es atendida en el servicio de urgencias con un diagnóstico médico de hemotórax. Presenta dolor torácico, dificultad respiratoria, tiraje intercostal, taquicardia y disminución de la expansión del hemitórax izquierdo, llanto fácil y temor. ¿Cuál es el diagnóstico de enfermería prioritario para esta paciente?","options":["Dolor agudo relacionado con agentes lesivos.","Ansiedad relacionada con factores estresores.","Deterioro de la ventilación espontánea relacionado con la fatiga de los músculos respiratorios.","Riesgo de infección relacionado con el deterioro de la integridad cutánea."],"answer":"Deterioro de la ventilación espontánea relacionado con la fatiga de los músculos respiratorios.","justification":"En el hemotórax, la acumulación de sangre en el espacio pleural comprime el parénquima pulmonar y limita la expansión torácica, generando compromiso ventilatorio agudo. Los signos presentados (tiraje intercostal, disminución de la expansión del hemitórax izquierdo, taquicardia y dificultad respiratoria) evidencian un patrón respiratorio ineficaz con riesgo inminente de hipoxemia e insuficiencia respiratoria. Según la jerarquía de necesidades de Maslow y el ABC de prioridades en enfermería, la vía aérea y la ventilación (Breathing) tienen prioridad absoluta sobre el dolor, la ansiedad o el riesgo de infección, ya que un compromiso respiratorio no resuelto puede evolucionar rápidamente a paro respiratorio y comprometer la vida de la paciente. Opciones incorrectas: • Dolor agudo relacionado con agentes lesivos: aunque el dolor torácico está presente y requiere manejo, no constituye una amenaza inmediata para la vida como el compromiso ventilatorio; su abordaje es secundario a la estabilización respiratoria. • Ansiedad relacionada con factores estresores: el temor y el llanto fácil son manifestaciones psicoemocionales secundarias a la dificultad respiratoria; se resuelven parcialmente al mejorar la oxigenación y no representan riesgo vital inmediato. • Riesgo de infección relacionado con el deterioro de la integridad cutánea: no existe evidencia clínica en el caso de una solución de continuidad cutánea activa que sustente este diagnóstico; además, el riesgo de infección es una prioridad a mediano plazo, no aguda. Tip/Mnemotecnia: Recuerda el \"ABC\" de las prioridades en enfermería: Airway (vía aérea), Breathing (ventilación) y Circulation (circulación) siempre preceden al dolor, la ansiedad o el riesgo de infección. Ante signos de dificultad respiratoria (tiraje, taquicardia, disminución de expansión torácica), la ventilación es SIEMPRE la prioridad.","bibliography":"Herdman T. NANDA Internacional. Diagnósticos Enfermeros. Definiciones y Clasificaciones 2021- 2023.                                   Elsevier;                                       2021. Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Cuidados de enfermería en el adulto y adulto mayor Tema: Cuidados de enfermería a pacientes con politrauma Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":244,"question":"Paciente con antecedentes de cáncer de mama estadio IV ingresa al servicio por terapia de dolor. El médico prescribe la administración de un medicamento que actúe como un potente agonista de los receptores opiáceos mu. ¿Cuál es el medicamento que se administra con base en el mecanismo de acción descrito?","options":["Metamizol.","Morfina.","Ketorolaco.","Paracetamol."],"answer":"Morfina.","justification":"Es un opioide agonista puro de los receptores mu (µ), considerado el fármaco de referencia (Gold Standard) en el tercer escalón de la escalera analgésica de la OMS para el manejo del dolor oncológico moderado a severo, como el que presenta esta paciente con cáncer de mama estadio IV. Su unión a los receptores mu en el sistema nervioso central y periférico inhibe la liberación de neurotransmisores nociceptivos (sustancia P, glutamato) y activa vías inhibitorias descendentes, produciendo analgesia potente, además de efectos secundarios característicos como depresión respiratoria, sedación, estreñimiento y miosis, que la enfermera debe vigilar estrechamente durante su administración. Opciones incorrectas: • Metamizol: Es un analgésico no opioide (pirazolona) con acción principalmente inhibitoria de la ciclooxigenasa (COX) a nivel central, útil en dolor leve a moderado y como antipirético, pero carece de afinidad por los receptores opiáceos mu. • Ketorolaco: Es un antiinflamatorio no esteroideo (AINE) que actúa inhibiendo la ciclooxigenasa (COX-1 y COX-2), bloqueando la síntesis de prostaglandinas; se emplea en dolor agudo moderado, principalmente postoperatorio, sin actividad sobre receptores opiáceos. • Paracetamol: Actúa principalmente a nivel central inhibiendo la síntesis de prostaglandinas (posible acción sobre COX-3) y modulando el sistema serotoninérgico descendente; se utiliza en dolor leve a moderado y como antipirético, pero no posee actividad agonista sobre receptores mu. Tip/Mnemotecnia: \"Morfina = Mu\": recuerda que la Morfina es el prototipo del agonista puro de receptores Mu, base del tercer escalón analgésico de la OMS para dolor oncológico severo.","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins; 2019. Subcomponente: Cuidados de enfermería en el adulto y adulto mayor Tema: Cuidados de enfermería en pacientes con dolor: valoración, terapia farmacológica y no farmacológica Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":245,"question":"Paciente femenina asintomática de 23 años acude al centro de salud después de 3 meses de mantener relaciones sexuales sin protección, por lo cual se le realiza un test de Micro Elisa, en donde se evidencia la presencia de anticuerpos contra el virus de inmunodeficiencia humana, VIH. ¿Cómo se interpreta el resultado del examen?","options":["La paciente ha desarrollado inmunidad contra el virus de inmunodeficiencia humana.","La paciente ha desarrollado resistencia adquirida.","La paciente está inmunocomprometida por la presencia del SIDA.","La paciente ha sido infectada por el virus de inmunodeficiencia humana."],"answer":"La paciente ha sido infectada por el virus de inmunodeficiencia humana.","justification":"El test de ELISA (Enzimoinmunoanálisis) es una prueba de tamizaje que detecta anticuerpos específicos generados por el sistema inmunitario en respuesta a la presencia del VIH, y no anticuerpos protectores o neutralizantes. La detección de estos anticuerpos indica que se ha producido el proceso de seroconversión, es decir, que el organismo ha sido infectado y ha montado una respuesta inmune humoral frente al virus, la cual es incapaz de eliminarlo o generar inmunidad protectora. Ante un resultado positivo o reactivo en el ELISA, el protocolo indica la confirmación mediante una segunda prueba (repetición del ELISA) y, de mantenerse reactiva, la confirmación con una prueba más específica como el Western Blot antes de establecer el diagnóstico definitivo de infección por VIH. Opciones incorrectas: • La paciente ha desarrollado inmunidad contra el virus de inmunodeficiencia humana: Es incorrecta porque los anticuerpos detectados en el ELISA no son neutralizantes ni confieren protección; el VIH tiene la capacidad de evadir la respuesta inmune y de infectar de manera persistente los linfocitos T CD4+. • La paciente ha desarrollado resistencia adquirida: Este concepto se aplica generalmente a la resistencia de microorganismos frente a fármacos (por ejemplo, resistencia antirretroviral tras tratamiento inadecuado), no a la relación entre el huésped y el virus tras la exposición inicial. • La paciente está inmunocomprometida por la presencia del SIDA: Es incorrecta porque el SIDA (Síndrome de Inmunodeficiencia Adquirida) corresponde a la fase avanzada de la infección por VIH, caracterizada por un recuento de linfocitos CD4+ menor a 200 células/mm³ o la presencia de enfermedades oportunistas definitorias; el solo hecho de tener anticuerpos positivos no implica progresión a esta etapa clínica, más aún si la paciente se encuentra asintomática. Tip/Mnemotecnia: \"ELISA detecta, Western Blot confirma\": recuerda que toda prueba de tamizaje positiva para VIH indica exposición/infección (presencia de anticuerpos), pero siempre debe confirmarse antes de dar un diagnóstico definitivo.","bibliography":"Smeltzer S, Bare B. Brunner y Suddarth. Enfermería Medico quirúrgica. 12ª ed. Lippincott Williams & Wilkins; 2019. Subcomponente: Cuidados de enfermería en el adulto y adulto mayor Tema: Cuidados de enfermería en pacientes con VIH - SIDA Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":246,"question":"Un paciente de 45 años ingresa a emergencia con dolor intenso por una fractura de fémur. El médico prescribe analgesia con opioides previo a valoración. ¿Cuál es la acción más apropiada para administrar este grupo de analgésicos?","options":["Administrar el analgésico por vía intramuscular para una acción más rápida.","Mezclar los opioides con otros medicamentos analgésicos para potenciar su efecto.","Limitar la frecuencia de administración de los opioides para evitar la dependencia.","Valoración integral del dolor antes y después de la administración de opioides."],"answer":"Valoración integral del dolor antes y después de la administración de opioides.","justification":"La administración segura de opioides exige valorar el dolor antes del fármaco y reevaluar posteriormente su eficacia y los posibles efectos adversos. La valoración debe incluir intensidad, localización, características, factores agravantes/aliviantes, nivel de conciencia/sedación, frecuencia respiratoria y, cuando corresponda, oxigenación. Esto permite titular el tratamiento, detectar depresión respiratoria temprana y documentar la respuesta. El MSP recomienda una valoración sistemática del dolor y vigilancia cuidadosa de los pacientes que reciben opioides. Opciones incorrectas: • Administrar el analgésico por vía intramuscular para una acción más rápida: La vía intramuscular no es necesariamente más rápida ni la más adecuada en dolor agudo intenso; la vía debe depender del fármaco, situación clínica, perfusión y prescripción. En urgencias suelen preferirse vías titulables. • Mezclar los opioides con otros medicamentos analgésicos para potenciar su efecto: La analgesia multimodal puede ser apropiada cuando está prescrita, pero no se deben mezclar medicamentos por iniciativa propia ni en la misma preparación sin comprobar compatibilidad y orden médica. • Limitar la frecuencia de administración de los opioides para evitar la dependencia: Una restricción arbitraria puede provocar analgesia insuficiente. La dosis y frecuencia deben basarse en prescripción, evaluación repetida, respuesta clínica y seguridad, no en el temor aislado a dependencia. Tip/Mnemotecnia: Opioide seguro = “valorar, administrar, reevaluar”.","bibliography":"Ministerio de Salud Pública del Ecuador. Tratamiento del dolor oncológico en adultos. Guía de Práctica Clínica. Quito: Dirección Nacional de Normatización; 2017. https://www.salud.gob.ec/wp- content/uploads/2017/06/Dolor-oncol%C3%B3gico-GPC-final-12-12-2016-1.pdf Subcomponente: Cuidados de enfermería en el adulto y adulto mayor Tema: Cuidados de enfermería en pacientes con dolor: valoración, terapia farmacológica y no farmacológica Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":247,"question":"Un paciente de 62 años se encuentra en su habitación programado para una colecistectomía electiva en una hora. Al realizar la toma de signos vitales preoperatorios, el profesional de enfermería detecta valores que se encuentran significativamente fuera de los rangos normales para el paciente. Ante este hallazgo en la valoración preoperatoria inmediata, ¿cuál es la acción prioritaria que debe realizar el enfermero?","options":["Anticipa la necesidad de un bolo de líquido.","Administra la medicación preanestésica de inmediato.","Anticipa retrasar la cirugía.","Registra los datos y autoriza el traslado a quirófano."],"answer":"Anticipa retrasar la cirugía.","justification":"Ante signos vitales significativamente anormales inmediatamente antes de una cirugía electiva, la prioridad de enfermería es detener la progresión rutinaria hacia quirófano, repetir/verificar las mediciones, valorar síntomas y comunicar de inmediato al equipo quirúrgico y anestésico. Al ser un procedimiento electivo, puede ser necesario retrasarlo hasta que se identifique la causa y el paciente esté clínicamente optimizado. “Anticipar retrasar” no significa que enfermería cancele por sí sola el procedimiento; significa reconocer el riesgo, activar la valoración correspondiente y evitar un traslado inseguro. Opciones incorrectas: • Anticipa la necesidad de un bolo de líquido: Un bolo puede ser apropiado en hipovolemia o hipotensión seleccionada, pero no debe asumirse sin conocer la alteración concreta, la causa y la indicación médica. • Administra la medicación preanestésica de inmediato: Los sedantes u otros preanestésicos pueden agravar alteraciones hemodinámicas o respiratorias; primero se debe aclarar la anormalidad y confirmar que el procedimiento seguirá adelante. • Registra los datos y autoriza el traslado a quirófano: Documentar es obligatorio, pero trasladar sin evaluación adicional ignora una señal de posible inestabilidad y compromete la seguridad perioperatoria. Tip/Mnemotecnia: Cirugía electiva + signos vitales muy anormales = “verificar, avisar y pausar”.","bibliography":"Association of Anaesthetists; British and Irish Hypertension Society. Measurement and management of adult blood pressure in the peri-operative period: updated guidelines. Anaesthesia.              2026.           https://pmc.ncbi.nlm.nih.gov/articles/PMC12893837/ Gill R, Goldstein S. Evaluation and Management of Perioperative Hypertension. StatPearls. https://www.ncbi.nlm.nih.gov/books/NBK557830/ Subcomponente: Cuidados de enfermería a personas con problemas quirúrgicos más frecuentes Tema: Cuidados de enfermería en el preoperatorio, transoperatorio y postoperatorio Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":248,"question":"Un paciente adulto mayor diagnosticado con colecistitis crónica alitiásica es programado para una intervención quirúrgica programada bajo anestesia general. Durante la valoración preoperatoria, el personal de enfermería revisa la historia clínica e identifica comorbilidades asociadas, tales como hipertensión arterial controlada y diabetes mellitus tipo 2. De acuerdo con el manual de Instrumentación Quirúrgica de Fuller, ¿cuál es la escala que se utiliza para valorar el riesgo quirúrgico y el estado físico de los pacientes que van a ser sometidos a anestesia general y que presentan comorbilidades, cuya puntuación va desde el nivel 1 hasta el nivel 6?","options":["Escala de Ramsay.","Escala de ASA.","Escala de Glasgow.","Escala de Norton."],"answer":"Escala de ASA.","justification":"La clasificación de estado físico de la American Society of Anesthesiologists (ASA) categoriza al paciente desde ASA I hasta ASA VI según su condición sistémica y el grado de enfermedad previo a la anestesia; se añade la letra E cuando se trata de una emergencia. Es una herramienta de uso habitual en la valoración preanestésica. Un adulto mayor con hipertensión controlada y diabetes tipo 2 requiere cla
