sificar su estado sistémico antes de anestesia general. La ASA no reemplaza una valoración integral del riesgo quirúrgico, pero es la escala descrita por el enunciado y la opción correcta. Opciones incorrectas: • Escala de Ramsay: Mide principalmente profundidad de sedación y respuesta del paciente sedado; no clasifica el estado físico preoperatorio. • Escala de Glasgow: Valora nivel de conciencia mediante respuesta ocular, verbal y motora; se usa especialmente en neurología y trauma. • Escala de Norton: Estima riesgo de lesiones por presión considerando condición física, mental, actividad, movilidad e incontinencia. Tip/Mnemotecnia: ASA = estado físico antes de anestesia; Glasgow = conciencia; Ramsay = sedación; Norton = presión.","bibliography":"American Society of Anesthesiologists. ASA Physical Status Classification System. https://www.asahq.org/standards-and-practice-parameters/statement-on-asa-physical-status- classification-system StatPearls. American Society of Anesthesiologists Physical Status Classification System. https://www.ncbi.nlm.nih.gov/books/NBK441940/ Subcomponente: Cuidados de enfermería a personas con problemas quirúrgicos más frecuentes Tema: Valoración al paciente quirúrgico y uso de escalas cuantitativas y cualitativas Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":249,"question":"Un paciente adulto se encuentra ingresado en la unidad de cuidados críticos con ventilación mecánica asistida debido a un traumatismo craneoencefálico grave que cursa con riesgo de hipertensión intracraneal. Con base en los fundamentos de enfermería clínico-quirúrgica, el personal de enfermería debe implementar una intervención postural sencilla, económica y respaldada por la práctica habitual que facilite la expansión pulmonar y optimice la disminución de la presión intracraneal (PIC) manteniendo el cabecero de la cama entre 30-45°. ¿Cuál es la posición terapéutica indicada para este paciente?","options":["Posición de Fowler.","Posición Semi-Fowler.","Posición de Trendelenburg.","Posición decúbito supino estricto."],"answer":"Posición Semi-Fowler.","justification":"La posición Semi-Fowler eleva la cabecera aproximadamente 30–45°. En un paciente con traumatismo craneoencefálico grave, esta elevación favorece el drenaje venoso cerebral, reduce la resistencia al retorno yugular y puede ayudar al control de la presión intracraneal, siempre que se mantenga la cabeza en línea media y se preserve una adecuada presión de perfusión cerebral. Además, facilita la expansión torácica y la ventilación. Es una intervención postural básica y de bajo costo ampliamente recomendada en el cuidado neurocrítico. Opciones incorrectas: • Posición de Fowler: Habitualmente implica una elevación mayor, alrededor de 45–60° o más. Puede ser útil en disnea, pero para el objetivo neurocrítico descrito el rango específico de 30–45° corresponde mejor a Semi-Fowler. • Posición de Trendelenburg: Coloca la cabeza más baja que los pies y puede aumentar congestión venosa cerebral y presión intracraneal, por lo que no es apropiada en este contexto. • Posición decúbito supino estricto: No aprovecha la elevación de la cabecera para favorecer drenaje venoso cerebral y puede dificultar expansión pulmonar en un paciente ventilado. Tip/Mnemotecnia: TCE + riesgo de PIC: cabecera 30–45° y cabeza neutra.","bibliography":"Picetti E, et al. Early management of isolated severe traumatic brain injury patients in a hospital without neurosurgical capabilities: WSES consensus and clinical recommendations. World J Emerg Surg. 2023;18:5. https://pmc.ncbi.nlm.nih.gov/articles/PMC9830860/ Subcomponente: Cuidados de enfermería en el adulto y adulto mayor Tema: Cuidados de enfermería en problemas cerebrovasculares-neurológicos: accidentes cerebrovasculares, párkinson, alzhéimer, traumatismo cráneo encefálico Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":250,"question":"Un paciente de 68 años con antecedentes de insuficiencia cardíaca congestiva ingresa al servicio de hospitalización presentando disnea marcada en reposo, ortopnea, taquipnea y estertores crepitantes bilaterales en las bases pulmonares debidos a la congestión. Mientras se preparan las intervenciones farmacológicas prescritas, el personal de enfermería debe ejecutar de inmediato una acción posicional prioritaria para aliviar la disnea y optimizar el estado hemodinámico del paciente. Con base en la literatura de Enfermería médico-quirúrgica de Brunner y Suddarth, ¿cuál es la intervención de enfermería inmediata que se debe realizar?","options":["Enseñar al paciente sobre la restricción de sodio en la dieta.","Colocar al paciente en posición de Trendelenburg.","Colocar al paciente en posición semifowler.","Mantener al paciente en posición decúbito lateral izquierdo."],"answer":"Colocar al paciente en posición semifowler.","justification":"El paciente presenta disnea en reposo, ortopnea y estertores por congestión pulmonar. Elevar la cabecera en Semi-Fowler mejora la expansión pulmonar, facilita el descenso diafragmático y reduce el trabajo respiratorio; además, disminuye en cierta medida el retorno venoso desde las extremidades, lo que puede aliviar la congestión mientras se preparan los tratamientos prescritos. En pacientes con insuficiencia cardiaca aguda o descompensada, mantener al paciente incorporado o semiincorporado es una medida inmediata de confort y soporte respiratorio. Entre las opciones disponibles, Semi-Fowler es la mejor respuesta. Opciones incorrectas: • Enseñar al paciente sobre la restricción de sodio en la dieta: Es una intervención educativa importante para el manejo crónico de la insuficiencia cardiaca, pero no alivia de forma inmediata la disnea intensa del episodio actual. • Colocar al paciente en posición de Trendelenburg: Aumenta el retorno venoso hacia el tórax y puede empeorar la congestión pulmonar y la disnea. • Mantener al paciente en posición decúbito lateral izquierdo: No es la posición de primera elección para aliviar ortopnea y congestión pulmonar; se prefiere elevar el tronco. Tip/Mnemotecnia: Ortopnea = “el paciente quiere sentarse”: eleva la cabecera.","bibliography":"Hinkle JL, Cheever KH, Overbaugh KJ, eds. Brunner & Suddarth's Textbook of Medical-Surgical Nursing.        15th        ed.       Philadelphia:        Wolters       Kluwer;         2022. https://books.google.com/books?id=XGdpzgEACAAJ National Library of Medicine. General Nursing Interventions to Manage Dyspnea and Hypoxia. https://www.ncbi.nlm.nih.gov/books/NBK613070/table/ch6respiratory.T.general_nursing_interve/ Subcomponente: Cuidados de enfermería en el adulto y adulto mayor Tema: Cuidados de enfermería en problemas cardiovasculares: hipertensión arterial, infarto agudo de miocardio, insuficiencia cardíaca congestiva Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":251,"question":"Un paciente de 65 años, con antecedentes de VIH hace un año, quien acude al centro de salud porque presenta molestias articulares de moderada intensidad y un peso de 49 kg. El médico valora mediante examen físico y complementario, diagnosticándolo de TB ósea, iniciando por primera vez el tratamiento antituberculoso. ¿Cuál es el esquema de tratamiento que corresponde en este caso?","options":["2HRZE/10HR.","2HRZE/6HR.","2RHE/7HR.","2HRZE/4HR."],"answer":"2HRZE/10HR.","justification":"Este esquema corresponde al tratamiento indicado para las formas de tuberculosis extrapulmonar graves, entre las cuales se incluye la TB osteoarticular, así como la TB del sistema nervioso central y la TB miliar. Según la normativa del Ministerio de Salud Pública del Ecuador para el manejo programático de la tuberculosis, estas presentaciones requieren prolongar la fase de mantenimiento a 10 meses (HR) posterior a la fase intensiva de 2 meses con cuatro fármacos (isoniazida, rifampicina, pirazinamida y etambutol), dado el riesgo de secuelas irreversibles, la localización de difícil acceso farmacológico y la necesidad de garantizar una esterilización bacteriana completa. En pacientes con VIH, como el caso descrito, este esquema prolongado cobra aún mayor relevancia por el estado de inmunosupresión, que incrementa el riesgo de reactivación y diseminación bacilar si el tratamiento es insuficiente. Opciones incorrectas: • 2HRZE/6HR: Este es el esquema estándar de primera línea utilizado para la tuberculosis pulmonar sensible y la mayoría de las formas extrapulmonares no complicadas, pero resulta insuficiente para la TB ósea, ya que esta requiere una fase de continuación prolongada. • 2RHE/7HR: Esta combinación no corresponde a los esquemas normados por el Programa Nacional de Control de la Tuberculosis del Ecuador, tanto en la composición de fármacos de la fase intensiva como en la duración de la fase de mantenimiento. • 2HRZE/4HR: Este esquema acortado no cumple con el tiempo mínimo de tratamiento requerido para las formas óseas u osteoarticulares de tuberculosis, lo que aumentaría el riesgo de fracaso terapéutico, resistencia bacteriana y secuelas funcionales permanentes. Tip/Mnemotecnia: Recuerda \"TB en hueso y cerebro, tratamiento más largo\": las formas óseas, del SNC y miliar de TB requieren 10 meses de fase de mantenimiento (2HRZE/10HR), a diferencia del esquema estándar de 6 meses para TB pulmonar simple.","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: La enfermería en el trabajo familiar y comunitario Tema: ITS/VIH: Contenido y sistema de información Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":252,"question":"En la comunidad rural donde usted labora se ha identificado un aumento en la incidencia de enfermedades crónicas no transmisibles, como diabetes tipo II e hipertensión. La población está compuesta principalmente por adultos mayores y familias de bajos recursos. Procede a desarrollar un plan de intervención para mejorar la salud de esta comunidad. Entre las actividades se incluyen la educación para la salud, programas de ejercicio comunitario, campañas de prevención, creación de huertos comunitarios y grupos de apoyo. ¿Cuál de las siguientes actividades del equipo de atención primaria se está aplicando en este caso?","options":["Promoción de la salud.","Rehabilitación y reinserción social.","Atención familiar.","Asistencia sanitaria."],"answer":"Promoción de la salud.","justification":"Esta actividad del equipo de atención primaria se orienta a fortalecer las capacidades individuales y colectivas para mejorar los determinantes de la salud, mediante estrategias educativas, participativas y de empoderamiento comunitario. En el caso descrito, la educación para la salud, los programas de ejercicio comunitario, las campañas de prevención, los huertos comunitarios y los grupos de apoyo constituyen intervenciones típicas de promoción de la salud según la Carta de Ottawa y el enfoque de Atención Primaria de Salud Renovada (APS-R), ya que buscan modificar estilos de vida y factores de riesgo asociados a enfermedades crónicas no transmisibles como la diabetes tipo II y la hipertensión arterial, antes de que se produzca el daño o para evitar su progresión, actuando sobre el contexto social y ambiental de la comunidad. Opciones incorrectas: • Rehabilitación y reinserción social: Corresponde a las acciones dirigidas a restaurar la funcionalidad física, psicológica y social de una persona que ya presenta una discapacidad o secuela derivada de una enfermedad o accidente, lo cual no se describe en el caso planteado. • Atención familiar: Se refiere al abordaje del núcleo familiar como unidad de cuidado, considerando su estructura, dinámica y ciclo vital, mediante herramientas como el familiograma o la visita domiciliaria; en el caso expuesto la intervención está dirigida a la comunidad en su conjunto, no exclusivamente al núcleo familiar. • Asistencia sanitaria: Implica la atención directa curativa o de diagnóstico y tratamiento de la enfermedad ya instaurada en el individuo, situación distinta a las estrategias educativas y preventivas de base comunitaria descritas en el enunciado. Tip/Mnemotecnia: \"PROMUEVE antes de CURAR\": la Promoción de la salud actúa sobre los determinantes sociales (educación, ejercicio, alimentación) para evitar la enfermedad, mientras que la Asistencia sanitaria y la Rehabilitación actúan cuando la enfermedad o el daño ya están presentes.","bibliography":"Zurro A. Atención familiar y salud comunitaria. 2ª ed. Elsevier; 2018. Subcomponente: Bases para el cuidado familiar y comunitario Tema: Promoción de la salud y Atención primaria renovada Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":253,"question":"Paciente residente en una comunidad rural, con antecedentes de hipertensión arterial y diabetes tipo 2. Durante la visita domiciliaria, se observa que atraviesa una serie de situaciones que provocan tristeza, depresión y falta de adherencia al tratamiento. Como persona de enfermería, usted identifica estas necesidades, realiza un plan de cuidados integral basado en la valoración de la situación de la paciente y coordina los recursos y servicios necesarios para la atención. ¿Cuál es la principal competencia de la enfermería basada en la comunidad que usted desempeña en este caso?","options":["Defensora del paciente.","Colaboradora.","Epidemióloga.","Gestora de casos."],"answer":"Colaboradora.","justification":"Esta competencia implica identificar las necesidades biopsicosociales del paciente y su familia, realizar una valoración integral, diseñar un plan de cuidados individualizado y coordinar activamente los recursos intra e interinstitucionales (salud mental, trabajo social, seguimiento farmacológico) para garantizar la continuidad y adherencia al tratamiento. En el escenario descrito, la enfermera detecta un problema de salud mental (tristeza/depresión) asociado a comorbilidades crónicas (HTA y diabetes) y articula la respuesta del sistema de salud mediante un plan de cuidados y la gestión de recursos, lo cual constituye el núcleo de la gestión de casos en el modelo de atención comunitaria. Opciones incorrectas: • Defensora del paciente: Esta función se centra en proteger y hacer valer los derechos del paciente frente al sistema de salud u otras instancias, pero no implica necesariamente la coordinación integral de recursos y servicios como se describe en el caso. • Colaboradora: Corresponde al trabajo interdisciplinario con otros profesionales de salud, pero no describe específicamente la valoración, planificación y coordinación centralizada que realiza la enfermera en este escenario. • Epidemióloga: Esta competencia se relaciona con la vigilancia, análisis y control de la distribución de enfermedades en la población, no con la atención individualizada y gestión de cuidados de un paciente específico. Tip/Mnemotecnia: \"Gestora de casos = Valora, Planifica, Coordina\" (VPC): valora integralmente al paciente, planifica cuidados personalizados y coordina los recursos del sistema de salud para asegurar continuidad y adherencia.","bibliography":"Zurro A. Atención familiar y salud comunitaria. 2ª ed. Elsevier; 2018. Subcomponente: Generalidades sobre el cuidado familiar y comunitario Tema: Definiciones, roles, funciones, actividades, limitaciones y retos de la enfermera comunitaria Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":254,"question":"Un adulto mayor de etnia indígena, habla muy poco español, muy religioso y con una gran familia, incluyendo una esposa, 9 hijos y muchos nietos, tiene un historial de patologías vasculares graves, fue sometido a una colecistectomía y ha desarrollado diabetes tipo II, hipertensión arterial y EPOC. Actualmente tiene el pie frío, piel pálida y un dolor creciente; su esposa insiste a todos los miembros de la familia que le visiten. El profesional de enfermería ingresa a la unidad del paciente para la valoración y observa ciertas características culturales; la mayoría de familiares están en oración y en la mesilla junto a la cama están varios pasajes del Corán grabados, pero los familiares de otros pacientes no dejan sitio para que se sentaran. ¿Con qué modelo o teoría emprende su trabajo el profesional de enfermería?","options":["Teoría de Hildegard E. Peplau.","Modelo de Nola Pender.","Teoría de Madeleine Leininger.","Modelo de Virginia Henderson."],"answer":"Teoría de Madeleine Leininger.","justification":"La Teoría de la Diversidad y Universalidad de los Cuidados Culturales de Leininger sostiene que los cuidados de enfermería deben ser congruentes con los valores, creencias, prácticas religiosas y estructura social del paciente y su familia. En el caso descrito, el profesional identifica elementos claramente culturales y espirituales: la etnia indígena, la barrera idiomática, la religiosidad manifestada en los pasajes del Corán, la estructura familiar extensa y el rol activo de la esposa como cuidadora y organizadora del apoyo familiar. Leininger propone que el cuidado debe preservarse, acomodarse o repatronizarse según estas particularidades culturales, lo cual es exactamente lo que el profesional debe considerar al planificar. Opciones incorrectas: • Teoría de Hildegard E. Peplau: Se centra en la relación interpersonal enfermera-paciente como proceso terapéutico e interactivo, enfocada en las fases de orientación, identificación, aprovechamiento y resolución, pero no aborda específicamente la dimensión cultural o religiosa del cuidado. • Modelo de Nola Pender: Corresponde al Modelo de Promoción de la Salud, orientado a identificar factores cognitivo-perceptuales y conductas que favorecen estilos de vida saludables; es útil en prevención, pero no está diseñado para el análisis transcultural del cuidado. • Modelo de Virginia Henderson: Se basa en las 14 necesidades básicas del ser humano y busca la independencia del paciente en su satisfacción; aunque integral, no profundiza en la valoración específica de creencias culturales o espirituales como eje central del cuidado. Tip/Mnemotecnia: \"LEININGER = CULTURA\" — Cada vez que aparezcan en el enunciado etnia, idioma, religión y familia extensa, piensa en Madeleine Leininger y su Teoría de la Diversidad y Universalidad de los Cuidados Culturales.","bibliography":"Alligood M. Modelos y Teorías de Enfermería. 10ª ed. Elsevier; 2022. Subcomponente: La enfermería en el trabajo familiar y comunitario Tema: Enfoque de riesgo y por ciclos de vida en las intervenciones de enfermería con la familia Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":255,"question":"Paciente femenina de 28 años, sintomática respiratoria por más de un mes, acudió al centro de salud obteniéndose la primera muestra de esputo. La profesional de enfermería le brindó información para la recolección de la segunda muestra y traerla al día siguiente, pero no acudió. ¿Cuál es la actividad que debe realizar el personal de salud en ausencia de la paciente?","options":["Desechar la primera muestra y registrar la ausencia, programar una visita llevando dos envases.","Agendar una nueva cita para realizar la toma de primera y segunda muestra.","Coordinar la ubicación del sintomático respiratorio con la oficina técnica y obtener la segunda muestra.","Programar una visita domiciliaria para obtener la muestra faltante dentro de las 48 horas."],"answer":"Programar una visita domiciliaria para obtener la muestra faltante dentro de las 48 horas.","justification":"Según la Estrategia Nacional de Control de la Tuberculosis (DOTS) del MSP Ecuador, el diagnóstico de tuberculosis pulmonar mediante baciloscopia requiere la recolección de dos muestras de esputo (una al momento de la consulta y otra al día siguiente en ayunas). Cuando el sintomático respiratorio no regresa a entregar la segunda muestra, el personal de salud tiene la responsabilidad de realizar búsqueda activa mediante visita domiciliaria dentro de las 48 horas siguientes a la inasistencia, con el fin de completar el estudio diagnóstico, evitar la pérdida del caso en el sistema de vigilancia y garantizar la captación oportuna, lo cual es fundamental para el control de la transmisión de la enfermedad en la comunidad. Opciones incorrectas: • Desechar la primera muestra y registrar la ausencia, programar una visita llevando dos envases: Es incorrecto desechar la primera muestra, ya que esta constituye material diagnóstico válido y necesario; desecharla implicaría repetir innecesariamente el procedimiento y retrasar el diagnóstico. • Agendar una nueva cita para realizar la toma de primera y segunda muestra: No es adecuado porque la primera muestra ya fue obtenida y se encuentra disponible para el análisis; solicitar ambas muestras nuevamente duplica esfuerzos y retrasa el proceso diagnóstico sin justificación. • Coordinar la ubicación del sintomático respiratorio con la oficina técnica y obtener la segunda muestra: Esta opción no corresponde al protocolo operativo establecido por el MSP para el seguimiento de sintomáticos respiratorios; la responsabilidad directa e inmediata de la búsqueda activa recae en el personal de salud del establecimiento, no en una gestión administrativa externa. Tip/Mnemotecnia: \"2 muestras, 48 horas\": ante la inasistencia del sintomático respiratorio a la segunda muestra de esputo, la visita domiciliaria de búsqueda activa debe realizarse dentro de las 48 horas para no perder el caso.","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: La enfermería en el trabajo familiar y comunitario Tema: Estrategia Nacional de Control de la tuberculosis (DOTS): Desarrollo y sistema de información Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":256,"question":"Paciente de 19 años acude por primera vez al centro de salud en la semana 28 de su primer embarazo. No ha recibido controles prenatales por parte del sistema de salud pública. Durante la valoración se detectan signos compatibles con anemia, así como cifras de presión arterial ligeramente elevada —TA 140/90 mmHg—. Se inicia control prenatal, tratamiento para la hipertensión gestacional y anemia; se establece un plan de seguimiento con visitas domiciliarias periódicas. ¿A cuál de las metas del objetivo 1 del Plan Nacional de Desarrollo se contribuye con la realización de estas intervenciones sanitarias?","options":["Reducir la razón de mortalidad materna.","Reducir el gasto de bolsillo en salud como porcentaje del gasto total en salud.","Reducir la prevalencia de desnutrición crónica infantil en menores de dos años.","Reducir la tasa específica de nacimientos en mujeres adolescentes de 15 a 19 años."],"answer":"Reducir la razón de mortalidad materna.","justification":"El caso clínico describe una gestante adolescente que acude tardíamente (semana 28) sin controles prenatales previos, con anemia y cifras tensionales elevadas compatibles con un trastorno hipertensivo gestacional; ambas son causas directas reconocidas de morbimortalidad materna en el Ecuador. Las intervenciones descritas —inicio de control prenatal, manejo terapéutico de la hipertensión y la anemia, y seguimiento mediante visitas domiciliarias— constituyen acciones de captación temprana, detección de factores de riesgo obstétrico y seguimiento continuo, pilares de las estrategias nacionales orientadas a disminuir la razón de mortalidad materna. Opciones incorrectas: • Reducir el gasto de bolsillo en salud como porcentaje del gasto total en salud: Es un indicador de protección financiera en salud vinculado a la equidad en el acceso a servicios, no relacionado directamente con el manejo clínico de complicaciones obstétricas descrito en el caso. • Reducir la prevalencia de desnutrición crónica infantil en menores de dos años: Corresponde a una meta de salud infantil enfocada en el estado nutricional postnatal del niño, no al seguimiento y manejo de riesgos durante la gestación materna. • Reducir la tasa específica de nacimientos en mujeres adolescentes de 15 a 19 años: Aunque la paciente es adolescente, esta meta se relaciona con la prevención del embarazo adolescente, no con el manejo de las complicaciones ya presentes en un embarazo en curso. Tip/Mnemotecnia: \"Control prenatal a tiempo, salva vidas de la mamá\": toda intervención que busque detectar y tratar precozmente complicaciones del embarazo (anemia, hipertensión) impacta directamente en la meta de reducción de la razón de mortalidad materna del PND-ODS 3.","bibliography":"Organización de las Naciones Unidas. Transformar nuestro mundo: La Agenda 2030 para el Desarrollo Sostenible. [Aprobada por la Asamblea General el 25 de septiembre de 2015]; 2015. Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: Bases para el cuidado familiar y comunitario Tema: Objetivos de Desarrollo Sostenible ODS - 30, Constitución política y Plan Nacional de Desarrollo Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":257,"question":"Paciente con VIH, debido a complicaciones relacionadas con su estado de salud, ha sido hospitalizado en varias ocasiones en los últimos meses. Actualmente vive con su esposa y sus dos hijos adultos, con quienes manifiesta insatisfacción en la relación interpersonal, puesto que han enfrentado problemas, especialmente por la falta de adaptación, participación y apoyo en su cuidado. Con esos datos, usted evalúa la función familiar e implementa una intervención de cuidado. ¿Qué instrumento de la atención familiar utiliza como profesional de enfermería para basar su intervención?","options":["Apgar Familiar.","Ecomapa familiar.","Genograma familiar.","Escala de reajuste social."],"answer":"Apgar Familiar.","justification":"Es un instrumento de valoración que permite evaluar de forma rápida el funcionamiento familiar percibido por el paciente a través de cinco componentes: Adaptación, Participación (Partnership), Crecimiento (Growth), Afecto y Recursos (Resolve). En este caso, el paciente manifiesta insatisfacción relacionada precisamente con la falta de adaptación, participación y apoyo en su cuidado, lo cual corresponde directamente a las dimensiones que mide este instrumento, permitiendo al profesional de enfermería cuantificar el grado de disfunción familiar y orientar intervenciones específicas de apoyo psicosocial. Opciones incorrectas: • Ecomapa familiar: Es una representación gráfica que identifica las relaciones del sistema familiar con el entorno externo (instituciones, redes de apoyo social, trabajo, servicios de salud), pero no mide la satisfacción ni el funcionamiento interno de la dinámica familiar como lo requiere este caso. • Genograma familiar: Es una herramienta gráfica que representa la estructura familiar, relaciones de parentesco y patrones de enfermedades a través de generaciones; se utiliza para identificar antecedentes familiares y relaciones estructurales, no para evaluar la percepción de funcionalidad familiar actual. • Escala de reajuste social: Corresponde a un instrumento (como el de Holmes y Rahe) que mide el nivel de estrés generado por eventos vitales significativos, no está diseñada específicamente para evaluar la función familiar ni la satisfacción con el apoyo recibido de los miembros de la familia. Tip/Mnemotecnia: APGAR familiar = Adaptación, Participación, Gradiente de crecimiento (Growth), Afecto, Resolve (recursos). Igual que el APGAR neonatal evalúa vitalidad del recién nacido, el APGAR familiar evalúa la \"vitalidad\" o salud de la dinámica familiar.","bibliography":"Zurro A. Atención familiar y salud comunitaria. 2ª ed. Elsevier; 2018. Subcomponente: La enfermería en el trabajo familiar y comunitario Tema: ITS/VIH: Contenido y sistema de información Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":258,"question":"En una comunidad se evidencia una crisis sanitaria que afecta la salud de la niñez. La profesional de enfermería identifica hábitos inadecuados en el cuidado diario de los niños. ¿Cuál es el determinante de la salud que se describe en el caso?","options":["Ambiental.","Conductual.","Social.","Biológico."],"answer":"Conductual.","justification":"Los determinantes conductuales de la salud hacen referencia a los estilos de vida, hábitos y prácticas cotidianas que adoptan las personas o sus cuidadores, y que influyen directamente en su estado de salud. En el caso descrito, los \"hábitos inadecuados en el cuidado diario de los niños\" corresponden a prácticas de crianza y autocuidado que, al ser modificables mediante educación y promoción de la salud, constituyen un determinante conductual según el Modelo de Atención Integral de Salud Familiar, Comunitario e Intercultural (MAIS-FCI). Este tipo de determinante es clave para el diseño de intervenciones de enfermería orientadas al cambio de comportamiento en el núcleo familiar. Opciones incorrectas: • Ambiental: Se refiere a las condiciones físicas, geográficas, climáticas y de saneamiento del entorno (agua, vivienda, contaminación) que afectan la salud, no a las prácticas de cuidado de los cuidadores. • Social: Corresponde a las condiciones estructurales como educación, empleo, ingresos y redes de apoyo social que determinan de manera indirecta el acceso y la calidad de vida, pero no describe hábitos individuales de cuidado. • Biológico: Involucra factores genéticos, hereditarios y de desarrollo fisiológico propios del individuo, sobre los cuales no existe control mediante cambios de comportamiento. Tip/Mnemotecnia: Recuerda los determinantes de la salud con \"BASC\": Biológico, Ambiental, Social y Conductual. Si el caso menciona \"hábitos\" o \"prácticas de cuidado\", piensa siempre en el determinante Conductual.","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: Bases para el cuidado familiar y comunitario Tema: Determinantes de la salud de acuerdo con el MAIS FCI Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":259,"question":"Paciente de 45 años permanece hospitalizado por varias semanas en el servicio de terapia intensiva por un accidente de tránsito. Durante su turno, el paciente le comenta que se encuentra triste por la situación económica de su familia, esposa y dos hijas adolescentes, ya que es el único sustento familiar. De acuerdo con el caso, ¿qué tipo de crisis experimenta la familia?","options":["Crisis normativa.","Crisis de cuidado.","Crisis paranormativa.","Falta de apoyo familiar."],"answer":"Crisis paranormativa.","justification":"Las crisis paranormativas (también llamadas no normativas o accidentales) son eventos inesperados, imprevisibles y ajenos al ciclo vital natural de la familia, que la desestabilizan de forma abrupta y exigen una reorganización estructural y funcional no anticipada. En el caso descrito, el accidente de tránsito que provoca la hospitalización prolongada del único proveedor económico constituye un evento súbito y accidental que altera la dinámica familiar habitual, generando tensión económica y emocional no contemplada dentro de las etapas esperadas del ciclo de vida familiar (nacimiento de hijos, adolescencia, jubilación, etc.), lo que la diferencia claramente de una crisis normativa. Opciones incorrectas: • Crisis normativa: Corresponde a las transiciones esperadas y predecibles dentro del ciclo vital familiar, como el matrimonio, el nacimiento de un hijo, el ingreso a la adolescencia o el \"nido vacío\". No aplica en este caso porque el evento (accidente de tránsito) es imprevisible y no forma parte del desarrollo natural de la familia. • Crisis de cuidado: No corresponde a una categoría reconocida dentro de la clasificación clásica de crisis familiares (normativas y paranormativas); es un distractor sin sustento conceptual en la literatura de enfermería familiar. • Falta de apoyo familiar: Describe una carencia de soporte social o afectivo, pero no clasifica el tipo de crisis que atraviesa la familia; en el caso no se menciona ausencia de apoyo, sino una situación de tensión económica derivada de un evento accidental. Tip/Mnemotecnia: \"NORMATIVA es lo previsto, PARANORMATIVA es lo imprevisto\": si el evento aparece en el \"libro del ciclo familiar\" (boda, hijos, vejez) es normativo; si aparece \"fuera del libreto\" (accidente, muerte súbita, desempleo repentino) es paranormativo.","bibliography":"Zurro A. Atención familiar y salud comunitaria. 2ª ed. Elsevier; 2018. Subcomponente: Bases para el cuidado familiar y comunitario Tema: Funciones, tensiones y crisis familiares Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":260,"question":"Gestante de 12 semanas se presenta en el centro de salud para inmunización, posterior al control prenatal por parte de la obstetra. No presenta problema alguno de salud. A la valoración de enfermería no existen signos o síntomas de infección alguna ni se refieren alergias a vacunas por parte de la gestante. ¿Qué vacuna está contraindicada para esta paciente?","options":["Hepatitis tipo B.","Influenza estacional.","Varicela.","Difteria y tétanos."],"answer":"Varicela.","justification":"Esta vacuna está elaborada con virus vivos atenuados, por lo que se encuentra contraindicada durante el embarazo debido al riesgo teórico de transmisión del virus vacunal al feto y de teratogenicidad, similar a lo que ocurre con la infección natural por varicela zóster. El Esquema Nacional de Inmunizaciones (ENI) del Ministerio de Salud Pública del Ecuador establece que todas las vacunas de virus vivos atenuados deben evitarse en gestantes, recomendándose su administración previa al embarazo o en el puerperio si la paciente no cuenta con inmunidad. Opciones incorrectas: • Hepatitis tipo B: Es una vacuna elaborada con antígeno de superficie recombinante (no contiene virus vivo), por lo que es segura y se recomienda su aplicación en gestantes con esquema incompleto o desconocido, especialmente si existe riesgo de exposición. • Influenza estacional: Es una vacuna inactivada (virus fraccionado o subunidades), considerada segura y fuertemente recomendada durante cualquier trimestre del embarazo, ya que protege tanto a la madre como al recién nacido mediante transferencia de anticuerpos. • Difteria y tétanos: La vacuna Td (o dTpa) es un toxoide inactivado, indicado de forma rutinaria en el esquema de control prenatal ecuatoriano para prevenir el tétanos neonatal y materno, sin representar riesgo alguno para el feto. Tip/Mnemotecnia: \"En el embarazo, lo VIVO se evita\": las vacunas de virus vivos atenuados (Varicela, SRP, Fiebre amarilla, BCG) están contraindicadas en gestantes; las vacunas inactivadas o toxoides (Influenza, Td/dTpa, Hepatitis B) sí pueden y deben administrarse.","bibliography":"Ministerio de Salud Pública del Ecuador. Estrategia Nacional de Inmunizaciones, ENI. Ministerio de Salud                                         Pública;                                       2021. Cunningham G, Leveno K, Dashe J, Hoffman B, Spong C, Casey B. Williams Obstetrics. 26ª ed. McGraw-Hill; 2022. Subcomponente: La enfermería en el trabajo familiar y comunitario Tema: ENI: Esquemas de vacunación, técnicas de aplicación, cadena de frío, política de frasco abierto, bioseguridad y ESAVIS (Vigilancia de efectos adversos atribuidos a vacunación e inmunización) Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":261,"question":"Un grupo específico de personas vive en una parroquia rural, comparten la misma cultura, valores y normas. Al momento están organizadas en una estructura social por cabildo. En la valoración se detecta la necesidad de reorientar los servicios de salud hacia la comunidad. ¿Cuál de los siguientes enunciados define el concepto de comunidad cerrada?","options":["Una comunidad que se enfoca principalmente en el desarrollo económico y la generación de empleo.","Una comunidad que tiene fronteras geográficas claramente definidas y limita el acceso a personas externas.","Una comunidad que se caracteriza por tener una diversidad cultural y étnica muy marcada.","Una comunidad que promueve la participación activa de sus miembros en actividades sociales y culturales."],"answer":"Una comunidad que tiene fronteras geográficas claramente definidas y limita el acceso a personas externas.","justification":"El concepto de comunidad cerrada hace referencia a un tipo de organización social delimitada por fronteras geográficas o administrativas, en la cual el acceso e ingreso de personas externas se encuentra restringido o regulado por normas internas propias del grupo. Esta característica es relevante para la enfermería comunitaria, ya que condiciona la forma en que deben planificarse las estrategias de acercamiento, negociación y reorientación de los servicios de salud hacia la comunidad, siendo indispensable el reconocimiento de sus estructuras organizativas y de sus líderes o actores clave como puerta de entrada para la intervención sanitaria. Opciones incorrectas: • Una comunidad que se enfoca principalmente en el desarrollo económico y la generación de empleo: Esto corresponde a una característica funcional relacionada con actividades productivas, pero no define el criterio de \"cerrada\" o \"abierta\" de una comunidad, que se basa en el acceso y los límites territoriales, no en su orientación económica. • Una comunidad que se caracteriza por tener una diversidad cultural y étnica muy marcada: La diversidad cultural es opuesta al concepto de comunidad cerrada, ya que estas últimas suelen presentar homogeneidad cultural, de valores y normas compartidas entre sus miembros, tal como se describe en el caso de la parroquia rural organizada por cabildo. • Una comunidad que promueve la participación activa de sus miembros en actividades sociales y culturales: La participación social es un atributo transversal deseable en cualquier tipo de comunidad (abierta o cerrada) y no constituye el elemento diferenciador que define a una comunidad como cerrada. Tip/Mnemotecnia: Comunidad CERRADA = Cerca (frontera geográfica definida) + Restringe (acceso a externos) + Autoridad propia (cabildo, líderes comunitarios que regulan el ingreso).","bibliography":"González S, Crespo S. Salud pública y enfermería comunitaria. Manual Moderno: Universidad Nacional Autónoma de México; 2018. Subcomponente: Bases para el cuidado familiar y comunitario Tema: Comunidad, definiciones, tipos y cultura Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":262,"question":"En la visita domiciliaria, en el llenado de la ficha familiar para actualización del ASIS, el profesional enfermero encuentra que el jefe de hogar es un hombre de 42 años, desempleado desde hace un año, por lo que se refugia en el alcohol desde hace 5 meses. Su esposa de 37 años manifiesta que él la suele agredir y deja a su cargo el cuidado de sus hijos de 8, 5 y 3 años; actualmente los niños están descuidados en su vestido, higiene y alimentación, generando problemas dentro del hogar. ¿Qué determinantes de la salud constituyen factores de riesgo en este caso?","options":["Conductuales y ambientales.","Ambientales y biológicos.","Conductuales y sociales.","Ambientales y sociales."],"answer":"Conductuales y sociales.","justification":"Los determinantes conductuales hacen referencia a los estilos de vida y comportamientos individuales que afectan la salud, como el consumo de alcohol que presenta el jefe de hogar desde hace 5 meses como mecanismo de refugio ante el desempleo. Por su parte, los determinantes sociales incluyen las condiciones económicas (desempleo), la dinámica familiar disfuncional y el entorno de crianza deficiente (descuido en vestido, higiene y alimentación de los niños). El Modelo de Atención Integral de Salud Familiar, Comunitario e Intercultural (MAIS-FCI) reconoce estos determinantes como factores condicionantes del proceso salud-enfermedad de la familia, siendo indispensable su identificación durante la visita domiciliaria y el llenado de la ficha familiar para plantear intervenciones de enfermería dirigidas a mitigar estos riesgos. Opciones incorrectas: • Conductuales y ambientales: Los determinantes ambientales se relacionan con las condiciones físicas del entorno (vivienda, saneamiento, contaminación), aspectos que no se describen como problemáticos en el caso planteado. • Ambientales y biológicos: Los determinantes biológicos corresponden a la herencia genética y características fisiológicas de los individuos, mientras que los ambientales refieren al entorno físico; ninguno de estos dos aspectos es el eje central del caso, que se centra en conductas y dinámica social/familiar. • Ambientales y sociales: Si bien los determinantes sociales sí están presentes (desempleo, violencia, descuido infantil), no existe evidencia de un determinante ambiental en el escenario descrito; el componente conductual (alcoholismo) es el que corresponde asociar a los sociales. Tip/Mnemotecnia: Recuerda los determinantes de la salud con el acrónimo \"BASC\": Biológicos, Ambientales, Sociales y Conductuales. En este caso, identifica primero la conducta de riesgo (alcohol = conductual) y luego el contexto social disfuncional (desempleo, violencia, negligencia = social).","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: Bases para el cuidado familiar y comunitario Tema: Determinantes de la salud de acuerdo con el MAIS FCI Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":263,"question":"Paciente con antecedentes de lupus expresa durante la visita domiciliaria que se siente preocupada porque no puede atender adecuadamente a su familia debido a su estado de salud. Menciona su inquietud por el bienestar de sus hijas adolescentes de un compromiso anterior y un niño de 8 años fruto de su nuevo compromiso. Basado en este hallazgo, ¿qué forma de familia se describe en el caso planteado?","options":["Familia monoparental.","Familia nuclear.","Familia mixta.","Familia alternativa."],"answer":"Familia mixta.","justification":"También denominada familia reconstituida o ensamblada, se caracteriza por la unión de dos personas donde al menos una de ellas aporta hijos de una relación previa, conformando un nuevo núcleo familiar con hijos de distintas uniones conviviendo bajo el mismo techo. En el caso planteado, la paciente convive con sus hijas adolescentes producto de un compromiso anterior y con su hijo de 8 años fruto de su relación actual, lo que configura estructuralmente este tipo de familia según la clasificación utilizada en el Modelo de Atención Integral de Salud Familiar, Comunitario e Intercultural (MAIS-FCI). Opciones incorrectas: • Familia monoparental: Corresponde a la estructura familiar conformada por un solo progenitor (padre o madre) y sus hijos, sin la presencia de una pareja conviviente; no aplica en este caso porque la paciente tiene un compromiso vigente. • Familia nuclear: Se refiere al núcleo básico conformado por ambos padres y sus hijos en común, sin hijos de uniones previas; no corresponde al caso descrito porque existen hijos de dos relaciones distintas. • Familia alternativa: Incluye estructuras como uniones de hecho no tradicionales, familias unipersonales o convivencias sin vínculo consanguíneo ni matrimonial formal; no describe la situación de hijos de distintos compromisos conviviendo con la pareja actual. Tip/Mnemotecnia: \"MIXTA = Mis hijos + Tus hijos + Nuestra unión actual\" — cuando en la valoración familiar aparecen hijos de relaciones anteriores de uno o ambos miembros de la pareja actual, piensa en familia mixta o reconstituida.","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: Bases para el cuidado familiar y comunitario Tema: Definiciones de familia, tipos, etapas del ciclo familiar Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":264,"question":"En una comunidad de difícil acceso se presenta un elevado número de embarazadas. Los profesionales enfermeros del equipo de salud realizan una [texto poco legible] para realizar la valoración. Las madres refieren que reciben asistencia de la partera y no acuden a la unidad de salud por la distancia y falta de transporte. Al realizar la valoración, el profesional de enfermería identifica signos de peligro, falta de control integral y vacunación; además, dialogan con los actores locales, quienes demuestran interés por el problema de salud materna. ¿Qué mecanismo de referencia y contrarreferencia se determina con la participación comunitaria en el caso planteado?","options":["Definiendo puntos de partida y llegada con las redes de vigilancia del flujo desde la comunidad a las unidades de salud y retorno a la localidad.","Promoviendo acciones para mejorar la calidad de vida en coordinación intra e intersectorial y actuando sobre los determinantes de la salud.","Integrando las unidades de salud en los tres niveles para atención continua a los usuarios, con una red organizada y de tecnología apropiada.","Dirigiendo acciones coordinadas con enfoque intercultural, generacional y de género, que persiga la reducción, neutralización o eliminación de los factores."],"answer":"Definiendo puntos de partida y llegada con las redes de vigilancia del flujo desde la comunidad a las unidades de salud y retorno a la localidad.","justification":"El sistema de referencia y contrarreferencia constituye el mecanismo operativo que garantiza la continuidad de la atención dentro de la red de servicios de salud, estableciendo explícitamente los puntos de origen y destino del usuario, así como el retorno organizado a su localidad con las indicaciones correspondientes para el seguimiento por parte del equipo de salud del primer nivel. En comunidades de difícil acceso, la participación comunitaria y el diálogo con actores locales son fundamentales para diseñar redes de vigilancia del flujo de pacientes gestantes Opciones incorrectas: • Promoviendo acciones para mejorar la calidad de vida en coordinación intra e intersectorial y actuando sobre los determinantes de la salud: Esta descripción corresponde a las estrategias de promoción de la salud y atención primaria renovada, que abordan los determinantes sociales de manera amplia. • Integrando las unidades de salud en los tres niveles para atención continua a los usuarios, con una red organizada y de tecnología apropiada: Esta opción describe la organización general del Sistema Nacional de Salud por niveles de complejidad, un componente estructural necesario pero distinto del mecanismo específico de referencia-contrarreferencia • Dirigiendo acciones coordinadas con enfoque intercultural, generacional y de género, que persiga la reducción, neutralización o eliminación de los factores: Esta alternativa corresponde al enfoque de riesgo aplicado en las intervenciones familiares y comunitarias, orientado a la gestión de factores de riesgo","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: Generalidades sobre el cuidado familiar y comunitario Tema: Sistema Nacional de Salud: normativa de referencia, contrareferencia, componentes, principios, prestaciones, organizaciones y guías Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":265,"question":"Paciente femenina de 28 años, sintomática respiratoria por más de un mes, acudió al centro de salud obteniéndose la primera muestra de esputo. La profesional de enfermería le brindó información para la recolección de la segunda muestra y traerla al día siguiente, pero no acudió. ¿Cuál es la actividad que debe realizar el personal de salud en ausencia de la paciente?","options":["Desechar la primera muestra y registrar la ausencia, programar una visita llevando dos envases.","Programar una visita domiciliaria para obtener la muestra faltante dentro de las 48 horas.","Coordinar la ubicación del sintomático respiratorio con la oficina técnica y obtener la segunda muestra.","Agendar una nueva cita para realizar la toma de primera y segunda muestra."],"answer":"Agendar una nueva cita para realizar la toma de primera y segunda muestra.","justification":"Según la Estrategia Nacional de Control de la Tuberculosis (DOTS), cuando un sintomático respiratorio no acude a entregar la segunda muestra de esputo, el personal de salud debe realizar una visita domiciliaria dentro de las 48 horas siguientes a la inasistencia, con el fin de garantizar la captación oportuna de la muestra, evitar la pérdida del caso en seguimiento y asegurar el diagnóstico bacteriológico completo (dos muestras: una espontánea al momento de la consulta y otra matutina). Esta actividad forma parte del componente de búsqueda activa y seguimiento de sintomáticos respiratorios, pilar fundamental de la estrategia DOTS para el control de la tuberculosis, ya que el retraso diagnóstico incrementa el riesgo de transmisión comunitaria y complica el pronóstico del paciente. Opciones incorrectas: • Desechar la primera muestra y registrar la ausencia, programar una visita llevando dos envases: Es incorrecta porque la primera muestra obtenida es válida y debe conservarse y procesarse; desecharla implica pérdida de información diagnóstica y repetición innecesaria de procedimientos. • Coordinar la ubicación del sintomático respiratorio con la oficina técnica y obtener la segunda muestra: No corresponde al procedimiento estandarizado; la responsabilidad directa de la búsqueda y visita domiciliaria recae en el equipo de salud del primer nivel de atención, no en una \"oficina técnica\" como intermediario para la obtención de la muestra. • Agendar una nueva cita para realizar la toma de primera y segunda muestra: Es incorrecta porque la primera muestra ya fue obtenida y es válida; reiniciar el proceso completo retrasa el diagnóstico y contraviene el protocolo establecido de seguimiento inmediato ante inasistencia. Tip/Mnemotecnia: \"Faltó a la cita, en 48 horas visita\" — recuerda que ante la ausencia del sintomático respiratorio para la segunda muestra, la visita domiciliaria debe realizarse dentro de 48 horas para no perder el caso.","bibliography":"González S, Crespo S. Salud pública y enfermería comunitaria. Manual Moderno: Universidad Nacional Autónoma de México; 2018. Subcomponente: La enfermería en el trabajo familiar y comunitario Tema: Estrategia Nacional de Control de la tuberculosis (DOTS): Desarrollo y sistema de información Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":266,"question":"En una comunidad rural se reúnen los profesionales de salud y los actores locales para verificar el cumplimiento de las estrategias y acciones prioritarias de educación y comunicación por el inadecuado uso de químicos en la agricultura y la exposición prolongada a la radiación solar. Según datos estadísticos, se establece que las inflamaciones oculares y queratitis actínica bajaron del 75 % al 55 %; las quemaduras y el bronceado de la piel se incrementaron del 65 % al 75 %, y el envejecimiento prematuro del 45 % persiste. La morbilidad sigue relacionada con la falta de uso de prendas y elementos de fotoprotección. El profesional de enfermería analiza que en los últimos dos años hay un incremento de transferencias por lesiones precancerosas y cáncer de piel en grupos étnicos, referidos al segundo nivel y unidades oncológicas. ¿Con qué orientaciones replantea los procesos educativos en promoción de la salud?","options":["El enfoque de interculturalidad en las acciones educativas.","Preparar métodos expositivos con expertos y dirigidos a los actores sociales.","Lineamientos para desarrollar procesos de educación y comunicación.","Disponer de herramientas de educación y comunicación."],"answer":"El enfoque de interculturalidad en las acciones educativas.","justification":"La persistencia y el incremento de morbilidad en grupos étnicos, a pesar de las estrategias educativas ya implementadas, evidencia que los procesos de educación y comunicación no están respondiendo a las particularidades culturales, cosmovisión, prácticas ancestrales y determinantes sociales de estas poblaciones. El Modelo de Atención Integral de Salud Familiar, Comunitario e Intercultural (MAIS-FCI) exige que la promoción de la salud incorpore el enfoque intercultural como eje transversal, adaptando el lenguaje, los códigos culturales y las prácticas tradicionales de autocuidado de los grupos étnicos para lograr una adherencia efectiva a las medidas de fotoprotección y disminuir la brecha de inequidad en salud. Opciones incorrectas: • Preparar métodos expositivos con expertos y dirigidos a los actores sociales: Los métodos expositivos unidireccionales no garantizan la apropiación cultural del mensaje ni consideran las particularidades étnicas identificadas como factor asociado al incremento de la morbilidad, por lo que no resuelven la brecha detectada. • Lineamientos para desarrollar procesos de educación y comunicación: Estos lineamientos generales ya existen y se están aplicando, pero no han sido suficientes porque no incorporan la variable intercultural, que es la causa de fondo del problema persistente en los grupos étnicos. • Disponer de herramientas de educación y comunicación: Contar con herramientas es un aspecto instrumental y operativo, pero no soluciona el problema de fondo si dichas herramientas no están adaptadas culturalmente a la cosmovisión y prácticas de los grupos étnicos afectados.","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: Bases para el cuidado familiar y comunitario Tema: Promoción de la salud y Atención primaria renovada Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":267,"question":"Como profesional de enfermería del primer nivel de atención, se encuentra realizando una vigilancia epidemiológica por un incremento en la incidencia de enfermedades diarreicas agudas en niños menores de 5 años. Para abordar esta situación, consulta en diversas fuentes de información disponibles en el centro de salud, incluyendo la proyección de mapas epidemiológicos, gráficos de tendencias y tablas de datos. De acuerdo con el Modelo de Atención Integral de Salud, MAIS, ¿cuál es la principal herramienta que se utiliza en este caso?","options":["Sala situacional.","Diagnóstico situacional.","Mapa parlante.","Diagnóstico dinámico."],"answer":"Sala situacional.","justification":"Es la herramienta del Modelo de Atención Integral de Salud que permite la organización, sistematización y análisis visual de la información epidemiológica, demográfica y social de un territorio o comunidad, mediante el uso de mapas, gráficos de tendencias, tablas e indicadores. Su objetivo es facilitar la identificación de problemas de salud prioritarios, el monitoreo continuo de tendencias y la toma de decisiones oportunas por parte del equipo de salud del primer nivel de atención, constituyéndose en un espacio físico o virtual de análisis permanente de salud. Opciones incorrectas: • Diagnóstico situacional: Corresponde al Análisis de Situación Integral de Salud (ASIS), un proceso más amplio y periódico que caracteriza de manera integral los determinantes sociales, demográficos y de salud de una comunidad, pero no constituye en sí mismo la herramienta de proyección continua de mapas, gráficos y tendencias que se describe en el caso. • Mapa parlante: Es una herramienta gráfica participativa elaborada con la comunidad para representar de forma visual y descriptiva los recursos, riesgos y actores del territorio, pero no está orientada al análisis sistemático y dinámico de indicadores epidemiológicos como tasas de incidencia. • Diagnóstico dinámico: No corresponde a una herramienta formalmente reconocida dentro del marco conceptual del MAIS-FCI; el término correcto y validado para el análisis situacional continuo es la sala situacional. Tip/Mnemotecnia: \"Sala situacional = SEMÁFORO de la comunidad\": mapas, gráficos y tablas actualizados constantemente para VIGILAR y decidir a tiempo, como un tablero de control en tiempo real.","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: La enfermería en el trabajo familiar y comunitario Tema: Herramientas del modelo de atención familiar, comunitaria e intercultural: Visita domiciliaria, familiograma, ficha familiar, diagnostico situacional ASIS, mapeo de actores, mapa parlante, sala situacional Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":268,"question":"Un paciente adulto acude a la unidad de salud con un informe de laboratorio que confirma un diagnóstico de tuberculosis pulmonar sensible mediante baciloscopia y cultivo positivos. Durante la valoración de enfermería, el paciente se muestra ansioso por la cronicidad de la enfermedad y presenta picos febriles aislados. De acuerdo con la Guía de Práctica Clínica del MSP y las prioridades de atención en el cuidado de esta patología, ¿cuál es la acción de enfermería prioritaria e inmediata que se debe ejecutar?","options":["Administrar un antipirético parenteral y aplicar medios físicos para reducir la fiebre que presenta el paciente.","Iniciar el tratamiento antituberculoso bajo prescripción médica y educar al paciente sobre la importancia de la adherencia al tratamiento.","Aislar al paciente de forma definitiva en una habitación con presión negativa antes de cualquier otra intervención.","Solicitar una nueva muestra de esputo para repetir las pruebas biológicas antes de la toma de medicamentos."],"answer":"Iniciar el tratamiento antituberculoso bajo prescripción médica y educar al paciente sobre la importancia de la adherencia al tratamiento.","justification":"El diagnóstico de tuberculosis pulmonar sensible ya está confirmado; por ello, la prioridad es iniciar oportunamente el esquema antituberculoso indicado y asegurar educación sobre adherencia, controles y medidas para reducir transmisión. La GPC del MSP enfatiza el tratamiento completo y supervisado/acompañado como base para la curación y para prevenir fracaso, recaída, transmisión y aparición de resistencia. La ansiedad y los picos febriles también deben abordarse Opciones incorrectas: • Administrar un antipirético parenteral y aplicar medios físicos para reducir la fiebre que presenta el paciente: La fiebre puede tratarse si es clínicamente necesario, pero es una medida sintomática y no modifica la infección tuberculosa ni su capacidad de transmisión. • Aislar al paciente de forma definitiva en una habitación con presión negativa antes de cualquier otra intervención: Las precauciones respiratorias son importantes según el nivel de atención y el riesgo de contagio, pero el aislamiento 'definitivo' no sustituye el inicio del tratamiento y no siempre implica hospitalización prolongada en presión negativa. • Solicitar una nueva muestra de esputo para repetir las pruebas biológicas antes de la toma de medicamentos: El diagnóstico ya está confirmado por baciloscopia y cultivo; repetir antes de empezar retrasaría innecesariamente el tratamiento. Las muestras de seguimiento se programan según la normativa.","bibliography":"Ministerio de Salud Pública del Ecuador. Tratamiento de la infección por tuberculosis, tuberculosis sensible y resistente. Guía de Práctica Clínica. Quito: MSP; 2024. https://www.salud.gob.ec/wp- content/uploads/2024/06/GPC-Tratamiento-de-la-infeccion-por-tuberculosis-tuberculosis-sensible- y-resistente-2024.pdf Subcomponente: La enfermería en el trabajo familiar y comunitario Tema: Estrategia Nacional de Control de la tuberculosis (DOTS): Desarrollo y sistema de información Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":269,"question":"Una enfermera comunitaria realiza el seguimiento de un grupo de familias con pacientes que padecen enfermedades crónicas complejas y discapacidades físicas severas. Para garantizar la continuidad de la atención, la profesional realiza valoraciones integrales exhaustivas, establece planes de cuidados personalizados y asume la responsabilidad de coordinar múltiples recursos y servicios dentro del sistema de salud (como citas con especialistas, entrega de medicamentos y soporte social) necesarios para el bienestar continuo de cada usuario. Con base en la literatura de Fundamentos de enfermería de Potter y Perry, ¿qué rol o competencia de la enfermería basada en la comunidad está ejerciendo principalmente en esta situación?","options":["Defensora del paciente.","Educadora de la salud.","Gestora de casos.","Investigadora clínica."],"answer":"Gestora de casos.","justification":"La gestión de casos se caracteriza por valorar de manera integral a personas con necesidades complejas, construir un plan individualizado y coordinar múltiples servicios sanitarios y sociales para garantizar continuidad, evitar duplicidades y facilitar el acceso. La enfermera del caso descrito articula especialistas, medicación, apoyo social y seguimiento familiar, por lo que ejerce principalmente el rol de gestora de casos. Esta función es especialmente útil en enfermedad crónica, discapacidad y transiciones entre niveles de atención. Opciones incorrectas: • Defensora del paciente: La defensa se centra en proteger derechos, preferencias y acceso del usuario; puede formar parte de la gestión de casos, pero no describe por sí sola la coordinación longitudinal de múltiples recursos. • Educadora de la salud: Implica enseñar y fortalecer autocuidado y toma de decisiones; es importante, pero el elemento dominante del caso es la coordinación integral de servicios. • Investigadora clínica: Se orienta a producir o aplicar evidencia mediante investigación sistemática; el caso no describe recolección de datos para un estudio ni generación de conocimiento. Tip/Mnemotecnia: Coordina “personas + servicios + recursos + continuidad” = gestora de casos.","bibliography":"Potter PA, Perry AG, Stockert PA, Hall AM. Fundamentals of Nursing. 11th ed. Elsevier/Mosby; 2023. https://shop.elsevier.com/books/fundamentals-of-nursing/potter/978-0-323-81034-0 Giardino    AP,     De    Jesus    O.    Case    Management.      StatPearls.    Updated     2023. https://www.ncbi.nlm.nih.gov/sites/books/NBK562214/ Subcomponente: Generalidades sobre el cuidado familiar y comunitario Tema: Definiciones, roles, funciones, actividades, limitaciones y retos de la enfermera comunitaria Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":270,"question":"Profesional de enfermería del Centro de Salud es responsable del área de inmunizaciones, ha discutido con una colega y se ha generado un conflicto. Ella trata de solucionarlo y recurre a la Coordinadora de Enfermería del Centro para que facilite la comunicación y se encuentre una solución satisfactoria al conflicto. ¿Cómo se denomina este método?","options":["Conciliación.","Mediación.","Arbitraje","Negociación."],"answer":"Mediación.","justification":"Es el método de resolución de conflictos en el cual un tercero neutral (en este caso, la Coordinadora de Enfermería) facilita la comunicación entre las partes en desacuerdo, sin tener poder de decisión ni imponer una solución, con el objetivo de que sean las propias partes quienes, orientadas por dicho facilitador, lleguen a un acuerdo satisfactorio y consensuado. Es una herramienta clave en la gestión del talento humano y la gobernanza en enfermería para el manejo de conflictos interpersonales en el equipo de salud. Opciones incorrectas: • Conciliación: Aunque también implica la intervención de un tercero, el conciliador tiene un rol más activo, pudiendo proponer soluciones o alternativas concretas a las partes, a diferencia del mediador que solo facilita el diálogo sin sugerir la solución. • Arbitraje: En este método, el tercero (árbitro) tiene la facultad de tomar una decisión vinculante y obligatoria para ambas partes, lo cual difiere del rol facilitador y no resolutivo que ejerce la Coordinadora en el caso descrito. • Negociación: Es un proceso directo entre las partes en conflicto, sin la intervención de un tercero facilitador, por lo que no aplica en este escenario donde se solicita explícitamente la intervención de la Coordinadora. Tip/Mnemotecnia: \"MEDIAdor MEDIA, no decide\": recuerda que en la mediación el tercero solo facilita la comunicación, mientras que en el arbitraje el tercero SÍ decide (piensa en el árbitro de un partido, que tiene autoridad para fallar).","bibliography":"Balderas M. Administración de los Servicios de Enfermería. 6ª ed. Mc. Graw. Hill. Interamericana Editores, S.A; 2015. Subcomponente: Bases administrativas del cuidado Tema: Gobernanza en enfermería: dirección, liderazgo, comunicación, toma de decisiones, negociación, manejo de conflictos y resolución de problemas Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":271,"question":"Un profesional de enfermería aplica los fundamentos de educación y comunicación para la promoción de la salud en su área de influencia. Al momento pretende desarrollar prácticas y actitudes que tengan incidencia sobre los determinantes de la salud a nivel comunitario. En el interrogatorio a un grupo focal encuentra prácticas potencialmente dañinas como la colocación de tela de araña en el ombligo de los recién nacidos. ¿Cómo se evidenciaría el enfoque sociocrítico en la promoción de la salud en este caso?","options":["Características psicoevolutivas en educación para la salud entendida como un objetivo de vida.","Promoción de la salud desconociendo prácticas de su entorno social.","Transferencia de conocimientos como visión principal para la promoción de la salud.","Promoción de la salud en contextos socioculturales, acción-reflexión-acción."],"answer":"Promoción de la salud en contextos socioculturales, acción-reflexión-acción.","justification":"El enfoque sociocrítico en educación para la salud parte del reconocimiento de que las prácticas de salud-enfermedad están inmersas en un contexto sociocultural específico, por lo que la intervención del profesional de enfermería no debe limitarse a transmitir información biomédica de manera vertical, sino a generar un proceso dialéctico de acción-reflexión-acción (praxis) con la comunidad. Esto implica identificar las prácticas culturales (como colocar tela de araña en el ombligo del recién nacido), problematizarlas junto con la comunidad, reflexionar sobre sus riesgos (tétanos neonatal, onfalitis) y co-construir alternativas seguras que respeten la cosmovisión local, empoderando a la comunidad como sujeto activo y no receptor pasivo de la educación en salud. Opciones incorrectas: • Características psicoevolutivas en educación para la salud entendida como un objetivo de vida: Corresponde a un enfoque biologicista o evolutivo centrado en las etapas del desarrollo individual, no en la dimensión sociocultural ni en la relación dialéctica entre el profesional y la comunidad. • Promoción de la salud desconociendo prácticas de su entorno social: Es contrario al enfoque sociocrítico, ya que este exige precisamente el reconocimiento y análisis crítico de las prácticas socioculturales existentes, no su desconocimiento u omisión. • Transferencia de conocimientos como visión principal para la promoción de la salud: Refleja el modelo tradicional o biomédico-informativo (educación bancaria), en el cual el profesional transmite conocimiento de forma unidireccional, lo que se opone al carácter participativo y reflexivo del enfoque sociocrítico. Tip/Mnemotecnia: \"Sociocrítico = SOCIO (contexto cultural) + CRÍTICO (reflexión-acción)\". Recuerda: no se impone el conocimiento, se construye con la comunidad mediante diálogo, análisis crítico y transformación conjunta de las prácticas de riesgo.","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: Educación para la salud Tema: Bases conceptuales de la educación para la salud Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":272,"question":"En un estudio de investigación en enfermería sobre la percepción de calidad de vida en pacientes con enfermedades crónicas, ¿cuál de las siguientes opciones describe correctamente el alcance exploratorio de la investigación?","options":["Comparar la calidad de vida de los pacientes con enfermedades crónicas antes y después de recibir un tratamiento específico.","Establecer la relación entre la calidad de vida y el cumplimiento del tratamiento en pacientes con enfermedades crónicas.","Evaluar la efectividad de un programa de intervención en la calidad de vida de los pacientes con enfermedades crónicas.","Identificar los factores que influyen en la calidad de vida de los pacientes con enfermedades crónicas."],"answer":"Identificar los factores que influyen en la calidad de vida de los pacientes con enfermedades crónicas.","justification":"Los estudios de alcance exploratorio se plantean cuando el objetivo es examinar un tema o problema de investigación poco estudiado o del cual existen dudas, con el fin de identificar conceptos, variables o factores relevantes que sienten las bases para investigaciones posteriores más estructuradas. En este caso, \"identificar factores\" corresponde exactamente a esta lógica: no se busca medir relaciones causales ni comparar grupos, sino explorar y reconocer qué elementos intervienen en el fenómeno de la calidad de vida, generando conocimiento preliminar que orientará el diseño de estudios descriptivos, correlacionales o explicativos posteriores. Opciones incorrectas: • Comparar la calidad de vida de los pacientes con enfermedades crónicas antes y después de recibir un tratamiento específico: Corresponde a un diseño de alcance explicativo o cuasiexperimental, ya que busca establecer el efecto de una intervención (tratamiento) sobre una variable dependiente en dos momentos temporales, lo cual excede el propósito exploratorio. • Establecer la relación entre la calidad de vida y el cumplimiento del tratamiento en pacientes con enfermedades crónicas: Este planteamiento corresponde a un alcance correlacional, pues busca medir el grado de asociación estadística entre dos variables ya identificadas previamente, y no la exploración inicial del fenómeno. • Evaluar la efectividad de un programa de intervención en la calidad de vida de los pacientes con enfermedades crónicas: Se trata de un alcance explicativo/experimental, orientado a determinar relaciones causa-efecto mediante la manipulación de una variable independiente","bibliography":"Grove S, Gray S, Burns N. Investigación en enfermería: desarrollo de la práctica enfermera basada en la evidencia. Elsevier; 2016. Subcomponente: Bases de investigación científica: metodología de investigación Tema: Diseño metodológico de la investigación: tipos de investigación, población y muestra, técnicas e instrumentos de recolección de datos, análisis e interpretación de resultados, discusión, recomendaciones y referencia bibliográfica (APA y VANCOUVER) Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":273,"question":"Como profesional de enfermería, está realizando un estudio para conocer el comportamiento del consumo de alcohol en un grupo de adolescentes; la información será recolectada en un momento específico. Al ser un problema nuevo y poco conocido en la comunidad, con los resultados de este estudio se ejecutarán programas de promoción y prevención de salud. ¿Qué tipo de diseño es pertinente para este estudio?","options":["Diseño transversal descriptivo.","Diseño transversal exploratorio.","Diseño longitudinal de tendencia.","Diseño transversal correlacional-causal."],"answer":"Diseño transversal exploratorio.","justification":"Este diseño es pertinente porque combina dos características esenciales del estudio planteado: por un lado, es transversal, ya que la información se recolecta en un único momento del tiempo, sin seguimiento posterior de los sujetos; por otro lado, es exploratorio, porque el consumo de alcohol en el grupo de adolescentes constituye un problema nuevo y poco conocido en la comunidad. Los estudios exploratorios se emplean precisamente cuando existe escaso conocimiento previo sobre el fenómeno de estudio, con el objetivo de identificar patrones, generar hipótesis y aportar una base de evidencia inicial que permita, posteriormente, diseñar e implementar programas de promoción y prevención de salud ajustados a la realidad encontrada. Opciones incorrectas: • Diseño transversal descriptivo: Se utiliza cuando el fenómeno ya es conocido y se busca únicamente caracterizar la frecuencia o distribución de una variable en la población, sin la finalidad de explorar un problema novedoso o poco estudiado, como sí sucede en este caso. • Diseño longitudinal de tendencia: Implica la recolección de datos en diferentes momentos del tiempo para observar cambios o evolución del fenómeno, lo cual contradice el enunciado, que especifica que la información se recopilará en un único momento específico. • Diseño transversal correlacional-causal: Este diseño busca establecer relaciones o asociaciones entre dos o más variables, lo cual no corresponde al objetivo planteado, que es explorar y describir el comportamiento de un problema nuevo, sin buscar relaciones causales entre variables. Tip/Mnemotecnia: Ante un problema \"NUEVO y POCO CONOCIDO\" en la comunidad, piensa en \"EXPLORAR\" antes de \"DESCRIBIR\" o \"CORRELACIONAR\"; y si los datos se toman en un \"solo momento\", es TRANSVERSAL, no longitudinal.","bibliography":"Grove S, Gray S, Burns N. Investigación en enfermería: desarrollo de la práctica enfermera basada en la evidencia. Elsevier; 2016. Subcomponente: Bases de investigación científica: metodología de investigación Tema: Diseño metodológico de la investigación: tipos de investigación, población y muestra, técnicas e instrumentos de recolección de datos, análisis e interpretación de resultados, discusión, recomendaciones y referencia bibliográfica (APA y VANCOUVER) Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":274,"question":"En una investigación sobre factores asociados a la hipertensión en adultos, un equipo de salud comunitaria recolecta datos de 100 pacientes sobre dos variables cuantitativas: edad, en años, y presión arterial sistólica, en mmHg. Los investigadores desean determinar si existe una relación lineal significativa entre la edad y los niveles de presión arterial sistólica en la muestra. Ambas variables se distribuyen de manera normal. ¿Qué prueba estadística paramétrica es la más adecuada utilizar para este estudio?","options":["Análisis de varianza unidireccional.","Coeficiente de correlación de Pearson.","Chi-cuadrado.","Prueba t."],"answer":"Coeficiente de correlación de Pearson.","justification":"Es la prueba estadística paramétrica adecuada para determinar la existencia y fuerza de una relación lineal entre dos variables cuantitativas continuas (edad y presión arterial sistólica), siempre que ambas variables cumplan el supuesto de distribución normal, como se indica en el enunciado. El coeficiente de Pearson (r) varía entre -1 y 1, indicando la dirección (positiva o negativa) y la magnitud de la asociación lineal entre las variables, siendo el método de elección cuando se busca cuantificar la covariación entre dos variables numéricas sin establecer relación de causalidad. Opciones incorrectas: • Análisis de varianza unidireccional (ANOVA): Se utiliza para comparar las medias de una variable cuantitativa entre tres o más grupos definidos por una variable categórica (factor), no para establecer relaciones lineales entre dos variables cuantitativas continuas. • Chi-cuadrado: Es una prueba no paramétrica utilizada para evaluar la asociación entre dos variables categóricas (nominales u ordinales), organizadas en tablas de contingencia, por lo que no es aplicable a variables cuantitativas continuas como edad y presión arterial. • Prueba t: Se emplea para comparar las medias de una variable cuantitativa entre dos grupos (independientes o relacionados), no para analizar la asociación lineal entre dos variables cuantitativas continuas. Tip/Mnemotecnia: \"Dos variables numéricas, ¿van juntas en línea? Pearson las examina sin dilema\". Recuerda: Pearson = correlación lineal entre 2 variables cuantitativas normales; Chi-cuadrado = asociación entre categóricas; ANOVA = comparar 3+ medias; t de Student = comparar 2 medias.","bibliography":"Hernández I, Lumbreras B. Manual de epidemiología y salud pública. 3ª ed. Editorial Médica Panamericana; 2018. Subcomponente: Bases epidemiológicas del cuidado: vigilancia epidemiológica Tema: Bioestadística descriptiva Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":275,"question":"El hospital está experimentando una escasez recurrente de materiales críticos en el quirófano, lo que ha provocado retrasos en las cirugías programadas y ha afectado la calidad de la atención. El líder de enfermería del servicio se ha reunido con el equipo directivo para discutir un plan de mejora en la gestión de estos recursos esenciales. ¿Cuál es la estrategia más adecuada para evitar este problema en el hospital?","options":["Dejar que cada departamento gestione sus propios inventarios de forma independiente.","Mantener grandes reservas de materiales para evitar faltantes.","Comprar materiales en grandes cantidades una vez al año.","Implementar un sistema de gestión de inventarios a tiempo."],"answer":"Implementar un sistema de gestión de inventarios a tiempo.","justification":"Este modelo, conocido como \"justo a tiempo\" (Just in Time), permite mantener un flujo constante y controlado de materiales críticos mediante la coordinación entre consumo real, reposición programada y proveedores confiables, evitando tanto el desabastecimiento como el exceso de stock. En la gestión de recursos materiales en enfermería, esta estrategia optimiza costos, reduce el riesgo de caducidad o deterioro de insumos estériles y garantiza la disponibilidad oportuna de materiales esenciales para procedimientos quirúrgicos, lo cual repercute directamente en la seguridad del paciente y en la continuidad de la atención. Opciones incorrectas: • Dejar que cada departamento gestione sus propios inventarios de forma independiente: Esta descentralización sin coordinación genera duplicidad de esfuerzos, pérdida de la visión global de necesidades institucionales y mayor riesgo de desabastecimiento o sobrestock, al no existir un control
