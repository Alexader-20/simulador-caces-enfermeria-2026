aloración inicial, el personal de enfermería registra: apertura ocular al dolor, emisión de palabras inapropiadas y flexión de las extremidades. De acuerdo con la Escala de Coma de Glasgow, ¿Cuál es la puntuación total que alcanza el paciente?", "options": ["Glasgow 9/15.", "Glasgow 10/15.", "Glasgow 8/15.", "Glasgow 12/15."], "answer": "Glasgow 8/15.", "justification": "Glasgow: apertura ocular al dolor = 2, respuesta verbal con palabras inapropiadas = 3 y respuesta motora en flexión = 3; total 8/15.", "bibliography": "Potter, P., Perry, A., Stockert, P., & Hall, A. (2019). Fundamentos de enfermería. 9.ª ed. Elsevier."}, {"id": 130, "question": "Una gestante de 34 años acude por su cuarto control prenatal. A la valoración de enfermería se determinan 28 semanas de gestación y riesgo de parto prematuro que conlleva a que el recién nacido presente enfermedad de membrana hialina. ¿Qué acción profiláctica se debe aplicar?", "options": ["Iniciar aplicación de labetalol.", "Aplicación de fludrocortisona.", "Administración de betametasona.", "Administrar gluconato de calcio."], "answer": "Administración de betametasona.", "justification": "Los corticoides antenatales como betametasona aceleran la maduración pulmonar fetal y disminuyen el riesgo de síndrome de dificultad respiratoria del prematuro.", "bibliography": "Cunningham, G., Leveno, K., Dashe, J., Hoffman, B., Spong, C. & Casey, B. (2022). Williams Obstetrics. 26.ª ed. McGraw-Hill."}, {"id": 131, "question": "Mujer primigesta de 46 años, gestante de 20 semanas que acude a centro de salud refiere, malestar general acompañado de cefalea, cambios de la visión, náusea que llega al vómito, edema de manos y miembros inferiores, oliguria, es valorada por profesional de enfermería quien realiza valoración de Score MAMÁ y una entrevista minuciosa. ¿Cuál es un factor de riesgo alto para preeclampsia?", "options": ["Infección de vías urinarias.", "Enfermedad renal crónica.", "Enfermedad periodontal.", "Primer embarazo."], "answer": "Enfermedad renal crónica.", "justification": "La enfermedad renal crónica es un factor de alto riesgo para preeclampsia por la asociación entre enfermedad renal y alteraciones vasculares/endoteliales.", "bibliography": "Cunningham, G., Leveno, K., Dashe, J., Hoffman, B., Spong, C. & Casey, B. (2022). Williams Obstetrics. 26.ª ed. McGraw-Hill."}, {"id": 132, "question": "En una comunidad se evidencia una crisis sanitaria que afecta la salud de la niñez. La profesional de enfermería identifica hábitos inadecuados en el cuidado diario de los niños. ¿Cuál es el determinante de la salud que se describe en el caso?", "options": ["Ambiental.", "Conductual.", "Social.", "Biológico."], "answer": "Conductual.", "justification": "Los hábitos de cuidado diario son determinantes conductuales porque se relacionan con las prácticas y decisiones que las personas realizan de manera habitual.", "bibliography": "González, S. Crespo, S. (2018). Salud pública y enfermería comunitaria. Manual Moderno."}, {"id": 133, "question": "Recién nacido de 15 días de vida es llevado por su madre al Centro de Salud, refiere que el parto fue en casa en el sector rural y desea que le apliquen las vacunas que le corresponde. En la valoración el recién nacido se encuentra en condiciones normales. ¿Cuál es el esquema de vacunación que corresponde en este caso?", "options": ["Administrar la vacuna Hepatitis B cero.", "Administrar las vacunas BCG y Hepatitis B cero.", "Indicar a la madre que debe iniciar el esquema a los 2 meses de edad.", "Administrar la vacuna BCG y continuar el esquema en 2 meses."], "answer": "Administrar las vacunas BCG y Hepatitis B cero.", "justification": "En un recién nacido de 15 días que no recibió las vacunas de nacimiento, corresponde recuperar BCG y hepatitis B según el esquema de inmunización indicado.", "bibliography": "Ministerio de Salud Pública del Ecuador. (2021). Estrategia Nacional de Inmunizaciones, ENI."}, {"id": 134, "question": "Un paciente de 72 años, hospitalizado en el servicio de clínica por diagnóstico médico de neumonía, es atendido por la enfermera de turno. El paciente refiere cefalea de moderada intensidad. Al informarle al médico prescribe administrar analgésicos, la enfermera procede inmediatamente y además proporciona las medidas de relajación que minimizan su molestia. Aplicando el pensamiento crítico, ¿A qué etapa del proceso de enfermería corresponde este caso?", "options": ["Evaluar.", "Implementar.", "Diagnosticar.", "Planificar."], "answer": "Implementar.", "justification": "Administrar el analgésico y aplicar las medidas de relajación corresponde a ejecutar las intervenciones planificadas: es la etapa de implementación del PAE.", "bibliography": "Potter, P., Perry, A., Stockert, P., & Hall, A. (2019). Fundamentos de enfermería. 9.ª ed. Elsevier."}, {"id": 135, "question": "Como profesional de enfermería del primer nivel de atención, se encuentra realizando una vigilancia epidemiológica por un incremento en la incidencia de enfermedades diarreicas agudas en niños menores de 5 años. Para abordar esta situación, consulta en diversas fuentes de información disponibles en el centro de salud, incluyendo la proyección de mapas epidemiológicos, gráficos de tendencias y tablas de datos. De acuerdo con el Modelo de Atención Integral de Salud (MAIS), ¿Cuál es la principal herramienta que se utiliza en este caso?", "options": ["Sala situacional.", "Diagnóstico situacional.", "Mapa parlante.", "Diagnóstico dinámico."], "answer": "Sala situacional.", "justification": "La sala situacional integra y presenta información de salud mediante mapas, gráficos y tablas para facilitar el análisis y la toma de decisiones.", "bibliography": "Ministerio de Salud Pública del Ecuador. (2018). Manual de Modelo de Atención Integral de Salud – MAIS."}, {"id": 136, "question": "Paciente masculino de 37 años, con tipo de sangre B negativo sufre accidente de tránsito y requiere transfusión sanguínea urgente, pero en el banco de sangre no se dispone de hemoderivados de su mismo grupo sanguíneo. ¿Cuál es el grupo sanguíneo que puede ser compatible con el tipo de sangre del paciente?", "options": ["AB negativo.", "O positivo.", "O negativo.", "B positivo."], "answer": "O negativo.", "justification": "Una persona B Rh negativa puede recibir concentrados de glóbulos rojos O Rh negativo cuando no se dispone de B negativo, siempre bajo los protocolos transfusionales correspondientes.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 137, "question": "Paciente femenina asintomática de 23 años acude al centro de salud después de 3 meses de mantener relaciones sexuales sin protección, por lo cual se le realiza un test de Micro Elisa, en donde se evidencia la presencia de anticuerpos contra el virus de inmunodeficiencia humana VIH. ¿Cómo se interpreta el resultado del examen?", "options": ["La paciente ha desarrollado inmunidad contra el virus de inmunodeficiencia humana.", "La paciente ha desarrollado resistencia adquirida.", "La paciente está inmunocomprometida por la presencia del SIDA.", "La paciente ha sido infectada por el virus de inmunodeficiencia humana."], "answer": "La paciente ha sido infectada por el virus de inmunodeficiencia humana.", "justification": "La detección de anticuerpos contra VIH en una prueba reactiva indica infección que debe seguir el algoritmo diagnóstico; no significa inmunidad protectora.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 138, "question": "Paciente adulto mayor con antecedente de hipertensión arterial acude al centro de salud en busca de consejería, por lo que solicita información sobre una dieta adecuada. ¿Qué tipo de alimentos adicionaría a la dieta de este paciente?", "options": ["Sandía o melón.", "Miel.", "Carne roja.", "Frutos secos."], "answer": "Frutos secos.", "justification": "Los frutos secos pueden formar parte de una alimentación saludable para hipertensión, especialmente dentro de un patrón equilibrado y bajo en sodio.", "bibliography": "Ministerio de Salud Pública del Ecuador. (2021). Estrategia Nacional de Inmunizaciones, ENI."}, {"id": 139, "question": "En la unidad de cuidados intensivos el personal de enfermería realiza de forma rutinaria la desinfección con glutaraldehído al 2% de todos los equipos utilizados en la intubación del paciente como las láminas del laringoscopio, este procedimiento es realizado durante 20 minutos. De acuerdo con el caso, ¿Qué nivel de desinfección se está aplicando?", "options": ["Desinfección de nivel intermedio.", "Desinfección de alto nivel.", "Desinfección de nivel mínimo.", "Desinfección de bajo nivel."], "answer": "Desinfección de alto nivel.", "justification": "El glutaraldehído al 2% se utiliza para desinfección de alto nivel de determinados artículos semicríticos cuando se cumplen concentración, tiempo y condiciones del procedimiento.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 140, "question": "Paciente con antecedentes de cáncer de mama estadio IV, ingresa al servicio por terapia de dolor, el médico prescribe la administración de un medicamento que actúe como un potente agonista de los receptores opiáceos mu. ¿Cuál es el medicamento que se administra con base al mecanismo de acción descrito?", "options": ["Metamizol.", "Morfina.", "Ketorolaco.", "Paracetamol."], "answer": "Morfina.", "justification": "La morfina es un potente agonista de los receptores opioides, especialmente μ, y se utiliza para el tratamiento del dolor intenso, incluido el dolor oncológico.", "bibliography": "Kliegman, R., Geme, J., Blum, N., Shah, S., Tasker, R. & Wilson, K. (2020). Tratado de pediatría de Nelson. 21.ª ed. Elsevier."}, {"id": 141, "question": "El cáncer de cuello uterino se clasifica en diferentes estadios clínicos para su manejo, por tanto, una mujer que presenta un tumor que se ha extendido a la pared de la pelvis, al examen rectal no hay espacio libre de cáncer entre el tumor y la pared de la pelvis. ¿A qué estadio clínico corresponde?", "options": ["Estadio III B.", "Estadio III A.", "Estadio IV B.", "Estadio IV A."], "answer": "Estadio III B.", "justification": "La extensión del cáncer de cuello uterino hasta la pared pélvica corresponde al estadio IIIB.", "bibliography": "Cunningham, G., Leveno, K., Dashe, J., Hoffman, B., Spong, C. & Casey, B. (2022). Williams Obstetrics. 26.ª ed. McGraw-Hill."}, {"id": 142, "question": "Un paciente de 60 años ha sido ingresado en el hospital tras sufrir un esguince de tobillo severo mientras jugaba al fútbol. A pesar de recibir analgésicos, sigue experimentando dolor intenso e inflamación en el tobillo. El profesional de enfermería decide implementar terapias no farmacológicas para ayudar a manejar su dolor. ¿Qué medida prioritaria utiliza en este caso?", "options": ["Utilizar técnicas clínicas de meditación.", "Aplicar compresas frías en la zona afectada.", "Realizar ejercicios de respiración profunda y relajación.", "Aplicar masajes suaves en la zona afectada."], "answer": "Aplicar compresas frías en la zona afectada.", "justification": "En un esguince agudo, las compresas frías ayudan a disminuir dolor e inflamación durante la fase inicial de la lesión.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 143, "question": "Paciente de 60 años con antecedentes de cáncer de próstata, para su tratamiento el médico indica intervención quirúrgica. Durante la visita médica el equipo de salud explica sobre el procedimiento al paciente, pero el paciente no desea iniciarlo. ¿Qué pilar de la bioética está implicado en este caso?", "options": ["Autonomía.", "No maleficencia.", "Justicia.", "Beneficencia."], "answer": "Autonomía.", "justification": "La autonomía reconoce el derecho de una persona competente a aceptar o rechazar una intervención sanitaria después de recibir información adecuada.", "bibliography": "Consejo Internacional de Enfermeras. (2016). Código Deontológico del CIE para la Profesión de Enfermería."}, {"id": 144, "question": "En una comunidad rural se reúnen los profesionales de salud y los actores locales para verificar el cumplimiento de las estrategias y acciones prioritarias de educación y comunicación por el inadecuado uso de químicos en la agricultura y la exposición prolongada a la radiación solar. Según datos estadísticos se establece que las inflamaciones oculares y queratitis actínica bajaron del 75% al 55%, las quemaduras y bronceado de la piel se incrementó del 65% al 75% y el envejecimiento prematuro del 45% persiste. La morbilidad sigue relacionada con la falta de uso de prendas y elementos de fotoprotección. El profesional de enfermería analiza que en los últimos dos años hay un incremento de transferencias por lesiones precancerosas y cáncer de piel en grupos étnicos, referidos al segundo nivel y unidades oncológicas. ¿Con que orientaciones replantea los procesos educativos en promoción de la salud?", "options": ["Preparar métodos expositivos con expertos y dirigidos a los actores sociales.", "Lineamientos para desarrollar procesos de educación y comunicación.", "El enfoque de interculturalidad en las acciones educativas.", "Disponer de herramientas de educación y comunicación."], "answer": "El enfoque de interculturalidad en las acciones educativas.", "justification": "El enfoque de interculturalidad exige adaptar los procesos educativos a la diversidad cultural y considerar conocimientos, prácticas y contextos de los grupos participantes.", "bibliography": "Ministerio de Salud Pública del Ecuador. (2018). Manual de Modelo de Atención Integral de Salud – MAIS."}, {"id": 145, "question": "Mujer de 52 años, acude al centro de salud porque refiere sofocos frecuentes, insomnio y cambios de humor, comenta que su última menstruación fue hace más de un año, no tiene antecedentes patológicos relevantes y no está tomando ningún tratamiento hormonal. Expresa su preocupación por su salud ósea ya que su madre tuvo fractura de cadera por osteoporosis. De acuerdo con el caso, ¿Cuál es la intervención de enfermería más adecuada?", "options": ["Indicar que los síntomas son normales y que no requiere atención específica.", "Sugerir el uso de suplementos herbales sin necesidad de consulta médica.", "Educar sobre cambios fisiológicos y promover hábitos saludables, dieta rica en calcio y Vitamina D.", "Recomendar el inicio inmediato de terapia hormonal sustitutiva para aliviar los síntomas."], "answer": "Educar sobre cambios fisiológicos y promover hábitos saludables, dieta rica en calcio y Vitamina D.", "justification": "En menopausia se recomienda promover actividad física y una alimentación adecuada con calcio y vitamina D para proteger la salud ósea, además de educación sobre los cambios fisiológicos.", "bibliography": "Cunningham, G., Leveno, K., Dashe, J., Hoffman, B., Spong, C. & Casey, B. (2022). Williams Obstetrics. 26.ª ed. McGraw-Hill."}, {"id": 146, "question": "Recién nacido de 3 días de vida, con antecedentes de asfixia perinatal, presenta un paro cardiorrespiratorio en la unidad neonatal. El equipo inicia maniobras de reanimación. Tras 30 segundos de ventilación efectiva y compresiones torácicas, la frecuencia cardíaca sigue por debajo de 60 latidos por minuto. De acuerdo con la situación clínica descrita y las guías de reanimación, ¿Cuál es el medicamento que debe preparar para su administración inmediata?", "options": ["Dopamina.", "Adrenalina.", "Dexametasona.", "Aminofilina."], "answer": "Adrenalina.", "justification": "Cuando la frecuencia cardíaca neonatal permanece por debajo de 60 lpm pese a ventilación efectiva y compresiones adecuadas, se prepara adrenalina según el algoritmo de reanimación neonatal.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 147, "question": "Paciente residente en una comunidad rural, con antecedentes de hipertensión arterial y diabetes tipo 2. Durante la visita domiciliaria, se observa que enfrenta varias dificultades que provocan tristeza, depresión y falta de adherencia al tratamiento. Como personal de enfermería, usted identifica estas necesidades, establece un plan de cuidado integral basado en la valoración de la situación de la paciente, y coordina los recursos y servicios necesarios para la atención. ¿Cuál es la principal competencia de la enfermería basada en la comunidad que usted desempeña en este caso?", "options": ["Defensora del paciente.", "Gestora de casos.", "Colaboradora.", "Epidemióloga."], "answer": "Gestora de casos.", "justification": "La gestión de casos implica valorar necesidades, elaborar un plan y coordinar recursos y servicios para asegurar continuidad e integralidad del cuidado.", "bibliography": "González, S. Crespo, S. (2018). Salud pública y enfermería comunitaria. Manual Moderno."}, {"id": 148, "question": "Paciente con antecedentes de lupus, expresa durante la visita domiciliaria que se siente preocupada porque no puede atender adecuadamente a su familia debido a su estado de salud, menciona su inquietud por el bienestar de sus hijas adolescentes de un compromiso anterior y un niño de 8 años fruto de su nuevo compromiso. Basado en este hallazgo, ¿Qué forma de familia se describe en el caso planteado?", "options": ["Familia monoparental.", "Familia nuclear.", "Familia mixta.", "Familia alternativa."], "answer": "Familia mixta.", "justification": "La convivencia de hijos de una relación previa con un hijo de la relación actual corresponde a una familia mixta o reconstituida.", "bibliography": "González, S. Crespo, S. (2018). Salud pública y enfermería comunitaria. Manual Moderno."}, {"id": 149, "question": "Paciente masculino de 65 años acude al hospital para un control médico, en la valoración clínica registra un valor de presión arterial de 139/89 mmHg en la primera toma, al interrogatorio, el paciente informa que tiene antecedentes familiares de hipertensión arterial. ¿Cuál es la principal recomendación que usted brinda a este paciente?", "options": ["Educar sobre el uso de terapia de medicamentos antihipertensivos.", "Realizar prueba de esfuerzo para ver su capacidad cardiovascular.", "Control de exámenes de laboratorio para descartar alguna complicación.", "Educar sobre una dieta baja en sodio y un programa de ejercicio regular."], "answer": "Educar sobre una dieta baja en sodio y un programa de ejercicio regular.", "justification": "Ante una presión de 139/89 mmHg y antecedentes familiares de hipertensión, las medidas iniciales incluyen reducir sodio y mantener actividad física regular.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 150, "question": "Paciente masculino de 4 años ingresa a emergencia por dificultad para respirar, madre refiere que el niño se encuentra agitado y con mucha tos seca, al examen físico se evidencia taquipnea, taquicardia y SO2 de 85 %, la PaO2 es de 40 mmHg. ¿Qué intervención es la más adecuada en ese momento?", "options": ["Aspiración de secreciones.", "Administración de oxígeno.", "Fisioterapia torácica.", "Lavado nasal."], "answer": "Administración de oxígeno.", "justification": "Una saturación de 85% y PaO₂ de 40 mmHg evidencian hipoxemia; la intervención inmediata entre las opciones es administrar oxígeno.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 151, "question": "Paciente de 15 años acude a la consulta externa. A la valoración por parte del profesional de enfermería la paciente refiere que piensa que está embarazada y se encuentra preocupada de que ahora pueda tener una infección de transmisión sexual (ITS). La prueba de embarazo es negativa. ¿Cuál es la prioridad de atención por parte del profesional de enfermería?", "options": ["Contactar a sus padres y notificar la necesidad de anticonceptivos.", "Asesoría sobre prácticas de sexo seguro.", "Derivar a la paciente al profesional de especialidad.", "Solicitar una prueba de ITS a la pareja de la paciente."], "answer": "Asesoría sobre prácticas de sexo seguro.", "justification": "En una adolescente sexualmente activa, la prioridad es brindar consejería confidencial sobre prácticas sexuales seguras y prevención de ITS.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 152, "question": "En la comunidad rural donde usted labora se ha identificado un aumento en la incidencia de enfermedades crónicas no transmisibles, como Diabetes tipo II e Hipertensión. La población está compuesta principalmente por adultos mayores y familias de bajos recursos. Procede a desarrollar un plan de intervención para mejorar la salud de esta comunidad. Entre las actividades se incluyen la educación para la salud, programas de ejercicio comunitario, campañas de prevención, creación de huertos comunitarios y grupos de apoyo. ¿Cuál de las siguientes actividades del equipo de atención primaria se está aplicando en este caso?", "options": ["Promoción de la salud.", "Rehabilitación y reinserción social.", "Atención familiar.", "Asistencia sanitaria."], "answer": "Promoción de la salud.", "justification": "La educación, el ejercicio comunitario, la prevención, los huertos y los grupos de apoyo son acciones propias de promoción de la salud en atención primaria.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 153, "question": "Durante la entrega recepción de la guardia de enfermería, se reciben los equipos adquiridos por la institución de salud para la atención en la sala de labor de parto, con el fin de desarrollar actividades basadas en la confidencialidad y confianza entre pacientes, profesionales y personal de salud. Además, se realizará una capacitación continua para su uso y aplicación correcta. ¿A qué principio transversal de la seguridad del paciente-usuario corresponde principalmente este accionar de la institución de salud?", "options": ["Alianza con el paciente y su familia.", "Cultura de seguridad.", "Impacto.", "Atención centrada en la persona."], "answer": "Cultura de seguridad.", "justification": "La cultura de seguridad promueve prácticas seguras, capacitación continua, comunicación, confianza y condiciones organizacionales que reduzcan riesgos para pacientes y personal.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 154, "question": "El hospital está experimentando una escasez recurrente de materiales críticos en el quirófano, lo que ha provocado retrasos en las cirugías programadas y ha afectado la calidad de la atención. El líder de enfermería del servicio se ha reunido con el equipo directivo para discutir un plan de mejora en la gestión de estos recursos esenciales. ¿Cuál es la estrategia más adecuada para evitar este problema en el hospital?", "options": ["Dejar que cada departamento gestione sus propios inventarios de forma independiente.", "Mantener grandes reservas de materiales para evitar faltantes.", "Comprar materiales en grandes cantidades una vez al año.", "Implementar un sistema de gestión de inventarios a tiempo."], "answer": "Implementar un sistema de gestión de inventarios a tiempo.", "justification": "Un sistema de inventario a tiempo permite reponer materiales según necesidad y reducir simultáneamente faltantes, exceso de stock y desperdicio.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 155, "question": "Profesional de enfermería del Centro de Salud es responsable del área de inmunizaciones, ha discutido con una colega y se ha generado un conflicto, ella trata de solucionarlo y recurre a la Coordinadora de Enfermería del Centro para que facilite la comunicación y se encuentre una solución satisfactoria al conflicto. ¿Cómo se denomina este método?", "options": ["Conciliación.", "Mediación.", "Arbitraje.", "Negociación."], "answer": "Mediación.", "justification": "La mediación utiliza a un tercero imparcial para facilitar la comunicación entre las partes y ayudar a alcanzar una solución aceptable para el conflicto.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 156, "question": "Un paciente de 25 años hospitalizado en el servicio de cirugía general sufre una caída de su propia altura con pérdida de conciencia al movilizarse al baño; se realiza valoración primaria de ABC (vía aérea, respiración y circulación) obteniendo que el paciente no respira y no se palpa el pulso carotídeo, por lo cual se activa el código correspondiente y se inicia protocolo de Reanimación Cardio Pulmonar, para tal efecto llegan dos profesionales de salud para apoyar. Como parte del equipo de respuesta se empieza a dar compresiones. ¿Cuál es la profundidad de la compresión en este paciente para que sea considerada de calidad?", "options": ["0.5 a 1 pulgada (1.27 a 2.54 centímetros).", "1/2 del diámetro anteroposterior del tórax.", "1.5 a 2 pulgadas (4 a 5 centímetros).", "1/3 del diámetro anteroposterior del tórax."], "answer": "1.5 a 2 pulgadas (4 a 5 centímetros).", "justification": "En el adulto, las compresiones torácicas de calidad deben alcanzar aproximadamente 5 cm, sin exceder 6 cm; entre las opciones, 4–5 cm es la alternativa planteada.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 157, "question": "Paciente femenina de 16 años acude a la unidad de salud, refiere que ha empezado su vida sexual y desconoce los métodos de anticoncepción, enfermedades de transmisión sexual, entre otros. Por lo que necesita asesoría en salud sexual y reproductiva. ¿Cuál es el primer paso a seguir para cumplir con el proceso de asesoría, de acuerdo al Manual de Asesoría en salud sexual y reproductiva del Ministerio de Salud Pública?", "options": ["Información.", "Indagación.", "Vínculo.", "Decisión."], "answer": "Vínculo.", "justification": "El primer paso de la asesoría en salud sexual y reproductiva es establecer vínculo, confianza y condiciones de confidencialidad antes de profundizar en la información.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 158, "question": "Un paciente de 55 años con diagnóstico de hipertensión arterial, acude a la consulta externa para control. A la valoración de enfermería se constata los siguientes parámetros vitales: presión arterial 160/100 mmHg, frecuencia cardiaca 82 por minuto, frecuencia respiratoria 18 por minuto, temperatura 36.8 °C, saturación de oxígeno 90 %, IMC 24. El paciente refiere dolor de cabeza, mareo y visión borrosa, también informa que a veces olvida tomar la medicación, y se encuentra temeroso por su condición de salud. ¿Qué intervención de enfermería es prioritaria en este caso?", "options": ["Administrar analgésicos prescritos.", "Promover el cumplimiento del esquema terapéutico.", "Controlar la ansiedad del paciente.", "Realizar un plan de control y registro de peso corporal."], "answer": "Promover el cumplimiento del esquema terapéutico.", "justification": "La presión arterial elevada y el olvido de la medicación hacen prioritaria la promoción del cumplimiento y la adherencia al esquema terapéutico.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 159, "question": "Paciente femenina de 28 años, sintomática respiratoria por más de un mes, acudió al centro de salud obteniéndose la primera muestra de esputo, la profesional de enfermería le brindó información para la recolección de la segunda muestra y traerla al día siguiente pero no acudió. ¿Cuál es la actividad que debe realizar el personal de salud en ausencia de la paciente?", "options": ["Desechar la primera muestra y registrar la ausencia, programar una visita llevando dos envases.", "Agendar una nueva cita para realizar la toma de primera y segunda muestra.", "Coordinar la ubicación del sintomático respiratorio con la oficina técnica y obtener la segunda muestra.", "Programar una visita domiciliaria para obtener la muestra faltante dentro de las 48 horas."], "answer": "Programar una visita domiciliaria para obtener la muestra faltante dentro de las 48 horas.", "justification": "Cuando falta la segunda muestra de esputo, el seguimiento activo mediante visita domiciliaria permite localizar al sintomático y obtener oportunamente la muestra faltante.", "bibliography": "Hernández, I., Lumbreras, B. (2018). Manual de epidemiología y salud pública. 3.ª ed. Editorial Médica Panamericana."}, {"id": 160, "question": "Un profesional de enfermería aplica los fundamentos de educación y comunicación para la promoción de la salud en su área de influencia. Al momento pretende desarrollar prácticas y actitudes que tengan incidencia sobre los determinantes de la salud a nivel comunitario. En el interrogatorio a un grupo focal encuentra prácticas potencialmente dañinas como la colocación de tela de araña en el ombligo de los recién nacidos. ¿Cómo se evidenciaría el enfoque sociocrítico en la promoción de la salud en este caso?", "options": ["Características psicoevolutivas en educación para la salud entendida como un objetivo de vida.", "Promoción de la salud desconociendo prácticas de su entorno social.", "Transferencia de conocimientos como visión principal para la promoción de la salud.", "Promoción de la salud en contextos socioculturales, acción - reflexión - acción."], "answer": "Promoción de la salud en contextos socioculturales, acción - reflexión - acción.", "justification": "El enfoque sociocrítico parte del contexto sociocultural y utiliza un proceso de acción–reflexión–acción, en lugar de imponer conocimientos sin considerar las prácticas locales.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 161, "question": "Paciente femenina de 32 años refiere que consume un medicamento para tratar sus convulsiones. A la valoración de enfermería identifica una amenorrea de aproximadamente 7 semanas y algunos signos y síntomas probables de embarazo. Según el caso, ¿Qué medicamento consume la paciente y puede provocar teratogenicidad en el desarrollo embrionario?", "options": ["Carbamazepina.", "Warfarina.", "Tiamina.", "Levotiroxina sódica."], "answer": "Carbamazepina.", "justification": "La carbamazepina es un anticonvulsivante asociado a riesgo teratogénico; ante un embarazo debe realizarse valoración especializada del tratamiento.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 162, "question": "Un grupo específico de personas, viven en una parroquia rural, comparten la misma cultura, valores y normas. Al momento están organizadas en una estructura social por cabildo. En la valoración se detecta la necesidad de reorientar los servicios de salud hacia la comunidad. ¿Cuál de los siguientes enunciados define el concepto de comunidad cerrada?", "options": ["Una comunidad que se enfoca principalmente en el desarrollo económico y la generación de empleo.", "Una comunidad que tiene fronteras geográficas claramente definidas y limita el acceso a personas externas.", "Una comunidad que se caracteriza por tener una diversidad cultural y étnica muy marcada.", "Una comunidad que promueve la participación activa de sus miembros en actividades sociales y culturales."], "answer": "Una comunidad que tiene fronteras geográficas claramente definidas y limita el acceso a personas externas.", "justification": "Una comunidad cerrada se caracteriza, en este planteamiento, por límites geográficos definidos y restricciones de acceso a personas externas.", "bibliography": "Cunningham, G., Leveno, K., Dashe, J., Hoffman, B., Spong, C. & Casey, B. (2022). Williams Obstetrics. 26.ª ed. McGraw-Hill."}, {"id": 163, "question": "Un paciente ingresa al hospital con diagnóstico de tuberculosis pulmonar activa. El personal de enfermería encargado de su cuidado debe utilizar medidas de aislamiento para prevenir la transmisión de la enfermedad a otros pacientes y al personal de salud. ¿Qué tipo de aislamiento debe aplicarse en este caso?", "options": ["Aislamiento por contacto.", "Aislamiento por vía aérea.", "Aislamiento por gotas.", "Aislamiento por cohorte."], "answer": "Aislamiento por vía aérea.", "justification": "La tuberculosis pulmonar activa se transmite por vía aérea, por lo que requiere aislamiento respiratorio de vía aérea.", "bibliography": "Alligood, M. (2022). Modelos y Teorías de Enfermería. 10.ª ed. Elsevier."}, {"id": 164, "question": "Un profesional de enfermería está brindando cuidados a un paciente diagnosticado de diabetes mellitus tipo 2 con sobrepeso, cuya indicación es la administración de insulina NPH (de acción intermedia) por vía subcutánea cada día; luego de limpiar la piel procede a la administración del fármaco. ¿Cuál es el principal cuidado de enfermería cuando se utiliza esta vía de administración?", "options": ["No extraer las burbujas de aire de la jeringuilla.", "Rotar diariamente los sitios de inyección.", "Insertar la aguja en ángulo de 10 - 15 grados.", "Aplicar el medicamento con aguja de 12 mm."], "answer": "Rotar diariamente los sitios de inyección.", "justification": "La rotación de los sitios de inyección subcutánea de insulina ayuda a prevenir alteraciones locales del tejido y favorece una absorción más uniforme.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 165, "question": "Una paciente de 28 años es atendida en el servicio de urgencias con un diagnóstico médico de hemotórax. Presenta dolor torácico, dificultad respiratoria, tiraje intercostal, taquicardia y disminución de la expansión del hemitórax izquierdo, llanto fácil y temor. ¿Cuál es el diagnóstico de enfermería prioritario para esta paciente?", "options": ["Dolor agudo relacionado con agentes lesivos.", "Ansiedad relacionada con factores estresores.", "Deterioro de la ventilación espontánea relacionado con la fatiga de los músculos respiratorios.", "Riesgo de infección relacionado con el deterioro de la integridad cutánea."], "answer": "Deterioro de la ventilación espontánea relacionado con la fatiga de los músculos respiratorios.", "justification": "El hemotórax compromete la ventilación y puede producir deterioro de la ventilación espontánea por la afectación de la expansión pulmonar.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 166, "question": "Como profesional de enfermería, está realizando un estudio para conocer el comportamiento del consumo de alcohol en un grupo de adolescentes, la información será recolectada en un momento específico. Al ser un problema nuevo y poco conocido en la comunidad, con los resultados de este estudio se ejecutarán programas de promoción y prevención de salud. ¿Qué tipo de diseño es pertinente para este estudio?", "options": ["Diseño transversal descriptivo.", "Diseño transversal exploratorio.", "Diseño longitudinal de tendencia.", "Diseño transversal correlacional-causal."], "answer": "Diseño transversal exploratorio.", "justification": "El diseño transversal exploratorio permite estudiar un fenómeno poco conocido recogiendo información en un momento determinado para generar una primera aproximación.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 167, "question": "Un paciente de 54 años ingresa al hospital con dificultad para respirar. Durante la valoración de enfermería se observa al paciente intranquilo, temperatura: 37.5 °C, presión arterial: 80/60 mmHg, frecuencia cardíaca 120 lpm, frecuencia respiratoria 20 rpm y oximetría 80%. Según la valoración de enfermería, ¿Cuál es el signo prioritario para una intervención inmediata?", "options": ["Hipotensión arterial.", "Temperatura.", "Oximetría.", "Frecuencia cardíaca."], "answer": "Oximetría.", "justification": "Una saturación de oxígeno de 80% representa hipoxemia grave y requiere intervención inmediata para mejorar la oxigenación.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 168, "question": "Paciente femenina de 17 años acude a consulta externa refiriendo un retraso de 3 semanas en su ciclo menstrual, además menciona que tras realizarse una prueba urinaria de embarazo doméstica ésta salió positiva. Al interrogatorio menciona prácticas sexuales sin protección. ¿Qué datos complementarios ayudarían a confirmar el embarazo?", "options": ["Cambios en el aparato reproductor inferior, signo de Chadwick.", "El aumento de la pigmentación y la aparición de estrías abdominales.", "Fecha de última menstruación y tiempo de amenorrea.", "La detección de B-HCG en sangre y la ecografía transvaginal."], "answer": "La detección de B-HCG en sangre y la ecografía transvaginal.", "justification": "La combinación de β-hCG en sangre y ecografía transvaginal aporta evidencia objetiva para confirmar el embarazo y valorar su localización.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 169, "question": "Paciente masculino de 70 años, hospitalizado con diagnóstico de apendicitis, antecedentes de hipertensión arterial diagnosticada hace 5 años con tratamiento farmacológico. Al momento se encuentra desorientado, inquieto, poco colaborador, presenta cifras de presión arterial elevadas por lo que se le administra antihipertensivos vía venosa. Tiene dificultad para movilizarse solo, por lo que requiere asistencia y cuidados, mientras se transporta al quirófano sufre una caída. ¿Cuál es el tipo de evento adverso con el que está relacionado el caso?", "options": ["Con infecciones hospitalarias.", "Con los cuidados.", "Con la medicación.", "Con procedimientos."], "answer": "Con la medicación.", "justification": "En el caso descrito, la caída ocurre después de la administración intravenosa de antihipertensivos; por ello el evento se relaciona con la medicación.", "bibliography": "Hernández, I., Lumbreras, B. (2018). Manual de epidemiología y salud pública. 3.ª ed. Editorial Médica Panamericana."}, {"id": 170, "question": "En la unidad operativa del primer nivel de atención, se ha planificado la ejecución de la campaña de salud \"Como cuidar tu corazón\", cada miembro del equipo de salud tiene asignada una actividad. ¿Cuáles son los roles que le corresponden al profesional de enfermería?", "options": ["Informativo, detección y erradicación.", "Fomento de la salud y prevención de enfermedades y accidentes.", "Asesoramiento individual.", "Educador, apoyo, refuerzo e identificar grupos de riesgo."], "answer": "Educador, apoyo, refuerzo e identificar grupos de riesgo.", "justification": "Entre las funciones de enfermería en promoción y prevención se incluyen educación, apoyo, refuerzo e identificación de grupos de riesgo.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 171, "question": "Paciente masculino de 27 años que ingresa al servicio de emergencia por presentar estatus convulsivo y edema en miembros superiores, se decide colocar sonda vesical para control de ingesta y eliminación estricto; al momento de inflar el balón el paciente se queja de dolor severo y se evidencia salida de sangre en orina. ¿Cuál es la estructura que se lesionó durante el procedimiento?", "options": ["Uréteres.", "Próstata.", "Vejiga.", "Uretra."], "answer": "Uretra.", "justification": "Dolor intenso y hematuria inmediatamente después de inflar el balón sugieren lesión de la uretra por colocación o inflado inadecuado del catéter.", "bibliography": "Ministerio de Salud Pública del Ecuador. (2018). Manual de Modelo de Atención Integral de Salud – MAIS."}, {"id": 172, "question": "Usted trabaja en el Departamento de Control de Infecciones, como reporte semanal se detectó un incremento en la tasa de infecciones del sitio quirúrgico, para lo que le piden revisar el libro de registros de los quirófanos y reconocer los parámetros anómalos con relación a temperatura y humedad. ¿En qué quirófano está ocurriendo lo planteado en el caso?", "options": ["Quirófano 1: Temperatura 24 °C, humedad 56 %.", "Quirófano 4: Temperatura 23 °C, humedad 55 %.", "Quirófano 2: Temperatura 20 °C, humedad 50 %.", "Quirófano 3: Temperatura 22 °C, humedad 52 %."], "answer": "Quirófano 1: Temperatura 24 °C, humedad 56 %.", "justification": "El quirófano 1 presenta 24 °C, el valor más alto entre los registros mostrados y el parámetro anómalo señalado en el reactivo.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 173, "question": "Un neonato con antecedentes de prematurez moderada llega al servicio de emergencias de la maternidad en brazos de su madre. Es valorado por el profesional de enfermería quien observa letargia y cianosis distal leve; procede a colocarlo en la incubadora conectado al sensor de temperatura de piel donde se aprecia un valor de 35.3° C. ¿En qué clasificación de temperatura se encuentra el neonato?", "options": ["Hipotermia moderada.", "Normotermia.", "Hipotermia leve.", "Hipotermia grave."], "answer": "Hipotermia leve.", "justification": "Una temperatura neonatal de 35,3 °C corresponde a hipotermia leve dentro de la clasificación planteada.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 174, "question": "Usted se encuentra atendiendo a un paciente de 70 años diagnosticado con un cáncer avanzado. El paciente ha expresado su deseo de no recibir más tratamientos agresivos y en su lugar, prefiere recibir cuidados paliativos para mejorar su calidad de vida en sus últimos días. Sin embargo, la familia del paciente insiste en que se sigan intentando tratamientos experimentales, ya que no quieren aceptar la decisión del paciente. ¿Cuál es el principal principio bioético que se está vulnerando en este caso?", "options": ["Justicia.", "No maleficencia.", "Beneficencia.", "Autonomía."], "answer": "Autonomía.", "justification": "La autonomía se vulnera cuando se pretende imponer un tratamiento contra la voluntad expresada por un paciente competente que ha decidido recibir cuidados paliativos.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 175, "question": "Paciente con diagnóstico de aborto ectópico fue enviada de manera urgente desde el área de emergencia al quirófano, donde se realizó la intervención correspondiente y fue trasladada a la unidad de cuidados intensivos para su estabilización y monitoreo. ¿Cómo se clasifican las áreas en las que fue atendida la paciente?", "options": ["Semicríticas.", "No críticas.", "De bajo riesgo.", "Críticas."], "answer": "Críticas.", "justification": "Emergencia, quirófano y UCI son áreas críticas por el tipo de procedimientos, complejidad, riesgo y necesidad de control estricto de infecciones.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 176, "question": "En una investigación sobre factores asociados a la hipertensión en adultos, un equipo de salud comunitaria recolecta datos de 100 pacientes sobre dos variables cuantitativas: Edad (en años) y Presión arterial sistólica (en mmHg). Los investigadores desean determinar si existe una relación lineal significativa entre la edad y los niveles de presión arterial sistólica en la muestra. Ambas variables se distribuyen de manera normal. ¿Qué prueba estadística paramétrica es la más adecuada utilizar para este estudio?", "options": ["Prueba t.", "Coeficiente de correlación de Pearson.", "Análisis de varianza unidireccional.", "Chi-cuadrado."], "answer": "Coeficiente de correlación de Pearson.", "justification": "El coeficiente de correlación de Pearson es una prueba paramétrica para evaluar la fuerza y dirección de la relación lineal entre dos variables cuantitativas con distribución normal.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}];
const $ = id => document.getElementById(id);
let session=[], pos=0, hits=0, answered=false;

function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}
  return x;
}
function start(){
  const amount=Math.min(Number($("amount").value)||20,QUESTIONS.length);
  session=shuffle(QUESTIONS).slice(0,amount);
  pos=0;hits=0;answered=false;
  $("start").hidden=true;$("result").hidden=true;$("quiz").hidden=false;
  render();
}
function render(){
  const q=session[pos]; answered=false;
  $("label").textContent="Pregunta "+(pos+1);
  $("counter").textContent=(pos+1)+" / "+session.length;
  $("score").textContent="Aciertos: "+hits;
  $("bar").style.width=((pos/session.length)*100)+"%";
  document.querySelector(".matching-table")?.remove(); $("question").innerHTML=q.question .replace(/C\s*U\s*I\s*D\s*A\s*D\s*O\s*F\s*A\s*M\s*I\s*L\s*I\s*A\s*R\s*,\s*C\s*O\s*M\s*U\s*N\s*I\s*T\s*A\s*R\s*I\s*O\s*E\s*I\s*N\s*T\s*E\s*R\s*C\s*U\s*L\s*T\s*U\s*R\s*A\s*L/gi,"") .replace(/C\s*U\s*I\s*D\s*A\s*D\s*O\s*S?\s*D\s*E\s*L\s*A\s*M\s*U\s*J\s*E\s*R\s*,\s*R\s*E\s*C\s*I\s*É\s*N\s*N\s*A\s*C\s*I\s*D\s*O\s*,\s*N\s*I\s*N\s*O\s*Y\s*A\s*D\s*O\s*L\s*E\s*S\s*C\s*E\s*N\s*T\s*E/gi,"") .replace(/C\s*U\s*I\s*D\s*A\s*D\s*O\s*S?\s*D\s*E\s*L\s*A\s*D\s*U\s*L\s*T\s*O\s*Y\s*A\s*D\s*U\s*L\s*T\s*O\s*M\s*A\s*Y\s*O\s*R/gi,"") .replace(/B\s*A\s*S\s*E\s*S\s*E\s*D\s*U\s*C\s*A\s*T\s*I\s*V\s*A\s*S?\s*,\s*A\s*D\s*M\s*I\s*N\s*I\s*S\s*T\s*R\s*A\s*T\s*I\s*V\s*A\s*S?\s*,\s*I\s*N\s*V\s*E\s*S\s*T\s*I\s*G\s*A\s*T\s*I\s*V\s*A\s*S?\s*Y\s*E\s*P\s*I\s*D\s*E\s*M\s*I\s*O\s*L\s*Ó\s*G\s*I\s*C\s*A\s*S?\s*D\s*E\s*L\s*C\s*U\s*I\s*D\s*A\s*D\s*O\s*E\s*N\s*F\s*E\s*R\s*M\s*E\s*R\s*O/gi,""); if(q.id===53){   $("question").insertAdjacentHTML("afterend",`     <table class="matching-table">       <thead>         <tr>           <th>TIPOS DE CATÉTER</th>           <th>CARACTERÍSTICAS</th>         </tr>       </thead>       <tbody>         <tr>           <td>1. Catéter Venoso Periférico</td>           <td>a) Radiopaco</td>         </tr>         <tr>           <td>2. Catéter Venoso Subcutáneo</td>           <td>b) Inserción en vena superficial</td>         </tr>         <tr>           <td>3. Catéter Venoso Central</td>           <td>c) Inserción en vena subclavia</td>         </tr>         <tr>           <td></td>           <td>d) Inserción en vena cava superior</td>         </tr>         <tr>           <td></td>           <td>e) Cánula corta</td>         </tr>         <tr>           <td></td>           <td>f) Con reservorio</td>         </tr>       </tbody>     </table>   `); }
  if(q.id===23){
  $("question").innerHTML=q.question.substring(q.question.indexOf("Al centro de salud"));
}

if(q.id===43){
  $("question").innerHTML=q.question.substring(q.question.indexOf("Paciente masculino de 45 años"));
}

if(q.id===70){
  $("question").innerHTML=q.question.substring(q.question.indexOf("El personal de un centro de salud tipo B"));
}

if(q.id===85){
  $("question").innerHTML=q.question.substring(q.question.indexOf("En una investigación sobre factores asociados a hipertensión"));
}
  if(q.id===4){
  $("question").insertAdjacentHTML("afterend",`
    <table class="matching-table">
      <thead>
        <tr>
          <th>GRUPO</th>
          <th>PUEDE DONAR A</th>
          <th>PUEDE RECIBIR DE</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>A+</td><td>A+, AB+</td><td>A+, A-, O+, O-</td></tr>
        <tr><td>O+</td><td>A+, O+, B+, AB+</td><td>O+, O-</td></tr>
        <tr><td>B+</td><td>B+, AB+</td><td>B+, B-, O+, O-</td></tr>
        <tr><td>AB+</td><td>AB+</td><td>TODOS</td></tr>
        <tr><td>A-</td><td>A+, A-, AB+, AB-</td><td>A-, O-</td></tr>
        <tr><td>O-</td><td>TODOS</td><td>O-</td></tr>
        <tr><td>B-</td><td>B+, B-, AB+, AB-</td><td>B-, O-</td></tr>
        <tr><td>AB-</td><td>AB+, AB-</td><td>A-, O-, B-, AB-</td></tr>
      </tbody>
    </table>
  `);
}
  if(q.id===31){
  $("question").insertAdjacentHTML("afterend",`
    <table class="matching-table">
      <thead>
        <tr>
          <th>ZONA DE KRAMER</th>
          <th>EXTENSIÓN ANATÓMICA</th>
          <th>BILIRRUBINA ESTIMADA</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Zona 1</td>
          <td>Cabeza y cuello</td>
          <td>4 a 6 mg/dl</td>
        </tr>
        <tr>
          <td>Zona 2</td>
          <td>Tronco hasta el ombligo</td>
          <td>6 a 8 mg/dl</td>
        </tr>
        <tr>
          <td>Zona 3</td>
          <td>Ombligo hasta rodillas</td>
          <td>8 a 12 mg/dl</td>
        </tr>
        <tr>
          <td>Zona 4</td>
          <td>Brazos y piernas</td>
          <td>12 a 14 mg/dl</td>
        </tr>
        <tr>
          <td>Zona 5</td>
          <td>Palmas de manos y plantas de pies</td>
          <td>&gt;15 mg/dl</td>
        </tr>
      </tbody>
    </table>
  `);
}
  $("options").innerHTML="";
  $("feedback").className="feedback";
  $("nextBtn").disabled=true;
  $("nextBtn").textContent=pos===session.length-1?"Ver resultado":"Siguiente pregunta";

  const correctIndex=q.answer ? q.options.findIndex(x=>x.trim()===q.answer.trim()) : -1;
  let opts=shuffle(q.options.map((text,i)=>({text,correct:i===correctIndex})));
  opts.forEach((o,i)=>{
    const b=document.createElement("button");
    b.type="button";b.className="opt";b.textContent=String.fromCharCode(65+i)+". "+o.text;
    b.addEventListener("click",()=>answer(o,b));
    $("options").appendChild(b);
  });
}
function answer(o,clicked){
  if(answered)return;
  answered=true;
  if(o.correct)hits++;
  $("score").textContent="Aciertos: "+hits;
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  clicked.classList.add(o.correct?"correct":"wrong");
  document.querySelectorAll(".opt").forEach(b=>{
    if(b.textContent.slice(3).trim()===session[pos].answer.trim())b.classList.add("correct");
  });
  const current=session[pos];
  if(!current.answer){
    $("feedbackTitle").textContent="⚠ No calificable";
    $("feedbackTitle").style.color="var(--muted)";
    $("explanation").textContent=(current.justification || "Esta pregunta no tiene una opción correcta válida en la fuente original.")+"\n\nEsta pregunta se conserva en el banco, pero no se contabiliza en la calificación.";
    $("source").textContent=current.bibliography ? "Bibliografía indicada en la guía: "+current.bibliography : "";
    $("feedback").className="feedback show";
  }else{
    $("feedbackTitle").textContent=o.correct?"✓ Correcta":"✗ Incorrecta";
    $("feedbackTitle").style.color=o.correct?"var(--good)":"var(--bad)";
    $("explanation").textContent=current.justification || "La guía no incluye una justificación para esta pregunta.";
    $("source").textContent=current.bibliography ? "Bibliografía indicada en la guía: "+current.bibliography : "";
    $("feedback").className="feedback show "+(o.correct?"good":"bad");
  }
  $("nextBtn").disabled=false;
  $("bar").style.width=((pos+1)/session.length*100)+"%";
}
function next(){
  if(!answered)return;
  if(pos<session.length-1){pos++;render();window.scrollTo({top:0,behavior:"smooth"});}
  else finish();
}
function finish(){
  $("quiz").hidden=true;$("result").hidden=false;
  const scored=session.filter(q=>q.answer).length;
  const pct=scored ? Math.round(hits/scored*100) : 0;
  $("finalScore").textContent=pct+"%";
  $("finalText").textContent=`Obtuviste ${hits} de ${scored} respuestas calificables. ${scored<session.length ? "Las preguntas sin una respuesta válida en la fuente no se contabilizan. " : ""}${pct>=90?"Excelente desempeño.":pct>=70?"Buen resultado; sigue reforzando los temas con errores.":"Conviene repasar las justificaciones y volver a intentarlo."}`;
}
function restart(){start();}
$("startBtn").addEventListener("click",start);
$("nextBtn").addEventListener("click",next);
$("restartBtn").addEventListener("click",restart);
$("againBtn").addEventListener("click",start);
$("total").textContent=QUESTIONS.length;
</script>
</body>
