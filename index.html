<title>SIMULADOR CACES ENFERMERÍA 2026</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--primary:#1457a6;--primary2:#0b3b75;--border:#dbe2ea;--good:#137333;--bad:#b42318;--goodbg:#ecfdf3;--badbg:#fef3f2;--shadow:0 12px 35px rgba(16,24,40,.08)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#edf4fc 0,#f8fafc 260px);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
.wrap{max-width:900px;margin:auto;padding:28px 16px 50px}.hero{background:linear-gradient(135deg,var(--primary2),var(--primary));color:#fff;border-radius:22px;padding:28px;box-shadow:var(--shadow);margin-bottom:18px}
.hero h1{margin:0 0 7px;font-size:clamp(26px,5vw,40px)}.hero p{margin:0;opacity:.92}.tag{display:inline-block;margin-top:16px;padding:7px 11px;border:1px solid rgba(255,255,255,.35);border-radius:999px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:8px 11px;background:#f7f9fc;border:1px solid var(--border);border-radius:10px;font-size:14px}.progress{height:9px;background:#e7edf4;border-radius:99px;overflow:hidden;margin:14px 0 4px}.bar{height:100%;background:var(--primary);width:0;transition:width .25s ease}
.kicker{font-size:13px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.05em}.q{font-size:20px;line-height:1.48;margin:10px 0 18px;font-weight:650}.options{display:grid;gap:10px}.opt{width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:13px;padding:14px 15px;font-size:16px;color:var(--text);cursor:pointer;transition:.15s}.opt:hover:not(:disabled){border-color:#8db1d9;background:#f8fbff;transform:translateY(-1px)}.opt:focus-visible{outline:3px solid #b9d7f8;outline-offset:2px}.opt:disabled{cursor:default}.opt.correct{border-color:#73c991;background:var(--goodbg)}.opt.wrong{border-color:#f19b92;background:var(--badbg)}
.feedback{margin-top:16px;border-radius:14px;padding:16px;display:none}.feedback.show{display:block}.feedback.good{background:var(--goodbg);border:1px solid #b7e4c7}.feedback.bad{background:var(--badbg);border:1px solid #f2c0ba}.feedback strong{display:block;margin-bottom:7px}.explain{line-height:1.6;white-space:pre-wrap}.source{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.5}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}button.action{border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff}button.action.secondary{background:#eef3f8;color:var(--text);border:1px solid var(--border)}button.action:disabled{opacity:.45;cursor:not-allowed}
.start{text-align:center}.start h2{margin-top:0}.start p{color:var(--muted);line-height:1.6}.start .big{font-size:18px;font-weight:700}
select{padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:15px}
.result{text-align:center}.score{font-size:52px;font-weight:800;color:var(--primary);margin:8px 0}.result p{color:var(--muted)}.small{font-size:13px;color:var(--muted)}
@media(max-width:560px){.wrap{padding:16px 10px 35px}.hero,.panel{border-radius:15px;padding:17px}.q{font-size:18px}.opt{font-size:15px;padding:13px}.actions{justify-content:stretch}.actions .action{flex:1}}
</style>
</head>
<body>
<main class="wrap" id="app">
<section class="hero">
  <h1>SIMULADOR CACES ENFERMERÍA 2026</h1>
</section>

<section class="panel" id="globalStats" aria-live="polite">
  <div class="row">
    <div>
      <div class="kicker">Estadísticas globales</div>
      <h2 style="margin:6px 0 4px">Actividad del simulador</h2>
      <div class="small" id="statsStatus">Conectando con la nube…</div>
    </div>
    <div class="stats" style="justify-content:flex-end">
      <span class="stat">📚 Preguntas: <strong id="statQuestions">276</strong></span>
      <span class="stat">👥 Visitantes: <strong id="statVisits">—</strong></span>
      <span class="stat">📝 Intentos: <strong id="statAttempts">—</strong></span>
      <span class="stat">✅ Completados: <strong id="statCompleted">—</strong></span>
      <span class="stat">20: <strong id="stat20">—</strong></span>
      <span class="stat">50: <strong id="stat50">—</strong></span>
      <span class="stat">100: <strong id="stat100">—</strong></span>
    </div>
  </div>
</section>

<section class="panel start" id="start">
  <h2>¿Listo para comenzar?</h2>
  <div class="row" style="justify-content:center;margin:18px 0">
    <label for="amount">Cantidad por intento:</label>
    <select id="amount">
      <option value="20" selected>20 preguntas</option>
      <option value="50">50 preguntas</option>
      <option value="100">100 preguntas</option>
    </select>
  </div>
  <button class="action" id="startBtn">Comenzar simulador</button>
</section>

<section class="panel" id="quiz" hidden>
  <div class="row">
    <div><span class="kicker" id="label">Pregunta 1</span></div>
    <div class="stats"><span class="stat" id="counter">1 / 20</span><span class="stat" id="score">Aciertos: 0</span></div>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="q" id="question"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback" aria-live="polite">
    <strong id="feedbackTitle"></strong>
    <div class="explain" id="explanation"></div>
    <div class="source" id="source"></div>
  </div>
  <div class="actions">
    <button class="action secondary" id="restartBtn" type="button">Reiniciar</button>
    <button class="action" id="nextBtn" type="button" disabled>Siguiente pregunta</button>
  </div>
</section>

<section class="panel result" id="result" hidden>
  <h2>Resultado del simulador</h2>
  <div class="score" id="finalScore">0%</div>
  <p id="finalText"></p>
  <div class="actions" style="justify-content:center"><button class="action" id="againBtn" type="button">Nuevo intento aleatorio</button></div>
</section>
</main>

<script type="module">
const $ = id => document.getElementById(id);

// Firebase se carga de forma dinámica para que el simulador siga funcionando
// aunque Firebase tarde en responder o haya un problema temporal de conexión.
const firebaseConfig = {
  apiKey: "AIzaSyBVEbU8mE5rvE6LMthRDaiR45UDg4srrEw",
  authDomain: "simulador-caces-enfermeria.firebaseapp.com",
  databaseURL: "https://simulador-caces-enfermeria-default-rtdb.firebaseio.com",
  projectId: "simulador-caces-enfermeria",
  storageBucket: "simulador-caces-enfermeria.firebasestorage.app",
  messagingSenderId: "216706351796",
  appId: "1:216706351796:web:705ef72865120505208de1"
};

let db = null, auth = null, firebaseUser = null;
let fbRef = null, fbRunTransaction = null, fbOnValue = null, fbSignInAnonymously = null, fbOnAuthStateChanged = null;
let authReadyResolve;
const authReady = new Promise(resolve => { authReadyResolve = resolve; });

function incrementCounter(path) {
  if (!db || !fbRef || !fbRunTransaction) return Promise.resolve();
  return fbRunTransaction(fbRef(db, path), current => (typeof current === "number" ? current : 0) + 1);
}

async function registerVisitor(user) {
  try {
    const key = "caces_visit_registered_v1";
    if (!localStorage.getItem(key)) {
      await incrementCounter("stats/visits");
      localStorage.setItem(key, "1");
    }
    const statusEl = $("statsStatus"); if (statusEl) statusEl.textContent = "Estadísticas globales conectadas a Firebase.";
  } catch (err) {
    console.error("No se pudo registrar el visitante:", err);
    const statusEl = $("statsStatus"); if (statusEl) statusEl.textContent = "Firebase conectado con limitaciones de escritura.";
  }
}

function watchGlobalStats() {
  if (!db || !fbRef || !fbOnValue) return;
  fbOnValue(fbRef(db, "stats"), snap => {
    const data = snap.val() || {};
    $("statVisits").textContent = data.visits ?? 0;
    $("statAttempts").textContent = data.attempts ?? 0;
    $("statCompleted").textContent = data.completed ?? 0;
    $("stat20").textContent = data.modes?.["20"] ?? 0;
    $("stat50").textContent = data.modes?.["50"] ?? 0;
    $("stat100").textContent = data.modes?.["100"] ?? 0;
  }, err => {
    console.error("Lectura de estadísticas:", err);
    const statusEl = $("statsStatus"); if (statusEl) statusEl.textContent = "No se pudieron cargar las estadísticas.";
  });
}

async function initFirebase() {
  try {
    const [{ initializeApp }, database, authentication] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js"),
      import("https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js")
    ]);
    fbRef = database.ref;
    fbRunTransaction = database.runTransaction;
    fbOnValue = database.onValue;
    fbSignInAnonymously = authentication.signInAnonymously;
    fbOnAuthStateChanged = authentication.onAuthStateChanged;
    const app = initializeApp(firebaseConfig);
    db = database.getDatabase(app);
    auth = authentication.getAuth(app);

    watchGlobalStats();
    fbOnAuthStateChanged(auth, user => {
      if (user) {
        firebaseUser = user;
        authReadyResolve(user);
        registerVisitor(user);
      }
    });
    await fbSignInAnonymously(auth);
  } catch (err) {
    console.error("Firebase:", err);
    const statusEl = $("statsStatus"); if (statusEl) statusEl.textContent = "Modo local: las estadísticas no están disponibles ahora.";
    authReadyResolve(null);
  }
}

const QUESTIONS = [{"id":1,"question":"Una paciente ingresa al hospital con diagnóstico de tuberculosis pulmonar activa. El personal de enfermería encargado de su cuidado debe utilizar medidas de aislamiento para prevenir la transmisión de la enfermedad a otros pacientes y el personal de salud ¿Qué tipo de aislamiento debe aplicarse en este caso?","options":["Aislamiento por gotas","Aislamiento por vía aérea","Aislamiento por contacto","Aislamiento por cohorte"],"answer":"Aislamiento por vía aérea","justification":"La tuberculosis pulmonar se transmite por núcleos goticulares (<5 micras) que permanecen suspendidos en el aire. Según la OMS y normas MSP, se requiere aislamiento por vía aérea con uso de mascarilla N95 y habitación ventilada. El aislamiento por gotas es insuficiente y el contacto no es la vía principal de transmisión.","bibliography":"Potter & Perry (2019). Fundamentos de enfermería; Normas MSP Subcomponente: 1.4 Bioseguridad Tema: Tipos de aislamiento - Tuberculosis pulmonar"},{"id":2,"question":"Paciente femenina con signos de hipoperfusión para su manejo requiere la administración de hemoderivados. Previo al tratamiento de infusión, el personal de enfermería omite la verificación cruzada por la demanda de pacientes, provocando la muerte del paciente. ¿A qué artículo del Código Orgánico Integral Penal se encuentra directamente vinculado este caso?","options":["Art. 144.- Homicidio.","Art. 146.- Homicidio culposo por mala práctica profesional.","Art. 145.- Homicidio culposo.","Art. 141.- Femicidio."],"answer":"Art. 146.- Homicidio culposo por mala práctica profesional.","justification":"El caso describe una muerte ocasionada por la omisión de un protocolo de seguridad obligatorio (la verificación cruzada de hemoderivados) por parte del personal de salud. En la legislación ecuatoriana, el Artículo 146 del COIP tipifica los casos en los que una persona ocasiona la muerte de otra por infringir el \"deber objetivo de cuidado\" inherente a su profesión. La omisión de verificación cruzada es una inobservancia directa de las normas y protocolos técnicos de enfermería.","bibliography":"Código Orgánico Integral Penal (COIP); Normas MSP Subcomponente: 1.5 Ética en el ejercicio profesional Tema: COIP - Mala práctica profesional"},{"id":3,"question":"Paciente de 55 años postquirúrgico de una apendicectomía ingresa a recuperación, a la valoración del profesional de enfermería observa que el paciente tiene dificultad para respirar y sospecha de una obstrucción de las vías respiratorias superiores. ¿Cuál debe ser el primer accionar del profesional de enfermería?","options":["Administración de oxígeno suplementario.","Control de la saturación de oxígeno.","Fomentar ejercicios respiratorios.","Toma de muestra de laboratorio."],"answer":"Administración de oxígeno suplementario.","justification":"Siguiendo el enfoque ABCDE, la prioridad es garantizar la oxigenación inmediata. Medir saturación o ejercicios respiratorios son acciones secundarias. La oxigenoterapia es una intervención vital inicial según protocolos de enfermería postquirúrgica. Control de la saturación de oxígeno: Es una medida de valoración/monitoreo. Si el profesional ya observó dificultad para respirar, no debe esperar a que el monitor marque una desaturación crítica para actuar; la intervención terapéutica (oxígeno) es prioritaria sobre la confirmación diagnóstica en este caso agudo. Fomentar ejercicios respiratorios: Estos son útiles para prevenir atelectasias en el postoperatorio mediato, pero son totalmente ineficaces e inapropiados ante una obstrucción aguda de la vía aérea superior. Toma de muestra de laboratorio: No tiene ninguna relevancia en el manejo inmediato de una emergencia respiratoria.","bibliography":"Potter & Perry (2019). Fundamentos de enfermería; Brunner & Suddarth (2019) Subcomponente: 1.2 Procedimientos básicos Tema: Manejo de vía aérea - Obstrucción respiratoria"},{"id":4,"question":"Paciente masculino de 37 años, con tipo de sangre B negativo sufre accidente de tránsito y requiere transfusión sanguínea urgente, Pero en el banco de sangre no se dispone de hemoderivados de su mismo grupo sanguíneo. ¿Cuál es el grupo sanguíneo que puede ser compatible con el tipo de sangre del paciente?","options":["B positivo","O positivo","AB negativo","O negativo"],"answer":"O negativo","justification":"El principio fundamental de la transfusión sanguínea es evitar que los anticuerpos del receptor ataquen los antígenos de los glóbulos rojos del donante. Un paciente con tipo de sangre B negativo (B-) tiene las siguientes características inmunológicas: Tiene antígenos B en sus eritrocitos y anticuerpos anti-A en su plasma. Carece del antígeno. Por norma de seguridad transfusional, un paciente Rh negativo solo debe recibir sangre Rh negativa para evitar la aloinmunización que desencadenaría reacciones hemolíticas.","bibliography":"Potter & Perry (2019); Brunner & Suddarth (2019) Subcomponente: 1.2 Procedimientos básicos Tema: Transfusión sanguínea - Grupos compatibles"},{"id":5,"question":"Paciente de 57 años hospitalizado en el servicio de ginecología por metrorragia disfuncional. Durante el examen especular, se observa un sangrado vaginal moderado, sin identificarse lesiones cervicales visibles. ¿Cuál es la técnica correcta para el aseo perineal?","options":["Limpiar los labios mayores de arriba hacia abajo, desde el recto hacia el periné.","Limpiar los labios mayores de abajo hacia arriba, desde el periné hacia el recto.","Limpiar los labios mayores de abajo hacia arriba, desde el recto hacia el periné.","Limpiar los labios mayores de arriba hacia abajo, desde el periné hacia el recto."],"answer":"Limpiar los labios mayores de arriba hacia abajo, desde el periné hacia el recto.","justification":"Anatómicamente, esto significa realizar el arrastre mecánico desde la zona de la sínfisis púbica/vulva hacia la zona anal. El objetivo principal de esta técnica estandarizada es prevenir la introducción de microorganismos gastrointestinales (especialmente Escherichia coli, que forma parte de la flora fecal normal) en el meato urinario y el tracto vaginal, reduciendo así drásticamente el riesgo de infecciones del tracto urinario y complicaciones infecciosas genitales, algo vital en una paciente hospitalizada y con sangrado.","bibliography":"Potter & Perry (2019). Fundamentos de enfermería Subcomponente: 1.2 Procedimientos básicos Tema: Medidas de higiene - Aseo perineal"},{"id":6,"question":"Paciente femenino de 86 años, diabética, hipertensa, con obesidad grado I, presente en región sacra úlcera por presión grado II, se realiza la visita domiciliaria y al ingresar a la habitación percibe olor desagradable, los muebles de la habitación están sucios, la ropa de cama y de la paciente están manchadas con residuos de orina y heces fecales, por lo que se conversa con la familia y los instruye sobre la importancia de mantener hábitos higiénicos adecuados, hoy la limpieza corporal y del entorno, la importancia de la luz y la ventilación de la habitación, que influye en la recuperación de la paciente y evita complicaciones. ¿En referencia a este caso quién es la autora de la teoría?","options":["Jean Watson","Betty Newman","Florence Nightingale","Hildegard Peplau"],"answer":"Florence Nightingale","justification":"El caso clínico describe un escenario donde la intervención de enfermería se centra en la modificación y mejora del espacio físico del paciente para favorecer su recuperación y evitar complicaciones. Estos principios corresponden exactamente a la Teoría del Entorno de Florence Nightingale. Ella postulaba que un entorno saludable es el factor principal para que la naturaleza actúe sobre el paciente y logre la curación. Definió elementos ambientales fundamentales que deben controlarse: ventilación adecuada, luz, higiene, calor y control de efluvios. Al instruir a la familia sobre la limpieza y ventilación, el profesional aplica directamente este modelo teórico.","bibliography":"Alligood, M. (2022). Modelos y Teorías de Enfermería Subcomponente: 1.1 Generalidades Tema: Teoría de Florence Nightingale"},{"id":7,"question":"Un paciente de 25 años es admitido a medicina interna por presentar fiebre, dolor de cabeza y rigidez de cuello. El médico indica el manejo del paciente con aislamiento por presentar meningitis. ¿Cuál es el tipo de aislamiento más adecuado para este paciente?","options":["Aislamiento cohorte","Aislamiento aéreo","Aislamiento por gotas","Aislamiento de contacto"],"answer":"Aislamiento por gotas","justification":"El cuadro clínico clásico es sugestivo de una meningitis aguda. En la práctica clínica, ante la sospecha de una meningitis bacteriana, el protocolo estándar de bioseguridad exige instaurar precauciones o aislamiento por gotas de manera empírica e inmediata. Estos microorganismos se transmiten a través de secreciones respiratorias grandes generadas al toser, estornudar o hablar. Dado que estas gotas son pesadas, no permanecen suspendidas en el aire y caen a una distancia corta. El personal de enfermería debe utilizar mascarilla quirúrgica estandarizada al acercarse al paciente. Este aislamiento se mantiene por lo menos durante las primeras 24 horas tras el inicio de una terapia antibiótica eficaz.","bibliography":"Potter & Perry (2019); Normas MSP bioseguridad Subcomponente: 1.4 Bioseguridad Tema: Aislamiento por gotas - Meningitis"},{"id":8,"question":"Un paciente ingresa a una sala de emergencias con una herida abierta en el antebrazo causada por un objeto cortante. El médico decide realizar una sutura en el lugar para cerrar la herida. ¿Cuál de las siguientes acciones es la más adecuada para garantizar la asepsia en este caso?","options":["Utilizar guantes estériles durante el procedimiento de sutura","Lavar el antebrazo con agua y jabón antes de la sutura","Utilizar guantes de manejo durante el procedimiento de sutura","Aplicar solución antiséptica directamente sobre la herida y suturar"],"answer":"Utilizar guantes estériles durante el procedimiento de sutura","justification":"El procedimiento de sutura es una intervención invasiva que penetra las barreras naturales de defensa de la piel y deja un cuerpo extraño (el hilo de sutura) en los tejidos profundos. Para garantizar la asepsia (la ausencia total de microorganismos patógenos) durante el cierre de la herida y prevenir una infección del sitio quirúrgico, es un principio universal y obligatorio mantener una técnica estéril estricta. Esto implica irreductiblemente el uso de guantes estériles, instrumental estéril y la creación de un campo estéril.","bibliography":"Potter & Perry (2019). Fundamentos de enfermería Subcomponente: 1.4 Bioseguridad Tema: Asepsia y antisepsia - Técnica estéril"},{"id":9,"question":"De acuerdo con el artículo 146 del COIP que se refiere al homicidio culposo por mala práctica profesional. ¿Cuántos años es la pena privativa de la libertad?","options":["4 a 6 años","1 a 3 años","2 a 4 años","1 a 2 años"],"answer":"1 a 3 años","justification":"Según el Artículo 146 del Código Orgánico Integral Penal (COIP) del Ecuador, se establece de manera literal que la persona que, al infringir un deber objetivo de cuidado en el ejercicio o práctica de su profesión, ocasione la muerte de otra, será sancionada con una pena privativa de libertad de uno a tres años. Este es el escenario legal base para el homicidio culposo por mala práctica profesional.","bibliography":"Código Orgánico Integral Penal (COIP) Subcomponente: 1.5 Ética profesional Tema: COIP Art. 146 - Pena privativa de libertad"},{"id":10,"question":"Un paciente acude a la sala de emergencias con síntomas de tos, fiebre y dolor de garganta. Después de una evaluación inicial se sospecha que podría tener una infección por el virus de la H. influenzae tipo b. ¿Qué tipo de aislamiento es el más adecuado para este paciente?","options":["Aislamiento por gotas","Aislamiento por contacto","Aislamiento por cohorte","Aislamiento por aire"],"answer":"Aislamiento por gotas","justification":"El Haemophilus influenzae tipo b (Hib) es un patógeno que se transmite principalmente a través de gotas respiratorias grandes (mayores a 5 micras) que se producen cuando el paciente tose, estornuda o habla. Debido al tamaño y peso de estas partículas, no permanecen suspendidas en el aire por mucho tiempo y suelen viajar distancias cortas (generalmente menos de 1 metro). Por lo tanto, el protocolo de bioseguridad estándar para prevenir su propagación en el entorno hospitalario es el aislamiento por gotas. Las medidas clave incluyen el uso de una mascarilla quirúrgica por parte del personal de salud al estar en contacto cercano con el paciente y, preferiblemente, una habitación individual.","bibliography":"Potter & Perry (2019); CDC; Normas MSP Subcomponente: 1.4 Bioseguridad Tema: Aislamiento - H. influenzae tipo b"},{"id":11,"question":"En la unidad de cuidados intensivos el personal de enfermería realiza de forma rutinaria la desinfección con glutaraldehído al 2% de todos los equipos utilizados en la intubación del paciente como las láminas del laringoscopio, este procedimiento es realizado durante 20 minutos. ¿Qué nivel de desinfección se está aplicando?","options":["Desinfección de nivel intermedio","Desinfección de bajo nivel","Desinfección de alto nivel","Desinfección de nivel mínimo"],"answer":"Desinfección de alto nivel","justification":"Las láminas del laringoscopio son consideradas artículos semicríticos, ya que entran en contacto directo con mucosas intactas pero no penetran tejidos estériles ni el sistema vascular. Para este tipo de instrumental, la norma exige una Desinfección de Alto Nivel. El glutaraldehído al 2% sumergido durante al menos 20 minutos es el agente químico biocida clásico y de referencia para alcanzar este nivel. Este proceso garantiza la eliminación de todos los microorganismos vegetativos, micobacterias, la mayoría de los virus y hongos, dejando intactas solo algunas esporas bacterianas altamente resistentes.","bibliography":"Potter & Perry (2019). Fundamentos de enfermería; Normas MSP Subcomponente: 1.4 Bioseguridad Tema: Niveles de desinfección - Glutaraldehído"},{"id":12,"question":"Paciente de 52 años es sometida una histerectomía abdominal total debido a una masa uterina sospechosa de ser maligna, hoy se la traslada a la unidad de cuidados posoperatorios s en donde presenta signos de dificultad respiratoria con frecuencia respiratoria hd de 30 por minuto, saturación de oxígeno de 85% al aire ambiente. el enfermero coloca una cánula de oxígeno a 3 litros sin mejoría; hola cambia una mascarilla de 5 litros y termina colocando una facial a 10 litros. ¿Qué nivel de pensamiento crítico está empleando el enfermero al tomar estas decisiones?","options":["Pensamiento crítico compromiso","Pensamiento crítico general","Pensamiento crítico básico","Pensamiento crítico específico"],"answer":"Pensamiento crítico específico","justification":"El enfermero aplica pensamiento crítico específico porque toma decisiones clínicas basadas en la valoración inmediata del paciente posoperatorio, interpretando signos objetivos como taquipnea y desaturación, y ajustando progresivamente el dispositivo de oxigenoterapia según la respuesta del paciente. Este nivel de pensamiento se caracteriza por el uso de conocimientos clínicos, juicio profesional y experiencia para resolver una situación concreta, compleja y cambiante, tal como lo describen los fundamentos de enfermería clínica y el modelo de pensamiento crítico aplicado al cuidado directo del paciente.","bibliography":"Potter & Perry (2019). Fundamentos de enfermería Subcomponente: 1.1 Generalidades Tema: Pensamiento crítico en enfermería"},{"id":13,"question":"Durante su turno el profesional de enfermería debe realizar el proceso de desinfección de dispositivos que requiere para el cuidado del paciente, para lo cual necesita determinar los artículos críticos. ¿Cuáles son estos artículos?","options":["Fonendoscopio, vajilla, tensiómetro y oxímetro de pulso","Equipos de asistencia respiratoria, anestesia y equipos endoscópicos","Termómetros, equipos de limpieza perineal, bidets y patos","Instrumental quirúrgico, sondas cardiacas, catéteres y prótesis"],"answer":"Instrumental quirúrgico, sondas cardiacas, catéteres y prótesis","justification":"Los artículos críticos son aquellos que penetran tejidos estériles o el sistema vascular, por lo que representan alto riesgo de infección si no se someten a esterilización completa. Según la clasificación de Spaulding, adoptada por el MSP y utilizada en CACES, estos dispositivos requieren esterilización obligatoria debido al contacto directo con zonas estériles del cuerpo, a diferencia de los artículos semicríticos o no críticos que solo requieren desinfección de alto o bajo nivel.","bibliography":"Potter & Perry (2019); Normas MSP bioseguridad Subcomponente: 1.4 Bioseguridad Tema: Clasificación de artículos - Spaulding"},{"id":14,"question":"Según el Código de Ética del CIE, ¿qué componente ético se ve afectado cuando un profesional de enfermería se presenta a trabajar con una condición de salud que compromete la calidad y seguridad del cuidado brindado?","options":["Relación de la enfermera con la profesión","Relación con el equipo interdisciplinario","Relación de la enfermera con su práctica profesional","Relación de la enfermera con la comunidad"],"answer":"Relación de la enfermera con su práctica profesional","justification":"El Código de Ética del Consejo Internacional de Enfermeras se fundamenta en cuatro elementos principales. El escenario planteado se enmarca directamente en el elemento La enfermera y la práctica. Dentro de este pilar, el código establece explícitamente que la enfermera es personalmente responsable y debe rendir cuentas de su práctica. Un mandato textual de este apartado es que la enfermera mantendrá un nivel de salud personal que no comprometa su capacidad para dispensar cuidados. Presentarse a laborar con una condición física o mental que afecte la seguridad del paciente es una vulneración directa a su responsabilidad sobre la propia práctica profesional.","bibliography":"CIE (2016). Código Deontológico Subcomponente: 1.5 Ética profesional Tema: Código CIE - Práctica profesional"},{"id":15,"question":"¿Cuál es el componente del Código deontológico para la profesión del CIE que se evidencia cuando el profesional de enfermería se asegura de que la utilización de la tecnología y los progresos científicos están en consonancia con la seguridad, la dignidad y los derechos humanos?","options":["La enfermera y los pacientes.","La enfermera y la profesión.","La enfermera y la salud global.","La enfermera y la práctica."],"answer":"La enfermera y la práctica.","justification":"El Código Deontológico del Consejo Internacional de Enfermeras divide las responsabilidades éticas en cuatro elementos principales. El pilar de \"La enfermera y la práctica\" rige directamente cómo el profesional ejecuta su labor técnica y clínica diaria. Es en este apartado donde se establece de manera literal que la enfermera, al dispensar los cuidados, es responsable de cerciorarse de que el uso de la tecnología y los avances científicos se apliquen siempre respetando la seguridad, la dignidad y los derechos humanos del paciente, evitando que la tecnología deshumanice el cuidado.","bibliography":"CIE (2016). Código Deontológico del CIE Subcomponente: 1.5 Ética profesional Tema: Código CIE - Tecnología y derechos humanos"},{"id":16,"question":"Durante una evaluación domiciliaria, usted identifica que el paciente no comprende adecuadamente las indicaciones médicas ni el tratamiento que debe seguir. Según los patrones funcionales de salud de Marjory Gordon, ¿cuál de ellos está comprometido?","options":["Patrón rol y relaciones","Patrón autopercepción y autoestima","Patrón cognitivo-perceptivo","Patrón percepción y manejo de la salud"],"answer":"Patrón cognitivo-perceptivo","justification":"Los 11 Patrones Funcionales de Marjory Gordon son una herramienta fundamental de valoración en enfermería. El Patrón cognitivo-perceptivo evalúa las funciones sensoriales, la percepción del dolor y, de manera crucial, las capacidades cognitivas: el lenguaje, la memoria, el juicio, la toma de decisiones y el aprendizaje o comprensión. Cuando un paciente presenta un déficit de conocimientos o una incapacidad para procesar y comprender las indicaciones médicas y su plan de tratamiento, el diagnóstico de enfermería resultante se agrupa directamente bajo la alteración de este patrón cognitivo.","bibliography":"Alligood, M. (2022). Modelos y Teorías; Potter & Perry (2019) Subcomponente: 1.3 Proceso de atención Tema: Patrones funcionales - Marjory Gordon"},{"id":17,"question":"Dentro del marco de las prácticas seguras en la atención sanitaria, ¿cuál de los siguientes procedimientos corresponde específicamente a una práctica segura de tipo administrativa?","options":["Verificar correctamente los datos de identificación del paciente antes de realizar procedimientos.","Registrar los efectos adversos asociados a medicamentos de alto riesgo.","Supervisar la administración correcta de fármacos intravenosos.","Conciliar los medicamentos prescritos al momento del egreso hospitalario."],"answer":"Verificar correctamente los datos de identificación del paciente antes de realizar procedimientos.","justification":"La Identificación correcta del paciente está clasificada explícitamente como una práctica segura de tipo administrativa. Su objetivo es garantizar que la identidad administrativa registrada en el sistema o brazalete coincida de forma inequívoca con la persona que va a recibir la atención, utilizando siempre al menos dos identificadores (nombres/apellidos completos y número de cédula o historia clínica).","bibliography":"Potter & Perry (2019); Normas MSP seguridad del paciente Subcomponente: 1.6 Seguridad y calidad Tema: Prácticas seguras administrativas"},{"id":18,"question":"Una persona con crisis asmática severa presenta confusión, disnea, aleteo nasal y alteración en la relación ventilación/perfusión. La gasometría muestra PCO₂ elevado y pH limítrofe. ¿Cuál es el diagnóstico de enfermería más apropiado en esta situación?","options":["Deterioro en el intercambio gaseoso evidenciado por hipercapnia y signos de hipoxia.","Disminución de la frecuencia respiratoria relacionada con fatiga muscular.","Riesgo de insuficiencia cerebral secundaria a hipoventilación.","Alteración de la función neurológica causada por hipoxia cerebral."],"answer":"Deterioro en el intercambio gaseoso evidenciado por hipercapnia y signos de hipoxia.","justification":"El caso clínico presenta datos objetivos innegables a nivel alveolar: alteración en la relación ventilación/perfusión y una gasometría con PCO₂ elevado. Además, el paciente presenta confusión, que es un signo neurológico clásico de hipoxia cerebral e hipercapnia severa. En la taxonomía NANDA, el diagnóstico de Deterioro del intercambio de gases se define exactamente como el exceso o déficit en la oxigenación y/o eliminación de dióxido de carbono en la membrana alvéolo-capilar. La presencia de valores gasométricos alterados y cambios en el estado mental (confusión) son las características definitorias principales que confirman este diagnóstico por encima de cualquier otro.","bibliography":"Herdman, T. (2021). NANDA; Brunner & Suddarth (2019) Subcomponente: 1.3 Proceso de atención Tema: Diagnóstico NANDA - Intercambio gaseoso"},{"id":19,"question":"¿Cuál de las siguientes acciones corresponde específicamente a la etapa de ejecución dentro del Proceso de Atención de Enfermería (PAE)?","options":["Aplicar las intervenciones previamente planificadas en el cuidado del paciente.","Establecer los resultados deseados para el cuidado del paciente.","Analizar la información recolectada para formular diagnósticos.","Evaluar si se han cumplido los objetivos terapéuticos."],"answer":"Aplicar las intervenciones previamente planificadas en el cuidado del paciente.","justification":"El Proceso de Atención de Enfermería (PAE) es el método científico aplicado a la práctica clínica y consta de cinco etapas estandarizadas y secuenciales: Valoración, Diagnóstico, Planificación, Ejecución y Evaluación. La etapa de ejecución es el componente de \"acción\" del proceso. Comienza una vez que se ha desarrollado el plan de cuidados y consiste en llevar a cabo, delegar o documentar las intervenciones de enfermería (taxonomía NIC) que fueron previamente seleccionadas para ayudar al paciente a alcanzar los resultados esperados. Es el momento donde la teoría se convierte en cuidado directo.","bibliography":"Potter & Perry (2019). Fundamentos de enfermería Subcomponente: 1.3 Proceso de atención Tema: Etapas del PAE - Ejecución"},{"id":20,"question":"Según el modelo de autocuidado de Dorothea Orem, ¿cuál sería la intervención prioritaria en el plan de egreso para una paciente adulta mayor con secuelas neuromusculares tras un accidente cerebrovascular?","options":["Promover el uso de estrategias compensatorias para aumentar su independencia en el autocuidado.","Delegar el cuidado a los familiares para evitar riesgos de salud.","Coordinar visitas domiciliarias frecuentes ante cualquier requerimiento.","Mantener vigilancia permanente para prevenir nuevas lesiones."],"answer":"Promover el uso de estrategias compensatorias para aumentar su independencia en el autocuidado.","justification":"El Modelo de Déficit de Autocuidado de Dorothea Orem postula que el objetivo central de la enfermería es ayudar al individuo a llevar a cabo y mantener, por sí mismo, acciones de autocuidado para conservar la salud y la vida. En una paciente adulta mayor con secuelas neuromusculares post-ACV, existe un déficit entre sus capacidades actuales y las demandas de cuidado. Según Orem, la enfermera debe aplicar un sistema parcialmente compensatorio o de apoyo educativo. Esto significa que la intervención prioritaria no es hacer todo por la paciente, sino enseñarle, guiarla y promover el uso de estrategias compensatorias para restaurar su \"agencia de autocuidado\" y maximizar su independencia. .","bibliography":"Alligood, M. (2022). Modelos y Teorías de Enfermería Subcomponente: 1.1 Generalidades Tema: Teoría de Dorothea Orem - Autocuidado"},{"id":21,"question":"Le piden administrar midazolam 5 mg intravenosa y usted cuenta en el servicio con una presentación de 15 mg/3 ml. ¿Cuántos ml debe administrar?","options":["0.5 ml","2 ml","1 ml","1.5 ml"],"answer":"1 ml","justification":":Si la presentación es 15 mg en 3 ml, cada ml contiene 5 mg; por lo tanto, para administrar 5 mg de midazolam se requiere 1 ml. El cálculo correcto de dosis es una competencia esencial de enfermería clínica y un eje evaluado por el CACES por su impacto en la seguridad del paciente.","bibliography":"Harvey, M. (2016). Cálculo y administración de medicamentos Subcomponente: 1.2 Procedimientos básicos Tema: Cálculo de medicamentos - Midazolam"},{"id":22,"question":"¿Quién es la teórica de enfermería que propone un modelo centrado en los modos de adaptación del paciente frente a estímulos fisiológicos, psicológicos, sociales y del entorno de dependencia?","options":["Callista Roy, con su Modelo de Adaptación que contempla la respuesta del ser humano a los estímulos internos y externos.","Madeleine Leininger, con su teoría del Cuidado Transcultural.","Hildegard Peplau, conocida por su enfoque en la relación interpersonal enfermerapaciente.","Virginia Henderson, centrada en las necesidades humanas básicas como fundamento del cuidado."],"answer":"Callista Roy, con su Modelo de Adaptación que contempla la respuesta del ser humano a los estímulos internos y externos.","justification":"Sor Callista Roy desarrolló el Modelo de Adaptación, el cual concibe a la persona (o grupo) como un sistema biopsicosocial complejo en constante interacción con un entorno cambiante. Según su teoría, el nivel de adaptación de un paciente está determinado por el efecto combinado de los estímulos (focales, contextuales y residuales). Para hacer frente a estos estímulos y mantener el equilibrio, el ser humano activa mecanismos de afrontamiento que se manifiestan en cuatro modos de adaptación específicos","bibliography":"Alligood, M. (2022). Modelos y Teorías de Enfermería Subcomponente: 1.1 Generalidades Tema: Teoría de Callista Roy - Adaptación"},{"id":23,"question":" Al centro de salud acude a una madre con su hija de 6 meses para el control de rutina de su niña (crecimiento y desarrollo), peso 7120 gramos y talla de 66 centímetros, el personal de enfermería solicita la libreta integral de salud para el registro de las curvas correspondientes de peso y talla, determinando que la paciente se encuentra en percentil cero (0). ¿Cómo se interpreta este percentil obtenido?","options":["Peso y talla altos para la edad","Peso y talla normales para la edad","Peso y talla muy altos para la edad","Peso y talla bajos para la edad"],"answer":"Peso y talla bajos para la edad","justification":"El percentil indica el porcentaje de niños sanos de la misma edad y sexo que tienen un peso o talla inferior al del paciente evaluado. Un percentil cero (0), o encontrarse por debajo del percentil 3, significa que el niño está en el extremo inferior absoluto de la curva poblacional. Es decir, el 100% de los niños de referencia pesan y miden más que ella. Clínicamente, esto se diagnostica como talla baja (desnutrición crónica) y bajo peso para la edad (desnutrición global), lo que requiere intervención y derivación inmediata. .","bibliography":"Kliegman et al. (2020). Tratado de pediatría Nelson; MSP - Carnet de salud infantil Subcomponente: 2.6 Cuidados en niñez Tema: Crecimiento y desarrollo - Percentiles"},{"id":24,"question":"Una gestante de 34 años acude por su cuarto control prenatal. A la valoración de enfermería se determinan 28 semanas de gestación y riesgo de parto prematuro que conlleva a que el recién nacido presente enfermedad de membrana hialina. ¿Qué acción profiláctica se debe aplicar?","options":["Administrar gluconato de calcio","Administrar de betametasona","Iniciar aplicación de labetalol","Aplicación de fludrocortisona"],"answer":"Administrar de betametasona","justification":"La Enfermedad de Membrana Hialina o Síndrome de Distrés Respiratorio tipo 1 es una patología causada por el déficit de surfactante en pulmones inmaduros. Ante un riesgo inminente de parto prematuro, la medida profiláctica de elección es la maduración pulmonar fetal con corticoides. El esquema preferido es la betametasona (12 mg por vía intramuscular, cada 24 horas, por 2 dosis). Estos fármacos cruzan la barrera placentaria y aceleran la producción y liberación de surfactante por los neumocitos tipo II del feto, reduciendo drásticamente la mortalidad neonatal y las complicaciones respiratorias.","bibliography":"Cunningham et al. (2022). Williams Obstetrics; Normas MSP Subcomponente: 2.2 Cuidados en embarazo Tema: Farmaconocividad - Maduración pulmonar fetal (Betametasona)"},{"id":25,"question":"Durante la visita domiciliaria a un niño de 2 años 2 meses, el profesional de enfermería solicita a la madre la libreta integral de salud del niño. En la revisión del documento se verifica que el niño ha recibido las siguientes vacunas: A los 2 meses BCG, primeras dosis de rotavirus, pentavalente, neumococo y fipV; a los 4 meses las segundas dosis de rotavirus, pentavalente, neumococo, fipV y a los 6 meses terceras dosis de pentavalente, neumococo, bOPV y también ha recibido a los 24 meses las dosis de vacunas SRP1. ¿Qué vacunas corresponde administrar al niño?","options":["Pentavalente, neumococo, BCG","Terceras dosis de bOPV, DPT, SRP1","Pentavalente, SR, Rotavirus","Refuerzos de bOPV, DPT, SRP2, FA"],"answer":"Refuerzos de bOPV, DPT, SRP2, FA","justification":"Vacunas de los 12 meses (Pendientes): Según el esquema, al año de edad el niño debe recibir SRP1, Fiebre Amarilla y el refuerzo de Neumococo. El caso indica que el niño recibió la SRP1 recién a los 24 meses, por lo tanto, la dosis de Fiebre Amarilla sigue pendiente y debe administrarse. Vacunas de los 18 meses (Pendientes): A esta edad corresponden los primeros refuerzos de DPT y bOPV, además de la segunda dosis de SRP2. Como estos refuerzos no constan en la revisión de la libreta, son la prioridad inmediata. Aunque el niño tiene 2 años y 2 meses, el personal de enfermería debe completar el esquema omitido. La combinación correcta de biológicos a administrar hoy para protegerlo según su historial es: Refuerzo de bOPV, Refuerzo de DPT, SRP2 y Fiebre Amarilla (FA).","bibliography":"MSP (2021). Estrategia Nacional de Inmunizaciones Subcomponente: 2.6 Cuidados en niñez Tema: ENI - Esquema de vacunación"},{"id":26,"question":"Paciente de 30 años que se encuentra en el postparto inmediato, a la valoración de enfermería presenta: letargia, palidez, piel fría, diaforética, llenado capilar >3 segundos, frecuencia cardíaca de 130 latidos por minuto, presión arterial 65/40 milímetros de mercurio. De acuerdo con el caso planteado. ¿Cuál es el grado de shock hipovolémico que presenta la paciente?","options":["Severo.","Compensado.","Leve.","Moderado."],"answer":"Severo.","justification":"Hipotensión Crítica: Una presión arterial sistólica de 65 mmHg indica una pérdida de volumen sanguíneo superior al 35-40% (aproximadamente más de 2000 ml en una paciente obstétrica estándar). Esto ya categoriza el choque como Grado IV o Severo. Signos de Hipoperfusión Orgánica: La letargia es un indicador de que el flujo sanguíneo cerebral está comprometido. En los grados leves o moderados, la paciente suele estar normal, ansiosa o agitada, pero no letárgica. Compensación Fallida: El cuerpo intenta compensar la pérdida con taquicardia extrema (130 lpm), pero la presión arterial ya no se puede mantener, lo que marca la transición de un choque compensado/moderado a uno severo (descompensado).","bibliography":"Cunningham et al. (2022). Williams Obstetrics; Brunner & Suddarth (2019) Subcomponente: 2.2 Cuidados puerperio Tema: Shock hipovolémico postparto"},{"id":27,"question":"El profesional de enfermería brinda atención a un paciente de 26 años en el puerperio inmediato con evolución de 7 horas quien refiere que no tiene una buena producción de leche materna, mostrándose preocupada por el crecimiento y desarrollo de su bebé. ¿Qué actividad de enfermería realiza inmediatamente?","options":["Educar fomentando una alimentación complementaria a libre demanda.","Fomentando el uso de fórmula y alimentación complementaria.","Educar fomentando la succión y lactancia materna exclusiva con horario.","Educar fomentando una buena succión y lactancia materna exclusiva a libre demanda."],"answer":"Educar fomentando una buena succión y lactancia materna exclusiva a libre demanda.","justification":"En el puerperio inmediato, es fisiológicamente normal que la producción de leche parezca escasa, ya que la madre está produciendo calostro, el cual se secreta en volúmenes pequeños pero suficientes para la capacidad gástrica del recién nacido. La actividad prioritaria de enfermería ante la preocupación de la madre debe basarse en la fisiología de la lactancia. La producción de leche depende directamente del estímulo de succión, el cual activa la liberación de prolactina y oxitocina. Al asegurar una buena técnica de succión y fomentar la libre demanda, se garantiza el vaciamiento del pecho, enviando la señal hormonal necesaria para aumentar la producción láctea y asegurar el crecimiento adecuado del neonato.","bibliography":"Cunningham et al. (2022). Williams Obstetrics; MSP - Normas de lactancia Subcomponente: 2.2 Cuidados puerperio Tema: Lactancia materna - Producción de leche"},{"id":28,"question":"Paciente femenina de 28 años acude con su hijo de 10 días de nacido al centro de salud para el tamizaje metabólico neonatal. A la valoración de enfermería en recién nacido se encuentra en ayuno y con un adecuado peso para la edad. ¿Cuál es la edad óptima para realizar dicho procedimiento?","options":["A partir del tercer día hasta los 30 días de nacido","A partir del cuarto día hasta los 28 días de nacido","A partir del segundo día hasta los 28 días de nacido","A partir del primer día hasta los 28 días de nacido"],"answer":"A partir del cuarto día hasta los 28 días de nacido","justification":"El tamizaje metabólico neonatal es una prueba de salud pública obligatoria en Ecuador que permite detectar precozmente enfermedades metabólicas congénitas (hipotiroidismo congénito, fenilcetonuria, hiperplasia suprarrenal congénita, galactosemia, entre otras). Según el MSP del Ecuador: La muestra debe tomarse a partir del 4to día y hasta el día 28 después del nacimiento. Antes del tercer día pueden presentarse falsos negativos, especialmente para hipotiroidismo congénito.","bibliography":"MSP/Manual AIEPI (Clínico Cuadros de Procedimientos) Actualización 2017. Subcomponente: 2.4 Cuidados del recién nacido Tema: Tamizaje metabólico neonatal"},{"id":29,"question":"Mujer de 32 años multigesta, embarazada de 38 semanas, presenta contracciones uterinas regulares. Es valorada por el médico quien realiza tacto vaginal y refiere que se encuentra en labor de parto fase latente, por lo que permanece en observación y controles secuenciales. ¿Cuál es el cambio fisiológico que está ocurriendo en el cérvix en esta etapa?","options":["Borramiento y dilatación","Mayor rigidez y menor elasticidad","Cierre hermético y protección","Disminución de tamaño"],"answer":"Borramiento y dilatación","justification":"La fase latente del trabajo de parto corresponde al inicio de la primera etapa del parto. Según el Manual de Atención del Parto Normal (MSP): Durante esta fase ocurre: Borramiento cervical: acortamiento progresivo del cuello uterino. Dilatación inicial: generalmente hasta 3–4 cm. Reblandecimiento del tejido cervical por acción hormonal. Las otras opciones describen condiciones contrarias al trabajo de parto, como rigidez o cierre cervical.","bibliography":"Cunningham et al. (2022). Williams Obstetrics; MSP - Manual atención del parto Subcomponente: 2.2 Cuidados parto Tema: Fisiología del parto - Cambios cervicales"},{"id":30,"question":"Un recién nacido a término con peso de 2950 gramos, en los resultados de grupo y factor sanguíneo es ARH+, madre ORH+. A la valoración se observa ictérico hasta zona de Kramer 3, presenta bilirubinas totales de 15.5 mg/dl. ¿Cuál es la patología del recién nacido?","options":["Ictericia de leche materna","Hiperbilirrubinemia fisiológica","Ictericia por deshidratación","Hiperbilirrubinemia patológica"],"answer":"Hiperbilirrubinemia patológica","justification":"El diagnóstico se define como hiperbilirrubinemia patológica debido a la presencia de un mecanismo de producción de ictericia que no es normal ni esperado en el desarrollo fisiológico: la incompatibilidad de grupo sanguíneo. En este caso, la madre es O y el recién nacido es A. Esta interacción provoca una hemólisis que libera bilirrubina de forma acelerada. Además, un valor de 15.5 mg/dl en un recién nacido a término supera los umbrales de la ictericia fisiológica (que usualmente no sobrepasa los 12-13 mg/dl). La extensión clínica hasta la Zona 3 de Kramer correlaciona con niveles elevados que requieren vigilancia o tratamiento","bibliography":"Kliegman et al. (2020). Tratado pediatría Nelson; OPS (2006). AIEPI Neonatal Subcomponente: 2.4 Cuidados recién nacido Tema: Hiperbilirrubinemia - Escala Kramer"},{"id":31,"question":"Recién nacido prematuro de 24 horas de vida, se encuentra en el servicio de neonatología recibiendo fototerapia, el momento de la valoración presenta ictericia progresiva hacia el abdomen, según la estimación visual de la ictericia por escala de Kramer. ¿Cuál es su interpretación de la escala?","options":["Zona 1","Zona 4","Zona 3","Zona 2"],"answer":"Zona 2","justification":"La Escala de Kramer es una herramienta clínica utilizada para estimar los niveles de bilirrubina sérica en el recién nacido mediante la observación de la progresión cefalocaudal de la ictericia. Según esta escala, la Zona 2 corresponde a la ictericia que se localiza en el tronco superior, abarcando desde el cuello hasta el nivel del ombligo (abdomen superior). Dado que el caso indica que la ictericia ha progresado hacia el abdomen, la clasificación clínica inmediata es la Zona 2.","bibliography":"Kliegman et al. (2020). Tratado pediatría Nelson Subcomponente: 2.4 Cuidados recién nacido Tema: Fototerapia - Escala Kramer"},{"id":32,"question":"Durante una consulta prenatal, una mujer embarazada de 19 semanas manifiesta haber tenido múltiples parejas sexuales y desconocer el historial sexual de su pareja. ¿Qué prueba diagnóstica inicial es la más adecuada para detectar una posible infección por VIH?","options":["Prueba confirmatoria de Western Blot.","Test de tamizaje ELISA.","Cuantificación de linfocitos T CD4+","Dosificación de interleuquina 6."],"answer":"Test de tamizaje ELISA.","justification":"Según los protocolos de atención prenatal, el abordaje inicial (cribado o tamizaje) para VIH se realiza con pruebas de alta sensibilidad como el ELISA (Enzyme-Linked Immunosorbent Assay) o pruebas rápidas de cuarta generación. Estas pruebas buscan detectar anticuerpos y/o antígenos. Si el resultado es reactivo, se procede posteriormente a una prueba confirmatoria (como Western Blot o Inmunofluorescencia), pero el paso inicial obligatorio es el tamizaje.”.","bibliography":"Cunningham et al. (2022). Williams Obstetrics; Normas MSP Subcomponente: 2.2 Cuidados embarazo Tema: VIH - Tamizaje prenatal (ELISA)"},{"id":33,"question":"En un recién nacido, al detectarse frío ambiental a través de la piel, se activa el sistema nervioso simpático para generar calor mediante el uso del tejido adiposo marrón. ¿Cómo se denomina este proceso?","options":["Transferencia de calor desde el cuerpo hacia el aire por contacto.","Activación del metabolismo graso en el tejido pardo para producir calor.","Pérdida de calor al tocar superficies frías.","Eliminación de calor a través del sudor."],"answer":"Activación del metabolismo graso en el tejido pardo para producir calor.","justification":"Los recién nacidos tienen una capacidad limitada para generar calor mediante escalofríos. Su principal mecanismo de defensa contra el frío es la termogénesis química o sin escalofríos, la cual ocurre en la grasa parda. Este tejido, rico en mitocondrias y vascularización, se metaboliza rápidamente ante la estimulación del sistema nervioso simpático (liberación de noradrenalina) para producir calor y calentar la sangre que circula hacia los órganos vitals.","bibliography":"OPS (2006). Manual AIEPI Neonatal; Kliegman et al. (2020) Subcomponente: 2.4 Cuidados recién nacido Tema: Termorregulación neonatal - Termogénesis química"},{"id":34,"question":"¿Cuál es la vía y región de administración de la vacuna Triple Viral SRP según el Programa Ampliado de Inmunizaciones del Ecuador / Estrategia Nacional de Inmunizaciones?","options":["Vía intradérmica en la región deltoidea.","Vía intramuscular en el vasto externo.","Vía subcutánea en el deltoides del brazo izquierdo.","Vía subcutánea en la región periumbilical."],"answer":"Vía subcutánea en el deltoides del brazo izquierdo.","justification":"Las vacunas de virus vivos atenuados como la SRP (Sarampión, Rubéola, Paperas) se administran habitualmente por vía subcutánea para asegurar una absorción lenta y efectiva, minimizando reacciones locales. La región anatómica estandarizada en niños mayores de 12 meses (edad de la primera dosis de SRP) es el músculo deltoides del brazo (frecuentemente el izquierdo por convención en esquemas nacionales para diferenciar de otras vacunas).","bibliography":"MSP (2021). Estrategia Nacional de Inmunizaciones Subcomponente: 2.6 Cuidados niñez Tema: Vacuna SRP - Vía de administración"},{"id":35,"question":"Una gestante de término se encuentra en la primera fase del trabajo de parto. Según el protocolo de atención obstétrica, ¿qué acción corresponde a esta etapa?","options":["Evaluar la indicación de episiotomía y fomentar el contacto precoz madre- hijo para iniciar la lactancia.","Administrar oxitocina y realizar masaje uterino inmediatamente.","Monitorizar la contractilidad uterina y frecuencia fetal cada 15 minutos.","Efectuar masaje uterino frecuente para prevenir atonía uterina."],"answer":"Monitorizar la contractilidad uterina y frecuencia fetal cada 15 minutos.","justification":"Durante la primera fase del trabajo de parto, especialmente en la fase activa, la prioridad es la vigilancia materno-fetal mediante el control periódico de la dinámica uterina y la frecuencia cardíaca fetal, con el fin de identificar oportunamente alteraciones. Según las guías obstétricas del MSP y la OMS, las intervenciones como episiotomía o masaje uterino corresponden a fases posteriores.","bibliography":"Cunningham et al. (2022). Williams Obstetrics; Normas MSP Subcomponente: 2.2 Cuidados parto Tema: Primera fase del parto - Monitorización"},{"id":36,"question":"La escala de Ballard se utiliza para estimar la edad gestacional de un recién nacido. En relación con los signos que permiten valorar la madurez física, ¿cuáles corresponden correctamente a esta dimensión?","options":["Desarrollo de ojos, pabellones auriculares, genitales, textura de la piel, lanugo y mamas.","Evaluación de ángulos articulares, postura y ventana cuadrada.","Extensión del brazo, talón a oreja y signo de la bufanda.","Ángulo poplíteo, tono muscular, flexión de extremidades."],"answer":"Desarrollo de ojos, pabellones auriculares, genitales, textura de la piel, lanugo y mamas.","justification":"Escala de Ballard divide sus 12 criterios de evaluación en dos grandes dimensiones: madurez física y madurez neuromuscular. La dimensión de madurez física se centra exclusivamente en las características anatómicas externas que evolucionan visiblemente según la edad gestacional, tales como la textura de la piel, la presencia de lanugo, el desarrollo del tejido mamario, la formación de los pabellones auriculares y la diferenciación de los genitales externos. Por el contrario, criterios como la ventana cuadrada, el signo de la bufanda o el ángulo poplíteo evalúan el tono muscular y la resistencia de las articulaciones, los cuales pertenecen estrictamente a la dimensión neuromuscular, lo que convierte a la observación de los órganos y tejidos externos en la única respuesta correcta para esta categoría.","bibliography":"OPS (2006). Manual AIEPI Neonatal; Kliegman et al. (2020) Subcomponente: 2.4 Cuidados recién nacido Tema: Escala de Ballard - Madurez física"},{"id":37,"question":"Durante una valoración rutinaria, la enfermera observa a un lactante en posición prona. Nota que el niño es capaz de levantar la cabeza y el pecho mientras se apoya en sus antebrazos. Según las etapas del desarrollo motor grueso, ¿en qué rango de edad se espera que los lactantes logren esta habilidad postural?","options":["De 2 a 4 meses","De 5 a 7 meses","De 6 a 9 meses","De 8 a 10 meses"],"answer":"De 2 a 4 meses","justification":"Entre los 2 y 4 meses, el lactante logra levantar la cabeza y el pecho apoyándose en los antebrazos en posición prona, reflejando maduración del control cervical y del tronco. Este hito es fundamental en la valoración del desarrollo psicomotor infantil según guías de crecimiento y desarrollo del MSP.","bibliography":"Kliegman et al. (2020). Tratado pediatría Nelson; MSP - Guías desarrollo Subcomponente: 2.6 Cuidados niñez Tema: Desarrollo motor grueso - Lactante"},{"id":38,"question":"Un neonato con diagnóstico de hipoglicemia requiere la administración de una solución de dextrosa al 12.5%. En la unidad de neonatología se cuenta únicamente con soluciones de dextrosa al 10% y al 50%. Si el volumen total a preparar es de 150 ml, ¿cuál debe ser la proporción exacta de cada solución para obtener la concentración deseada?","options":["140.62 ml de Dextrosa al 10% + 9.37 ml de Dextrosa al 50%","130 ml de Dextrosa al 10% + 20 ml de Dextrosa al 50%","140.62 ml de Dextrosa al 50% + 9.37 ml de Dextrosa al 10%","110 ml de Dextrosa al 10% + 40 ml de Dextrosa al 50%"],"answer":"140.62 ml de Dextrosa al 10% + 9.37 ml de Dextrosa al 50%","justification":"Aplicando el método de diluciones, esta combinación permite obtener 150 ml de dextrosa al 12.5%, concentración segura para uso neonatal. El cálculo correcto de soluciones intravenosas es una competencia esencial evaluada en el CACES por su impacto directo en la seguridad del paciente.","bibliography":"Harvey, M. (2016). Cálculo y administración de medicamentos Subcomponente: 2.4 Cuidados recién nacido Tema: Diluciones - Dextrosa neonatal"},{"id":39,"question":"En el marco del cuidado de enfermería para prevenir la anemia por deficiencia de hierro en niños menores de cinco años, ¿cuál es la recomendación basada en las normas nacionales de nutrición infantil?","options":["Promover la alimentación complementaria desde los 6 meses junto a la lactancia materna.","Ofrecer suplementos multivitamínicos desde los 4 meses de forma universal.","Aconsejar el inicio de alimentos sólidos desde los 3 meses para mejorar el estado nutricional.","Mantener la lactancia materna exclusiva hasta los 12 meses sin introducir otros alimentos."],"answer":"Promover la alimentación complementaria desde los 6 meses junto a la lactancia materna.","justification":"Durante los primeros 6 meses, la lactancia materna exclusiva cubre las necesidades de hierro gracias a su alta biodisponibilidad. Sin embargo, a partir del sexto mes, las reservas de hierro del lactante se agotan y la leche materna por sí sola ya no es suficiente para cubrir los requerimientos diarios. Por ello, la norma establece el inicio de la alimentación complementaria a los 6 meses, priorizando la introducción de alimentos de origen animal ricos en hierro hemínico (como hígado, sangre de pollo, carnes rojas) para evitar el desarrollo de anemia.","bibliography":"Kliegman et al. (2020); MSP - Normas nutrición; OMS Subcomponente: 2.6 Cuidados niñez Tema: Prevención anemia - Nutrición infantil"},{"id":40,"question":"Una gestante de 30.4 semanas con diagnóstico de ruptura prematura de membranas refiere pérdida de líquido claro por vía vaginal. La ecografía muestra un índice de líquido amniótico bajo. ¿Cuál es la intervención prioritaria de enfermería para prevenir riesgos materno-fetales?","options":["Indicar reposo absoluto para reducir el riesgo de parto prematuro e infección.","Estimular la hidratación oral con líquidos claros para recuperar el volumen de líquido amniótico.","Realizar controles mamarios periódicos para iniciar preparación para lactancia.","Trasladar de inmediato a la sala de parto ante sospecha de trabajo de parto activo."],"answer":"Indicar reposo absoluto para reducir el riesgo de parto prematuro e infección.","justification":"En casos de ruptura prematura de membranas pretérmino (30.4 semanas), el objetivo primordial es prolongar el embarazo de forma segura para permitir la maduración fetal, siendo el reposo absoluto la intervención prioritaria para minimizar la pérdida continua de líquido amniótico y mantener un volumen suficiente que proteja al feto. Esta medida es crucial para prevenir complicaciones mecánicas graves, como el prolapso del cordón umbilical, y para reducir el riesgo de desencadenar contracciones uterinas prematura.","bibliography":"Cunningham et al. (2022). Williams Obstetrics; Normas MSP Subcomponente: 2.2 Cuidados embarazo Tema: RPM - Oligohidramnios"},{"id":41,"question":"Si los frascos multidosis de las vacunas DPT, DT, dT y OPV no presentan signos de contaminación tras su apertura, ¿cuál es el tiempo máximo recomendado para su uso posterior según las normas de bioseguridad?","options":["Pueden utilizarse hasta por 6 semanas.","Es seguro su uso hasta por un período de 4 semanas.","Solo pueden usarse dentro de los primeros 3 días tras la apertura.","Deben desecharse luego de 5 semanas de haber sido abiertos."],"answer":"Pueden utilizarse hasta por 6 semanas.","justification":"De acuerdo con las Normas del Programa Ampliado de Inmunizaciones (PAI) del Ministerio de Salud Pública del Ecuador, y en concordancia con la política de Frascos Multidosis Abiertos (MDVP) de la OMS, las vacunas DPT, DT, dT y OPV pueden utilizarse hasta por 28–42 días (4 a 6 semanas) después de su apertura, siempre que se cumplan estrictamente las condiciones de bioseguridad: conservación permanente de la cadena de frío entre +2 °C y +8 °C, uso de técnica aséptica en cada punción, frasco íntegro, sin contaminación visible, sin cambios de color, sin partículas extrañas, con fecha y hora de apertura registrada y dentro de la fecha de caducidad.","bibliography":"MSP (2021). Estrategia Nacional de Inmunizaciones; OMS – MDVP Subcomponente: 2.6 Cuidados niñez Tema: ENI - Frascos multidosis"},{"id":42,"question":"Durante la auscultación pulmonar en un paciente pediátrico diagnosticado con asma, ¿cuál de los siguientes hallazgos acústicos es el más característico de esta condición?","options":["Roce pleural durante los movimientos respiratorios.","Sonido respiratorio suave y uniforme.","Presencia de silbidos audibles durante la espiración.","Ruidos burbujeantes al final de la inspiración"],"answer":"Presencia de silbidos audibles durante la espiración.","justification":"Las sibilancias son el hallazgo acústico más característico del asma pediátrico, originadas por la turbulencia del aire al pasar a través de bronquios estrechados por inflamación, broncoespasmo y exceso de moco. Aunque pueden presentarse en ambas fases respiratorias, son predominantemente espiratorias debido a que el aumento de la presión intratorácica durante la exhalación colapsa dinámicamente las vías aéreas ya obstruidas, acentuando el sonido sibilante. Este signo permite diferenciar la crisis asmática de otras patologías respiratorias, como las neumonías (donde predominan los estertores) o las pleuritis (donde se ausculta el roce pleural), siendo fundamental para la valoración clínica rápida y el inicio del tratamiento broncodilatador","bibliography":"Kliegman et al. (2020). Tratado pediatría Nelson Subcomponente: 2.6 Cuidados niñez Tema: Asma pediátrica - Auscultación (Sibilancias)"},{"id":43,"question":" Un paciente de 68 años hospitalizado con diagnóstico de insuficiencia cardiaca congestiva. A la valoración presenta: disnea, cansancio, edema con fóvea en miembros inferiores, oliguria, ansiedad y alteración del sueño en la última semana. ¿Qué intervención de enfermería es la principal a realizar en este caso?","options":["Controla la ansiedad del paciente","Administrar furosemida de acuerdo a prescripción","Administrar oxígeno suplementario a 2 litros por minuto","Control de ingesta y eliminación diario"],"answer":"Administrar furosemida de acuerdo a prescripción","justification":"Ante un paciente con insuficiencia cardíaca congestiva que presenta signos claros de sobrecarga de volumen como edema, oliguria y disnea, la intervención principal consiste en la administración de diuréticos de asa como la furosemida para promover la eliminación de líquidos y reducir la precarga cardíaca. Esta acción aborda directamente la causa fisiopatológica de la congestión pulmonar y sistémica, permitiendo mejorar el intercambio gaseoso y aliviar el esfuerzo respiratorio de manera más definitiva que las medidas de soporte sintomático, constituyendo el paso esencial para estabilizar el balance hídrico y hemodinámico del paciente.","bibliography":"Brunner & Suddarth (2019). Enfermería Medico quirúrgica Subcomponente: 3.2 Cuidados problemas prevalentes Tema: Insuficiencia cardíaca - Balance hídrico"},{"id":44,"question":"Paciente masculino de 45 años acude al centro de salud. Refiere al profesional de enfermería que ha perdido su trabajo recientemente, que su esposa le ha pedido el divorcio, que tiene dificultad para conciliar el sueño y cambios en el apetito. Hoy sus antecedentes familiares revelan que su padre se suicidó a los 53 años. ¿Qué variables debe evaluar el profesional de enfermería?","options":["De percepción de funcionamiento","Espirituales","Emocionales","Socioeconómicas"],"answer":"Emocionales","justification":"El profesional de enfermería debe evaluar prioritariamente las variables emocionales, ya que el paciente atraviesa una crisis situacional severa caracterizada por múltiples pérdidas y manifestaciones somáticas de angustia, lo que sumado a un antecedente familiar directo de suicidio eleva significativamente el riesgo de depresión mayor e ideación autolítica. Esta valoración permite identificar estados de desesperanza, niveles de ansiedad y la capacidad de afrontamiento del individuo, elementos críticos para establecer un plan de cuidados preventivo y de soporte psicológico que garantice la integridad del paciente ante su evidente vulnerabilidad emocional y el riesgo heredofamiliar detectado.","bibliography":""},{"id":45,"question":"Paciente con antecedentes de cáncer de mama estadio IV, ingresa al servicio por terapia de dolor, el médico prescribe la administración de un medicamento que actúe como un potente agonista de los receptores opiáceos. ¿Cuál es el medicamento que se administra con base al mecanismo de acción descrito?","options":["Metamizol","Morfina","Paracetamol","Ketorolaco"],"answer":"Morfina","justification":"La morfina es el fármaco de elección en el manejo del dolor oncológico severo debido a su mecanismo de acción como agonista puro y potente de los receptores opiáceos, especialmente los receptores mu ($\\mu$) situados en el sistema nervioso central. Al unirse a estos receptores, la morfina bloquea la transmisión de las señales de dolor en la médula espinal y modifica la percepción sensorial y emocional del estímulo nociceptivo en el cerebro, cumpliendo con los criterios terapéuticos del tercer escalón de la Escalera Analgésica de la OMS.","bibliography":""},{"id":46,"question":"Un paciente de 58 años diagnosticado con enfermedad de Parkinson desde hace un año, acude a consulta externa y presenta temblor en reposo, rigidez muscular y movimientos involuntarios más persistentes. Manifiesta no haber tomado la medicación regularmente. ¿Qué intervención de enfermería es la indicada para el cuidado de este paciente?","options":["Fomentar la participación en actividades físicas de alto impacto","Educar al paciente y familia sobre las complicaciones y el apego al tratamiento","Fomentar el consumo de alimentos ricos en vitaminas B12","Proporcionar terapia de masaje profundo para aliviar la rigidez muscular"],"answer":"Educar al paciente y familia sobre las complicaciones y el apego al tratamiento","justification":"En el manejo de la enfermedad de Parkinson, el pilar fundamental para el control de los síntomas motores como el temblor y la rigidez es el mantenimiento de niveles terapéuticos constantes de dopamina mediante el tratamiento farmacológico. Dado que el paciente admite una falta de adherencia a la medicación, la intervención de enfermería prioritaria es la educación sanitaria dirigida tanto al paciente como a su red de apoyo, enfatizando que la irregularidad en las dosis no solo exacerba la sintomatología actual, sino que acelera la aparición de fluctuaciones motoras y complicaciones incapacitantes.","bibliography":""},{"id":47,"question":"Paciente de 82 años ingresa al servicio de urgencias tras sufrir una caída en su domicilio. Presenta dolor intenso en la cadera derecha, deformidad y limitación funcional. Hoy la radiografía confirma una fractura intertrocantérea de cadera. Hoy se programa intervención quirúrgica en las próximas 24 horas. ¿Cuál es la intervención de enfermería prioritaria en las horas previas a la cirugía del paciente?","options":["Usar un rollo de trocánter, rotar hacia el lado sano.","Administrar antibióticos profilácticos intravenosos antes de la cirugía","Administrar anticoagulantes para evitar el riesgo de trombos por el tiempo de reposo","Mantener la extremidad afectada inmovilizada y en posición funcional"],"answer":"Mantener la extremidad afectada inmovilizada y en posición funcional","justification":"La intervención de enfermería prioritaria ante una fractura de cadera en el periodo preoperatorio es la inmovilización de la extremidad afectada en una posición funcional, ya que esto estabiliza los fragmentos óseos, reduce significativamente el dolor derivado de los espasmos musculares y previene lesiones secundarias en los tejidos blandos y paquetes neurovasculares. Al mantener la alineación anatómica, se minimiza el riesgo de complicaciones sistémicas graves como el embolismo graso y se garantiza la seguridad del paciente durante las maniobras de cuidado y el traslado al quirófano, cumpliendo con los estándares de soporte inicial que priorizan la protección mecánica del foco de fractura antes de la resolución quirúrgica definitiva.","bibliography":""},{"id":48,"question":"Paciente de 45 años, ingrese al servicio de urgencias con diagnóstico de trauma cráneoencefálico grave, con una puntuación en la escala de Glasgow 8/15. Para su manejo se requiere intubación orotraqueal. Como profesional de enfermería, usted debe confirmar la correcta posición del tubo mediante un dispositivo que permita medir la presión parcial de CO2 en el aire espirado. ¿Cuál es el dispositivo principal que usted utiliza en este caso?","options":["Endotest","Oxímetro de pulso","Gasómetro","Capnógrafo"],"answer":"Capnógrafo","justification":"El capnógrafo es el dispositivo estándar de oro para confirmar la correcta colocación del tubo orotraqueal, ya que mide de forma continua y no invasiva la presión parcial de dióxido de carbono en el aire espirado, lo que permite diferenciar de manera inmediata una intubación traqueal de una esofágica. En pacientes con trauma craneoencefálico grave, este monitoreo es doblemente crítico: además de verificar la vía aérea, permite al personal de enfermería y medicina ajustar la ventilación para mantener niveles de co2 dentro de rangos neuroprotectores, evitando la vasoconstricción cerebral por hipocapnia o el aumento de la presión intracraneal por hipercapnia.","bibliography":""},{"id":49,"question":"Paciente varón de 70 años ingresado en el hospital con diagnóstico de enfermedad cerebrovascular, al momento presenta disfagia severa. El equipo médico decide implementar alimentación enteral para asegurar la nutrición adecuada del paciente. ¿Qué sonda es la más adecuada para este caso?","options":["Sonda nasogástrica","Sonda por gastrostomía","Sonda por yeyunostomía","Sonda nasoyeyunal"],"answer":"Sonda por gastrostomía","justification":"En pacientes con enfermedad cerebrovascular y disfagia severa que requieren alimentación enteral a largo plazo, la gastrostomía es la opción más adecuada. Permite una alimentación segura, reduce el riesgo de aspiración y es más cómoda para el paciente que las sondas nasales.","bibliography":""},{"id":50,"question":" Paciente de 75 años ingresa en el hospital con signos y síntomas de insuficiencia cardíaca congestiva (ICC). Presenta disnea, edema en miembros inferiores +/++++, ortopnea y fatiga. Según hallazgo radiológico se encuentra cardiomegalia y un BNP (péptido natriurético cerebral) de 50 picogramos por mililitro. ¿Cuál de las siguientes intervenciones de enfermería es principal para este paciente?","options":["Enseñar al paciente sobre la restricción de sodio en la dieta","Administrar furosemida intravenosa","Colocar al paciente en posición semifowler","Monitorizar los niveles de potasio sérico"],"answer":"Colocar al paciente en posición semifowler","justification":"La elección de la posición Semi-Fowler como intervención principal se fundamenta en la jerarquía de atención de enfermería, que prioriza las acciones autónomas para estabilizar el patrón respiratorio (B de Breathing) antes que las intervenciones dependientes de prescripción médica. Ante la presencia de ortopnea y disnea, la elevación de la cabecera es la medida mecánica inmediata más eficaz para disminuir el retorno venoso, reducir la presión sobre el diafragma y optimizar la expansión pulmonar, ofreciendo alivio sintomático instantáneo.","bibliography":""},{"id":51,"question":"  Paciente de 18 años ingresa al servicio de emergencias por trauma torácico penetrante a nivel de cuarto espacio intercostal derecho, hola inmediatamente se coloca un sistema drenaje torácico, se realiza una RX hoy de tórax evidenciando que el tubo se encuenta en el mediastino. Paciente con intenso dolor a nivel de tórax a la valoración de EVA se obtiene un puntaje de 9/10, además presenta: disnea, diaforesis, taquipnea, se evidencia que el sistema Pleurevac no presenta burbujeo ni fluctuaciones. ¿Qué cámara del sistema de drenaje torácico nos permite evidenciar esta complicación?","options":["La cámara de sello de agua","La cámara con válvula de presión positiva","La cámara de recolección","La cámara de control de aspiración"],"answer":"La cámara de sello de agua","justification":"La cámara de sello de agua es el componente del sistema de drenaje torácico diseñado para actuar como una válvula unidireccional y, fundamentalmente, como un monitor de la dinámica pleural, donde se deben observar fluctuaciones (oscilaciones del nivel de agua con la respiración) y burbujeo en caso de fuga aérea. La ausencia de estos signos físicos en la cámara de sello de agua, sumada al hallazgo radiológico del tubo en el mediastino, evidencia que el catéter no se encuentra en el espacio pleural y, por tanto, no está sometido a los cambios de presión intrapleural del ciclo respiratorio, lo que explica la persistencia de la disnea y el dolor intenso del paciente.","bibliography":""},{"id":52,"question":"Paciente de 27 años ingresa al hospital por presentar palidez, taquicardia, presión arterial baja, dolor a nivel de pecho y mareos, con antecedente de enfermedad cardíaca y en los exámenes de laboratorio se reporta: hemoglobina 9 g/dL. El médico confirma el diagnóstico de anemia e indica realizar una transfusión sanguínea para mejorar su estado. ¿Cuál es la intervención de enfermería principal en este paciente?","options":["Administrar un diurético antes de la transfusión.","Calentar la bolsa de sangre para evitar hipotermia.","Valorar al paciente antes de la transfusión.","Administrar el hemoderivado dentro de las 5 horas."],"answer":"Administrar un diurético antes de la transfusión.","justification":"La valoración integral del paciente antes de iniciar una transfusión sanguínea es la intervención de enfermería prioritaria y fundamental, ya que permite establecer una línea base clínica indispensable para identificar precozmente cualquier reacción transfusional o complicación circulatoria. En este caso específico, el antecedente de enfermedad cardíaca eleva el riesgo de Sobrecarga Circulatoria Asociada a la Transfusión, por lo que la evaluación previa de ruidos pulmonares y presión arterial es crítica para garantizar la seguridad del procedimiento. Además, este paso incluye la verificación obligatoria del paciente, el grupo sanguíneo y el hemoderivado, cumpliendo con los protocolos internacionales de seguridad del paciente que exigen la detección de riesgos antes de la administración de cualquier biológico.","bibliography":""},{"id":53,"question":"Relacione los siguientes tipos de catéter utilizados en terapias intravenosas con sus dos características correspondientes:","options":["1 be, 2 df, 3 ac","1 bf, 2 ad, 3 ce","1 bc, 2 de, 3 af","1 ae, 2 bc, 3 df"],"answer":"1 ae, 2 bc, 3 df","justification":"El catéter venoso periférico se caracteriza por ser una cánula corta y radiopaca, diseñada para terapias de corta duración en venas periféricas; el catéter venoso subcutáneo se inserta quirúrgicamente y se conecta generalmente a una vena subclavia, iniciando su trayecto en venas superficiales y permitiendo accesos prolongados; mientras que el catéter venoso central tiene su extremo distal en la vena cava superior y se asocia a sistemas con reservorio o de larga permanencia, lo que permite la administración segura de soluciones hiperosmolares, nutrición parenteral y medicamentos de alto riesgo.","bibliography":""},{"id":54,"question":"¿Qué manifestaciones clínicas son características del deterioro cognitivo avanzado en pacientes con enfermedad de Alzheimer?","options":["Dificultad para nombrar objetos, pérdida de la capacidad de ejecutar actos motores voluntarios y alteraciones en la lectura.","Disminución de la sensibilidad y alteraciones motoras con marcha festinante.","Alteraciones emocionales con salivación excesiva y disfagia.","Rigidez muscular, lentitud motora e inestabilidad postural."],"answer":"Dificultad para nombrar objetos, pérdida de la capacidad de ejecutar actos motores voluntarios y alteraciones en la lectura.","justification":"En la fase avanzada (o severa) de la enfermedad de Alzheimer, el daño neuronal se extiende a áreas de la corteza cerebral que controlan el lenguaje, el razonamiento y el procesamiento sensorial. Esto deriva en el síndrome \"AAA\": ·Afasia: Dificultad para nombrar objetos (anomia) y comunicarse. ·Apraxia: Pérdida de la capacidad de ejecutar actos motores voluntarios (como vestirse o comer), a pesar de tener la función motora física intacta. ·Agnosia: Incapacidad para reconocer objetos o personas familiares.","bibliography":""},{"id":55,"question":" ¿Qué parámetro hemodinámico se evalúa principalmente mediante la medición de la Presión Venosa Central (PVC) en un paciente crítico?","options":["Nivel de llenado del ventrículo derecho antes de la contracción.","Resistencia que enfrenta el ventrículo izquierdo durante la eyección.","Grado de presión en el sistema arterial pulmonar.","Capacidad del ventrículo izquierdo para vencer la presión sistémica"],"answer":"Nivel de llenado del ventrículo derecho antes de la contracción.","justification":"La Presión Venosa Central (PVC) corresponde a la presión sanguínea a nivel de la aurícula derecha o en la vena cava superior. Fisiológicamente, representa la precarga del ventrículo
