cutáneo en pacientes encamados."], "answer": "Escala de Morse, que analiza factores como historial de caídas, marcha y uso de dispositivos.", "justification": "La escala de Morse es el instrumento más utilizado para evaluar el riesgo de caídas en pacientes hospitalizados, considerando antecedentes de caídas, diagnóstico secundario, marcha, uso de ayudas y estado mental. Su aplicación es fundamental en adultos mayores con déficit neurológico, como lo establecen los protocolos de seguridad del paciente del MSP", "bibliography": ""}, {"id": 59, "question": "¿Cuáles de los siguientes cambios están directamente vinculados al deterioro del sistema nervioso periférico como consecuencia del proceso de envejecimiento? 1.Disminución de la sensibilidad táctil 2.Incremento de la liberación de neurotransmisores 3.Mayor dificultad para realizar movimientos coordinados 4.Necesidad de asistencia para actividades básicas 5.Lentitud en la velocidad de conducción de los impulsos nerviosos 6.Presencia de episodios agudos de confusión mental Opciones:", "options": ["1, 3, 5", "1, 5, 6", "2, 4, 6", "2, 3, 4"], "answer": "1, 3, 5", "justification": "El envejecimiento del sistema nervioso periférico se asocia a disminución de la sensibilidad táctil, lentitud en la conducción nerviosa y dificultad en la coordinación motora. Estos cambios explican la mayor vulnerabilidad a caídas y lesiones en el adulto mayor, mientras que la confusión mental corresponde más al sistema nervioso central.", "bibliography": ""}, {"id": 60, "question": "Una persona con escasa movilidad presenta una lesión profunda en la zona sacra. Al examen físico se identifica una úlcera que compromete todo el espesor de la piel y se extiende hacia el tejido subcutáneo, mostrando signos de necrosis. ¿Cómo se clasifica este tipo de lesión según las etapas de las úlceras por presión?", "options": ["Estadio III (tejido subcutáneo comprometido).", "Estadio II (pérdida parcial de piel).", "Estadio I (piel intacta con enrojecimiento).", "Estadio IV (tejidos profundos, hueso o músculo expuestos)."], "answer": "Estadio III (tejido subcutáneo comprometido).", "justification": "La clasificación corresponde al Estadio III debido a que la descripción clínica especifica una pérdida total del espesor de la piel con daño o necrosis del tejido subcutáneo, formando una cavidad profunda que, aunque compromete la grasa, no llega a exponer estructuras subyacentes como músculo, tendones o hueso. En esta etapa, la lesión se caracteriza por ser una úlcera profunda donde la fascia subyacente permanece intacta, lo que la diferencia estrictamente del Estadio IV, donde la destrucción alcanza los planos anatómicos más profundos del organismo.", "bibliography": ""}, {"id": 61, "question": "El paciente de 73 años con antecedentes de EPOC acude a la emergencia debido a manifestaciones de alteraciones del estado de conciencia y dificultad respiratoria. Para su tratamiento, se lleva a cabo una gasometría arterial que registra una concentración de PO2 en 55mmHg. ¿Cuál es la disfunción manifestada por el paciente?", "options": ["Hipoxia.", "Hipoxemia.", "Hipocapnia.", "Hipercapnia."], "answer": "Hipoxemia.", "justification": "La disfunción manifestada es la hipoxemia, ya que este término se refiere específicamente a la disminución de la presión parcial de oxígeno en la sangre arterial por debajo de los niveles fisiológicos normales. En este caso clínico, el valor de 55 mmHg no solo confirma la hipoxemia, sino que clasifica al paciente en un estado de insuficiencia respiratoria aguda, lo cual explica la sintomatología de alteración de la conciencia y dificultad respiratoria.", "bibliography": ""}, {"id": 62, "question": "Un paciente refiere parestesias y debilidad muscular. Los resultados de laboratorio muestran: sodio 140 mEq/L, potasio 2.5 mEq/L, calcio 9 mg/dL, magnesio 2.0 mg/dL y fósforo 4.0 mg/dL. ¿Qué alteración electrolítica se confirma con estos valores?", "options": ["Déficit de magnesio", "Déficit de potasio", "Déficit de sodio", "Déficit de calcio"], "answer": "Déficit de potasio", "justification": "La alteración electrolítica se confirma mediante el valor de potasio sérico de 2.5 mEq/L, el cual se encuentra significativamente por debajo del rango fisiológico normal, definiendo un cuadro de hipopotasemia que correlaciona directamente con la sintomatología neuromuscular de parestesias y debilidad muscular reportada por el paciente. Dado que el potasio es el principal catión intracelular y resulta fundamental para mantener el potencial de membrana en reposo y la excitabilidad de las células nerviosas y musculares, su déficit interfiere con la transmisión normal de impulsos y la contracción muscular; mientras tanto, los niveles de sodio, calcio, magnesio y fósforo se encuentran dentro de sus respectivos límites de referencia, descartando otras anomalías metabólicas en este perfil de laboratorio.", "bibliography": ""}, {"id": 63, "question": "Una paciente de 35 años se encuentra en recuperación postoperatoria tras cesárea. Usted observa sangrado activo, presión arterial de 90/50 mmHg, taquicardia, taquipnea, saturación de oxígeno al 90% y piel fría y húmeda. ¿Qué tipo de shock debe sospecharse como complicación inmediata?", "options": ["Shock por disfunción cardíaca", "Shock infeccioso", "Shock por pérdida de volumen sanguíneo", "Shock por alteración neurológica"], "answer": "Shock por pérdida de volumen sanguíneo", "justification": "EEl cuadro clínico descrito, caracterizado por sangrado activo postquirúrgico inmediato tras una cesárea junto con signos de inestabilidad hemodinámica como hipotensión, taquicardia y perfusión tisular disminuida, es diagnóstico de un shock hipovolémico de origen hemorrágico. En el contexto obstétrico, la hemorragia es la complicación inmediata más crítica, donde la reducción masiva del volumen intravascular disminuye la precarga y el gasto cardíaco, activando mecanismos compensatorios como la taquipnea y la vasoconstricción periférica para intentar preservar la oxigenación de órganos vitales.", "bibliography": ""}, {"id": 64, "question": "Según una de las teorías del envejecimiento, el alejamiento social de los adultos mayores es un proceso natural y recíproco entre ellos y la sociedad, ya que ambas partes no perciben utilidad en mantener la interacción. ¿A qué teoría corresponde esta descripción?", "options": ["Teoría de la desvinculación social", "Teoría de la actividad residual", "Teoría del estrés oxidativo", "Teoría del envejecimiento activo"], "answer": "Teoría de la desvinculación social", "justification": "Esta teoría plantea que el envejecimiento implica un proceso natural y progresivo de retiro mutuo entre el adulto mayor y la sociedad, en el que ambas partes reducen voluntariamente sus interacciones al percibir menor utilidad social, favoreciendo la adaptación a las limitaciones propias de la edad. Es una teoría clásica del envejecimiento social abordada en gerontología y evaluada como parte del cuidado integral del adulto mayor.", "bibliography": ""}, {"id": 65, "question": "Un paciente con diabetes mellitus tipo 1 presenta enrojecimiento, edema y ronchas en el sitio de inyección subcutánea de insulina. ¿Qué complicación asociada al tratamiento insulínico se sospecha en este caso?", "options": ["Reacción cutánea localizada por hipersensibilidad", "Degeneración del tejido graso por uso repetido", "Anafilaxia inducida por insulina", "Falta de respuesta terapéutica a insulina regular"], "answer": "Reacción cutánea localizada por hipersensibilidad", "justification": "El enrojecimiento, edema y ronchas en el sitio de inyección corresponden a una reacción local de hipersensibilidad a la insulina o a sus excipientes, una complicación frecuente cuando no se rota adecuadamente el sitio de aplicación. Esta manifestación es distinta de la lipodistrofia y no corresponde a una reacción sistémica grave como la anafilaxia.", "bibliography": ""}, {"id": 66, "question": "En la evaluación nutricional de adultos, ¿cuál de los siguientes indicadores es más útil para estimar el riesgo de enfermedades cardiovasculares relacionadas con la distribución de grasa corporal?", "options": ["Relación cintura-cadera (ICC).", "Análisis dietético cualitativo.", "Medición de hemoglobina y hematocrito.", "Registro clínico de hábitos de alimentación"], "answer": "Relación cintura-cadera (ICC).", "justification": "La relación cintura-cadera es un indicador antropométrico clave para estimar la distribución de grasa abdominal, estrechamente asociada al riesgo cardiovascular. A diferencia del IMC, permite identificar obesidad central, reconocida por la OMS como factor de riesgo para enfermedades metabólicas y cardiovasculares.", "bibliography": ""}, {"id": 67, "question": "Un paciente con quemaduras en el tórax anterior y posterior es ingresado a la unidad de atención especializada. Aplicando la \"Regla de los 9\" de Wallace para calcular la extensión de la quemadura, ¿cuál es el porcentaje aproximado de superficie corporal afectada?", "options": ["36%, correspondiente al compromiso de ambas caras torácicas (anterior y posterior).", "18%, equivalente únicamente al tórax anterior.", "9%, si solo una región pequeña estuviese comprometida.", "45%, lo que implicaría afectación de torso y extremidades."], "answer": "36%, correspondiente al compromiso de ambas caras torácicas (anterior y posterior).", "justification": "Según la Regla de los 9 de Wallace, el cuerpo humano se divide en secciones que representan el 9% o múltiplos de 9 de la superficie corporal total para facilitar el cálculo de la extensión de las quemaduras. En este esquema, el tronco se valora en un 36%, distribuyéndose en un 18% para la parte anterior (tórax y abdomen) y un 18% para la parte posterior (espalda completa); por lo tanto, si un paciente presenta compromiso en ambas caras del tronco, se suman ambos porcentajes resultando en un 36% de superficie corporal afectada.", "bibliography": ""}, {"id": 68, "question": "Una paciente diabética tipo II presenta presión arterial baja, pulso lento y signos clínicos de confusión, debilidad y mucosas secas. El análisis bioquímico revela niveles de sodio en 129 mEq/L. ¿Qué alteración del equilibrio hidroelectrolítico se identifica con base en estos hallazgos?", "options": ["Disminución de sodio plasmático compatible con hiponatremia.", "Aumento de potasio sérico que indica hiperpotasemia.", "Exceso de sodio en sangre característico de hipernatremia.", "Descenso de potasio compatible con hipopotasemia."], "answer": "Disminución de sodio plasmático compatible con hiponatremia.", "justification": "La hiponatremia se define por una concentración de sodio sérico inferior a 135 mEq/L, lo cual se confirma en este caso con el reporte de 129 mEq/L, constituyendo el desequilibrio electrolítico más frecuente en pacientes con patologías crónicas como la diabetes. El sodio es el principal soluto del compartimento extracelular y su disminución provoca un gradiente osmótico que desplaza el agua hacia el espacio intracelular, resultando en un edema celular que se manifiesta clínicamente con confusión, debilidad y alteraciones del estado de conciencia.", "bibliography": ""}, {"id": 69, "question": "Un paciente adulto mayor refiere dificultades para realizar actividades básicas de autocuidado y requiere apoyo para caminar. Considerando estas limitaciones funcionales, ¿qué escala sería la más adecuada para valorar su nivel de dependencia en actividades básicas de la vida diaria?", "options": ["Escala de Pfeiffer", "Escala de Lawton y Brody", "Escala de Katz", "Test de Yesavage"], "answer": "Escala de Katz", "justification": "La Escala de Katz es el instrumento estándar de oro para evaluar el nivel de dependencia funcional en adultos mayores, centrándose específicamente en seis funciones básicas: baño, vestido, uso del retrete, movilidad, continencia y alimentación. A diferencia de la escala de Lawton y Brody, que mide actividades instrumentales más complejas como el uso del teléfono o la gestión económica, el Índice de Katz permite al profesional de enfermería clasificar de forma jerárquica el grado de asistencia que requiere un paciente con limitaciones en el autocuidado y la deambulación, facilitando la planificación de cuidados directos y la monitorización del deterioro funcional. Por su parte, herramientas como el test de Pfeiffer o la escala de Yesavage", "bibliography": ""}, {"id": 70, "question": " El personal de un centro de salud tipo B, aplica el enfoque de Atención Primaria de Salud Renovada en la prestación de servicios con la perspectiva de mejorar la calidad de vida de la población. Al momento dispone de un plan local de salud alineado a las exigencias del MAIS-FCI. En la valoración detecta la participación comunitaria y multisectorial en forma eficiente ¿Cuál es el enfoque central de la Atención Primaria Renovada en el ámbito de la salud en este caso?", "options": ["Reducir los costos de los tratamientos médicos para hacerlos más accesibles a la población.", "Mejorar el acceso a servicios de salud de alta complejidad en hospitales.", "Priorizar la atención médica especializada para tratar enfermedades crónicas.", "Fortalece la atención de salud en la comunidad, centrándose en la prevención promoción y atención integral."], "answer": "Fortalece la atención de salud en la comunidad, centrándose en la prevención promoción y atención integral.", "justification": "El enfoque de la Atención Primaria de Salud Renovada (APS-R), integrado en el Modelo de Atención Integral de Salud (MAIS-FCI) en Ecuador, se fundamenta en la transformación del sistema sanitario hacia un modelo que prioriza el primer nivel de atención y la participación comunitaria por encima del enfoque hospitalocéntrico y curativo. Se busca incidir directamente en los determinantes sociales de la salud mediante estrategias de promoción y prevención.", "bibliography": ""}, {"id": 71, "question": "Paciente femenina primigesta que cursa un embarazo de 38 semanas acude al Centro de Salud tipo A por dolor tipo contracción y eliminación de líquido por vía vaginal, luego de la valoración se identifica que se encuentra en la etapa activa del parto. ¿A qué nivel de atención se refiere a la paciente?", "options": ["Centro de salud tipo B.", "Tercer nivel de atención.", "Segundo nivel de atención.", "Cuarto nivel de atención."], "answer": "Segundo nivel de atención.", "justification": "La paciente debe ser referida al segundo nivel de atención, ya que según el Modelo de Atención Integral de Salud (MAIS), este nivel cuenta con la capacidad resolutiva, infraestructura y talento humano especializado para la atención del parto institucionalizado y el manejo de posibles complicaciones obstétricas. Debido a que la paciente se encuentra en la fase activa del parto en un Centro de Salud tipo A el cual pertenece al primer nivel y generalmente carece de salas de labor y parto equipadas para una atención integral, la referencia inmediata es obligatoria para garantizar un entorno seguro que disponga de monitoreo continuo, asistencia por ginecoobstetras y capacidad quirúrgica inmediata en caso de requerirse una cesárea de emergencia o resolución de distocias.", "bibliography": ""}, {"id": 72, "question": "El profesional de enfermería realiza visita domiciliaria a pacientes de 59 años y a su familia para control de la diabetes mellitus tipo 2, quien vive en un entorno de riesgo. Al momento de la valoración paciente refiere que no sabe leer ni escribir, no trabaja desde hace 10 años, consume siempre infusiones ancestrales y no hace dieta, tampoco participa en terapias comunitarias. Al aplicar el proceso de atención de enfermería: hola conducta ineficaz para el mantenimiento de la salud, impotencia y deterioro de la interacción social. ¿Qué categorías tomaría en cuenta para la toma de decisiones de la práctica de atención individual y familiar?", "options": ["Interpersonal", "Política y económica", "Individual y sociocultural", "De organización"], "answer": "Individual y sociocultural", "justification": "Para la toma de decisiones en este caso, el profesional de enfermería debe priorizar las categorías individual y sociocultural, ya que estas engloban los factores determinantes que condicionan directamente la salud y el comportamiento del paciente, tales como su nivel educativo, su situación laboral de larga duración y sus creencias culturales arraigadas. Estas variables permiten entender la raíz de las conductas ineficaces y el deterioro de la interacción social, facilitando el diseño de un plan de cuidados que no solo aborde la patología clínica, sino que se adapte a la cosmovisión del individuo y a las barreras sociales de su entorno.", "bibliography": ""}, {"id": 73, "question": "Como profesional de enfermería debe realizar una visita domiciliaria a una familia que vive en un sector de difícil acceso y con problemas de seguridad. Antes de salir del centro de salud, revisa antecedentes en el expediente clínico familiar, organiza material necesario y coordina acompañamiento del personal de salud y la disponibilidad de la familia. ¿Cuál es la etapa de la visita domiciliaria que realiza en este caso?", "options": ["Presentación en el domicilio", "Planificación de los cuidados", "Preparación de la visita", "Ejecución de los cuidados"], "answer": "Preparación de la visita", "justification": "La preparación de la visita es la fase preliminar fundamental que se realiza en el centro de salud antes del desplazamiento al territorio, cuyo objetivo es asegurar la viabilidad, seguridad y calidad de la atención domiciliaria. En este caso clínico, el profesional de enfermería ejecuta las acciones propias de esta etapa al recopilar información del expediente para conocer la situación de la familia, organizar los recursos materiales específicos y, crucialmente, coordinar la logística de acompañamiento para mitigar los riesgos identificados en el entorno.", "bibliography": ""}, {"id": 74, "question": "En la visita domiciliaria, en el llenado de la ficha familiar para actualización del ASIS, el profesional enfermero encuentra que el jefe de hogar es un hombre de 42 años, desempleado desde hace un año, por lo que se refugian en el alcohol desde hace 5 meses. Su esposa de 37 años manifiesta que ella sale a trabajar y deja a su esposo al cuidado de sus hijos de 8, 5 y 3 años; actualmente los niños están descuidados en su vestido, higiene, alimentación, generando problemas dentro del hogar. ¿Qué determinantes de la salud constituyen factores de riesgo en este caso?", "options": ["Conductuales y ambientales", "Ambientales y biológicos", "Ambientales y sociales", "Conductuales y sociales"], "answer": "Conductuales y sociales", "justification": "La respuesta se fundamenta en que el consumo de alcohol del jefe de hogar es un determinante conductual, reflejando un hábito individual que impacta negativamente su rol y salud, mientras que el desempleo y la consecuente negligencia en el cuidado de los niños son determinantes sociales críticos, vinculados directamente a las condiciones socioeconómicas y a la estructura de soporte familiar.", "bibliography": ""}, {"id": 75, "question": " Un paciente de 65 años con antecedentes de VIH hace un año, quien acude al centro de salud por presentar molestias articulares de moderada intensidad y un peso de 49 kg: el médico valora mediante examen físico y complementario, diagnosticándole de TB ósea, iniciando Por Primera Vez el tratamiento antituberculoso. ¿Cuál es el tema esquema de tratamiento que corresponde en este caso?", "options": ["2HRZE/10HR", "2HRZE/4HR", "2RHE/7HR", "2HRZE/6HR"], "answer": "2HRZE/10HR", "justification": "El esquema 2HRZE/10HR es el indicado por las normativas del Ministerio de Salud Pública del Ecuador para el tratamiento de la tuberculosis con localización osteoarticular, miliar o del sistema nervioso central, ya que estas formas requieren una duración total de 12 meses debido a la difícil penetración de los fármacos en el tejido óseo y el alto riesgo de recaídas. A diferencia de la TB pulmonar convencional que se resuelve en 6 meses, este protocolo extendido consta de una fase inicial de 2 meses con cuatro fármacos (Isoniazida, Rifampicina, Pirazinamida y Etambutol), seguida de una fase de consolidación de 10 meses con Isoniazida y Rifampicina, garantizando la eliminación del bacilo y la prevención de secuelas funcionales permanentes en el paciente, independientemente de su estado serológico para VIH.", "bibliography": ""}, {"id": 76, "question": "En una comunidad de difícil acceso se presenta un elevado número de embarazadas, hoy los profesionales y enfermeros del equipo de salud realizan una visita para captación y valoración. Las madres refieren que reciben asistencia de la cartera y no acuden a la unidad de salud por la distancia y falta de transporte. Al realizar la valoración el profesional de enfermería identifica signos de peligro, hoy falla de control integral y vacunación; hoy además dialogan con los actores locales quienes demuestran interés por el problema de salud materno. ¿Qué mecanismos de referencia y contra referencia se determinan con la participación comunitaria en el caso planteado?", "options": ["Promoviendo acciones para mejorar la calidad de vida en coordinación intra e intersectorial y actuando sobre los determinantes de la salud.", "Definiendo puntos de partida y llegada con las redes de vigilancia del flujo desde la comunidad las unidades de salud y retorno a la localidad", "Integrando las unidades de salud en los 3 niveles para atención continua a las usuarias (os) con una red organizada y de tecnología apropiada.", "Dirigiendo acciones coordinadas con enfoque intercultural generacional y de género que persiga la reducción neutralización o eliminación de los factores."], "answer": "Definiendo puntos de partida y llegada con las redes de vigilancia del flujo desde la comunidad las unidades de salud y retorno a la localidad", "justification": "El mecanismo de referencia y contrarreferencia con participación comunitaria se fundamenta en la creación de redes de vigilancia y el establecimiento de flujos claros, definiendo específicamente los puntos de partida y de llegada, así como el retorno seguro a la localidad para el seguimiento. Esta estrategia permite que los actores locales, como parteras o líderes comunitarios, actúen como un nexo vital para superar las barreras geográficas y de transporte, garantizando la captación oportuna de embarazadas con signos de peligro y la continuidad del control integral y esquemas de vacunación,", "bibliography": ""}, {"id": 77, "question": "En una comunidad donde labora un profesional de enfermería, se atiende a una familia con serios conflictos entre la abuela y la nieta, pues con cierta frecuencia la abuela no respeta la opinión de su nieta en temas de su matrimonio y cada vez que la abuela expresa lo que piensa recibe una grosería. ¿A qué enfoque de violencia se refiere este caso?", "options": ["Enfoque intergeneracional", "Enfoque de inclusión social", "Enfoque de género en salud", "Enfoque de interculturalidad"], "answer": "Enfoque intergeneracional", "justification": "El enfoque intergeneracional se centra en el análisis de las relaciones y conflictos que surgen entre personas de diferentes grupos de edad o ciclos de vida dentro de un mismo núcleo, como es el caso de la abuela y la nieta. En este escenario, la violencia o el conflicto se manifiesta a través de la falta de respeto a la autonomía y opiniones de la generación más joven por parte de la mayor, y la respuesta hostil de la menor, evidenciando una ruptura en la comunicación basada en las diferencias de jerarquía familiar, valores y etapas vitales. Identificar este enfoque permite al profesional de enfermería intervenir mediante la mediación familiar y el fomento del respeto mutuo entre generaciones, abordando los determinantes relacionales que vulneran la convivencia armónica sin necesariamente involucrar disparidades de género o diferencias culturales.", "bibliography": ""}, {"id": 78, "question": "Una mujer de 32 años con embarazo de alto riesgo llega a un centro de salud tipo C, hoy luego de la valoración médica es diagnosticada con preeclampsia más signos de severidad el profesional de enfermería explica la paciente y familiares sobre el plan nacional de reducción de la mortalidad materna. ¿Qué sistema de referencia y contra referencias del CONE aplica en esta paciente?", "options": ["Contrarreferencia a un centro de salud tipo A", "Referencia a un hospital de tercer nivel", "Contrarreferencia a un hospital de tercer nivel", "Referencia a un centro de salud tipo A"], "answer": "oReferencia a un hospital de tercer nivel", "justification": "La paciente presenta preeclampsia con signos de severidad, una emergencia obstétrica que requiere atención especializada, unidad de cuidados intensivos y capacidad resolutiva avanzada. Según el Sistema de Referencia y Contrarreferencia del CONE y el Plan Nacional de Reducción de la Mortalidad Materna, estas pacientes deben ser referidas de manera inmediata a hospitales de tercer nivel para reducir el riesgo de complicaciones maternas y fetales.", "bibliography": ""}, {"id": 79, "question": "Durante la terapia antituberculosa infantil con isoniacida (H), ¿cuál de las siguientes manifestaciones clínicas corresponde a un efecto adverso grave por toxicidad del medicamento?", "options": ["Aparición de crisis convulsivas debido a deficiencia de vitamina B6.", "Inflamación del parénquima renal con deterioro de la función renal.", "Alteración visual progresiva con pérdida de agudeza visual.", "Elevación de ácido úrico en sangre sin signos clínicos asociados"], "answer": "Aparición de crisis convulsivas debido a deficiencia de vitamina B6.", "justification": "La isoniacida compite con el fosfato de piridoxal (vitamina B6), aumentando su excreción urinaria. La deficiencia aguda de vitamina B6 reduce la síntesis de GABA (un neurotransmisor inhibitorio en el cerebro), lo que disminuye el umbral convulsivo y puede provocar neurotoxicidad, manifestada principalmente como crisis convulsivas o neuropatía periférica. Por esta razón, se suele suplementar con piridoxina durante el tratamiento.", "bibliography": ""}, {"id": 80, "question": "Durante una consulta domiciliaria, el profesional de enfermería conversa con una madre adolescente que vive con sus padres y su hijo recién nacido. El profesional desea clasificar adecuadamente el tipo de familia al que pertenece la paciente, para orientar el acompañamiento familiar. ¿Cómo se denomina este tipo de estructura familiar, considerando que conviven al menos tres generaciones?", "options": ["Familia extensa.", "Familia nuclear.", "Familia monoparental.", "Familia compuesta."], "answer": "Familia extensa.", "justification": "La familia extensa se caracteriza por la convivencia de tres o más generaciones en un mismo hogar, como ocurre cuando una madre adolescente vive con sus padres y su hijo. Esta clasificación es importante para orientar intervenciones familiares y comunitarias desde el enfoque de salud familiar.", "bibliography": ""}, {"id": 81, "question": "Una enfermera comunitaria trabaja en la implementación de estrategias que fomenten la salud colectiva en una comunidad rural. En su plan de acción, incluye actividades de educación para la salud, identificación de factores de riesgo, y fortalecimiento de redes de apoyo. Estas acciones se enmarcan en el enfoque de Atención Primaria Renovada, promovido por la Organización Panamericana de la Salud (OPS). ¿Cuál de las siguientes opciones describe de manera más precisa uno de los principios fundamentales de esta estrategia?", "options": ["Impulsar el fortalecimiento del primer nivel de atención como puerta de entrada al sistema de salud, con enfoque integral, continuo y centrado en la familia y la comunidad.", "Promover campañas masivas de vacunación exclusivamente desde el nivel hospitalario.", "Concentrar las acciones de salud en el segundo y tercer nivel de atención, priorizando la atención especializada.", "Enfocar la atención en la enfermedad a través de intervenciones reactivas ante eventos de salud"], "answer": "Impulsar el fortalecimiento del primer nivel de atención como puerta de entrada al sistema de salud, con enfoque integral, continuo y centrado en la familia y la comunidad.", "justification": "La APS renovada promueve un modelo integral, continuo y centrado en la familia y la comunidad, fortaleciendo el primer nivel como eje del sistema sanitario. Este principio, impulsado por la OPS, orienta la promoción, prevención y participación social, pilares fundamentales del MAIS-FCI.", "bibliography": ""}, {"id": 82, "question": "Durante una intervención en una comunidad rural, el equipo de salud identifica prácticas culturales como el uso de medicina tradicional, fuerte cohesión entre vecinos y liderazgo comunitario visible. Según los principios del MAIS-FCI y los componentes de la comunidad,", "options": ["Impulsar la eliminación de las prácticas culturales locales para asegurar el cumplimiento de la atención biomédica.", "Promover el uso exclusivo de tecnología de punta para cambiar las costumbres comunitarias.", "Reconocer y fortalecer la cultura y los liderazgos locales, incorporándolos en la planificación participativa del cuidado.", "Centrar la intervención únicamente en los niños de la comunidad, por ser la población más vulnerable."], "answer": "Reconocer y fortalecer la cultura y los liderazgos locales, incorporándolos en la planificación participativa del cuidado.", "justification": "El MAIS-FCI reconoce la interculturalidad como eje fundamental, promoviendo el respeto a las prácticas culturales y la participación comunitaria, integrando saberes locales con la atención sanitaria para lograr intervenciones sostenibles y aceptadas por la comunidad.", "bibliography": ""}, {"id": 83, "question": "En el marco de los compromisos asumidos por el Ecuador en los Objetivos de Desarrollo Sostenible (ODS) hacia el 2030, un profesional de enfermería promueve en su comunidad una campaña de educación y sensibilización para la prevención de embarazos en adolescentes. ¿Cuál de los siguientes ODS está siendo principalmente abordado a través de esta intervención?", "options": ["ODS 3: Garantizar una vida sana y promover el bienestar para todos en todas las edades.", "ODS 1: Poner fin a la pobreza en todas sus formas en todo el mundo.", "ODS 4: Garantizar una educación inclusiva, equitativa y de calidad.", "ODS 5: Lograr la igualdad entre los géneros y empoderar a todas las mujeres y las niñas."], "answer": "ODS 3: Garantizar una vida sana y promover el bienestar para todos en todas las edades.", "justification": "La prevención del embarazo adolescente se vincula directamente con el ODS 3, que busca garantizar una vida sana y promover el bienestar en todas las edades, al reducir riesgos maternos, neonatales y sociales, en concordancia con las políticas de salud pública del Ecuador.", "bibliography": ""}, {"id": 84, "question": "Durante una jornada de vacunación infantil, el personal de enfermería administra vacunas a menores de cinco años para evitar la aparición de enfermedades infecciosas. Según el modelo de niveles de prevención propuesto por Leavell y Clark, ¿a qué tipo de acción corresponde esta intervención?", "options": ["Intervención orientada a evitar la aparición de enfermedades mediante inmunización o promoción de la salud.", "Estrategia centrada en reducir factores predisponentes a enfermedades en población infantil.", "Acción diagnóstica temprana para controlar enfermedades en fase inicial.", "Actividad enfocada en reducir complicaciones y secuelas de enfermedades ya instauradas."], "answer": "Intervención orientada a evitar la aparición de enfermedades mediante inmunización o promoción de la salud.", "justification": "Esta acción corresponde a la prevención primaria, la cual, según el modelo de Leavell y Clark, se ejecuta en el periodo prepatogénico con el objetivo de disminuir la incidencia de enfermedades mediante la protección específica y la promoción de la salud. Al actuar antes de que se produzca el estímulo de la enfermedad, la inmunización previene eficazmente la infección y su propagación en la población infantil, diferenciándose de la prevención secundaria que busca el diagnóstico precoz o de la terciaria orientada a la rehabilitación, consolidándose como la estrategia de salud pública más costo- efectiva para el control de enfermedades inmunoprevenibles.", "bibliography": ""}, {"id": 85, "question": " En una investigación sobre factores asociados a hipertensión en adultos, un equipo de salud comunitario recolecta datos de 100 pacientes sobre 2 variables cuantitativas: edad (en años) y presión arterial sistólica (en mmHg). Los investigadores desean determinar si existe una relación lineal significativa entre la edad y los niveles de presión arterial sistólica en la muestra. Ambas variables se distribuyen de manera normal. ¿Qué prueba estadística paramétrica es la más adecuada utilizar para este estudio?", "options": ["Prueba t", "Chi-cuadrado", "Coeficiente de correlación de Pearson", "Análisis de varianza unidireccional"], "answer": "Coeficiente de correlación de Pearson", "justification": "El coeficiente de correlación de Pearson es la prueba paramétrica de elección cuando el objetivo es cuantificar la fuerza y la dirección de la relación lineal entre dos variables cuantitativas continuas, como la edad y la presión arterial, siempre que ambas cumplan con el supuesto de normalidad. A diferencia de la prueba t o el ANOVA, que comparan medias entre grupos, o del Chi- cuadrado, que analiza variables categóricas, el coeficiente de Pearson utiliza los valores individuales para determinar cómo varía una medida en función de la otra, siendo fundamental en estudios epidemiológicos de base comunitaria para identificar asociaciones significativas y predecir tendencias de riesgo cardiovascular.", "bibliography": ""}, {"id": 86, "question": "Los problemas de salud tienen serias consecuencias económicas y sociales para el sistema de salud y la población. Actualmente al personal de enfermería le preocupa la alta morbilidad en menores de 2 años y están interesados en realizar el estudio de las determinantes. Reconocen que deben solventar sus inquietudes de expresar finalmente la pregunta concreta ¿A qué fase del diseño lógico hace referencia este caso enunciado?", "options": ["Marco teórico", "Recolección de datos", "Objetivos de la investigación", "Planteamiento del problema"], "answer": "Planteamiento del problema", "justification": "El planteamiento del problema es la fase del diseño lógico de la investigación donde se transita de una inquietud o área de preocupación general como la alta morbilidad en menores de 2 años hacia la delimitación precisa y formalización de una pregunta de investigación concreta. Esta etapa es fundamental porque permite al investigador estructurar formalmente la idea de estudio, definiendo el qué, el cómo y el para qué de la indagación; al buscar expresar finalmente la pregunta concreta, el personal de enfermería está cerrando el proceso de problematización, lo cual servirá de base para la posterior redacción de los objetivos y la construcción del marco teórico, asegurando que el estudio tenga una dirección clara y una viabilidad metodológica adecuada.", "bibliography": ""}, {"id": 87, "question": "Usted como responsable de servicio de medicina interna identifica flebitis en pacientes hospitalizados y como parte de sus funciones de liderazgo establece el objetivo y las actividades para disminuir la incidencia de este problema. ¿Cuál de las etapas del proceso administrativo se relaciona con el caso planteado?", "options": ["Dirección", "Planeación", "Control", "Organización"], "answer": "Planeación", "justification": "La etapa de planeación es la fase inicial del proceso administrativo donde se definen los objetivos estratégicos y se diseñan los cursos de acción o actividades necesarias para alcanzarlos. En este escenario, al identificar una problemática específica (flebitis) y proceder a establecer metas claras junto con las tareas para mitigar su incidencia, el líder del servicio está estructurando el qué se va a hacer y el cómo se va a lograr, sentando las bases antes de organizar los recursos, dirigir al personal hacia la ejecución o evaluar los resultados mediante el control.", "bibliography": ""}, {"id": 88, "question": "Como profesional de enfermería de primer nivel de atención, se encuentra realizando una vigilancia epidemiológica por un incremento en la incidencia de enfermedades diarreicas agudas en niños menores de 5 años. Para abordar esta situación consulta en diversas fuentes de información disponibles en el centro de salud, incluyendo la proyección de mapas epidemiológicos, gráficas de tendencias y tablas de datos. De acuerdo con el Modelo de Atención Integral de Salud (MAIS). ¿Cuál es la principal herramienta que se utiliza en este caso?", "options": ["Diagnóstico dinámico", "Sala situacional", "Mapa parlante", "Diagnóstico situacional"], "answer": "Sala situacional", "justification": "La sala situacional es el espacio técnico, físico o virtual donde se procesa la información para la toma de decisiones, utilizando herramientas como mapas epidemiológicos, gráficas de tendencias y tablas de datos para analizar la situación de salud de una población en tiempo real. En el marco del Modelo de Atención Integral de Salud (MAIS), esta herramienta es fundamental para la vigilancia epidemiológica, ya que permite al equipo de salud identificar cambios en la incidencia de enfermedades, evaluar el impacto de las intervenciones y coordinar respuestas inmediatas basadas en la evidencia visualizada, diferenciándose del diagnóstico situacional que funciona más como un corte estático o anual de la realidad local.", "bibliography": ""}, {"id": 89, "question": "Paciente femenina de 68 años, diagnosticada con diabetes e hipertensión arterial desde hace 10 años, recibe tratamiento con insulina y antihipertensivo, hoy en la consulta se enfatiza los cuidados para mejorar los estilos de vida. Obteniendo una negativa a su cumplimiento no por falta de conocimiento sino por sus actitudes que no le permiten realizar esos cambios. Usted le plantea trabajar en un programa de salud. ¿Cuáles son las técnicas apropiadas a utilizar en este caso?", "options": ["Técnicas de análisis", "Técnicas de información", "Técnicas de desarrollo de habilidades", "Técnicas de expresión"], "answer": "oTécnicas de expresión", "justification": "En este caso la paciente no presenta déficit de información, sino barreras actitudinales que dificultan el cambio de conducta, por lo que las técnicas de expresión son las más adecuadas. Estas técnicas permiten que la persona exprese emociones, creencias, temores y resistencias, facilitando la reflexión y el compromiso con su autocuidado. Según la educación para la salud del MSP y la OPS, estas técnicas son clave cuando se busca modificar actitudes y motivar la adopción de estilos de vida saludables en pacientes con enfermedades crónicas.", "bibliography": ""}, {"id": 90, "question": "El hospital está experimentando una escasez recurrente de materiales críticos en el quirófano, lo que ha provocado retrasos en las cirugías programadas y ha afectado la calidad de la atención. El líder de enfermería del servicio se ha reunido con el equipo directivo para discutir un plan de mejora en la gestión de recursos esenciales. ¿Cuál es la estrategia más adecuada para evitar este problema en el hospital?", "options": ["Implementar un sistema de gestión de inventario a tiempo", "Comprar materiales en grandes cantidades una vez al año", "Dejar que cada departamento gestione sus propios inventarios de forma independiente", "Mantener grandes reservas de materiales para evitar faltantes"], "answer": "Implementar un sistema de gestión de inventario a tiempo", "justification": "La implementación de un sistema de gestión de inventarios permite planificar, controlar y reponer oportunamente los materiales críticos, evitando desabastecimientos y desperdicios. Esta estrategia se alinea con los principios de administración en enfermería y gestión hospitalaria, promovidos por el MSP, ya que garantiza continuidad de la atención, optimización de recursos y mejora de la calidad del servicio, a diferencia de las compras masivas o el manejo desarticulado por departamentos", "bibliography": ""}, {"id": 91, "question": "En una unidad operativa del primer nivel de atención se presenta un paciente masculino de 45 años. Actualmente presenta fiebre de 38.5 °C, tos seca y cefalea. Al realizarle la prueba rápida para COVID-19 se obtiene positivo. El equipo de salud activa el protocolo e inicia con las actividades de vigilancia epidemiológica. De acuerdo con los lineamientos para la vigilancia epidemiológica de COVID-19 del Ministerio de Salud Pública del Ecuador (MSP). ¿Cuál es la actividad prioritaria de vigilancia en establecimientos de primer nivel de salud?", "options": ["Derivar directamente al paciente al hospital general para iniciar vigilancia epidemiológica.", "Notificación al sistema informático de vigilancia vigente y seguimiento de casos y contactos.", "Realizar Monitoreos Rápidos de Vacunación (MRV).", "Actualización del mapa parlante en la sala situacional con la información del paciente."], "answer": "Notificación al sistema informático de vigilancia vigente y seguimiento de casos y contactos.", "justification": "En el primer nivel de atención, la actividad prioritaria de vigilancia epidemiológica es la notificación inmediata del caso al sistema oficial del MSP, junto con el seguimiento del paciente y sus contactos. Esta acción permite el control del brote, la toma de decisiones sanitarias y la interrupción de la cadena de transmisión, conforme a los lineamientos nacionales de vigilancia epidemiológica para COVID-19", "bibliography": ""}, {"id": 92, "question": "Ante la ausencia inesperada de un miembro del equipo de vacunación, la enfermera líder decide reorganizar el grupo de trabajo participando activamente con ellos y promoviendo el consenso en las decisiones. ¿Qué tipo de liderazgo está ejerciendo?", "options": ["Impositivo.", "Participativo.", "Jerárquico.", "Autoritario."], "answer": "Participativo.", "justification": "El liderazgo participativo (o democrático) se caracteriza por fomentar la colaboración del equipo en la toma de decisiones. El líder no solo da órdenes, sino que se involucra, participa activamente con ellos y busca acuerdos que promueve el consenso, lo que aumenta la motivación y el compromiso del personal, especialmente en situaciones de crisis o reorganización.", "bibliography": ""}, {"id": 93, "question": "Como parte de un diagnóstico participativo en salud comunitaria, usted desea identificar las prioridades del grupo respecto a los problemas detectados. ¿Qué estrategia es la más adecuada para alcanzar acuerdos y jerarquizar colectivamente las opiniones de los participantes?", "options": ["Aplicar una técnica de votación que asigne diferentes valores a las opciones seleccionadas.", "Formar pequeños grupos de discusión que roten cada cinco minutos.", "Organizar lluvias de ideas sin restricciones para obtener la mayor cantidad de propuestas posibles.", "Utilizar la técnica 6/6 donde cada seis personas discuten durante seis minutos y exponen conclusiones."], "answer": "Aplicar una técnica de votación que asigne diferentes valores a las opciones seleccionadas.", "justification": "En el diagnóstico participativo, una vez identificados los problemas, es fundamental jerarquizarlos colectivamente para definir prioridades de intervención; la técnica de votación ponderada permite alcanzar consensos democráticos al asignar valores según la importancia percibida por el grupo, facilitando acuerdos objetivos y transparentes. Este método es recomendado en salud comunitaria por el MAIS-FCI.", "bibliography": ""}, {"id": 94, "question": "Durante una intervención educativa sobre nutrición dirigida a pacientes con Diabetes tipo II, es necesario seguir un orden lógico en la planificación. ¿Cuál es la secuencia correcta de los pasos del plan educativo?", "options": ["Valoración del paciente → Diagnóstico de necesidades → Diseño del plan → Aplicación → Evaluación → Documentación.", "Diagnóstico de necesidades → Diseño del plan → Aplicación → Valoración del paciente → Documentación → Evaluación.", "Evaluación → Valoración del paciente → Diseño del plan → Diagnóstico de necesidades → Aplicación → Documentación.", "Diseño del plan → Diagnóstico de necesidades → Evaluación → Aplicación → Valoración → Documentación."], "answer": "Valoración del paciente → Diagnóstico de necesidades → Diseño del plan → Aplicación → Evaluación → Documentación.", "justification": "Esta secuencia sigue la lógica sistemática del PAE aplicada al ámbito pedagógico, donde el ciclo comienza obligatoriamente con la valoración para conocer el estado basal y entorno del paciente, permitiendo así establecer un diagnóstico de necesidades educativas real y específico. Una vez identificadas las carencias de conocimiento, se procede al diseño del plan y su posterior aplicación o ejecución; finalmente, el proceso se cierra con la evaluación de los resultados de aprendizaje y la documentación técnica de la intervención", "bibliography": ""}, {"id": 95, "question": "¿Qué tipo de técnica de muestreo es más adecuada cuando se necesita estudiar una población extensa y geográficamente dispersa?", "options": ["Selección por intervalos regulares de una lista completa.", "División de la población en estratos según características específicas.", "Selección aleatoria de grupos o unidades naturales como escuelas o comunidades.", "Sorteo individual aleatorio de todos los integrantes del universo de estudio."], "answer": "Selección aleatoria de grupos o unidades naturales como escuelas o comunidades.", "justification": "Cuando la población es extensa y dispersa geográficamente, el muestreo por conglomerados es el más adecuado, ya que permite seleccionar grupos naturales en lugar de individuos, optimizando recursos y tiempo sin perder representatividad. Este tipo de muestreo es ampliamente descrito en metodología de la investigación en salud y forma parte de los contenidos evaluados en enfermería comunitaria.", "bibliography": ""}, {"id": 96, "question": "Durante la planificación de una entrevista cualitativa en el ámbito investigativo, es importante estructurar las preguntas de forma que faciliten la confianza del entrevistado y la recolección progresiva de información. ¿Cuál es el orden lógico y recomendado para presentar los distintos tipos de preguntas?", "options": ["Iniciar con interrogantes generales, avanzar a cuestiones complejas, luego abordar temas delicados y cerrar la entrevista.", "Empezar por los temas sensibles, continuar con los más difíciles, seguir con los generales y concluir con agradecimientos.", "Iniciar por las conclusiones, luego temas sencillos, pasar a lo complejo y terminar con lo íntimo.", "Comenzar con temas complejos, después los sensibles, continuar con preguntas generales y terminar con las de cierre."], "answer": "Iniciar con interrogantes generales, avanzar a cuestiones complejas, luego abordar temas delicados y cerrar la entrevista.", "justification": "En la investigación cualitativa, el orden progresivo de las preguntas favorece la creación de un clima de confianza, permitiendo que el entrevistado se sienta cómodo antes de abordar temas sensibles. Este enfoque metodológico mejora la calidad de la información recolectada y responde a principios éticos y técnicos reconocidos por la OPS y la formación investigativa en enfermería.", "bibliography": ""}, {"id": 97, "question": "En el enfoque cuantitativo de la investigación, ¿qué tipo de estudio se caracteriza por no requerir hipótesis previa, ya que su objetivo es brindar una primera aproximación a fenómenos poco conocidos?", "options": ["Estudio explicativo", "Estudio correlacional", "Estudio exploratorio", "Estudio descriptivo"], "answer": "Estudio exploratorio", "justification": "El estudio exploratorio es el nivel de investigación que se realiza cuando el objetivo es examinar un tema o problema de investigación poco estudiado, del cual se tienen muchas dudas o no se ha abordado antes, funcionando como una primera aproximación al fenómeno. Debido a que su propósito es precisamente familiarizarse con conceptos desconocidos para determinar prioridades de investigaciones futuras, este tipo de estudio se caracteriza por su flexibilidad metodológica y por no requerir de forma obligatoria la formulación de una hipótesis previa, a diferencia de los estudios correlacionales o explicativos que exigen un conocimiento más profundo para predecir relaciones entre variables.", "bibliography": ""}, {"id": 98, "question": "Dentro del enfoque cuantitativo, al estructurar el planteamiento del problema de investigación, ¿qué componentes deben ser incluidos para garantizar claridad, pertinencia y posibilidad de ejecución?", "options": ["Discusión, interpretación de resultados y limitaciones del estudio", "Diseño metodológico, herramientas y marco muestral", "Justificación, objetivos, preguntas de investigación y viabilidad", "Marco legal, marco ético, contexto histórico y antecedentes"], "answer": "", "justification": "Justificación: De acuerdo con la metodología de la investigación cuantitativa , el planteamiento del problema no es una simple descripción, sino una estructura formal que debe contener obligatoriamente los objetivos (lo que se pretende lograr), las preguntas de investigación (el vacío de conocimiento a resolver), la justificación (la relevancia y utilidad del estudio) y la viabilidad (la disponibilidad de recursos, tiempo y acceso a la muestra). Estos componentes aseguran que la investigación sea clara, tenga un propósito definido y, sobre todo, sea ejecutable en la práctica, diferenciándose de otras secciones del diseño lógico como el marco teórico o la metodología, que se ocupan del sustento documental y el procedimiento técnico, respectivamente.", "bibliography": ""}, {"id": 99, "question": "¿Qué tipo de variable se caracteriza por representar categorías sin orden específico y que, en algunos casos, puede asumir únicamente dos posibles valores, como \"sí\" o \"no\"?", "options": ["Variable nominal, como por ejemplo el sexo (masculino/femenino).", "Variable ordinal, que permite establecer un orden entre sus categorías.", "Variable de intervalo, que presenta diferencias medibles, pero sin unos cero absolutos.", "Variable de razón, que incluye un punto cero y permite operaciones matemáticas completas."], "answer": "Variable nominal, como por ejemplo el sexo (masculino/femenino).", "justification": "Una variable nominal es un tipo de variable cualitativa que identifica o etiqueta categorías que no guardan un orden jerárquico ni una relación de magnitud entre sí, permitiendo únicamente establecer relaciones de igualdad o diferencia. Cuando esta variable presenta solo dos opciones posibles, como en el caso de \"vivo/muerto\", \"sano/enfermo\" o el ejemplo del sexo, se denomina específicamente variable dicotómica o binaria. Identificar correctamente el nivel nominal es crucial, ya que define el uso de pruebas no paramétricas (como el Chi-cuadrado) para determinar asociaciones entre factores clínicos o sociodemográficos donde el orden de los datos no altera la naturaleza de la medición.", "bibliography": ""}, {"id": 100, "question": "Paciente de 45 años permanece hospitalizado por varias semanas en el servicio de terapia intensiva por un accidente de tránsito. Durante su turno, el paciente le comenta que se encuentra triste por la situación económica de su familia, esposa y dos hijas adolescentes, ya que él es el único sustento familiar. De acuerdo con el caso, ¿qué tipo de crisis experimenta la familia?", "options": ["Crisis normativa.", "Crisis de cuidado.", "Crisis paranormativa.", "Falta de apoyo familiar."], "answer": "Crisis paranormativa.", "justification": "La crisis paranormativa aparece ante acontecimientos inesperados que alteran el funcionamiento familiar, como una enfermedad grave, un accidente o la pérdida del principal sostén económico.", "bibliography": "González, S. Crespo, S. (2018). Salud pública y enfermería comunitaria. Manual Moderno."}, {"id": 101, "question": "Paciente de 45 años, ingresa al servicio de urgencias con diagnóstico de trauma craneoencefálico grave con una puntuación en la escala de Glasgow 8/15. Para su manejo se requiere intubación orotraqueal. Como profesional de enfermería, usted debe confirmar la correcta posición del tubo mediante un dispositivo que permita medir la presión parcial de CO₂ en el aire espirado. ¿Cuál es el dispositivo principal que usted utiliza en este caso?", "options": ["Endotest.", "Capnógrafo.", "Oxímetro de pulso.", "Gasómetro."], "answer": "Capnógrafo.", "justification": "La capnografía permite medir el CO₂ del aire espirado y confirmar de manera objetiva la ventilación y la correcta posición del tubo endotraqueal.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 102, "question": "Un paciente de 45 años ingresa a emergencia con dolor intenso por una fractura de fémur. El médico prescribe analgesia con opioides previo a valoración. ¿Cuál es la acción más apropiada para administrar este grupo de analgésicos?", "options": ["Administrar el analgésico por vía intramuscular para una acción más rápida.", "Mezclar los opioides con otros medicamentos analgésicos para potenciar su efecto.", "Limitar la frecuencia de administración de los opioides para evitar la dependencia.", "Valoración integral del dolor antes y después de la administración de opioides."], "answer": "Valoración integral del dolor antes y después de la administración de opioides.", "justification": "La valoración integral del dolor antes y después de administrar opioides permite individualizar el tratamiento, comprobar la respuesta y vigilar efectos adversos.", "bibliography": "Potter, P., Perry, A., Stockert, P., & Hall, A. (2019). Fundamentos de enfermería. 9.ª ed. Elsevier."}, {"id": 103, "question": "Al centro de salud acude una madre con su hija de 6 meses para el control de rutina de su niña (crecimiento y desarrollo), peso 7.120 gramos y talla de 66 centímetros. El personal de enfermería solicita libreta integral de salud para el registro en las curvas correspondientes de peso y talla, determinando que la paciente se encuentra en percentil cero (0). ¿Cómo se interpreta el percentil obtenido?", "options": ["Peso y talla muy altos para la edad.", "Peso y talla normales para la edad.", "Peso y talla altos para la edad.", "Peso y talla bajos para la edad."], "answer": "Peso y talla bajos para la edad.", "justification": "El percentil 0 se ubica en el extremo inferior de la distribución de referencia; por tanto, el peso y la talla se interpretan como bajos para la edad.", "bibliography": "Potter, P., Perry, A., Stockert, P., & Hall, A. (2019). Fundamentos de enfermería. 9.ª ed. Elsevier."}, {"id": 104, "question": "Usuario pediátrico con trastorno de despigmentación macular asociado a destrucción de melanocitos se encuentra hospitalizado acompañado de su madre. A la valoración se aprecia patrones de máculas y manchas blancas notablemente simétricos con bordes ligeramente hiperpigmentados. ¿Qué cuidado de enfermería se debe considerar para evitar complicaciones?", "options": ["Recomendar terapia con psoraleno y radiación UV.", "Sugerir que se evite el contacto con rayos solares.", "Sugerir que no se empleen tópicos de esteroides.", "Recomendar tratamiento UVB de banda amplia."], "answer": "Sugerir que se evite el contacto con rayos solares.", "justification": "En el vitíligo existe pérdida de melanocitos y menor protección frente a la radiación ultravioleta; por ello debe evitarse la exposición solar directa y utilizar fotoprotección.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 105, "question": "Un paciente ingresa a una sala de emergencias con una herida abierta en el antebrazo causada por un objeto cortante. El médico decide realizar una sutura en el lugar para cerrar la herida. ¿Cuál de las siguientes acciones es la más adecuada para garantizar la asepsia en este caso?", "options": ["Lavar el antebrazo con agua y jabón antes de la sutura.", "Utilizar guantes de manejo durante el procedimiento de sutura.", "Aplicar solución antiséptica directamente sobre la herida y suturar.", "Utilizar guantes estériles durante el procedimiento de sutura."], "answer": "Utilizar guantes estériles durante el procedimiento de sutura.", "justification": "La sutura es un procedimiento invasivo que requiere técnica aséptica; los guantes estériles ayudan a mantener la esterilidad del campo y disminuir la contaminación.", "bibliography": "Potter, P., Perry, A., Stockert, P., & Hall, A. (2019). Fundamentos de enfermería. 9.ª ed. Elsevier."}, {"id": 106, "question": "Madre acude al centro de salud con su recién nacido masculino de 15 días de vida para el tamizaje metabólico neonatal. Al momento recién nacido con signos vitales normales. ¿Qué consideración es correcta en la toma de la muestra?", "options": ["Puncionar en la parte central del talón.", "Limpiar el área del talón con gasa impregnada en alcohol antiséptico.", "Puncionar en una de las partes laterales del talón.", "Friccionar el sitio de punción antes de la toma de la muestra."], "answer": "Puncionar en una de las partes laterales del talón.", "justification": "Para el tamizaje metabólico neonatal la punción se realiza en las zonas laterales de la superficie plantar del talón, evitando el centro y las zonas de riesgo de lesión.", "bibliography": "Organización Panamericana de la Salud. (2006). Manual Clínico AIEPI Neonatal en el contexto del continuo materno-recién nacido-salud infantil."}, {"id": 107, "question": "Un adulto mayor de etnia indígena, habla muy poco español, muy religioso y con una gran familia, incluyendo una esposa, 9 hijos y muchos nietos, tiene un historial de patologías vasculares graves, fue sometido a una colecistectomía y ha desarrollo diabetes tipo II, hipertensión arterial y EPOC. Actualmente tiene el pie frío, piel pálida y un dolor creciente, su esposa insiste a todos los miembros de la familia que le visiten. El profesional de enfermería ingresa a la unidad del paciente para la valoración y observa ciertas características culturales, la mayoría de familiares están en oración y en la mesilla junto a la cama están varios pasajes del Corán grabados; pero los familiares de otros pacientes no dejaban sitio para que se sentaran. ¿Con qué modelo o teoría emprende su trabajo el profesional de enfermería?", "options": ["Teoría de Hildegard E. Peplau.", "Modelo de Nola Pender.", "Teoría de Madeleine Leininger.", "Modelo de Virginia Henderson."], "answer": "Teoría de Madeleine Leininger.", "justification": "La teoría de Madeleine Leininger aborda el cuidado transcultural y considera valores, creencias, prácticas y contexto cultural de la persona y su familia.", "bibliography": "Alligood, M. (2022). Modelos y Teorías de Enfermería. 10.ª ed. Elsevier."}, {"id": 108, "question": "Un profesional de enfermería ha terminado de realizar el aseo de un paciente fallecido debido a un infarto agudo de miocardio por arritmia maligna, ha retirado los catéteres, ocluido los orificios naturales y ha colocado el cuerpo en decúbito supino con ligera elevación de la cabeza sobre una almohada. ¿Por qué se coloca el cuerpo en esa posición?", "options": ["Para disminuir la lividez cadavérica en el rostro.", "Para evitar el drenaje sanguíneo de la cara.", "Para retrasar la aparición del enfriamiento cadavérico.", "Para impedir la aparición de la rigidez cadavérica."], "answer": "Para disminuir la lividez cadavérica en el rostro.", "justification": "La ligera elevación de la cabeza durante los cuidados post mortem favorece el manejo de la congestión y la acumulación de sangre en la región facial.", "bibliography": "Potter, P., Perry, A., Stockert, P., & Hall, A. (2019). Fundamentos de enfermería. 9.ª ed. Elsevier."}, {"id": 109, "question": "Un recién nacido se encuentra hospitalizado por bajo peso al nacer. La madre refiere que durante el embarazo presentó anticuerpos IgG positivos para toxoplasmosis, lo que indica una infección pasada. El bebé se encuentra inmunizado contra la hepatitis B y está siendo alimentado exclusivamente con leche materna. ¿Cuál es la forma en la que el recién nacido desarrolló inmunidad activa?", "options": ["Al recibir la vacuna contra la hepatitis B.", "Al exponer al bebé al ambiente sanitario.", "Al poseer anticuerpos para toxoplasmosis.", "Al ser alimentado con leche materna."], "answer": "Al recibir la vacuna contra la hepatitis B.", "justification": "La vacunación contra hepatitis B induce al organismo a producir su propia respuesta inmunitaria; por eso constituye inmunidad activa adquirida artificialmente.", "bibliography": "Ministerio de Salud Pública del Ecuador. (2021). Estrategia Nacional de Inmunizaciones, ENI."}, {"id": 110, "question": "Paciente femenina de 50 años se encuentra hospitalizada por laparotomía exploratoria, presenta herida quirúrgica cubierta con apósito manchado de líquido purulento y de mal olor. A la valoración la herida presenta eritema, rubor y calor local. El profesional enfermero procede a retirar el apósito. ¿Cuál es la clasificación correcta del desecho generado?", "options": ["Desecho común.", "Desecho corto - punzante.", "Desecho anatomopatológico.", "Desecho biológico - infeccioso."], "answer": "Desecho biológico - infeccioso.", "justification": "Un apósito con secreción purulenta y mal olor procedente de una herida infectada se clasifica como desecho biológico-infeccioso y requiere manejo diferenciado.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 111, "question": "Como profesional de enfermería ha sido designado para esterilizar varios paquetes de ropa quirúrgica en un hospital, tomando en cuenta las recomendaciones del Manual de Bioseguridad para establecimientos de salud del Ministerio de Salud Pública del Ecuador. ¿Cuál de los siguientes métodos de esterilización es el adecuado en este caso?", "options": ["Esterilización por óxido de etileno.", "Esterilización por calor húmedo.", "Esterilización por peróxido de hidrógeno.", "Esterilización por calor seco."], "answer": "Esterilización por calor húmedo.", "justification": "El calor húmedo a presión, mediante vapor, es un método eficaz para esterilizar ropa quirúrgica porque permite una adecuada penetración del agente esterilizante.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 112, "question": "Paciente de 78 años hospitalizada, en espera de cirugía por pterigium. Al momento presenta limitación funcional y necesita asistencia para realizar actividades básicas de la vida diaria. Constantes vitales dentro de parámetros normales, IMC 19. De acuerdo con el modelo de enfermería de Virginia Henderson, ¿Cuál es la intervención más adecuada?", "options": ["Coordinar la programación de cirugía.", "Proporcionar una dieta equilibrada y nutritiva.", "Ayudar a la paciente a movilizarse.", "Proporcionar analgésicos para controlar el dolor."], "answer": "Ayudar a la paciente a movilizarse.", "justification": "En el modelo de Virginia Henderson, enfermería ayuda a la persona a realizar actividades que contribuyen a su independencia; la movilización responde directamente a esa necesidad.", "bibliography": "Alligood, M. (2022). Modelos y Teorías de Enfermería. 10.ª ed. Elsevier."}, {"id": 113, "question": "En una comunidad de difícil acceso se presenta un elevado número de embarazadas, los profesionales enfermeros del equipo de salud realizan una visita para captación y valoración. Las madres refieren que reciben asistencia de la partera y no acuden a la unidad de salud por la distancia y falta de transporte. Al realizar la valoración el profesional de enfermería identifica signos de peligro, falta de control integral y vacunación; además, dialogan con los actores locales quienes demuestran interés por el problema de salud materno. ¿Qué mecanismo de referencia y contrarreferencia se determina con la participación comunitaria en el caso planteado?", "options": ["Definiendo puntos de partida y llegada con las redes de vigilancia del flujo desde la comunidad a las unidades de salud y retorno a la localidad.", "Promoviendo acciones para mejorar la calidad de vida en coordinación intra e intersectorial y actuando sobre los determinantes de la salud.", "Integrando las unidades de salud en los tres niveles para atención continua a las usuarias con una red organizada y de tecnología apropiada.", "Dirigiendo acciones coordinadas con enfoque intercultural, generacional y de género, que persiga la reducción, neutralización o eliminación de los factores."], "answer": "Definiendo puntos de partida y llegada con las redes de vigilancia del flujo desde la comunidad a las unidades de salud y retorno a la localidad.", "justification": "La referencia y contrarreferencia requiere establecer claramente los puntos de partida y llegada y el flujo de las personas desde la comunidad a los servicios y de regreso para continuar el seguimiento.", "bibliography": "Ministerio de Salud Pública del Ecuador. (2018). Manual de Modelo de Atención Integral de Salud – MAIS."}, {"id": 114, "question": "Paciente varón de 45 años ingresa al hospital con diagnóstico de neumonía adquirida en la comunidad. Durante la valoración inicial, el profesional de enfermería identifica que el paciente tiene una frecuencia respiratoria de 32 por minuto, temperatura de 38.5° C, utiliza músculos accesorios para respirar y presenta tos productiva. Además, presenta debilidad generalizada y se encuentra desnutrido. Como parte del proceso de enfermería, ¿Cuál es la etiqueta NANDA para estructurar el diagnóstico de enfermería prioritario para este paciente?", "options": ["Riesgo de déficit de volumen de líquidos.", "Patrón respiratorio ineficaz.", "Riesgo de hipertermia.", "Deterioro de la movilidad física."], "answer": "Patrón respiratorio ineficaz.", "justification": "La frecuencia respiratoria elevada, el uso de músculos accesorios y la tos productiva apoyan el diagnóstico de Patrón respiratorio ineficaz como prioridad respiratoria.", "bibliography": "Herdman, T. (2021). NANDA Internacional. Diagnósticos Enfermeros. Definiciones y Clasificaciones 2021-2023. Elsevier."}, {"id": 115, "question": "Paciente de 50 años es rescatado de un incendio en su hogar. A la valoración de enfermería presenta quemaduras de segundo grado en el 20 % de su superficie corporal total, principalmente en tronco y extremidades superiores, presenta tos con esputo carbonáceo y estridor laríngeo. ¿Cuál es la intervención de enfermería prioritaria en este paciente?", "options": ["Administración de oxígeno al 100%.", "Aplicar apósitos estériles en la superficie quemada.", "Administrar líquidos intravenosos.", "Administrar analgésicos intravenosos para el manejo del dolor."], "answer": "Administración de oxígeno al 100%.", "justification": "La presencia de esputo carbonáceo y estridor después de un incendio hace sospechar lesión por inhalación; la oxigenoterapia al 100% es una intervención inmediata de soporte.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 116, "question": "Durante el turno en el servicio de Medicina Interna, se valora a un paciente masculino de 75 años con antecedentes de hipertensión arterial. En la valoración de enfermería se identifica anuria de 24 horas, fiebre y dolor en la fosa renal izquierda. El médico indica de manera presuntiva el diagnóstico de insuficiencia por el uso de nefrotóxicos. ¿Cuál medicamento provoca esta lesión?", "options": ["Ciprofloxacina.", "Claritromicina.", "Cefazolina.", "Gentamicina."], "answer": "Gentamicina.", "justification": "La gentamicina pertenece a los aminoglucósidos y puede producir nefrotoxicidad, especialmente con tratamientos prolongados o factores de riesgo asociados.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 117, "question": "El profesional de enfermería brinda cuidados a un paciente adulto hospitalizado en la Unidad de Cuidados Intensivos (UCI) que está recibiendo alimentación enteral a través de una sonda nasogástrica. Usted nota que la alimentación no está fluyendo correctamente por la sonda, se observa residuos de fármacos pulverizados en el trayecto de ésta y no logra obtener contenido gástrico mediante la aspiración por la sonda. ¿Qué complicación se describe en este caso?", "options": ["Ruptura de la sonda.", "Desplazamiento de la sonda.", "Mala colocación de la sonda.", "Obstrucción de la sonda."], "answer": "Obstrucción de la sonda.", "justification": "Los residuos de medicamentos en la sonda y la imposibilidad de obtener contenido gástrico son compatibles con obstrucción de la sonda nasogástrica.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 118, "question": "En la visita domiciliaria, en el llenado de la ficha familiar para actualización del ASIS, el profesional enfermero encuentra que el jefe de hogar es un hombre de 42 años, desempleado desde hace un año, por lo que se refugia en el alcohol desde hace 5 meses. Su esposa de 37 años manifiesta que ella sale a trabajar y deja a su esposo al cuidado de sus hijos de 8, 5 y 3 años; actualmente los niños están descuidados en su vestido, higiene, alimentación, generando problemas dentro del hogar. ¿Qué determinantes de la salud constituyen factores de riesgo en este caso?", "options": ["Conductuales y ambientales.", "Ambientales y biológicos.", "Conductuales y sociales.", "Ambientales y sociales."], "answer": "Conductuales y sociales.", "justification": "El consumo de alcohol corresponde a un determinante conductual y el desempleo y la situación de cuidado familiar corresponden a determinantes sociales.", "bibliography": "González, S. Crespo, S. (2018). Salud pública y enfermería comunitaria. Manual Moderno."}, {"id": 119, "question": "Paciente de 19 años acude por primera vez al centro de salud en la semana 28 de su primer embarazo. No ha recibido controles prenatales por parte del sistema de salud pública. Durante la valoración se detectan signos compatibles con anemia; así como, cifras de presión arterial ligeramente elevada (TA 140/90mmHg). Se inicia control prenatal, tratamiento para la hipertensión gestacional y anemia, se establece un plan de seguimiento con visitas domiciliarias periódicas. ¿A cuál de las metas del objetivo 1 del Plan Nacional de Desarrollo se contribuye con la realización de estas intervenciones sanitarias?", "options": ["Reducir la razón de mortalidad materna.", "Reducir el gasto de bolsillo en salud como porcentaje del gasto total en salud.", "Reducir la prevalencia de Desnutrición Crónica Infantil en menores de dos años.", "Reducir la tasa específica de nacimientos en mujeres adolescentes de 15 a 19 años."], "answer": "Reducir la razón de mortalidad materna.", "justification": "El control prenatal oportuno y el tratamiento de anemia e hipertensión contribuyen a prevenir complicaciones y reducir la mortalidad materna.", "bibliography": "Organización de las Naciones Unidas. (2015). Transformar nuestro mundo: La Agenda 2030 para el Desarrollo Sostenible."}, {"id": 120, "question": "Paciente con VIH, debido a complicaciones relacionadas con su estado de salud ha sido hospitalizado en varias ocasiones en los últimos meses. Actualmente, vive con su esposa y sus dos hijos adultos, con quienes manifiesta insatisfacción en la relación interpersonal, puesto que han enfrentado problemas, especialmente por la falta de adaptación, participación y apoyo en su cuidado. Con esos datos usted evalúa la función familiar e implementa una intervención de cuidado. ¿Qué instrumento de la atención familiar utiliza como profesional de enfermería para basar su intervención?", "options": ["Apgar Familiar.", "Ecomapa familiar.", "Genograma familiar.", "Escala de reajuste social."], "answer": "Apgar Familiar.", "justification": "El Apgar Familiar permite valorar adaptación, participación, crecimiento, afecto y recursos/satisfacción dentro del funcionamiento familiar.", "bibliography": "González, S. Crespo, S. (2018). Salud pública y enfermería comunitaria. Manual Moderno."}, {"id": 121, "question": "Paciente femenina de 86 años, diabética, hipertensa, con obesidad grado I, presenta en región sacra úlcera por presión grado II, se realiza la visita domiciliaria y al ingresar a la habitación percibe olor desagradable, los muebles de la habitación están sucios, la ropa de cama y de la paciente están manchados con residuos de orina y heces fecales, por lo que se conversa con la familia y los instruye sobre la importancia de mantener hábitos higiénicos adecuados, la limpieza corporal y del entorno, la importancia de la luz y la ventilación de la habitación, que influyen en la recuperación de la paciente y evita complicaciones. ¿En referencia a este caso, quién es la autora de la Teoría?", "options": ["Jean Watson.", "Betty Neuman.", "Florence Nightingale.", "Hildegard Peplau."], "answer": "Florence Nightingale.", "justification": "La teoría del entorno de Florence Nightingale destaca higiene, ventilación, luz, limpieza y condiciones ambientales como elementos fundamentales para favorecer la recuperación.", "bibliography": "Alligood, M. (2022). Modelos y Teorías de Enfermería. 10.ª ed. Elsevier."}, {"id": 122, "question": "Mujer de 23 años primípara permanece en la sala de partos en conjunto con su recién nacido masculino a término. Durante el parto no se presentan complicaciones ni riesgos, la mujer solicita información sobre cuándo debe iniciar la lactancia materna. ¿Qué información le ofrece?", "options": ["Lactancia materna cuando pase a hospitalización.", "Lactancia materna dentro de la primera hora luego del nacimiento.", "Lactancia materna cuando pase a recuperación.", "Lactancia materna una hora después del nacimiento."], "answer": "Lactancia materna dentro de la primera hora luego del nacimiento.", "justification": "La recomendación es iniciar la lactancia materna dentro de la primera hora después del nacimiento, favoreciendo el contacto precoz y el establecimiento de la lactancia.", "bibliography": "Cunningham, G., Leveno, K., Dashe, J., Hoffman, B., Spong, C. & Casey, B. (2022). Williams Obstetrics. 26.ª ed. McGraw-Hill."}, {"id": 123, "question": "Un paciente masculino de 67 años es ingresado en el servicio de cardiología, con diagnóstico médico de fibrilación auricular tratado con warfarina. Durante la noche deambula para ir al baño y se resbala sin sufrir ningún daño perceptible. ¿Cómo se denomina a este evento relacionado con la seguridad del paciente?", "options": ["Evento adverso leve.", "Cuasi evento.", "Evento centinela.", "Evento adverso."], "answer": "Cuasi evento.", "justification": "Una caída sin daño perceptible constituye un incidente o cuasi evento porque ocurrió un evento de seguridad sin producir daño al paciente.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 124, "question": "Mujer de 20 años primigesta que cursa un embarazo de 12 semanas, en su primer control prenatal usted identifica la presencia de algunos factores de riesgo, a la valoración de enfermería determina que es una paciente de bajo riesgo. ¿Relacione cuáles son los factores de riesgo modificables y no modificables?", "options": ["1ad, 2bc.", "1bc, 2ad.", "1ab, 2cd.", "1cd, 2ab."], "answer": "1bc, 2ad.", "justification": "En este ejercicio, el soporte familiar insuficiente y el tabaquismo son factores modificables, mientras que la fecha de última menstruación incierta y la baja escolaridad se ubican entre los no modificables planteados.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 125, "question": "Un paciente de 65 años con antecedentes de VIH hace un año, quien acude al centro de salud por presentar molestias articulares de moderada intensidad y un peso de 49 kg; el médico valora mediante examen físico y complementario, diagnosticándolo de TB ósea, iniciando por primera vez el tratamiento antituberculoso. ¿Cuál es el esquema de tratamiento que corresponde en este caso?", "options": ["2HRZE/10HR.", "2HRZE/6HR.", "2RHE/7HR.", "2HRZE/4HR."], "answer": "2HRZE/10HR.", "justification": "La tuberculosis ósea es una forma extrapulmonar que requiere un esquema prolongado; el esquema señalado es 2HRZE/10HR.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 126, "question": "Paciente de 30 años que se encuentra en el postparto inmediato, a la valoración de enfermería presenta: letargia, palidez, piel fría, diaforética, llenado capilar >3 segundos, frecuencia cardíaca de 130 latidos por minuto, presión arterial 65/40 milímetros de mercurio. De acuerdo con el caso planteado, ¿Cuál es el grado de shock hipovolémico que presenta la paciente?", "options": ["Moderado.", "Leve.", "Severo.", "Compensado."], "answer": "Severo.", "justification": "La hipotensión marcada, taquicardia, piel fría y diaforesis, llenado capilar prolongado y alteración del estado de conciencia indican shock hipovolémico severo.", "bibliography": "Cunningham, G., Leveno, K., Dashe, J., Hoffman, B., Spong, C. & Casey, B. (2022). Williams Obstetrics. 26.ª ed. McGraw-Hill."}, {"id": 127, "question": "Gestante de 12 semanas se presenta en el centro de salud para inmunización, posterior al control prenatal por parte de la obstetra. No presenta problema alguno de salud. A la valoración de enfermería no existen signos o síntomas de infección alguna ni se refieren alergias a vacunas por parte de la gestante. ¿Qué vacuna está contraindicada para esta paciente?", "options": ["Hepatitis tipo B.", "Influenza estacional.", "Difteria y Tétanos.", "Varicela."], "answer": "Varicela.", "justification": "La vacuna de varicela es de virus vivos atenuados y está contraindicada durante el embarazo.", "bibliography": "Ministerio de Salud Pública del Ecuador. (2021). Estrategia Nacional de Inmunizaciones, ENI."}, {"id": 128, "question": "A la valoración de un recién nacido, en el cual se identifica: que no responde, no ventila y no tiene pulso; en la escena se encuentra el profesional de enfermería y un segundo reanimador. ¿Cuál es la relación entre compresión y ventilación en este caso?", "options": ["15 compresiones 2 ventilaciones.", "30 compresiones 2 ventilaciones.", "30 compresiones 1 ventilación.", "15 compresiones 3 ventilaciones."], "answer": null, "justification": "El reactivo presenta una inconsistencia: para reanimación neonatal la relación estándar es 3 compresiones por 1 ventilación, pero ninguna de las opciones ofrecidas corresponde a esa relación. Por ello no se califica este reactivo.", "bibliography": "Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."}, {"id": 129, "question": "Paciente de 35 años ingresa a urgencias tras un accidente de tránsito. En la v
