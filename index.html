 centralizado que armonice la demanda real con la reposición. • Mantener grandes reservas de materiales para evitar faltantes: Si bien busca prevenir la escasez, esta práctica incrementa los costos de almacenamiento, el riesgo de vencimiento de insumos estériles y no resuelve la causa raíz del problema, que es la falta de un sistema de control y planificación eficiente. • Comprar materiales en grandes cantidades una vez al año: Esta estrategia limita la flexibilidad ante cambios en la demanda, incrementa el riesgo de obsolescencia o caducidad de los insumos y no permite ajustes oportunos frente a variaciones en el volumen quirúrgico o brotes de necesidades inesperadas. Tip/Mnemotecnia: \"JIT\" (Just In Time): Justo lo necesario, en el momento indicado, evitando excesos y faltantes en la cadena de suministro hospitalario.","bibliography":"Balderas M. Administración de los Servicios de Enfermería. 6ª ed. Mc. Graw. Hill. Interamericana Editores, S.A; 2015. Subcomponente: Bases administrativas del cuidado Tema: Gestión de recursos materiales y equipos Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":276,"question":"Durante las actividades de seguimiento en el centro de salud, el profesional de enfermería recibe la alerta por parte del familiar de un usuario, quien refiere que varios vecinos de su sector presentan sintomatología febril y exantemática similar de forma repentina. De acuerdo con la Norma Técnica del Sistema Integrado de Vigilancia Epidemiológica del MSP, ¿a qué tipo de origen de información corresponde este reporte basado en la vigilancia comunitaria para la identificación de potenciales eventos que pudieran afectar a la salud pública?","options":["Fuentes formales nacionales.","Fuentes informales.","Fuentes institucionales directas.","Fuentes formales internacionales."],"answer":"Fuentes informales.","justification":"En la vigilancia basada en eventos, la información puede originarse fuera de los canales rutinarios oficiales. Un familiar que comunica que varios vecinos presentan fiebre y exantema constituye una señal proveniente de vigilancia comunitaria, por lo que se clasifica como fuente informal. Estas señales no se descartan por no venir de un establecimiento: deben verificarse, evaluarse y, si corresponde, activar investigación y respuesta oportuna. La normativa histórica del SIVE identifica explícitamente la vigilancia comunitaria y otros canales no oficiales dentro de las fuentes informales; la Norma Técnica SIVE vigente mantiene la vigilancia de eventos y la respuesta ante alertas de salud pública. Opciones incorrectas: • Fuentes formales nacionales: Provienen de sistemas, instituciones o reportes oficiales nacionales y siguen canales establecidos; el aviso espontáneo de un familiar no tiene ese origen. • Fuentes institucionales directas: Se originan en establecimientos o servicios de salud mediante notificación institucional; aquí la señal nace en la comunidad. • Fuentes formales internacionales: Corresponden a organismos y redes oficiales internacionales, no a información local aportada por una familia. Tip/Mnemotecnia: Comunidad, medios o rumores que generan una señal = fuente informal que debe verificarse.","bibliography":"Ministerio de Salud Pública del Ecuador. Normas del Sistema Integrado de Vigilancia Epidemiológica.           Norma              técnica.         Quito:           MSP;       2013. https://aplicaciones.msp.gob.ec/salud/archivosdigitales/documentosDirecciones/dnn/archivos/no rma_sive.pdf Ministerio de Salud Pública del Ecuador. Norma Técnica del Sistema Integrado de Vigilancia Epidemiológica (SIVE). Registro Oficial, Tercer Suplemento No. 107; 21 de agosto de 2025. Subcomponente: Bases epidemiológicas del cuidado: vigilancia epidemiológica Tema: Sistema de vigilancia epidemiológica: alerta contenido y sistema de información Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."}];

function answer(o,clicked){
  if(answered)return;
  answered=true;
  if(o.correct)hits++;
  $("score").textContent="Aciertos: "+hits;
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  clicked.classList.add(o.correct?"correct":"wrong");
  document.querySelectorAll(".opt").forEach(b=>{
    if(b.textContent.slice(3).trim()===session[pos].answer.trim())b.classList.add("correct");
  });
  const current=session[pos];
  if(!current.answer){
    $("feedbackTitle").textContent="⚠ No calificable";
    $("feedbackTitle").style.color="var(--muted)";
    $("explanation").textContent=(current.justification || "Esta pregunta no tiene una opción correcta válida en la fuente original.")+"\n\nEsta pregunta se conserva en el banco, pero no se contabiliza en la calificación.";
    $("source").textContent=current.bibliography ? "Bibliografía indicada en la guía: "+current.bibliography : "";
    $("feedback").className="feedback show";
  }else{
    $("feedbackTitle").textContent=o.correct?"✓ Correcta":"✗ Incorrecta";
    $("feedbackTitle").style.color=o.correct?"var(--good)":"var(--bad)";
    $("explanation").textContent=current.justification || "La guía no incluye una justificación para esta pregunta.";
    $("source").textContent=current.bibliography ? "Bibliografía indicada en la guía: "+current.bibliography : "";
    $("feedback").className="feedback show "+(o.correct?"good":"bad");
  }
  $("nextBtn").disabled=false;
  $("bar").style.width=((pos+1)/session.length*100)+"%";
}
function next(){

}
function finish(){
  $("quiz").hidden=true;$("result").hidden=false;
  authReady.then(async user => {
    if (!user) return;
    try { await incrementCounter("stats/completed"); }
    catch (err) { console.error("No se pudo registrar la finalización:", err); }
  });
  const scored=session.filter(q=>q.answer).length;
  const pct=scored ? Math.round(hits/scored*100) : 0;
  $("finalScore").textContent=pct+"%";
  $("finalText").textContent=`Obtuviste ${hits} de ${scored} respuestas calificables. ${scored<session.length ? "Las preguntas sin una respuesta válida en la fuente no se contabilizan. " : ""}${pct>=90?"Excelente desempeño.":pct>=70?"Buen resultado; sigue reforzando los temas con errores.":"Conviene repasar las justificaciones y volver a intentarlo."}`;
}
