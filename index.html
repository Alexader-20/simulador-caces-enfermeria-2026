co que presenta la paciente?","options":["Moderado.","Leve.","Severo.","Compensado."],"answer":"Severo.","justification":"La hipotensión marcada, taquicardia, piel fría y diaforesis, llenado capilar prolongado y alteración del estado de conciencia indican shock hipovolémico severo.","bibliography":"Cunningham, G., Leveno, K., Dashe, J., Hoffman, B., Spong, C. & Casey, B. (2022). Williams Obstetrics. 26.ª ed. McGraw-Hill."},{"id":127,"question":"Gestante de 12 semanas se presenta en el centro de salud para inmunización, posterior al control prenatal por parte de la obstetra. No presenta problema alguno de salud. A la valoración de enfermería no existen signos o síntomas de infección alguna ni se refieren alergias a vacunas por parte de la gestante. ¿Qué vacuna está contraindicada para esta paciente?","options":["Hepatitis tipo B.","Influenza estacional.","Difteria y Tétanos.","Varicela."],"answer":"Varicela.","justification":"La vacuna de varicela es de virus vivos atenuados y está contraindicada durante el embarazo.","bibliography":"Ministerio de Salud Pública del Ecuador. (2021). Estrategia Nacional de Inmunizaciones, ENI."},{"id":128,"question":"A la valoración de un recién nacido, en el cual se identifica: que no responde, no ventila y no tiene pulso; en la escena se encuentra el profesional de enfermería y un segundo reanimador. ¿Cuál es la relación entre compresión y ventilación en este caso?","options":["15 compresiones 2 ventilaciones.","30 compresiones 2 ventilaciones.","30 compresiones 1 ventilación.","15 compresiones 3 ventilaciones."],"answer":null,"justification":"El reactivo presenta una inconsistencia: para reanimación neonatal la relación estándar es 3 compresiones por 1 ventilación, pero ninguna de las opciones ofrecidas corresponde a esa relación. Por ello no se califica este reactivo.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":129,"question":"Paciente de 35 años ingresa a urgencias tras un accidente de tránsito. En la valoración inicial, el personal de enfermería registra: apertura ocular al dolor, emisión de palabras inapropiadas y flexión de las extremidades. De acuerdo con la Escala de Coma de Glasgow, ¿Cuál es la puntuación total que alcanza el paciente?","options":["Glasgow 9/15.","Glasgow 10/15.","Glasgow 8/15.","Glasgow 12/15."],"answer":"Glasgow 8/15.","justification":"Glasgow: apertura ocular al dolor = 2, respuesta verbal con palabras inapropiadas = 3 y respuesta motora en flexión = 3; total 8/15.","bibliography":"Potter, P., Perry, A., Stockert, P., & Hall, A. (2019). Fundamentos de enfermería. 9.ª ed. Elsevier."},{"id":130,"question":"Una gestante de 34 años acude por su cuarto control prenatal. A la valoración de enfermería se determinan 28 semanas de gestación y riesgo de parto prematuro que conlleva a que el recién nacido presente enfermedad de membrana hialina. ¿Qué acción profiláctica se debe aplicar?","options":["Iniciar aplicación de labetalol.","Aplicación de fludrocortisona.","Administración de betametasona.","Administrar gluconato de calcio."],"answer":"Administración de betametasona.","justification":"Los corticoides antenatales como betametasona aceleran la maduración pulmonar fetal y disminuyen el riesgo de síndrome de dificultad respiratoria del prematuro.","bibliography":"Cunningham, G., Leveno, K., Dashe, J., Hoffman, B., Spong, C. & Casey, B. (2022). Williams Obstetrics. 26.ª ed. McGraw-Hill."},{"id":131,"question":"Mujer primigesta de 46 años, gestante de 20 semanas que acude a centro de salud refiere, malestar general acompañado de cefalea, cambios de la visión, náusea que llega al vómito, edema de manos y miembros inferiores, oliguria, es valorada por profesional de enfermería quien realiza valoración de Score MAMÁ y una entrevista minuciosa. ¿Cuál es un factor de riesgo alto para preeclampsia?","options":["Infección de vías urinarias.","Enfermedad renal crónica.","Enfermedad periodontal.","Primer embarazo."],"answer":"Enfermedad renal crónica.","justification":"La enfermedad renal crónica es un factor de alto riesgo para preeclampsia por la asociación entre enfermedad renal y alteraciones vasculares/endoteliales.","bibliography":"Cunningham, G., Leveno, K., Dashe, J., Hoffman, B., Spong, C. & Casey, B. (2022). Williams Obstetrics. 26.ª ed. McGraw-Hill."},{"id":132,"question":"En una comunidad se evidencia una crisis sanitaria que afecta la salud de la niñez. La profesional de enfermería identifica hábitos inadecuados en el cuidado diario de los niños. ¿Cuál es el determinante de la salud que se describe en el caso?","options":["Ambiental.","Conductual.","Social.","Biológico."],"answer":"Conductual.","justification":"Los hábitos de cuidado diario son determinantes conductuales porque se relacionan con las prácticas y decisiones que las personas realizan de manera habitual.","bibliography":"González, S. Crespo, S. (2018). Salud pública y enfermería comunitaria. Manual Moderno."},{"id":133,"question":"Recién nacido de 15 días de vida es llevado por su madre al Centro de Salud, refiere que el parto fue en casa en el sector rural y desea que le apliquen las vacunas que le corresponde. En la valoración el recién nacido se encuentra en condiciones normales. ¿Cuál es el esquema de vacunación que corresponde en este caso?","options":["Administrar la vacuna Hepatitis B cero.","Administrar las vacunas BCG y Hepatitis B cero.","Indicar a la madre que debe iniciar el esquema a los 2 meses de edad.","Administrar la vacuna BCG y continuar el esquema en 2 meses."],"answer":"Administrar las vacunas BCG y Hepatitis B cero.","justification":"En un recién nacido de 15 días que no recibió las vacunas de nacimiento, corresponde recuperar BCG y hepatitis B según el esquema de inmunización indicado.","bibliography":"Ministerio de Salud Pública del Ecuador. (2021). Estrategia Nacional de Inmunizaciones, ENI."},{"id":134,"question":"Un paciente de 72 años, hospitalizado en el servicio de clínica por diagnóstico médico de neumonía, es atendido por la enfermera de turno. El paciente refiere cefalea de moderada intensidad. Al informarle al médico prescribe administrar analgésicos, la enfermera procede inmediatamente y además proporciona las medidas de relajación que minimizan su molestia. Aplicando el pensamiento crítico, ¿A qué etapa del proceso de enfermería corresponde este caso?","options":["Evaluar.","Implementar.","Diagnosticar.","Planificar."],"answer":"Implementar.","justification":"Administrar el analgésico y aplicar las medidas de relajación corresponde a ejecutar las intervenciones planificadas: es la etapa de implementación del PAE.","bibliography":"Potter, P., Perry, A., Stockert, P., & Hall, A. (2019). Fundamentos de enfermería. 9.ª ed. Elsevier."},{"id":135,"question":"Como profesional de enfermería del primer nivel de atención, se encuentra realizando una vigilancia epidemiológica por un incremento en la incidencia de enfermedades diarreicas agudas en niños menores de 5 años. Para abordar esta situación, consulta en diversas fuentes de información disponibles en el centro de salud, incluyendo la proyección de mapas epidemiológicos, gráficos de tendencias y tablas de datos. De acuerdo con el Modelo de Atención Integral de Salud (MAIS), ¿Cuál es la principal herramienta que se utiliza en este caso?","options":["Sala situacional.","Diagnóstico situacional.","Mapa parlante.","Diagnóstico dinámico."],"answer":"Sala situacional.","justification":"La sala situacional integra y presenta información de salud mediante mapas, gráficos y tablas para facilitar el análisis y la toma de decisiones.","bibliography":"Ministerio de Salud Pública del Ecuador. (2018). Manual de Modelo de Atención Integral de Salud – MAIS."},{"id":136,"question":"Paciente masculino de 37 años, con tipo de sangre B negativo sufre accidente de tránsito y requiere transfusión sanguínea urgente, pero en el banco de sangre no se dispone de hemoderivados de su mismo grupo sanguíneo. ¿Cuál es el grupo sanguíneo que puede ser compatible con el tipo de sangre del paciente?","options":["AB negativo.","O positivo.","O negativo.","B positivo."],"answer":"O negativo.","justification":"Una persona B Rh negativa puede recibir concentrados de glóbulos rojos O Rh negativo cuando no se dispone de B negativo, siempre bajo los protocolos transfusionales correspondientes.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":137,"question":"Paciente femenina asintomática de 23 años acude al centro de salud después de 3 meses de mantener relaciones sexuales sin protección, por lo cual se le realiza un test de Micro Elisa, en donde se evidencia la presencia de anticuerpos contra el virus de inmunodeficiencia humana VIH. ¿Cómo se interpreta el resultado del examen?","options":["La paciente ha desarrollado inmunidad contra el virus de inmunodeficiencia humana.","La paciente ha desarrollado resistencia adquirida.","La paciente está inmunocomprometida por la presencia del SIDA.","La paciente ha sido infectada por el virus de inmunodeficiencia humana."],"answer":"La paciente ha sido infectada por el virus de inmunodeficiencia humana.","justification":"La detección de anticuerpos contra VIH en una prueba reactiva indica infección que debe seguir el algoritmo diagnóstico; no significa inmunidad protectora.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":138,"question":"Paciente adulto mayor con antecedente de hipertensión arterial acude al centro de salud en busca de consejería, por lo que solicita información sobre una dieta adecuada. ¿Qué tipo de alimentos adicionaría a la dieta de este paciente?","options":["Sandía o melón.","Miel.","Carne roja.","Frutos secos."],"answer":"Frutos secos.","justification":"Los frutos secos pueden formar parte de una alimentación saludable para hipertensión, especialmente dentro de un patrón equilibrado y bajo en sodio.","bibliography":"Ministerio de Salud Pública del Ecuador. (2021). Estrategia Nacional de Inmunizaciones, ENI."},{"id":139,"question":"En la unidad de cuidados intensivos el personal de enfermería realiza de forma rutinaria la desinfección con glutaraldehído al 2% de todos los equipos utilizados en la intubación del paciente como las láminas del laringoscopio, este procedimiento es realizado durante 20 minutos. De acuerdo con el caso, ¿Qué nivel de desinfección se está aplicando?","options":["Desinfección de nivel intermedio.","Desinfección de alto nivel.","Desinfección de nivel mínimo.","Desinfección de bajo nivel."],"answer":"Desinfección de alto nivel.","justification":"El glutaraldehído al 2% se utiliza para desinfección de alto nivel de determinados artículos semicríticos cuando se cumplen concentración, tiempo y condiciones del procedimiento.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":140,"question":"Paciente con antecedentes de cáncer de mama estadio IV, ingresa al servicio por terapia de dolor, el médico prescribe la administración de un medicamento que actúe como un potente agonista de los receptores opiáceos mu. ¿Cuál es el medicamento que se administra con base al mecanismo de acción descrito?","options":["Metamizol.","Morfina.","Ketorolaco.","Paracetamol."],"answer":"Morfina.","justification":"La morfina es un potente agonista de los receptores opioides, especialmente μ, y se utiliza para el tratamiento del dolor intenso, incluido el dolor oncológico.","bibliography":"Kliegman, R., Geme, J., Blum, N., Shah, S., Tasker, R. & Wilson, K. (2020). Tratado de pediatría de Nelson. 21.ª ed. Elsevier."},{"id":141,"question":"El cáncer de cuello uterino se clasifica en diferentes estadios clínicos para su manejo, por tanto, una mujer que presenta un tumor que se ha extendido a la pared de la pelvis, al examen rectal no hay espacio libre de cáncer entre el tumor y la pared de la pelvis. ¿A qué estadio clínico corresponde?","options":["Estadio III B.","Estadio III A.","Estadio IV B.","Estadio IV A."],"answer":"Estadio III B.","justification":"La extensión del cáncer de cuello uterino hasta la pared pélvica corresponde al estadio IIIB.","bibliography":"Cunningham, G., Leveno, K., Dashe, J., Hoffman, B., Spong, C. & Casey, B. (2022). Williams Obstetrics. 26.ª ed. McGraw-Hill."},{"id":142,"question":"Un paciente de 60 años ha sido ingresado en el hospital tras sufrir un esguince de tobillo severo mientras jugaba al fútbol. A pesar de recibir analgésicos, sigue experimentando dolor intenso e inflamación en el tobillo. El profesional de enfermería decide implementar terapias no farmacológicas para ayudar a manejar su dolor. ¿Qué medida prioritaria utiliza en este caso?","options":["Utilizar técnicas clínicas de meditación.","Aplicar compresas frías en la zona afectada.","Realizar ejercicios de respiración profunda y relajación.","Aplicar masajes suaves en la zona afectada."],"answer":"Aplicar compresas frías en la zona afectada.","justification":"En un esguince agudo, las compresas frías ayudan a disminuir dolor e inflamación durante la fase inicial de la lesión.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":143,"question":"Paciente de 60 años con antecedentes de cáncer de próstata, para su tratamiento el médico indica intervención quirúrgica. Durante la visita médica el equipo de salud explica sobre el procedimiento al paciente, pero el paciente no desea iniciarlo. ¿Qué pilar de la bioética está implicado en este caso?","options":["Autonomía.","No maleficencia.","Justicia.","Beneficencia."],"answer":"Autonomía.","justification":"La autonomía reconoce el derecho de una persona competente a aceptar o rechazar una intervención sanitaria después de recibir información adecuada.","bibliography":"Consejo Internacional de Enfermeras. (2016). Código Deontológico del CIE para la Profesión de Enfermería."},{"id":144,"question":"En una comunidad rural se reúnen los profesionales de salud y los actores locales para verificar el cumplimiento de las estrategias y acciones prioritarias de educación y comunicación por el inadecuado uso de químicos en la agricultura y la exposición prolongada a la radiación solar. Según datos estadísticos se establece que las inflamaciones oculares y queratitis actínica bajaron del 75% al 55%, las quemaduras y bronceado de la piel se incrementó del 65% al 75% y el envejecimiento prematuro del 45% persiste. La morbilidad sigue relacionada con la falta de uso de prendas y elementos de fotoprotección. El profesional de enfermería analiza que en los últimos dos años hay un incremento de transferencias por lesiones precancerosas y cáncer de piel en grupos étnicos, referidos al segundo nivel y unidades oncológicas. ¿Con que orientaciones replantea los procesos educativos en promoción de la salud?","options":["Preparar métodos expositivos con expertos y dirigidos a los actores sociales.","Lineamientos para desarrollar procesos de educación y comunicación.","El enfoque de interculturalidad en las acciones educativas.","Disponer de herramientas de educación y comunicación."],"answer":"El enfoque de interculturalidad en las acciones educativas.","justification":"El enfoque de interculturalidad exige adaptar los procesos educativos a la diversidad cultural y considerar conocimientos, prácticas y contextos de los grupos participantes.","bibliography":"Ministerio de Salud Pública del Ecuador. (2018). Manual de Modelo de Atención Integral de Salud – MAIS."},{"id":145,"question":"Mujer de 52 años, acude al centro de salud porque refiere sofocos frecuentes, insomnio y cambios de humor, comenta que su última menstruación fue hace más de un año, no tiene antecedentes patológicos relevantes y no está tomando ningún tratamiento hormonal. Expresa su preocupación por su salud ósea ya que su madre tuvo fractura de cadera por osteoporosis. De acuerdo con el caso, ¿Cuál es la intervención de enfermería más adecuada?","options":["Indicar que los síntomas son normales y que no requiere atención específica.","Sugerir el uso de suplementos herbales sin necesidad de consulta médica.","Educar sobre cambios fisiológicos y promover hábitos saludables, dieta rica en calcio y Vitamina D.","Recomendar el inicio inmediato de terapia hormonal sustitutiva para aliviar los síntomas."],"answer":"Educar sobre cambios fisiológicos y promover hábitos saludables, dieta rica en calcio y Vitamina D.","justification":"En menopausia se recomienda promover actividad física y una alimentación adecuada con calcio y vitamina D para proteger la salud ósea, además de educación sobre los cambios fisiológicos.","bibliography":"Cunningham, G., Leveno, K., Dashe, J., Hoffman, B., Spong, C. & Casey, B. (2022). Williams Obstetrics. 26.ª ed. McGraw-Hill."},{"id":146,"question":"Recién nacido de 3 días de vida, con antecedentes de asfixia perinatal, presenta un paro cardiorrespiratorio en la unidad neonatal. El equipo inicia maniobras de reanimación. Tras 30 segundos de ventilación efectiva y compresiones torácicas, la frecuencia cardíaca sigue por debajo de 60 latidos por minuto. De acuerdo con la situación clínica descrita y las guías de reanimación, ¿Cuál es el medicamento que debe preparar para su administración inmediata?","options":["Dopamina.","Adrenalina.","Dexametasona.","Aminofilina."],"answer":"Adrenalina.","justification":"Cuando la frecuencia cardíaca neonatal permanece por debajo de 60 lpm pese a ventilación efectiva y compresiones adecuadas, se prepara adrenalina según el algoritmo de reanimación neonatal.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":147,"question":"Paciente residente en una comunidad rural, con antecedentes de hipertensión arterial y diabetes tipo 2. Durante la visita domiciliaria, se observa que enfrenta varias dificultades que provocan tristeza, depresión y falta de adherencia al tratamiento. Como personal de enfermería, usted identifica estas necesidades, establece un plan de cuidado integral basado en la valoración de la situación de la paciente, y coordina los recursos y servicios necesarios para la atención. ¿Cuál es la principal competencia de la enfermería basada en la comunidad que usted desempeña en este caso?","options":["Defensora del paciente.","Gestora de casos.","Colaboradora.","Epidemióloga."],"answer":"Gestora de casos.","justification":"La gestión de casos implica valorar necesidades, elaborar un plan y coordinar recursos y servicios para asegurar continuidad e integralidad del cuidado.","bibliography":"González, S. Crespo, S. (2018). Salud pública y enfermería comunitaria. Manual Moderno."},{"id":148,"question":"Paciente con antecedentes de lupus, expresa durante la visita domiciliaria que se siente preocupada porque no puede atender adecuadamente a su familia debido a su estado de salud, menciona su inquietud por el bienestar de sus hijas adolescentes de un compromiso anterior y un niño de 8 años fruto de su nuevo compromiso. Basado en este hallazgo, ¿Qué forma de familia se describe en el caso planteado?","options":["Familia monoparental.","Familia nuclear.","Familia mixta.","Familia alternativa."],"answer":"Familia mixta.","justification":"La convivencia de hijos de una relación previa con un hijo de la relación actual corresponde a una familia mixta o reconstituida.","bibliography":"González, S. Crespo, S. (2018). Salud pública y enfermería comunitaria. Manual Moderno."},{"id":149,"question":"Paciente masculino de 65 años acude al hospital para un control médico, en la valoración clínica registra un valor de presión arterial de 139/89 mmHg en la primera toma, al interrogatorio, el paciente informa que tiene antecedentes familiares de hipertensión arterial. ¿Cuál es la principal recomendación que usted brinda a este paciente?","options":["Educar sobre el uso de terapia de medicamentos antihipertensivos.","Realizar prueba de esfuerzo para ver su capacidad cardiovascular.","Control de exámenes de laboratorio para descartar alguna complicación.","Educar sobre una dieta baja en sodio y un programa de ejercicio regular."],"answer":"Educar sobre una dieta baja en sodio y un programa de ejercicio regular.","justification":"Ante una presión de 139/89 mmHg y antecedentes familiares de hipertensión, las medidas iniciales incluyen reducir sodio y mantener actividad física regular.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":150,"question":"Paciente masculino de 4 años ingresa a emergencia por dificultad para respirar, madre refiere que el niño se encuentra agitado y con mucha tos seca, al examen físico se evidencia taquipnea, taquicardia y SO2 de 85 %, la PaO2 es de 40 mmHg. ¿Qué intervención es la más adecuada en ese momento?","options":["Aspiración de secreciones.","Administración de oxígeno.","Fisioterapia torácica.","Lavado nasal."],"answer":"Administración de oxígeno.","justification":"Una saturación de 85% y PaO₂ de 40 mmHg evidencian hipoxemia; la intervención inmediata entre las opciones es administrar oxígeno.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":151,"question":"Paciente de 15 años acude a la consulta externa. A la valoración por parte del profesional de enfermería la paciente refiere que piensa que está embarazada y se encuentra preocupada de que ahora pueda tener una infección de transmisión sexual (ITS). La prueba de embarazo es negativa. ¿Cuál es la prioridad de atención por parte del profesional de enfermería?","options":["Contactar a sus padres y notificar la necesidad de anticonceptivos.","Asesoría sobre prácticas de sexo seguro.","Derivar a la paciente al profesional de especialidad.","Solicitar una prueba de ITS a la pareja de la paciente."],"answer":"Asesoría sobre prácticas de sexo seguro.","justification":"En una adolescente sexualmente activa, la prioridad es brindar consejería confidencial sobre prácticas sexuales seguras y prevención de ITS.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":152,"question":"En la comunidad rural donde usted labora se ha identificado un aumento en la incidencia de enfermedades crónicas no transmisibles, como Diabetes tipo II e Hipertensión. La población está compuesta principalmente por adultos mayores y familias de bajos recursos. Procede a desarrollar un plan de intervención para mejorar la salud de esta comunidad. Entre las actividades se incluyen la educación para la salud, programas de ejercicio comunitario, campañas de prevención, creación de huertos comunitarios y grupos de apoyo. ¿Cuál de las siguientes actividades del equipo de atención primaria se está aplicando en este caso?","options":["Promoción de la salud.","Rehabilitación y reinserción social.","Atención familiar.","Asistencia sanitaria."],"answer":"Promoción de la salud.","justification":"La educación, el ejercicio comunitario, la prevención, los huertos y los grupos de apoyo son acciones propias de promoción de la salud en atención primaria.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":153,"question":"Durante la entrega recepción de la guardia de enfermería, se reciben los equipos adquiridos por la institución de salud para la atención en la sala de labor de parto, con el fin de desarrollar actividades basadas en la confidencialidad y confianza entre pacientes, profesionales y personal de salud. Además, se realizará una capacitación continua para su uso y aplicación correcta. ¿A qué principio transversal de la seguridad del paciente-usuario corresponde principalmente este accionar de la institución de salud?","options":["Alianza con el paciente y su familia.","Cultura de seguridad.","Impacto.","Atención centrada en la persona."],"answer":"Cultura de seguridad.","justification":"La cultura de seguridad promueve prácticas seguras, capacitación continua, comunicación, confianza y condiciones organizacionales que reduzcan riesgos para pacientes y personal.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":154,"question":"El hospital está experimentando una escasez recurrente de materiales críticos en el quirófano, lo que ha provocado retrasos en las cirugías programadas y ha afectado la calidad de la atención. El líder de enfermería del servicio se ha reunido con el equipo directivo para discutir un plan de mejora en la gestión de estos recursos esenciales. ¿Cuál es la estrategia más adecuada para evitar este problema en el hospital?","options":["Dejar que cada departamento gestione sus propios inventarios de forma independiente.","Mantener grandes reservas de materiales para evitar faltantes.","Comprar materiales en grandes cantidades una vez al año.","Implementar un sistema de gestión de inventarios a tiempo."],"answer":"Implementar un sistema de gestión de inventarios a tiempo.","justification":"Un sistema de inventario a tiempo permite reponer materiales según necesidad y reducir simultáneamente faltantes, exceso de stock y desperdicio.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":155,"question":"Profesional de enfermería del Centro de Salud es responsable del área de inmunizaciones, ha discutido con una colega y se ha generado un conflicto, ella trata de solucionarlo y recurre a la Coordinadora de Enfermería del Centro para que facilite la comunicación y se encuentre una solución satisfactoria al conflicto. ¿Cómo se denomina este método?","options":["Conciliación.","Mediación.","Arbitraje.","Negociación."],"answer":"Mediación.","justification":"La mediación utiliza a un tercero imparcial para facilitar la comunicación entre las partes y ayudar a alcanzar una solución aceptable para el conflicto.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":156,"question":"Un paciente de 25 años hospitalizado en el servicio de cirugía general sufre una caída de su propia altura con pérdida de conciencia al movilizarse al baño; se realiza valoración primaria de ABC (vía aérea, respiración y circulación) obteniendo que el paciente no respira y no se palpa el pulso carotídeo, por lo cual se activa el código correspondiente y se inicia protocolo de Reanimación Cardio Pulmonar, para tal efecto llegan dos profesionales de salud para apoyar. Como parte del equipo de respuesta se empieza a dar compresiones. ¿Cuál es la profundidad de la compresión en este paciente para que sea considerada de calidad?","options":["0.5 a 1 pulgada (1.27 a 2.54 centímetros).","1/2 del diámetro anteroposterior del tórax.","1.5 a 2 pulgadas (4 a 5 centímetros).","1/3 del diámetro anteroposterior del tórax."],"answer":"1.5 a 2 pulgadas (4 a 5 centímetros).","justification":"En el adulto, las compresiones torácicas de calidad deben alcanzar aproximadamente 5 cm, sin exceder 6 cm; entre las opciones, 4–5 cm es la alternativa planteada.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":157,"question":"Paciente femenina de 16 años acude a la unidad de salud, refiere que ha empezado su vida sexual y desconoce los métodos de anticoncepción, enfermedades de transmisión sexual, entre otros. Por lo que necesita asesoría en salud sexual y reproductiva. ¿Cuál es el primer paso a seguir para cumplir con el proceso de asesoría, de acuerdo al Manual de Asesoría en salud sexual y reproductiva del Ministerio de Salud Pública?","options":["Información.","Indagación.","Vínculo.","Decisión."],"answer":"Vínculo.","justification":"El primer paso de la asesoría en salud sexual y reproductiva es establecer vínculo, confianza y condiciones de confidencialidad antes de profundizar en la información.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":158,"question":"Un paciente de 55 años con diagnóstico de hipertensión arterial, acude a la consulta externa para control. A la valoración de enfermería se constata los siguientes parámetros vitales: presión arterial 160/100 mmHg, frecuencia cardiaca 82 por minuto, frecuencia respiratoria 18 por minuto, temperatura 36.8 °C, saturación de oxígeno 90 %, IMC 24. El paciente refiere dolor de cabeza, mareo y visión borrosa, también informa que a veces olvida tomar la medicación, y se encuentra temeroso por su condición de salud. ¿Qué intervención de enfermería es prioritaria en este caso?","options":["Administrar analgésicos prescritos.","Promover el cumplimiento del esquema terapéutico.","Controlar la ansiedad del paciente.","Realizar un plan de control y registro de peso corporal."],"answer":"Promover el cumplimiento del esquema terapéutico.","justification":"La presión arterial elevada y el olvido de la medicación hacen prioritaria la promoción del cumplimiento y la adherencia al esquema terapéutico.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":159,"question":"Paciente femenina de 28 años, sintomática respiratoria por más de un mes, acudió al centro de salud obteniéndose la primera muestra de esputo, la profesional de enfermería le brindó información para la recolección de la segunda muestra y traerla al día siguiente pero no acudió. ¿Cuál es la actividad que debe realizar el personal de salud en ausencia de la paciente?","options":["Desechar la primera muestra y registrar la ausencia, programar una visita llevando dos envases.","Agendar una nueva cita para realizar la toma de primera y segunda muestra.","Coordinar la ubicación del sintomático respiratorio con la oficina técnica y obtener la segunda muestra.","Programar una visita domiciliaria para obtener la muestra faltante dentro de las 48 horas."],"answer":"Programar una visita domiciliaria para obtener la muestra faltante dentro de las 48 horas.","justification":"Cuando falta la segunda muestra de esputo, el seguimiento activo mediante visita domiciliaria permite localizar al sintomático y obtener oportunamente la muestra faltante.","bibliography":"Hernández, I., Lumbreras, B. (2018). Manual de epidemiología y salud pública. 3.ª ed. Editorial Médica Panamericana."},{"id":160,"question":"Un profesional de enfermería aplica los fundamentos de educación y comunicación para la promoción de la salud en su área de influencia. Al momento pretende desarrollar prácticas y actitudes que tengan incidencia sobre los determinantes de la salud a nivel comunitario. En el interrogatorio a un grupo focal encuentra prácticas potencialmente dañinas como la colocación de tela de araña en el ombligo de los recién nacidos. ¿Cómo se evidenciaría el enfoque sociocrítico en la promoción de la salud en este caso?","options":["Características psicoevolutivas en educación para la salud entendida como un objetivo de vida.","Promoción de la salud desconociendo prácticas de su entorno social.","Transferencia de conocimientos como visión principal para la promoción de la salud.","Promoción de la salud en contextos socioculturales, acción - reflexión - acción."],"answer":"Promoción de la salud en contextos socioculturales, acción - reflexión - acción.","justification":"El enfoque sociocrítico parte del contexto sociocultural y utiliza un proceso de acción–reflexión–acción, en lugar de imponer conocimientos sin considerar las prácticas locales.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":161,"question":"Paciente femenina de 32 años refiere que consume un medicamento para tratar sus convulsiones. A la valoración de enfermería identifica una amenorrea de aproximadamente 7 semanas y algunos signos y síntomas probables de embarazo. Según el caso, ¿Qué medicamento consume la paciente y puede provocar teratogenicidad en el desarrollo embrionario?","options":["Carbamazepina.","Warfarina.","Tiamina.","Levotiroxina sódica."],"answer":"Carbamazepina.","justification":"La carbamazepina es un anticonvulsivante asociado a riesgo teratogénico; ante un embarazo debe realizarse valoración especializada del tratamiento.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":162,"question":"Un grupo específico de personas, viven en una parroquia rural, comparten la misma cultura, valores y normas. Al momento están organizadas en una estructura social por cabildo. En la valoración se detecta la necesidad de reorientar los servicios de salud hacia la comunidad. ¿Cuál de los siguientes enunciados define el concepto de comunidad cerrada?","options":["Una comunidad que se enfoca principalmente en el desarrollo económico y la generación de empleo.","Una comunidad que tiene fronteras geográficas claramente definidas y limita el acceso a personas externas.","Una comunidad que se caracteriza por tener una diversidad cultural y étnica muy marcada.","Una comunidad que promueve la participación activa de sus miembros en actividades sociales y culturales."],"answer":"Una comunidad que tiene fronteras geográficas claramente definidas y limita el acceso a personas externas.","justification":"Una comunidad cerrada se caracteriza, en este planteamiento, por límites geográficos definidos y restricciones de acceso a personas externas.","bibliography":"Cunningham, G., Leveno, K., Dashe, J., Hoffman, B., Spong, C. & Casey, B. (2022). Williams Obstetrics. 26.ª ed. McGraw-Hill."},{"id":163,"question":"Un paciente ingresa al hospital con diagnóstico de tuberculosis pulmonar activa. El personal de enfermería encargado de su cuidado debe utilizar medidas de aislamiento para prevenir la transmisión de la enfermedad a otros pacientes y al personal de salud. ¿Qué tipo de aislamiento debe aplicarse en este caso?","options":["Aislamiento por contacto.","Aislamiento por vía aérea.","Aislamiento por gotas.","Aislamiento por cohorte."],"answer":"Aislamiento por vía aérea.","justification":"La tuberculosis pulmonar activa se transmite por vía aérea, por lo que requiere aislamiento respiratorio de vía aérea.","bibliography":"Alligood, M. (2022). Modelos y Teorías de Enfermería. 10.ª ed. Elsevier."},{"id":164,"question":"Un profesional de enfermería está brindando cuidados a un paciente diagnosticado de diabetes mellitus tipo 2 con sobrepeso, cuya indicación es la administración de insulina NPH (de acción intermedia) por vía subcutánea cada día; luego de limpiar la piel procede a la administración del fármaco. ¿Cuál es el principal cuidado de enfermería cuando se utiliza esta vía de administración?","options":["No extraer las burbujas de aire de la jeringuilla.","Rotar diariamente los sitios de inyección.","Insertar la aguja en ángulo de 10 - 15 grados.","Aplicar el medicamento con aguja de 12 mm."],"answer":"Rotar diariamente los sitios de inyección.","justification":"La rotación de los sitios de inyección subcutánea de insulina ayuda a prevenir alteraciones locales del tejido y favorece una absorción más uniforme.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":165,"question":"Una paciente de 28 años es atendida en el servicio de urgencias con un diagnóstico médico de hemotórax. Presenta dolor torácico, dificultad respiratoria, tiraje intercostal, taquicardia y disminución de la expansión del hemitórax izquierdo, llanto fácil y temor. ¿Cuál es el diagnóstico de enfermería prioritario para esta paciente?","options":["Dolor agudo relacionado con agentes lesivos.","Ansiedad relacionada con factores estresores.","Deterioro de la ventilación espontánea relacionado con la fatiga de los músculos respiratorios.","Riesgo de infección relacionado con el deterioro de la integridad cutánea."],"answer":"Deterioro de la ventilación espontánea relacionado con la fatiga de los músculos respiratorios.","justification":"El hemotórax compromete la ventilación y puede producir deterioro de la ventilación espontánea por la afectación de la expansión pulmonar.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":166,"question":"Como profesional de enfermería, está realizando un estudio para conocer el comportamiento del consumo de alcohol en un grupo de adolescentes, la información será recolectada en un momento específico. Al ser un problema nuevo y poco conocido en la comunidad, con los resultados de este estudio se ejecutarán programas de promoción y prevención de salud. ¿Qué tipo de diseño es pertinente para este estudio?","options":["Diseño transversal descriptivo.","Diseño transversal exploratorio.","Diseño longitudinal de tendencia.","Diseño transversal correlacional-causal."],"answer":"Diseño transversal exploratorio.","justification":"El diseño transversal exploratorio permite estudiar un fenómeno poco conocido recogiendo información en un momento determinado para generar una primera aproximación.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":167,"question":"Un paciente de 54 años ingresa al hospital con dificultad para respirar. Durante la valoración de enfermería se observa al paciente intranquilo, temperatura: 37.5 °C, presión arterial: 80/60 mmHg, frecuencia cardíaca 120 lpm, frecuencia respiratoria 20 rpm y oximetría 80%. Según la valoración de enfermería, ¿Cuál es el signo prioritario para una intervención inmediata?","options":["Hipotensión arterial.","Temperatura.","Oximetría.","Frecuencia cardíaca."],"answer":"Oximetría.","justification":"Una saturación de oxígeno de 80% representa hipoxemia grave y requiere intervención inmediata para mejorar la oxigenación.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":168,"question":"Paciente femenina de 17 años acude a consulta externa refiriendo un retraso de 3 semanas en su ciclo menstrual, además menciona que tras realizarse una prueba urinaria de embarazo doméstica ésta salió positiva. Al interrogatorio menciona prácticas sexuales sin protección. ¿Qué datos complementarios ayudarían a confirmar el embarazo?","options":["Cambios en el aparato reproductor inferior, signo de Chadwick.","El aumento de la pigmentación y la aparición de estrías abdominales.","Fecha de última menstruación y tiempo de amenorrea.","La detección de B-HCG en sangre y la ecografía transvaginal."],"answer":"La detección de B-HCG en sangre y la ecografía transvaginal.","justification":"La combinación de β-hCG en sangre y ecografía transvaginal aporta evidencia objetiva para confirmar el embarazo y valorar su localización.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":169,"question":"Paciente masculino de 70 años, hospitalizado con diagnóstico de apendicitis, antecedentes de hipertensión arterial diagnosticada hace 5 años con tratamiento farmacológico. Al momento se encuentra desorientado, inquieto, poco colaborador, presenta cifras de presión arterial elevadas por lo que se le administra antihipertensivos vía venosa. Tiene dificultad para movilizarse solo, por lo que requiere asistencia y cuidados, mientras se transporta al quirófano sufre una caída. ¿Cuál es el tipo de evento adverso con el que está relacionado el caso?","options":["Con infecciones hospitalarias.","Con los cuidados.","Con la medicación.","Con procedimientos."],"answer":"Con la medicación.","justification":"En el caso descrito, la caída ocurre después de la administración intravenosa de antihipertensivos; por ello el evento se relaciona con la medicación.","bibliography":"Hernández, I., Lumbreras, B. (2018). Manual de epidemiología y salud pública. 3.ª ed. Editorial Médica Panamericana."},{"id":170,"question":"En la unidad operativa del primer nivel de atención, se ha planificado la ejecución de la campaña de salud \"Como cuidar tu corazón\", cada miembro del equipo de salud tiene asignada una actividad. ¿Cuáles son los roles que le corresponden al profesional de enfermería?","options":["Informativo, detección y erradicación.","Fomento de la salud y prevención de enfermedades y accidentes.","Asesoramiento individual.","Educador, apoyo, refuerzo e identificar grupos de riesgo."],"answer":"Educador, apoyo, refuerzo e identificar grupos de riesgo.","justification":"Entre las funciones de enfermería en promoción y prevención se incluyen educación, apoyo, refuerzo e identificación de grupos de riesgo.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":171,"question":"Paciente masculino de 27 años que ingresa al servicio de emergencia por presentar estatus convulsivo y edema en miembros superiores, se decide colocar sonda vesical para control de ingesta y eliminación estricto; al momento de inflar el balón el paciente se queja de dolor severo y se evidencia salida de sangre en orina. ¿Cuál es la estructura que se lesionó durante el procedimiento?","options":["Uréteres.","Próstata.","Vejiga.","Uretra."],"answer":"Uretra.","justification":"Dolor intenso y hematuria inmediatamente después de inflar el balón sugieren lesión de la uretra por colocación o inflado inadecuado del catéter.","bibliography":"Ministerio de Salud Pública del Ecuador. (2018). Manual de Modelo de Atención Integral de Salud – MAIS."},{"id":172,"question":"Usted trabaja en el Departamento de Control de Infecciones, como reporte semanal se detectó un incremento en la tasa de infecciones del sitio quirúrgico, para lo que le piden revisar el libro de registros de los quirófanos y reconocer los parámetros anómalos con relación a temperatura y humedad. ¿En qué quirófano está ocurriendo lo planteado en el caso?","options":["Quirófano 1: Temperatura 24 °C, humedad 56 %.","Quirófano 4: Temperatura 23 °C, humedad 55 %.","Quirófano 2: Temperatura 20 °C, humedad 50 %.","Quirófano 3: Temperatura 22 °C, humedad 52 %."],"answer":"Quirófano 1: Temperatura 24 °C, humedad 56 %.","justification":"El quirófano 1 presenta 24 °C, el valor más alto entre los registros mostrados y el parámetro anómalo señalado en el reactivo.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":173,"question":"Un neonato con antecedentes de prematurez moderada llega al servicio de emergencias de la maternidad en brazos de su madre. Es valorado por el profesional de enfermería quien observa letargia y cianosis distal leve; procede a colocarlo en la incubadora conectado al sensor de temperatura de piel donde se aprecia un valor de 35.3° C. ¿En qué clasificación de temperatura se encuentra el neonato?","options":["Hipotermia moderada.","Normotermia.","Hipotermia leve.","Hipotermia grave."],"answer":"Hipotermia leve.","justification":"Una temperatura neonatal de 35,3 °C corresponde a hipotermia leve dentro de la clasificación planteada.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":174,"question":"Usted se encuentra atendiendo a un paciente de 70 años diagnosticado con un cáncer avanzado. El paciente ha expresado su deseo de no recibir más tratamientos agresivos y en su lugar, prefiere recibir cuidados paliativos para mejorar su calidad de vida en sus últimos días. Sin embargo, la familia del paciente insiste en que se sigan intentando tratamientos experimentales, ya que no quieren aceptar la decisión del paciente. ¿Cuál es el principal principio bioético que se está vulnerando en este caso?","options":["Justicia.","No maleficencia.","Beneficencia.","Autonomía."],"answer":"Autonomía.","justification":"La autonomía se vulnera cuando se pretende imponer un tratamiento contra la voluntad expresada por un paciente competente que ha decidido recibir cuidados paliativos.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":175,"question":"Paciente con diagnóstico de aborto ectópico fue enviada de manera urgente desde el área de emergencia al quirófano, donde se realizó la intervención correspondiente y fue trasladada a la unidad de cuidados intensivos para su estabilización y monitoreo. ¿Cómo se clasifican las áreas en las que fue atendida la paciente?","options":["Semicríticas.","No críticas.","De bajo riesgo.","Críticas."],"answer":"Críticas.","justification":"Emergencia, quirófano y UCI son áreas críticas por el tipo de procedimientos, complejidad, riesgo y necesidad de control estricto de infecciones.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":176,"question":"En una investigación sobre factores asociados a la hipertensión en adultos, un equipo de salud comunitaria recolecta datos de 100 pacientes sobre dos variables cuantitativas: Edad (en años) y Presión arterial sistólica (en mmHg). Los investigadores desean determinar si existe una relación lineal significativa entre la edad y los niveles de presión arterial sistólica en la muestra. Ambas variables se distribuyen de manera normal. ¿Qué prueba estadística paramétrica es la más adecuada utilizar para este estudio?","options":["Prueba t.","Coeficiente de correlación de Pearson.","Análisis de varianza unidireccional.","Chi-cuadrado."],"answer":"Coeficiente de correlación de Pearson.","justification":"El coeficiente de correlación de Pearson es una prueba paramétrica para evaluar la fuerza y dirección de la relación lineal entre dos variables cuantitativas con distribución normal.","bibliography":"Normas, políticas, reglamentos, protocolos, manuales, planes, guías y otros del Ministerio de Salud Pública del Ecuador."},{"id":177,"question":"Paciente masculino de 70 años, hospitalizado con diagnóstico de apendicitis, antecedentes de hipertensión arterial diagnosticada hace 5 años en tratamiento farmacológico. Al momento se encuentra desorientado, inquieto, poco colaborador, presenta cifras de presión arterial elevadas, por lo que se le administra antihipertensivos vía venosa. Tiene dificultad para movilizarse solo, por lo que requiere asistencia y cuidados; mientras se transporta al quirófano sufre una caída. ¿Cuál es el tipo de evento adverso con el que está relacionado el caso?","options":["Con infecciones hospitalarias.","Con los cuidados.","Con la medicación.","Con procedimientos."],"answer":"Con los cuidados.","justification":"Los eventos adversos relacionados con los cuidados son aquellos daños no intencionados producidos por una omisión, retraso o inadecuada ejecución de las actividades de vigilancia, asistencia y protección que el personal de enfermería debe brindar al paciente, especialmente cuando este presenta factores de riesgo identificables (edad avanzada, desorientación, inquietud, dificultad para la movilización y uso de fármacos que alteran el estado hemodinámico o neurológico). En el caso descrito, el paciente reunía múltiples criterios de riesgo de caída (adulto mayor, desorientación, poca colaboración, antihipertensivos endovenosos, dependencia para la movilización) que obligaban a implementar medidas preventivas (barandales, acompañamiento permanente, sujeción segura durante el traslado). La ausencia o insuficiencia de estas medidas de cuidado directo derivó en la caída, configurando un evento adverso vinculado al proceso de cuidados enfermeros y no a la medicación, procedimientos o infección per se. Opciones incorrectas: • Con infecciones hospitalarias: Este tipo de evento adverso se relaciona con procesos infecciosos adquiridos durante la estancia hospitalaria (infección de sitio quirúrgico, neumonía asociada a ventilación mecánica, infección urinaria asociada a catéter), situación no descrita en el caso, que no reporta signos de proceso infeccioso. • Con la medicación: Se refiere a errores en la prescripción, dispensación o administración de fármacos (dosis incorrecta, vía errada, interacción medicamentosa) que ocasionan daño al paciente; en este caso la administración del antihipertensivo fue clínicamente pertinente por las cifras tensionales elevadas y no fue la causa directa del daño, sino la falta de vigilancia durante la movilización. • Con procedimientos: Corresponde a daños derivados de la ejecución de técnicas o intervenciones diagnósticas/terapéuticas (punciones, sondajes, cirugías) mal realizadas; la caída durante el traslado no constituye un procedimiento invasivo o técnico, sino una falla en la vigilancia y asistencia continua del paciente. Tip/Mnemotecnia: Ante un paciente con factores de riesgo de caída (adulto mayor + desorientación + fármacos que alteran el estado hemodinámico/neurológico + dependencia funcional), la vigilancia y asistencia continua es responsabilidad directa del cuidado enfermero: su omisión = evento adverso relacionado con los cuidados.","bibliography":"Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Seguridad y calidad en el cuidado Tema: Seguridad del paciente: generalidades Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":178,"question":"Un paciente ingresa al hospital con diagnóstico de tuberculosis pulmonar activa. El personal de enfermería encargado de su cuidado debe utilizar medidas de aislamiento para prevenir la transmisión de la enfermedad a otros pacientes y al personal de salud. ¿Qué tipo de aislamiento debe aplicarse en este caso?","options":["Aislamiento por contacto.","Aislamiento por vía aérea.","Aislamiento por gotas.","Aislamiento por cohorte."],"answer":"Aislamiento por vía aérea.","justification":"La tuberculosis pulmonar activa se transmite mediante núcleos de gotas (droplet nuclei) menores a 5 micras, los cuales permanecen suspendidos en el aire durante largos períodos de tiempo y pueden desplazarse por corrientes de aire a distancias considerables. Por ello, el personal de enfermería debe ubicar al paciente en una habitación con presión negativa, mantener la puerta cerrada y utilizar mascarilla de alta eficiencia (N95 o FFP2) al ingresar a la habitación, además de restringir el número de visitas y garantizar una adecuada ventilación del ambiente, conforme a las precauciones estándar de bioseguridad. Opciones incorrectas: • Aislamiento por contacto: Se aplica en infecciones que se transmiten por contacto directo o indirecto con el paciente o superficies contaminadas, como en el caso de microorganismos multirresistentes (por ejemplo, Clostridium difficile o infecciones por MRSA), requiriendo el uso de guantes y bata, pero no mascarilla de alta eficiencia. • Aislamiento por gotas: Corresponde a enfermedades transmitidas por partículas mayores a 5 micras que se dispersan a corta distancia (menos de un metro), como la influenza o la meningitis meningocócica, requiriendo mascarilla quirúrgica y no mascarilla N95. • Aislamiento por cohorte: No constituye un tipo de aislamiento según la vía de transmisión, sino una estrategia organizativa que consiste en agrupar a pacientes con la misma infección en un mismo espacio cuando no se dispone de habitaciones individuales suficientes. Tip/Mnemotecnia: Para recordar las precauciones basadas en el mecanismo de transmisión: \"CGA\" - Contacto (guantes/bata), Gotas (mascarilla quirúrgica, <1 metro), Aérea (N95, presión negativa). La tuberculosis, el sarampión y la varicela son las clásicas \"3 A\" que requieren aislamiento Aéreo.","bibliography":"Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Bioseguridad Tema: Bioseguridad: concepto, principios normas y precauciones Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":179,"question":"Un paciente de 54 años ingresa al hospital con dificultad para respirar. Durante la valoración de enfermería se observa al paciente intranquilo, temperatura: 37,5 °C, presión arterial: 80/60 mmHg, frecuencia cardíaca: 120 lpm, frecuencia respiratoria: 20 rpm y oximetría: 80 %. Según la valoración de enfermería, ¿cuál es el signo prioritario para una intervención inmediata?","options":["Hipotensión arterial.","Temperatura.","Oximetría.","Frecuencia cardíaca."],"answer":"Oximetría.","justification":"Un valor de saturación de oxígeno del 80% representa una hipoxemia severa que compromete de forma inminente la oxigenación tisular y la vida del paciente. Siguiendo la secuencia de prioridades ABC (Vía Aérea, Ventilación/Breathing, Circulación) y la jerarquía de necesidades de Maslow aplicada al cuidado enfermero, la oxigenación es la necesidad fisiológica más urgente de cubrir, ya que su déficit produce daño celular irreversible en minutos. Por lo tanto, ante este hallazgo, la enfermera debe iniciar de inmediato medidas de soporte de oxígeno (oxigenoterapia, valoración de vía aérea y patrón respiratorio) antes de abordar otros parámetros alterados, dado que la hipoxia no corregida puede desencadenar rápidamente paro cardiorrespiratorio. Opciones incorrectas: • Hipotensión arterial: Aunque una presión arterial de 80/60 mmHg es un signo de alarma que sugiere compromiso hemodinámico (posible shock), en la secuencia de prioridades de valoración se aborda después de asegurar la vía aérea y la oxigenación, ya que la circulación depende de una adecuada ventilación previa. • Temperatura: Un valor de 37,5 °C corresponde a febrícula leve, sin relevancia clínica inmediata frente al compromiso respiratorio y hemodinámico que presenta el paciente; no representa riesgo vital a corto plazo. • Frecuencia cardíaca: La taquicardia de 120 lpm es un mecanismo compensatorio del organismo frente a la hipoxemia y la hipotensión, por lo que constituye una consecuencia del problema principal y no la causa que debe intervenirse en primer lugar. Tip/Mnemotecnia: Recuerda el \"ABC\" de la priorización clínica: Airway (vía aérea), Breathing (ventilación/oxigenación) y Circulation (circulación). La oximetría del 80% indica una falla en la \"B\", por lo que siempre se prioriza sobre alteraciones circulatorias o térmicas.","bibliography":"Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Proceso de atención en Enfermería Tema: Valoración de enfermería Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":180,"question":"Durante una visita domiciliaria, se identifica a una familia compuesta por la madre de 35 años con antecedentes de hipertensión arterial, el padre de 45 años diagnosticado con diabetes mellitus tipo II, ambos con buena adherencia al tratamiento. Tienen un hijo de 4 años y otro de 8 meses, quienes no han completado su esquema de vacunación. En la entrevista, la madre expresa su deseo de mejorar la calidad de vida familiar y su disposición para cambiar conductas de salud, razón por la cual usted le brinda educación para la salud. Según la definición y clasificación de diagnósticos de enfermería, ¿qué tipo de diagnóstico está aplicando para el cuidado de esta familia?","options":["Diagnóstico de síndrome.","Diagnóstico focalizado en el problema.","Diagnóstico de promoción de la salud.","Diagnóstico de riesgo."],"answer":"Diagnóstico de promoción de la salud.","justification":"Según la taxonomía NANDA-I, este tipo de diagnóstico se define como un juicio clínico sobre la motivación y el deseo de una persona, familia, grupo o comunidad de aumentar su bienestar y actualizar su potencial de salud, expresado en su disposición para mejorar comportamientos específicos. En el caso presentado, la madre manifiesta explícitamente su motivación para mejorar la calidad de vida familiar y su disposición para cambiar conductas de salud, lo cual constituye el criterio diagnóstico central de esta categoría, independientemente de que existan factores de riesgo (esquema de vacunación incompleto, comorbilidades crónicas) que puedan abordarse mediante intervenciones educativas complementarias. Opciones incorrectas: • Diagnóstico de síndrome: Corresponde a un juicio clínico que se refiere a un grupo de diagnósticos de enfermería reales o de riesgo que suelen presentarse juntos y que se abordan mejor mediante un conjunto similar de intervenciones, como el síndrome de fragilidad del anciano o el síndrome de estrés del traslado; no aplica aquí porque no se describe un cúmulo de diagnósticos asociados. • Diagnóstico focalizado en el problema: Describe una respuesta humana indeseable a una condición o situación de salud/proceso vital existente, sustentada en características definitorias (signos y síntomas) agrupadas en patrones relacionados; en este caso no se identifica un problema de salud real ya manifiesto que requiera esta clasificación, sino una disposición proactiva de mejora. • Diagnóstico de riesgo: Describe respuestas humanas a condiciones de salud/procesos vitales que pueden desarrollarse en una persona, familia, grupo o comunidad vulnerable, sustentado por factores de riesgo que contribuyen al aumento de la vulnerabilidad; aunque la familia presenta factores de riesgo (vacunación incompleta, enfermedades crónicas), la pregunta enfatiza la motivación y disposición de la madre para el cambio, lo que orienta hacia promoción de la salud y no hacia riesgo. Tip/Mnemotecnia: \"PROMOCIÓN = MOTIVACIÓN\". Si el paciente o familia expresa deseo y disposición de mejorar su salud (aunque no tenga un problema manifiesto), es diagnóstico de promoción de la salud.","bibliography":"Herdman T. NANDA Internacional. Diagnósticos Enfermeros. Definiciones y Clasificaciones 2021-2023. Elsevier; 2021. Subcomponente: Proceso de atención en Enfermería Tema: Taxonomías, NANDA, NOC Y NIC Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":181,"question":"Paciente femenina de 86 años, diabética, hipertensa, con obesidad grado I, presenta en región sacra úlcera por presión grado II. Se realiza la visita domiciliaria y, al ingresar a la habitación, percibe olor desagradable; los muebles de la habitación están sucios, la ropa de cama y de la paciente están manchados con residuos de orina y heces fecales, por lo que se conversa con la familia y los instruye sobre la importancia de mantener hábitos higiénicos adecuados, la limpieza corporal y del entorno, la importancia de la luz y la ventilación de la habitación, que influyen en la recuperación de la paciente y evita complicaciones. En referencia a este caso, ¿quién es la autora de la teoría?","options":["Jean Watson.","Betty Neuman.","Florence Nightingale.","Hildegard Peplau."],"answer":"Florence Nightingale.","justification":"Es la autora de la Teoría del Entorno, la cual postula que la enfermedad es un proceso reparador de la naturaleza y que el rol de la enfermera consiste en colocar al paciente en las mejores condiciones posibles para que dicha naturaleza actúe. Nightingale identificó componentes ambientales específicos —ventilación adecuada, luz natural, calor, limpieza del entorno y de la ropa de cama, control de olores y manejo silencioso— como determinantes directos de la recuperación del paciente y de la prevención de complicaciones, tal como se evidencia en el caso descrito. Opciones incorrectas: • Jean Watson: Es la autora de la Teoría del Cuidado Humano, centrada en los diez factores de cuidado (carativos) y en la relación transpersonal enfermera-paciente, pero no enfatiza los elementos físicos del entorno (ventilación, luz, limpieza) como determinantes de la curación. • Betty Neuman: Desarrolló el Modelo de Sistemas, que aborda al paciente como un sistema abierto sometido a estresores intra, inter y extrapersonales, enfocándose en la prevención primaria, secundaria y terciaria, no en la manipulación directa del ambiente físico como agente terapéutico. • Hildegard Peplau: Formuló la Teoría de las Relaciones Interpersonales, que describe las fases de la relación enfermera-paciente (orientación, identificación, explotación y resolución) con énfasis en la comunicación terapéutica, sin abordar específicamente la influencia del entorno físico en la recuperación. Tip/Mnemotecnia: \"NIGHTINGALE = ENTORNO\": ventilación, luz, limpieza, calor y silencio son los pilares ambientales que ella identificó como parte del cuidado enfermero moderno, sentando las bases de la enfermería profesional durante la Guerra de Crimea.","bibliography":"Alligood M. Modelos y Teorías de Enfermería. 10ª ed. Elsevier; 2022. Subcomponente: Generalidades para el cuidado enfermero Tema: Evolución histórica de la Enfermería: Teoría del entorno de Florence Nightingale Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":182,"question":"Durante el turno en la unidad de cuidados intensivos, la enfermera debe realizar un cambio de apósito de una herida quirúrgica. La profesional se da cuenta de que no se ha realizado la higiene de manos. ¿Cuál es la acción principal que debe realizar en este momento?","options":["Realizar fricciones con preparación alcohólica.","Lavado quirúrgico.","Desinfectar el área de trabajo.","Colocarse un nuevo par de guantes estériles."],"answer":"Realizar fricciones con preparación alcohólica.","justification":"La higiene de manos mediante fricción con preparación alcohólica (basada en la estrategia de los \"5 momentos\" de la OMS) es la técnica indicada antes de procedimientos que impliquen contacto con el paciente o material estéril, siempre que las manos no estén visiblemente sucias. Este método es rápido, efectivo para reducir la carga microbiana transitoria y constituye el estándar previo a procedimientos como el cambio de apósitos, garantizando la asepsia antes de la manipulación de la herida quirúrgica. Opciones incorrectas: • Lavado quirúrgico: Este tipo de lavado con agua y jabón antiséptico (de 3 a 5 minutos) está reservado para procedimientos invasivos mayores, como cirugías, y no es necesario ni práctico para un cambio de apósito de rutina. • Desinfectar el área de trabajo: Aunque la desinfección del entorno es importante para la bioseguridad general, no sustituye la higiene de manos del profesional, que es la medida individual más eficaz para prevenir la transmisión de microorganismos al paciente. • Colocarse un nuevo par de guantes estériles: El uso de guantes no reemplaza la higiene de manos; de hecho, esta debe realizarse siempre antes de colocarse los guantes, ya que estos pueden presentar microperforaciones imperceptibles que permiten el paso de microorganismos. Tip/Mnemotecnia: Recuerda los \"5 momentos para la higiene de manos\" de la OMS: 1) Antes de tocar al paciente, 2) Antes de realizar una tarea aséptica, 3) Después del riesgo de exposición a fluidos corporales, 4) Después de tocar al paciente, 5) Después del contacto con el entorno del paciente. Ante cualquier duda de asepsia antes de un procedimiento limpio/aséptico: ¡fricción alcohólica primero!","bibliography":"Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Bioseguridad Tema: Técnicas de higiene de manos Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":183,"question":"Una enfermera se encuentra en un hospital atendiendo a un paciente en estado grave. Durante su turno, la enfermera se percata de que el médico a cargo no ha realizado ciertos procedimientos necesarios para el cuidado del paciente, según el Código Deontológico del Consejo Internacional de Enfermería (CIE). ¿Cuál de las siguientes acciones es la más adecuada para la enfermera en esta situación?","options":["Conversar con el médico a cargo para discutir la situación y expresar su preocupación por el cuidado del paciente.","Ignorar la situación y no intervenir, ya que no es responsabilidad directa del personal de enfermería.","Informar al paciente sobre la negligencia del médico y sugerirle que tome medidas legales.","Realizar los procedimientos médicos por su cuenta sin informar al médico a cargo del paciente."],"answer":"Conversar con el médico a cargo para discutir la situación y expresar su preocupación por el cuidado del paciente.","justification":"El Código Deontológico del CIE establece que la enfermera tiene la responsabilidad de actuar como defensora (abogacía) del paciente, garantizando que reciba una atención segura y de calidad. Ante la omisión de procedimientos necesarios por parte del médico, la conducta ética y profesionalmente correcta es establecer una comunicación directa, asertiva y colegiada con el profesional a cargo, exponiendo los hallazgos clínicos y la preocupación por la seguridad del paciente, respetando la vía jerárquica y el trabajo interdisciplinario, y de no resolverse, escalar el caso a las instancias correspondientes dentro de la institución. Opciones incorrectas: • Ignorar la situación y no intervenir, ya que no es responsabilidad directa del personal de enfermería: Es incorrecta porque contraviene el principio de abogacía y responsabilidad profesional que exige el Código Deontológico del CIE; la enfermera tiene el deber ético de velar por la seguridad del paciente independientemente de quién cometa la omisión. • Informar al paciente sobre la negligencia del médico y sugerirle que tome medidas legales: No corresponde a la enfermera calificar la conducta de otro profesional como \"negligencia\" ni instigar acciones legales, ya que esto excede su rol, vulnera el trabajo en equipo y puede constituir una falta ética por emitir juicios sin el debido proceso institucional. • Realizar los procedimientos médicos por su cuenta sin informar al médico a cargo del paciente: Es una acción que excede las competencias legales del ejercicio de enfermería y constituye una intrusión en el ámbito de otra profesión, lo cual podría configurar mala práctica y responsabilidad legal según el Código Orgánico Integral Penal. Tip/Mnemotecnia: \"Comunicar antes de actuar\": ante cualquier omisión detectada en el equipo de salud, la primera línea de acción del profesional de enfermería siempre es el diálogo profesional directo, antes de escalar o actuar unilateralmente.","bibliography":"Consejo Internacional de Enfermeras. Código Deontológico del CIE para la Profesión de Enfermería. Ginebra, Suiza; 2016. Subcomponente: Ética en el ejercicio profesional Tema: Código de ética profesional y código deontológico del CIE Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":184,"question":"Paciente varón de 45 años ingresa al hospital con diagnóstico de neumonía adquirida en la comunidad. Durante la valoración inicial, el profesional de enfermería identifica que el paciente tiene una frecuencia respiratoria de 32 por minuto, temperatura de 38.5 °C, utiliza músculos accesorios para respirar y presenta tos productiva. Además, presenta debilidad generalizada y se encuentra desnutrido. Como parte del proceso de enfermería, ¿cuál es la etiqueta NANDA para estructurar el diagnóstico de enfermería prioritario para este paciente?","options":["Riesgo de déficit de volumen de líquidos.","Patrón respiratorio ineficaz.","Riesgo de hipertermia.","Deterioro de la movilidad física."],"answer":"Patrón respiratorio ineficaz.","justification":"Esta etiqueta NANDA se define como la inspiración o espiración que no proporciona una ventilación adecuada, y es la prioritaria en este caso porque el paciente presenta signos objetivos de dificultad respiratoria: taquipnea (FR 32/min), uso de músculos accesorios y tos productiva secundaria al proceso infeccioso pulmonar. Siguiendo la jerarquización de necesidades de Maslow y el ABC de la valoración de enfermería, la vía aérea y la ventilación tienen prioridad absoluta sobre cualquier otro problema, ya que un compromiso respiratorio no resuelto puede evolucionar rápidamente a insuficiencia respiratoria aguda y comprometer la vida del paciente. Opciones incorrectas: • Riesgo de déficit de volumen de líquidos: Sería un diagnóstico válido si existieran datos de pérdidas hídricas significativas o signos de deshidratación, los cuales no se describen como hallazgo predominante en este caso. • Riesgo de hipertermia: No aplica porque el paciente ya presenta hipertermia real (38.5 °C), por lo que el diagnóstico correcto sería \"Hipertermia\" y no un diagnóstico de riesgo; además, no constituye la alteración fisiológica más urgente frente al compromiso ventilatorio. • Deterioro de la movilidad física: La debilidad generalizada y desnutrición podrían sustentar este diagnóstico en un plano secundario, pero no representa una amenaza inmediata para la vida como el compromiso del patrón respiratorio, por lo que no es prioritario en esta valoración inicial. Tip/Mnemotecnia: Recuerda el ABC de la priorización en enfermería: Airway (vía aérea), Breathing (respiración) y Circulation (circulación). Ante cualquier signo de dificultad respiratoria (taquipnea, uso de músculos accesorios), el diagnóstico de \"Patrón respiratorio ineficaz\" u otro relacionado con la ventilación siempre tiene prioridad sobre diagnósticos de confort, movilidad o riesgo.","bibliography":"Herdman T. NANDA Internacional. Diagnósticos Enfermeros. Definiciones y Clasificaciones 2021- 2023.                                          Elsevier;                                 2021. Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Proceso de atención en Enfermería Tema: Taxonomías, NANDA, NOC Y NIC Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":185,"question":"Paciente masculino de 27 años que ingresa al servicio de emergencia por presentar estatus convulsivo y edema en miembros superiores, se decide colocar sonda vesical para control de ingesta y eliminación estricto; al momento de inflar el balón, el paciente se queja de dolor severo y se evidencia salida de sangre en orina. ¿Cuál es la estructura que se lesionó durante el procedimiento?","options":["Uréteres.","Próstata.","Vejiga.","Uretra."],"answer":"Uretra.","justification":"La lesión uretral durante el cateterismo vesical ocurre típicamente cuando se infla el balón de la sonda Foley antes de confirmar que la punta se encuentra completamente dentro de la vejiga, es decir, sin haber obtenido retorno de orina previo. Al insuflar el balón dentro de la luz uretral, se produce distensión y desgarro de la mucosa uretral, generando dolor súbito e intenso y hematuria franca inmediata. Esta es una complicación mecánica prevenible cuya conducta correcta ante la sospecha es desinflar de inmediato el balón, retirar la sonda y valorar el daño mediante uretrografía o interconsulta a urología, evitando forzar el paso de una nueva sonda para no agravar la lesión. Opciones incorrectas: • Uréteres: Estas estructuras conectan los riñones con la vejiga y no forman parte del trayecto del sondaje vesical, por lo que no se ven afectadas por esta maniobra; su lesión se asocia más bien a procedimientos quirúrgicos pélvicos o traumatismos abdominales. • Próstata: Aunque en el varón la uretra prostática puede dificultar el paso de la sonda (especialmente en casos de hipertrofia prostática benigna), el dolor y la hematuria descritos en el caso son consecuencia directa de la insuflación del balón fuera de la vejiga, no de una lesión prostática primaria. • Vejiga: Una perforación vesical es una complicación mucho menos frecuente y generalmente se asocia a sondajes traumáticos con fuerza excesiva o patología vesical previa, no al inflado del balón en un trayecto uretral no confirmado, como ocurre en este caso. Tip/Mnemotecnia: \"Sin retorno, no inflo\": nunca se debe insuflar el balón de la sonda vesical sin haber confirmado previamente la salida de orina, señal inequívoca de que la punta está alojada en la vejiga.","bibliography":"Potter P, Perry A, Stockert P, Hall A. Fundamentos de enfermería. 9ª ed. Elsevier; 2019. Subcomponente: Procedimientos básicos del cuidado enfermero Tema: Eliminación urinaria e intestinal Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":186,"question":"Paciente con diagnóstico de aborto ectópico fue enviada de manera urgente desde el área de emergencia al quirófano, donde se realizó la intervención correspondiente y fue trasladada a la unidad de cuidados intensivos para su estabilización y monitoreo. ¿Cómo se clasifican las áreas en las que fue atendida la paciente?","options":["Semicríticas.","No críticas.","De bajo riesgo.","Críticas."],"answer":"Críticas.","justification":"Las áreas críticas son aquellas unidades hospitalarias donde se atienden pacientes con alto riesgo de infección y compromiso vital, que requieren procedimientos invasivos, soporte de funciones vitales y vigilancia constante y especializada. Emergencia (por la resolución inmediata de patologías graves como el aborto ectópico complicado), quirófano (por ser un ambiente de alta exigencia aséptica donde se realizan procedimientos invasivos) y la Unidad de Cuidados Intensivos (por el monitoreo continuo y soporte vital avanzado) se clasifican dentro de esta categoría, ya que en ellas convergen los mayores factores de riesgo biológico, físico y químico, además de concentrar los procedimientos con mayor probabilidad de infecciones asociadas a la atención de salud (IAAS). Opciones incorrectas: • Semicríticas: Corresponde a áreas donde se atienden pacientes con patologías estables pero que requieren vigilancia y cuidados especiales sin llegar al nivel de soporte vital, como hospitalización general o áreas de recuperación intermedia; no aplica a quirófano, emergencia ni UCI. • No críticas: Se refiere a áreas administrativas o de bajo riesgo de contaminación, como consulta externa o servicios de apoyo administrativo, donde el contacto con fluidos corporales o procedimientos invasivos es mínimo o inexistente. • De bajo riesgo: No corresponde a una categoría oficial de clasificación de áreas hospitalarias según bioseguridad; es un término genérico que no se ajusta a la nomenclatura técnica utilizada para diferenciar unidades críticas, semicríticas y no críticas. Tip/Mnemotecnia: \"Críticas = Cirugía, Reanimación (UCI), Trauma/Emergencia, Infecciosas\" — recuerda que estas áreas concentran el mayor riesgo biológico y requieren máximas medidas de bioseguridad.","bibliography":"Ministerio de Salud Pública del Ecuador. Manual de Modelo de Atención Integral de Salud - MAIS. 3ª ed. Ministerio de Salud Pública, Viceministerio de Gobernanza y Vigilancia de la Salud; 2018. Subcomponente: Bioseguridad Tema: Establecimientos de salud: organización, ambientes y tipos Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":187,"question":"Paciente de 78 años hospitalizado, en espera de cirugía por pterigium. Al momento presenta limitación funcional y necesita asistencia para realizar actividades básicas de la vida diaria. Constantes vitales dentro de parámetros normales, IMC 19. De acuerdo con el modelo de enfermería de Virginia Henderson, ¿cuál es la intervención más adecuada?","options":["Coordinar la programación de cirugía.","Proporcionar una dieta equilibrada y nutritiva.","Ayudar a la paciente a movilizarse.","Proporcionar analgésicos para controlar el dolor."],"answer":"Ayudar a la paciente a movilizarse.","justification":"Según el modelo conceptual de Virginia Henderson, el cuidado enfermero se organiza en torno a 14 necesidades básicas, siendo la cuarta \"moverse y mantener una postura adecuada\". El caso describe explícitamente limitación funcional con dependencia para las actividades básicas de la vida diaria, lo cual constituye el problema prioritario identificado en la valoración. Henderson define el rol de la enfermera como sustituto, ayuda o complemento de la persona en aquello que le falta para lograr su independencia; en este paciente, dicha independencia está comprometida específicamente en el dominio de la movilidad, por lo que la intervención enfermera debe orientarse a suplir o asistir esta necesidad hasta que el paciente recupere su autonomía o sea intervenido quirúrgicamente. Opciones incorrectas: • Coordinar la programación de cirugía: corresponde a una función de gestión y coordinación interdisciplinaria del proceso quirúrgico, no a una intervención directa de cuidado basada en las necesidades básicas del modelo de Henderson. • Proporcionar una dieta equilibrada y nutritiva: se relaciona con la necesidad de \"comer y beber adecuadamente\"; aunque el IMC de 19 podría orientar a una valoración nutricional complementaria, no constituye el problema prioritario planteado en el enunciado, que es la limitación funcional y dependencia para las AVD. • Proporcionar analgésicos para controlar el dolor: el caso no reporta presencia de dolor ni alteración de signos vitales; esta intervención sería pertinente ante la necesidad de \"evitar peligros\" únicamente si existiera dicho síntoma, lo cual no se describe en el enunciado. Tip/Mnemotecnia: Recuerda las 14 necesidades de Henderson con la regla \"RE-COM-ELI-MO-DOR-VI-TE-SEG-COMU- CREE-TRA-JUE-APRE\": la 4ª necesidad, \"MOverse y mantener una postura adecuada\", es la clave cuando el enunciado menciona limitación funcional o dependencia para la movilización.","bibliography":"Alligood M. Modelos y Teorías de Enfermería. 10ª ed. Elsevier; 2022. Subcomponente: Generalidades para el cuidado enfermero Tema: Principales teorizantes del cuidado enfermero: Virginia Henderson, Dorothea Orem, Callista Roy, Martha Rogers, Marjorie Gordon, Jean Watson y Betty Newman Fuente: PREGUNTAS FILTRADAS ENFERMERIA CACES 2026 TOMO 2 — Banco Mayo 2026."},{"id":188,"question":"Usted se encuentra atendiendo a un paciente de 70 años diagnosticado con un cáncer avanzado. El paciente ha expresado su deseo de no recibir más tratamientos agresivos y, en su lugar, prefiere recibir cuidados paliativos para mejorar su calidad de vida en sus últimos días. Sin embargo, la familia del paciente insiste en que se sigan intentando tratamientos experimentales, ya que no quieren aceptar la decisión del paciente. ¿Cuál es el principal principio bioético que se está valorando en este caso?","options":["Beneficencia.","Justicia.","Autonomía.","No maleficencia."],"answer":"Autonomía.","justification":"Este principio bioético reconoce el derecho del paciente competente a tomar decisiones informadas sobre su propio proceso de salud-enfermedad, incluyendo la aceptación o rechazo de tratamientos, en concordancia con sus valores, creencias y proyecto de vida. En el caso descrito, el paciente ha manifestado de forma explícita su voluntad de rechazar tratamientos agresivos y optar por cuidados paliativos, lo cual constituye un ejercicio legítimo de autodeterminación que debe prevalecer sobre las preferencias de terceros, incluida la familia, siempre que el paciente conserve su capacidad cognitiva y de juicio para decidir. Opciones incorrectas: • Beneficencia: Se refiere a la obligación del p
